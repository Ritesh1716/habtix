// Web Audio sound player
function playSound(type){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    // Resume context (required after user gesture on mobile)
    if(ctx.state==="suspended")ctx.resume();
    const master=ctx.createGain();
    master.connect(ctx.destination);

    if(type==="bell"){
      // Rich bell — doubled oscillators for fullness, much louder
      [880,1760].forEach((freq,layer)=>{
        const o=ctx.createOscillator();const g=ctx.createGain();
        o.connect(g);g.connect(master);o.type="sine";
        o.frequency.setValueAtTime(freq,ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(freq/2,ctx.currentTime+1.2);
        g.gain.setValueAtTime(layer===0?0.9:0.4,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.4);
        o.start();o.stop(ctx.currentTime+1.4);
      });

    }else if(type==="beep"){
      // 3 loud sharp beeps
      [0,0.25,0.5].forEach(t2=>{
        const o=ctx.createOscillator();const g=ctx.createGain();
        o.connect(g);g.connect(master);o.type="square";o.frequency.value=1000;
        g.gain.setValueAtTime(0.8,ctx.currentTime+t2);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t2+0.18);
        o.start(ctx.currentTime+t2);o.stop(ctx.currentTime+t2+0.2);
      });

    }else if(type==="chime"){
      // Ascending chime — C5 E5 G5 C6
      [523,659,784,1047].forEach((f,i)=>{
        const o=ctx.createOscillator();const g=ctx.createGain();
        o.connect(g);g.connect(master);o.type="sine";o.frequency.value=f;
        g.gain.setValueAtTime(0,ctx.currentTime+i*0.18);
        g.gain.linearRampToValueAtTime(0.85,ctx.currentTime+i*0.18+0.04);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.18+0.55);
        o.start(ctx.currentTime+i*0.18);o.stop(ctx.currentTime+i*0.18+0.6);
      });

    }else if(type==="alarm"){
      // Urgent pulsing alarm — 8 fast bursts
      for(let i=0;i<8;i++){
        const f=i%2===0?880:1100;
        const o=ctx.createOscillator();const g=ctx.createGain();
        o.connect(g);g.connect(master);o.type="sawtooth";o.frequency.value=f;
        g.gain.setValueAtTime(0.85,ctx.currentTime+i*0.13);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.13+0.11);
        o.start(ctx.currentTime+i*0.13);o.stop(ctx.currentTime+i*0.13+0.12);
      }

    }else if(type==="siren"){
      // Rising siren — good for important reminders
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.connect(g);g.connect(master);o.type="sawtooth";
      o.frequency.setValueAtTime(300,ctx.currentTime);
      o.frequency.linearRampToValueAtTime(900,ctx.currentTime+0.4);
      o.frequency.linearRampToValueAtTime(300,ctx.currentTime+0.8);
      o.frequency.linearRampToValueAtTime(900,ctx.currentTime+1.2);
      g.gain.setValueAtTime(0.8,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.4);
      o.start();o.stop(ctx.currentTime+1.4);

    }else if(type==="ding"){
      // Single sharp high ding — minimal, clean
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.connect(g);g.connect(master);o.type="sine";o.frequency.value=1400;
      g.gain.setValueAtTime(0.95,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
      o.start();o.stop(ctx.currentTime+0.85);

    }else if(type==="drum"){
      // Bold percussion thud — great on mobile speakers
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.connect(g);g.connect(master);o.type="sine";
      o.frequency.setValueAtTime(200,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(40,ctx.currentTime+0.3);
      g.gain.setValueAtTime(1.0,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
      o.start();o.stop(ctx.currentTime+0.4);
      // noise layer
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.1,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.4;
      const src=ctx.createBufferSource();src.buffer=buf;
      const ng=ctx.createGain();src.connect(ng);ng.connect(master);
      ng.gain.setValueAtTime(0.6,ctx.currentTime);
      ng.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.1);
      src.start();

    }else if(type==="trumpet"){
      // Bold fanfare — memorable, hard to miss
      [[392,0],[523,0.15],[659,0.3],[784,0.45]].forEach(([f,t2])=>{
        const o=ctx.createOscillator();const g=ctx.createGain();
        o.connect(g);g.connect(master);o.type="square";o.frequency.value=f;
        g.gain.setValueAtTime(0,ctx.currentTime+t2);
        g.gain.linearRampToValueAtTime(0.7,ctx.currentTime+t2+0.05);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t2+0.35);
        o.start(ctx.currentTime+t2);o.stop(ctx.currentTime+t2+0.4);
      });
    }

    setTimeout(()=>ctx.close(),3000);
  }catch(e){console.log("Sound error:",e);}
}

function fmt12(timeStr){
  if(!timeStr)return"";
  const[h,m]=timeStr.split(":").map(Number);
  const ampm=h>=12?"PM":"AM";
  const h12=h%12||12;
  return h12+":"+String(m).padStart(2,"0")+" "+ampm;
}

// ── C3: FCM SUBSCRIBE HELPER ─────────────────────────────────────
// Requests an FCM registration token and stores it (plus the user's chosen
// check-in time and timezone offset) on their user doc, so the hourly cron
// (/api/push.js) can deliver a single daily push at the right local hour even
// when the app is fully closed. Returns true on success, false otherwise.
// Safe to call repeatedly — getToken is idempotent and returns the same token.
async function subscribeToPush(uid,checkInTime){
  try{
    const fb=window._fb;
    if(!fb||!fb.messaging||!fb.getToken||!uid)return false;
    if(typeof Notification==="undefined"||Notification.permission!=="granted")return false;
    // The SW must be registered & ready before FCM can bind a token to it.
    const reg=await navigator.serviceWorker.ready;
    const token=await fb.getToken(fb.messaging,{vapidKey:fb.VAPID_KEY,serviceWorkerRegistration:reg});
    if(!token)return false;
    // Parse "HH:MM" → hour/minute. Default to 20:00 if missing/invalid.
    let hh=20,mm=0;
    if(typeof checkInTime==="string"&&/^\d{2}:\d{2}$/.test(checkInTime)){
      const p=checkInTime.split(":").map(Number);hh=p[0];mm=p[1];
    }
    // tzOffsetMin: minutes to ADD to UTC to get local time (IST = +330).
    const tzOffsetMin=-new Date().getTimezoneOffset();
    await fb.setDoc(fb.doc(fb.db,"users",uid),{
      fcmToken:token,
      notifEnabled:true,
      checkInHour:hh,
      checkInMinute:mm,
      tzOffsetMin:tzOffsetMin,
      fcmUpdatedAt:new Date().toISOString(),
    },{merge:true});
    return true;
  }catch(e){console.warn("subscribeToPush failed:",e?.message);return false;}
}

  const myTier=plan.heat?"pro":"free";
  const isPaidPlan=myTier!=="free";
  const[showManage,setShowManage]=useState(false);
  const[prefs,setPrefsLocal]=useState(()=>({..._notifStore.prefs}));
  const NOTIF_TYPES=[
    {key:"__checkin",label:"Daily check-in",desc:"Mo's one daily nudge — the only guaranteed closed-app message",locked:true,tiers:["free","pro"]},
    {key:"milestones",label:"Streak milestones",desc:"Celebrate 7/30/100-day badges etc.",tiers:["free","pro"]},
    {key:"perfectday",label:"Perfect day",desc:"When every habit is done today",tiers:["free","pro"]},

  const visibleTypes=NOTIF_TYPES.filter(nt=>nt.tiers.includes(myTier));
  async function togglePref(key){
    if(!isPaidPlan)return;// Free: view-only, cannot edit
    const next={...prefs,[key]:prefs[key]===false?true:false};
    setPrefsLocal(next);
    _notifStore.prefs=next;
    try{await window._fb.setDoc(window._fb.doc(window._fb.db,"users",uid),{notifPrefs:next},{merge:true});}catch(e){}
  }

  async function enable(){
    if(typeof Notification==="undefined"){
      alert("Notifications not supported here.\n\nTry:\n1. Install app (Add to Home Screen)\n2. Use Chrome on Android\n3. Use desktop Chrome/Firefox");
      return;
    }
    if(Notification.permission==="denied"){
      alert("Notifications blocked!\n\nTo fix:\n1. Tap 🔒 in address bar\n2. Set Notifications → Allow\n3. Refresh page");
      return;
    }
    const p=await Notification.requestPermission();
    setStatus(p);
    if(p==="granted"){setEnabled(true);localStorage.setItem("hg_notif","1");localStorage.setItem("hg_push_asked","1");
      // Sentry JAVASCRIPT-3: new Notification() throws "Illegal constructor" once a service
      // worker is registered, on a real chunk of Chrome/Android users — this was completely
      // unguarded before, so it crashed the whole enable() flow right after permission was
      // already granted. reg.showNotification() is what's actually required in that case.
      try{
        if('serviceWorker' in navigator){
          navigator.serviceWorker.ready.then(reg=>{
            reg.showNotification("⚡ Habtix",{body:"Notifications enabled! 🎉",icon:"/icon-192.png"}).catch(()=>{});
          }).catch(()=>{});
        }else{
          new Notification("⚡ Habtix",{body:"Notifications enabled! 🎉",icon:"/icon-192.png"});
        }

      // C3: register for closed-app FCM push. Use the earliest custom reminder as
      // the daily check-in time; fall back to 20:00 if none set.
      const custom=(reminders||[]).filter(r=>!r.isHabit&&r.time).map(r=>r.time).sort();
      subscribeToPush(uid,custom[0]||"20:00").catch(()=>{});

    setEnabled(false);
    localStorage.setItem("hg_notif","0");

    // without this write, disabling here did nothing server-side and the daily check-in
    // would keep arriving forever regardless of what the app showed.
    try{
      if(uid&&window._fb){
        window._fb.setDoc(window._fb.doc(window._fb.db,"users",uid),{notifEnabled:false},{merge:true}).catch(()=>{});
      }
    }catch(e){}

      {!canAdd&&maxReminders!==Infinity&&<div style={{background:NB.blueSoft,border:"2px solid "+NB.ink,borderRadius:12,padding:"8px 12px",marginBottom:10,fontSize:11,color:NB.ink,fontWeight:600}}>Upgrade to Pro for unlimited reminders</div>}
      {canAdd&&<div style={{display:"flex",gap:7,marginTop:4,flexWrap:"wrap"}}>
        <input type="time" value={newTime} onChange={e=>setNewTime(e.target.value)} style={{padding:"8px 10px",border:"2.5px solid "+NB.ink,borderRadius:12,fontSize:14,flex:"0 0 auto",fontFamily:"'Sora',sans-serif"}}/>
        <input value={newLabel} onChange={e=>setNewLabel(e.target.value)} placeholder="Label (optional)" style={{padding:"8px 10px",border:"2.5px solid "+NB.ink,borderRadius:12,fontSize:13,flex:1,minWidth:100,fontFamily:"'Sora',sans-serif"}}/>
        <span onClick={addReminder} style={{padding:"8px 16px",borderRadius:12,border:"2.5px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:13,flexShrink:0,fontFamily:NB.font}}>+ Add</span>

        <span style={{display:"inline-flex",alignItems:"center",gap:4}}>{IC.info(NB.ink,13)} How do notifications work?</span>
        <span style={{fontSize:11}}>{showHowTo?"▲":"▼"}</span>
      </span>
      {showHowTo&&<div style={{padding:"0 14px 14px",fontSize:11,color:NB.muted,lineHeight:1.8,fontWeight:600}}>

        <div style={{fontWeight:800,color:NB.ink,fontSize:12,marginBottom:8,fontFamily:NB.font}}>Two kinds of notifications</div>
        <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:14}}>
          {[
            ["bell","Daily check-in from Mo — one motivating nudge a day at your chosen time. Reaches you even when the app is closed."],
            ["check","Your own reminders — habit & custom reminders you set, delivered while the app is open."],
          ].map(([icKey,txt])=>(
            <div key={txt} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <span style={{flexShrink:0,display:"flex",alignItems:"center",marginTop:1}}>{IC[icKey]?.(NB.ink,12)||icKey}</span>
              <span>{txt}</span>
            </div>
          ))}
        </div>

        <div style={{fontWeight:800,color:NB.ink,fontSize:12,marginBottom:8,fontFamily:NB.font}}>Works best when…</div>
        <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:14}}>
          {[
            ["mobile","Using the Habtix app (or added to your home screen) — the daily check-in reaches you even when the app is fully closed."],
            ["bell","Notifications are allowed for Habtix in your phone settings."],
            ["globe","Phone isn't on silent or Do Not Disturb — otherwise it shows silently, no sound."],
          ].map(([icKey,txt])=>(
            <div key={txt} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <span style={{flexShrink:0,display:"flex",alignItems:"center",marginTop:1}}>{IC[icKey]?.(NB.green,12)||icKey}</span>
              <span>{txt}</span>
            </div>
          ))}
        </div>

        <div style={{fontWeight:800,color:NB.ink,fontSize:12,marginBottom:8,fontFamily:NB.font}}>Good to know</div>
        <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:10}}>
          {[
            ["warning","Your daily check-in arrives within your chosen hour, not to the exact minute."],
            ["warning","On iPhone, add Habtix to your Home Screen first — Apple only allows notifications for installed web apps (iOS 16.4+)."],
            ["warning","Your own reminders fire while the app is open; the daily check-in is the one that reaches a closed app."],
          ].map(([icKey,txt])=>(
            <div key={txt} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <span style={{flexShrink:0,display:"flex",alignItems:"center",marginTop:1}}>{IC[icKey]?.(NB.coral,12)||icKey}</span>
              <span>{txt}</span>
            </div>
          ))}
        </div>

        <div style={{background:NB.blueSoft,border:"2px solid "+NB.ink,borderRadius:12,padding:"9px 11px",fontSize:11,color:NB.ink,lineHeight:1.6,fontWeight:600}}>
           Tip: install Habtix to your home screen (⋮ → Add to Home Screen), open it from there, and allow notifications — that's the most reliable setup for background alerts.
        </div>
      </div>}
    </div>
    </div>
  </Modal>);
}

// ── SETTINGS PAGE ─────────────────────────────────────────────────────────
function ChallengeCard({t,habits,user}){
  const CHALLENGE_LIMIT=100; // First 100 completions only
  const KEY="hg_challenge";
  const[data,setData]=useState(()=>{try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch{return null;}});
  const[selectedHabit,setSelectedHabit]=useState(null);
  const[winnerCount,setWinnerCount]=useState(null);
  const today=td();
  const PROOF_DAYS=[1,4,7];

  // Load winner count from Firestore app_stats
  useEffect(()=>{
    const cached=parseInt(localStorage.getItem("hg_challenge_winners")||"0");
    setWinnerCount(cached);
    try{
      if(fb&&fb.getDoc&&fb.doc&&fb.db){
        fb.getDoc(fb.doc(fb.db,"app_stats","challenge")).then(snap=>{
          const c=snap.exists()?(snap.data().winners||0):0;
          setWinnerCount(c);
          localStorage.setItem("hg_challenge_winners",String(c));
        }).catch(()=>{});
      }
    }catch(e){}
  },[]);

  const spotsLeft=winnerCount===null?null:Math.max(0,CHALLENGE_LIMIT-winnerCount);
  const challengeClosed=winnerCount!==null&&winnerCount>=CHALLENGE_LIMIT;

  function save7(d){setData(d);localStorage.setItem(KEY,JSON.stringify(d));}
  function startChallenge(habit){save7({habitId:habit.id,habitName:habit.name,habitIcon:habit.icon,startDate:today,days:{},status:"active"});}
  function resetChallenge(){localStorage.removeItem(KEY);setData(null);setSelectedHabit(null);}

  function markDay(){
    if(!data)return;
    const dayNum=Math.floor((new Date(today+"T12:00:00")-new Date(data.startDate+"T12:00:00"))/86400000)+1;
    if(dayNum<1||dayNum>7||data.days[dayNum])return;
    const habit=habits.find(h=>h.id===data.habitId);
    if(!habit||!habit.log||!habit.log[today]){showToastGlobal("✅ Complete your habit first, then mark the day!");return;}
    const updated={...data,days:{...data.days,[dayNum]:{date:today}}};
    if(Object.keys(updated.days).length>=7)updated.status="completed";
    save7(updated);
  }

  function checkMissed(){
    if(!data||data.status!=="active")return false;
    const dayNum=Math.floor((new Date(today+"T12:00:00")-new Date(data.startDate+"T12:00:00"))/86400000)+1;
    const lastMarked=Math.max(0,...Object.keys(data.days).map(Number));
    return lastMarked>0&&dayNum>lastMarked+1;
  }

  const missed=checkMissed();
  const dayNum=data?Math.min(7,Math.floor((new Date(today+"T12:00:00")-new Date(data.startDate+"T12:00:00"))/86400000)+1):0;
  const daysMarked=data?Object.keys(data.days).length:0;
  const habit=data?habits.find(h=>h.id===data.habitId):null;
  const todayMarked=data&&data.days[dayNum]&&data.days[dayNum].date===today;
  const habitDoneToday=habit&&habit.log&&habit.log[today];
  const isProofDay=PROOF_DAYS.includes(dayNum);

  // ── NOT STARTED ──────────────────────────────────────────────
  if(!data){
    const[showDetails,setShowDetails]=useState(false);
    return(
      <div style={{background:"linear-gradient(135deg,"+t.accent+"14,"+t.accent+"03)",border:"1px solid "+t.accent+"33",borderRadius:12,padding:16}}>
        {/* Minimized header — always visible */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span>{IC.trophy(t.accent,24)}</span>
            <div>
              <div style={{fontSize:13,fontWeight:800,color:challengeClosed?t.muted:t.accent}}>
                {challengeClosed?"7-Day Challenge — Closed":"7-Day Streak Challenge"}
              </div>
              <div style={{fontSize:10,marginTop:1}}>
                {challengeClosed
                  ?<span style={{color:t.danger}}>All 100 spots filled — closed</span>
                  :<span style={{color:t.muted}}>Win <strong style={{color:t.success}}>14 Days Pro FREE</strong>
                    {spotsLeft!==null&&<span style={{color:spotsLeft<=20?t.danger:t.accent}}> · {spotsLeft} spots left</span>}
                  </span>
                }
              </div>
            </div>
          </div>
          {!challengeClosed&&<button onClick={()=>setShowDetails(v=>!v)} style={{padding:"5px 12px",borderRadius:9,border:"1px solid "+t.accent+"33",background:showDetails?t.accent+"22":"none",color:t.accent,cursor:"pointer",fontSize:11,fontWeight:700}}>
            {showDetails?"▲ Hide":"View ▼"}
          </button>}
        </div>

        {/* Closed state */}
        {challengeClosed&&<div style={{marginTop:12,padding:"12px 14px",background:t.danger+"12",border:"1px solid "+t.danger+"33",borderRadius:10,textAlign:"center"}}>
          <div style={{fontSize:13,fontWeight:700,color:t.danger,marginBottom:4,display:"flex",alignItems:"center",gap:4}}>{IC.lock(t.danger,13)} Challenge Closed</div>
          <div style={{fontSize:11,color:t.muted,lineHeight:1.6}}>All 100 early winner spots have been filled. The challenge is no longer accepting new completions. Stay tuned for the next challenge!</div>
        </div>}

        {/* Expanded details */}
        {showDetails&&<div style={{marginTop:14,borderTop:"1px solid "+t.accent+"22",paddingTop:14}}>
          {/* Reward banner */}
          <div style={{background:t.success+"18",border:"1px solid "+t.success+"44",borderRadius:10,padding:"10px 12px",marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
            <span>{IC.gift(t.accent,20)}</span>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:t.success}}>Prize: 14 Days Pro FREE — Worth ₹38!</div>
              <div style={{fontSize:10,color:t.muted,marginTop:1}}>Unlimited habits · heatmaps · badges · themes</div>
            </div>
          </div>

          {/* Rules */}
          <div style={{background:t.surface,borderRadius:10,padding:12,marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>How It Works</div>
            {[
              ["flame","Do your chosen habit every day for 7 days"],
              ["camera","Post proof on Instagram/WhatsApp on Day 1, Day 4 & Day 7"],
              ["xCircle","Miss a day? The challenge resets — start over"],
              ["plan","After Day 7, submit your 3 screenshots via the Google Form"],
              ["bolt","We verify within 48hrs and upgrade your account for free"],
            ].map(([ic,txt],i)=>(
              <div key={i} style={{display:"flex",gap:9,alignItems:"flex-start",padding:"5px 0",borderBottom:i<4?"1px solid "+t.border:"none"}}>
                <span style={{flexShrink:0,marginTop:1,display:"flex",alignItems:"center"}}>{IC[ic]?.(ic==="xCircle"?t.danger:ic==="bolt"?t.accent:t.muted,14)||ic}</span>
                <span style={{fontSize:11,color:t.text,lineHeight:1.5}}>{txt}</span>
              </div>
            ))}
          </div>

          {/* Proof requirement callout */}
          <div style={{background:t.accent+"12",border:"1px solid "+t.accent+"33",borderRadius:10,padding:"9px 12px",marginBottom:14,fontSize:11,color:t.text,lineHeight:1.6,display:"flex",alignItems:"flex-start",gap:7}}>
            {IC.camera(t.accent,14)} <span><strong>3 Screenshots required:</strong> Day 1 post, Day 4 post, Day 7 post — upload in the Google Form</span>
          </div>

          {/* Habit picker */}
          {habits.length===0?(
            <div style={{fontSize:12,color:t.muted,textAlign:"center",padding:"8px 0"}}>Add habits first to start the challenge! {IC.leaf(t.success,13)}</div>
          ):(
            <>
              <div style={{fontSize:11,fontWeight:700,color:t.muted,marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>Choose Your Challenge Habit</div>
              <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12,maxHeight:200,overflowY:"auto"}}>
                {habits.map(h=>(
                  <button key={h.id} onClick={()=>setSelectedHabit(h)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,border:"1px solid "+(selectedHabit?.id===h.id?t.accent:t.border),background:selectedHabit?.id===h.id?t.accent+"18":t.surface,cursor:"pointer",textAlign:"left",transition:"all 0.15s"}}>
                    <span style={{fontSize:20}}>{h.icon}</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600,color:t.text}}>{h.name}</div>
                      <div style={{fontSize:10,color:t.muted}}><span style={{display:"inline-flex",alignItems:"center",gap:2}}>{h.cat} · {IC.flame(t.accent,10)} {h.streak||0}d</span></div>
                    </div>
                    {selectedHabit?.id===h.id&&<span style={{color:t.accent,fontSize:16,fontWeight:700}}>✓</span>}
                  </button>
                ))}
              </div>
              <button onClick={()=>selectedHabit&&startChallenge(selectedHabit)} disabled={!selectedHabit} style={{width:"100%",padding:"13px",borderRadius:12,border:"none",background:selectedHabit?t.accent:"#2a2a32",color:selectedHabit?"#000":t.muted,fontWeight:700,cursor:selectedHabit?"pointer":"not-allowed",fontSize:14,transition:"all 0.2s",display:"inline-flex",alignItems:"center",justifyContent:"center",gap:5}}>
                {IC.flame(t.accent,14)} Start 7-Day Challenge {selectedHabit?"— "+selectedHabit.icon+" "+selectedHabit.name:""}
              </button>
            </>
          )}
        </div>}
      </div>
    );
  }

  // ── MISSED DAY ──────────────────────────────────────────────
  if(missed){
    return(
      <div style={{background:t.danger+"18",border:"1px solid "+t.danger+"44",borderRadius:12,padding:16,textAlign:"center"}}>
        <div style={{fontSize:15,fontWeight:800,color:t.danger,marginBottom:8}}>You Missed a Day!</div>
        <div style={{fontSize:12,color:t.muted,lineHeight:1.7,marginBottom:6}}>
          The 7-Day Challenge requires <strong>consecutive days</strong> — no breaks allowed.
        </div>
        <div style={{fontSize:12,color:t.muted,lineHeight:1.7,marginBottom:16}}>
          You were on <strong style={{color:t.text}}>{data.habitIcon} {data.habitName}</strong>. Don't give up — every champion had to restart at least once! 💪
        </div>
        <button onClick={resetChallenge} style={{width:"100%",padding:"12px",borderRadius:12,border:"none",background:t.danger,color:"#fff",fontWeight:700,cursor:"pointer",fontSize:14}}>🔄 Restart From Day 1</button>
      </div>
    );
  }

  // ── COMPLETED ──────────────────────────────────────────────
  if(data.status==="completed"){
    return(
      <div style={{background:t.success+"14",border:"1px solid "+t.success+"44",borderRadius:12,padding:16}}>
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{marginBottom:8}}>{IC.sparkle(t.accent,44)}</div>
          <div style={{fontSize:16,fontWeight:800,color:t.success}}>Challenge Complete!</div>
          <div style={{fontSize:12,color:t.muted,marginTop:6,lineHeight:1.6}}>
            Amazing — 7 days of <strong style={{color:t.text}}>{data.habitIcon} {data.habitName}</strong>! Now submit your proof screenshots to claim your 14 days of Pro FREE.
          </div>
        </div>

        {/* 7-day grid */}
        <div style={{display:"flex",gap:4,marginBottom:14}}>
          {Array.from({length:7}).map((_,i)=>{
            const marked=data.days[i+1];
            const isProof=PROOF_DAYS.includes(i+1);
            return(<div key={i} style={{flex:1,textAlign:"center"}}>
              <div style={{width:"100%",aspectRatio:"1",borderRadius:8,background:marked?t.success+"33":t.surface,border:"2px solid "+(marked?t.success:t.border),display:"flex",alignItems:"center",justifyContent:"center",marginBottom:3,position:"relative"}}>
                <span style={{fontSize:11}}>{marked?"✅":"—"}</span>
                {isProof&&<span style={{position:"absolute",top:-4,right:-4,fontSize:8,background:t.accent,borderRadius:4,padding:"0 2px",color:"#000",fontWeight:700}}>📸</span>}
              </div>
              <span style={{fontSize:9,color:t.muted}}>D{i+1}</span>
            </div>);
          })}
        </div>

        {/* What to submit */}
        <div style={{background:t.surface,borderRadius:10,padding:12,marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:10,display:"flex",alignItems:"center",gap:5}}>{IC.plan(t.muted,11)} What To Submit in the Form</div>
          {[
            ["mail","Your Gmail (same as Habtix login)"],
            ["run","Habit name you completed"],
            ["camera","Screenshot of your Day 1 post"],
            ["camera","Screenshot of your Day 4 post"],
            ["camera","Screenshot of your Day 7 post"],
            ["calendar","Your challenge start date"],
          ].map(([ic,txt],i)=>(
            <div key={i} style={{display:"flex",gap:8,alignItems:"center",padding:"5px 0",borderBottom:i<5?"1px solid "+t.border:"none"}}>
              <span style={{display:"flex",alignItems:"center",color:t.muted}}>{IC[ic]?.(t.muted,13)||ic}</span>
              <span style={{fontSize:11,color:t.text}}>{txt}</span>
            </div>
          ))}
        </div>

        {challengeClosed
          ?<div style={{padding:"14px",borderRadius:12,background:t.danger+"18",border:"1px solid "+t.danger+"44",textAlign:"center",marginBottom:10}}>
            <div style={{fontSize:14,fontWeight:700,color:t.danger,marginBottom:6,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>{IC.lock(t.danger,14)} Challenge Closed</div>
            <div style={{fontSize:12,color:t.muted,lineHeight:1.7}}>All 100 spots have been claimed. You completed the challenge but unfortunately the limit was reached before your submission. Stay tuned for the next round!</div>
          </div>
          :<>
            {spotsLeft!==null&&spotsLeft<=20&&spotsLeft>0&&<div style={{background:t.danger+"12",border:"1px solid "+t.danger+"33",borderRadius:10,padding:"9px 12px",marginBottom:12,fontSize:11,color:t.danger,fontWeight:700,textAlign:"center"}}>
              ⚡ Only {spotsLeft} spots remaining — submit now!
            </div>}
            <a href={CHALLENGE_FORM} target="_blank" style={{display:"block",width:"100%",padding:"14px",borderRadius:12,background:t.success,color:"#000",fontWeight:700,fontSize:15,textAlign:"center",textDecoration:"none",marginBottom:10}}>
              <span style={{display:"inline-flex",alignItems:"center",gap:5}}>{IC.plan("#000",13)} Submit Proof → Claim 14 Days Pro FREE</span>
            </a>
          </>
        }
        <div style={{fontSize:10,color:t.muted,textAlign:"center",marginBottom:12}}>We verify within 48 hours · No payment needed</div>
        <button onClick={resetChallenge} style={{width:"100%",padding:"9px",borderRadius:12,border:"1px solid "+t.border,background:"none",color:t.muted,cursor:"pointer",fontSize:12}}>Start New Challenge</button>
      </div>
    );
  }

  // ── ACTIVE ──────────────────────────────────────────────────
  return(
    <div style={{background:"linear-gradient(135deg,"+t.accent+"14,"+t.accent+"03)",border:"1px solid "+t.accent+"33",borderRadius:12,padding:16}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:t.accent,display:"flex",alignItems:"center",gap:5}}>{IC.trophy(t.accent,14)} Challenge Active</div>
          <div style={{fontSize:11,color:t.muted,marginTop:2}}>{data.habitIcon} {data.habitName}</div>
          <div style={{fontSize:10,color:t.muted,marginTop:1}}>Started {data.startDate}</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:22,fontWeight:800,color:t.accent}}>Day {dayNum}<span style={{fontSize:13,color:t.muted,fontWeight:400}}>/7</span></div>
          <div style={{fontSize:10,color:t.muted}}>{daysMarked} of 7 marked</div>
        </div>
      </div>

      {/* Progress bar */}
      <div style={{height:4,background:t.border,borderRadius:4,marginBottom:14}}>
        <div style={{height:"100%",width:(daysMarked/7)*100+"%",background:t.accent,borderRadius:4,transition:"width 0.4s"}}/>
      </div>

      {/* 7-day dot grid */}
      <div style={{display:"flex",gap:4,marginBottom:14}}>
        {Array.from({length:7}).map((_,i)=>{
          const marked=data.days[i+1];
          const isToday2=(i+1)===dayNum;
          const isPast=(i+1)<dayNum&&!marked;
          const isFuture=(i+1)>dayNum;
          const isProof=PROOF_DAYS.includes(i+1);
          return(<div key={i} style={{flex:1,textAlign:"center"}}>
            <div style={{width:"100%",aspectRatio:"1",borderRadius:8,background:marked?"#4ade8033":isToday2?t.accent+"22":isPast?t.danger+"22":t.surface,border:"2px solid "+(marked?"#4ade80":isToday2?t.accent:isPast?t.danger:t.border),display:"flex",alignItems:"center",justifyContent:"center",marginBottom:3,position:"relative",transition:"all 0.2s"}}>
              <span style={{fontSize:11}}>{marked?"✅":isToday2?"👆":isPast?"❌":""}</span>
              {isProof&&!isFuture&&<span style={{position:"absolute",top:-5,right:-5,fontSize:8,background:isProof&&marked?t.success:t.accent,borderRadius:4,padding:"0 2px",color:"#000",fontWeight:700}}>📸</span>}
            </div>
            <span style={{fontSize:9,color:isToday2?t.accent:t.muted,fontWeight:isToday2?700:400}}>D{i+1}</span>
          </div>);
        })}
      </div>

      {/* Proof day reminder */}
      {isProofDay&&!todayMarked&&(
        <div style={{background:t.accent+"18",border:"1px solid "+t.accent+"44",borderRadius:10,padding:"9px 12px",marginBottom:12,display:"flex",gap:8,alignItems:"flex-start"}}>
          <span style={{flexShrink:0}}>{IC.camera(t.muted,16)}</span>
          <div style={{fontSize:11,color:t.text,lineHeight:1.6}}>
            <strong>Day {dayNum} is a proof day!</strong> After completing your habit, post it on Instagram/WhatsApp Stories — you'll need this screenshot for the form.
          </div>
        </div>
      )}

      {/* Today's action */}
      {!todayMarked&&dayNum<=7&&(
        <div style={{marginBottom:12}}>
          {!habitDoneToday
            ?<div style={{background:t.surface,borderRadius:10,padding:12,fontSize:12,color:t.muted,textAlign:"center",lineHeight:1.6}}>
                ⏳ Complete <strong style={{color:t.text}}>{data.habitIcon} {data.habitName}</strong> today first, then come back to mark Day {dayNum}
              </div>
            :<button onClick={markDay} style={{width:"100%",padding:"13px",borderRadius:12,border:"none",background:t.accent,color:"#000",fontWeight:700,cursor:"pointer",fontSize:14,animation:"fadeIn 0.3s ease"}}>
                ✅ Mark Day {dayNum} Complete!{isProofDay?" (don't forget your screenshot!)":""}
              </button>}
        </div>
      )}
      {todayMarked&&(
        <div style={{background:t.success+"18",border:"1px solid "+t.success+"44",borderRadius:10,padding:10,textAlign:"center",marginBottom:12,fontSize:12,color:t.success,fontWeight:700}}>
          ✅ Day {dayNum} marked! {7-daysMarked>0?7-daysMarked+" more days to go 💪":"All 7 done! Submit below 🎉"}
        </div>
      )}

      {/* Proof checklist */}
      <div style={{background:t.surface,borderRadius:10,padding:12,marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:700,color:t.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>📸 Screenshot Checklist</div>
        {PROOF_DAYS.map(d=>{
          const done=data.days[d];
          const future=d>dayNum;
          return(
            <div key={d} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:d!==7?"1px solid "+t.border:"none",opacity:future?0.4:1}}>
              <span style={{fontSize:14}}>{done?"✅":future?"⬜":"❌"}</span>
              <div style={{flex:1}}>
                <span style={{fontSize:11,color:done?t.success:future?t.muted:t.text,fontWeight:done?700:400}}>Day {d} post screenshot</span>
                {done&&<span style={{fontSize:9,color:t.muted,marginLeft:6}}>{done.date}</span>}
                {!done&&!future&&<span style={{fontSize:9,color:t.danger,marginLeft:6}}>Post on Instagram/WhatsApp now!</span>}
                {future&&<span style={{fontSize:9,color:t.muted,marginLeft:6}}>upcoming</span>}
              </div>
            </div>
          );
        })}
      </div>

      {/* Submit + restart */}
      <div style={{display:"flex",gap:8}}>
        <a href={CHALLENGE_FORM} target="_blank" style={{flex:1,padding:"10px",borderRadius:10,border:"1px solid "+t.accent+"44",background:t.accent+"12",color:t.accent,fontWeight:700,fontSize:11,textAlign:"center",textDecoration:"none",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
          <span style={{display:"inline-flex",alignItems:"center",gap:5}}>{IC.plan("#000",13)} Submit Form</span>
        </a>
        <button onClick={resetChallenge} style={{padding:"10px 12px",borderRadius:10,border:"1px solid "+t.border,background:"none",color:t.muted,cursor:"pointer",fontSize:11,fontWeight:600}}>Restart</button>
      </div>
    </div>
  );
}

function ExportPanel({t,habits,goals,journals,goalStats,displayName,canPDF=false,user,isPlus=false}){
  const[exporting,setExporting]=useState(null); // null | "habits_csv_plain" | "goals_csv" | "journal_csv" | "pdf"
  const[range,setRange]=useState("30"); // "30" | "90" | "all"

  function downloadCSV(filename,rows,skipBOM){
    const csv=rows.map(r=>r.map(cell=>{
      const s=String(cell==null?"":cell);
      return s.includes(",") || s.includes('"')||s.includes("\n") ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(",")).join("\n");
    // Item 33: prepend UTF-8 BOM — without it, Excel/Sheets misreads emoji/multi-byte characters as garbled text.
    // B17: pure-ASCII exports (Goals — no emoji anywhere in its data) skip the BOM entirely, since some
    // apps that don't recognize a BOM render its raw bytes as a visible "ï»¿" artifact — and an export
    // with no multi-byte content doesn't need the signal in the first place.
    const blob=new Blob([(skipBOM?"":"\uFEFF")+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;a.click();
    URL.revokeObjectURL(url);
  }

  // Item 36: strips emoji/symbols down to plain ASCII — used by the Plain Text fallback export for apps (e.g. Google Sheets Android) that misrender emoji on import
  function toPlainAscii(str){
    return String(str||"")
      .replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\u{FE0F}\u{200D}]/gu,"")
      .replace(/\s{2,}/g," ")
      .trim();
  }

  // Item: extracted so both the standalone Habits CSV export and the new Data Pack ZIP can reuse identical logic
  function habitSummaryRows(plain){
    const cutoffDays=range==="all"?3650:parseInt(range);
    const rows=[["Habit","Category","Streak","Best Streak","Total Done","Completion Rate","Days Tracked","Created On"]];
    habits.forEach(h=>{
      const total=Object.keys(h.log||{}).filter(d=>isFullDoneOn(h,d,h.log[d])).length;
      const createdAt=h.createdAt||Object.keys(h.log||{}).sort()[0]||new Date().toLocaleDateString("en-CA");
      const createdDaysAgo=Math.max(1,Math.ceil((new Date()-new Date(createdAt+"T00:00:00"))/86400000));
      const daysTracked=Math.min(cutoffDays,createdDaysAgo);
      const rate=Math.min(100,Math.round((total/createdDaysAgo)*100));
      rows.push([plain?toPlainAscii(h.name):(h.icon||"")+" "+h.name,h.cat||"",(h.streak||0)+"d",(h.best||0)+"d",total,rate+"%",daysTracked+" days",createdAt]);
    });
    return rows;
  }
  function habitDailyLogRows(datesAsc,plain){
    const rows=[["Date",...habits.map(h=>plain?toPlainAscii(h.name):(h.icon||"")+" "+h.name)]];
    datesAsc.forEach(date=>{
      const row=[date];
      habits.forEach(h=>{
        const v=h.log&&h.log[date];
        if(!v){row.push("");}
        else if(goalCountAt(h,date)>0&&h.goalUnit){const gc=goalCountAt(h,date);row.push(typeof v==="number"?v+"/"+gc:"✓");}
        else{row.push("✓");}
      });
      rows.push(row);
    });
    return rows;
  }


  // Item 36: plain-ASCII fallback — identical data, habit names stripped of emoji for apps that misrender them on CSV import
  function exportHabitsCSVPlain(){
    setExporting("habits_csv_plain");
    const cutoffDays=range==="all"?3650:parseInt(range);
    const dates=[];
    for(let i=0;i<cutoffDays;i++){const d=new Date();d.setDate(d.getDate()-i);dates.push(d.toLocaleDateString("en-CA"));}
    const datesAsc=[...dates].reverse();
    const rows=[["HABIT SUMMARY"],...habitSummaryRows(true),[],["DAILY LOG"],...habitDailyLogRows(datesAsc,true)];
    downloadCSV("habtix-habits-plain-"+range+"days-"+new Date().toISOString().split("T")[0]+".csv",rows);
    setTimeout(()=>setExporting(null),1000);
  }

  function goalsRows(){
    const rows=[["Goal","Priority","Deadline","Created","Progress%","Actions Total","Actions Done","Action","Action Done","Completed Date","Expected Result"]];
    goals.forEach(g=>{
      const done=g.actions.filter(a=>a.done).length;
      const pct=g.actions.length>0?Math.round(done/g.actions.length*100):0;
      if(g.actions.length===0){
        rows.push([g.title,g.priority||"",g.deadline||"",g.createdAt||"",pct+"%",0,0,"","","",""]);
      } else {
        g.actions.forEach((a,i)=>{
          rows.push([i===0?g.title:"",i===0?g.priority||"":"",i===0?g.deadline||"":"",i===0?g.createdAt||"":"",i===0?pct+"%":"",i===0?g.actions.length:"",i===0?done:"",a.action||"",a.done?"Yes":"No",a.doneAt||"",a.result||""]);
        });
      }
    });
    return rows;
  }
  function exportGoalsCSV(){
    setExporting("goals_csv");
    downloadCSV("habtix-goals-"+new Date().toISOString().split("T")[0]+".csv",goalsRows(),true);
    setTimeout(()=>setExporting(null),1000);
  }

  function journalRows(){
    const MOODS=["Rough","Low","Okay","Good","Great"];
    const cutoffDays=range==="all"?3650:parseInt(range);
    const rows=[["Date","Title","Mood","Mood Score","Tags","Entry","Word Count"]];
    Object.entries(journals).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([date,raw])=>{
      const daysAgo=Math.floor((new Date()-new Date(date+"T12:00:00"))/86400000);
      if(daysAgo>cutoffDays)return;
      const e=typeof raw==="object"?raw:{note:raw||"",mood:null,tags:[],title:""};
      const wc=(e.note||"").trim().split(/\s+/).filter(Boolean).length;
      rows.push([date,e.title||"",e.mood!=null?MOODS[e.mood]:"",e.mood!=null?e.mood+1:"",(e.tags||[]).join("; "),e.note||"",wc]);
    });
    return rows;
  }
  function exportJournalCSV(){
    setExporting("journal_csv");
    downloadCSV("habtix-journal-"+range+"days-"+new Date().toISOString().split("T")[0]+".csv",journalRows());
    setTimeout(()=>setExporting(null),1000);
  }

  // AI Coach PDF Report credit check — reads/writes the shared credit pool (hg_ai_credits_{uid} / Firebase aiCredits), Firebase as source of truth
  async function checkAndDeductAICredits(n){
    const uid=user?.uid;
    const thisMonth=new Date().toISOString().slice(0,7);
    const key="hg_ai_credits_"+(uid||"guest");
    const resetKey="hg_ai_reset_"+(uid||"guest");
    const maxC=isPlus?50:0;
    let current=maxC;
    if(uid&&window._fb){
      try{
        const fbR=window._fb;
        const snap=await fbR.getDoc(fbR.doc(fbR.db,"users",uid));
        const data=snap.exists()?snap.data():{};
        current=data.aiCreditsResetMonth===thisMonth&&typeof data.aiCredits==="number"?data.aiCredits:maxC;
      }catch(e){
        const stored=localStorage.getItem(key),resetDate=localStorage.getItem(resetKey);
        current=resetDate===thisMonth&&stored!==null?parseInt(stored):maxC;
      }
    } else {
      const stored=localStorage.getItem(key),resetDate=localStorage.getItem(resetKey);
      current=resetDate===thisMonth&&stored!==null?parseInt(stored):maxC;
    }
    if(current<n)return false;
    const newC=current-n;
    localStorage.setItem(key,String(newC));
    localStorage.setItem(resetKey,thisMonth);
    if(uid&&window._fb){
      const fbR=window._fb;
      fbR.setDoc(fbR.doc(fbR.db,"users",uid),{aiCredits:newC,aiCreditsResetMonth:thisMonth},{merge:true}).catch(e=>console.error("PDF AI credit save err:",e));
    }
    return true;
  }
  // 3 credits per report — only this section costs anything; the rest of the PDF is pure calculation
  async function buildAICoachReview(habitRows,goalRiskRows,moodSummary){
    if(!isPlus)return{error:"plus"};
    const got=await checkAndDeductAICredits(3);
    if(!got)return{error:"credits"};
    try{
      const habitCtx=habitRows.slice(0,8).map(r=>r.name+": "+r.rate+"% ("+r.streak+"d streak)").join("; ");
      const goalCtx=goalRiskRows.slice(0,6).map(r=>r.title+": "+r.pct+"% done, "+r.riskLabel).join("; ");
      const idToken4=await window._fb.auth.currentUser.getIdToken();
      const resp=await fetch("/api/ai",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken4},
        body:JSON.stringify({
          creditCost:3,
          usageType:"pdf_report",
          model:MODEL,
          max_tokens:900,
          system:"You are an AI habit and goal coach reviewing a user's Habtix app performance data. Return ONLY valid JSON, no markdown backticks. Format: {\"wentWell\":[\"...\"],\"needsImprovement\":[\"...\"],\"bottleneck\":\"...\",\"strategy\":[\"...\"]}. Rules: wentWell = 2-3 specific observations (max 15 words each) using the actual habit/goal names given; needsImprovement = 2-3 specific observations (max 15 words each); bottleneck = one sentence (max 22 words) naming the single biggest blocker; strategy = exactly 4 short concrete actions (max 14 words each) for the next 30 days. Be specific and direct, not generic.",
          messages:[{role:"user",content:"Habits (rate, streak): "+(habitCtx||"none")+"\nGoals (progress, risk): "+(goalCtx||"none")+"\nMood: "+moodSummary}]
        })
      });
      if(!resp.ok){const errBody=await resp.text();throw new Error("HTTP "+resp.status+": "+errBody.slice(0,180));}
      const data=await resp.json();
      if(data.error)throw new Error("API error");
      const raw=data.content[0].text.replace(/```json|```/g,"").trim();
      const parsedReview=JSON.parse(raw);
      try{window.trackEvent&&window.trackEvent("ai_used",{feature:"pdf_report"});}catch(e){}
      return parsedReview;
    }catch(e){
      console.error("AI Coach Review error:",e);
      return{error:"failed"};
    }
  }

  async function exportPDF(){
    setExporting("pdf");
    const MOODS=["Rough","Low","Okay","Good","Great"];
    const MOOD_EMOJI=["😩","😞","😐","🙂","😊"];
    const WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const cutoffDays=range==="all"?3650:parseInt(range);
    const cutoffDate=(()=>{const d=new Date();d.setDate(d.getDate()-(cutoffDays-1));return d.toLocaleDateString("en-CA");})();
    const totalHabitDone=habits.reduce((s,h)=>s+Object.keys(h.log||{}).filter(d=>d>=cutoffDate&&isFullDoneOn(h,d,h.log[d])).length,0);
    const recentJournals=Object.entries(journals).sort((a,b)=>b[0].localeCompare(a[0])).filter(([d])=>Math.floor((new Date()-new Date(d+"T12:00:00"))/86400000)<=cutoffDays).slice(0,10);

    // ── Habit ranking + category performance (pure calc) ──
    const habitRows=habits.map(h=>{
      const total=Object.keys(h.log||{}).filter(d=>isFullDoneOn(h,d,h.log[d])).length;
      const firstDay=h.createdAt||Object.keys(h.log||{}).sort()[0]||new Date().toISOString().split("T")[0];
      const days=Math.max(1,Math.ceil((new Date()-new Date(firstDay+"T00:00:00"))/86400000));
      const rate=Math.min(100,Math.round(total/days*100));
      return{name:h.name,cat:h.cat||"Other",streak:h.streak||0,best:h.best||0,total,rate};
    }).sort((a,b)=>b.rate-a.rate);
    const catMap={};
    habitRows.forEach(r=>{if(!catMap[r.cat])catMap[r.cat]={sum:0,n:0};catMap[r.cat].sum+=r.rate;catMap[r.cat].n++;});
    const catRows=Object.entries(catMap).map(([cat,v])=>({cat,avg:Math.round(v.sum/v.n)})).sort((a,b)=>b.avg-a.avg);
    const bestStreakEver=habits.length>0?Math.max(0,...habits.map(h=>h.best||0)):0;

    // ── Goal deadline-risk analysis (pure calc — threshold logic, not AI) ──
    const goalRiskRows=goals.map(g=>{
      const done=g.actions.filter(a=>a.done).length;
      const pct=g.actions.length>0?Math.round(done/g.actions.length*100):0;
      let daysLeft=null;
      if(g.deadline)daysLeft=Math.ceil((new Date(g.deadline+"T00:00:00")-new Date())/86400000);
      let risk="green",riskLabel="On Track";
      if(daysLeft!=null){
        if(daysLeft<0){risk="red";riskLabel="Overdue";}
        else if(daysLeft<7&&pct<70){risk="red";riskLabel="Critical";}
        else if(daysLeft<14&&pct<50){risk="yellow";riskLabel="Behind Schedule";}
      }
      return{title:g.title,priority:g.priority||"",pct,deadline:g.deadline||"-",done,total:g.actions.length,risk,riskLabel};
    });
    // Goals Completed — from goalStats (permanent, never capped), since completed goals move out of the active goals array
    const goalsCompleted=(goalStats||[]).filter(s=>s.completedAt&&s.completedAt>=cutoffDate).length;

    // ── Mood distribution (pure calc) ──
    const moodCounts=[0,0,0,0,0];
    let moodDaysTotal=0;
    Object.entries(journals).forEach(([d,raw])=>{
      if(d<cutoffDate)return;
      const e=typeof raw==="object"?raw:{mood:null};
      if(e.mood!=null){moodCounts[e.mood]++;moodDaysTotal++;}
    });
    const moodSummary=moodDaysTotal>0?("avg mood "+MOODS[Math.round(moodCounts.reduce((s,c,i)=>s+c*i,0)/moodDaysTotal)]+", "+moodDaysTotal+" days logged"):"no mood data";

    // ── Focus dashboard (pure calc, enhanced) ──
    // Bug fix: previously read totals from hg_pomo_history, which is a rolling ~30-day-capped
    // key — for any report range longer than 30 days, this silently under-reported real focus
    // time. hg_pomo_focuslog is the never-pruned daily aggregate, used for everything except
    // "longest single session," which needs hg_pomo_history's per-session granularity (focuslog
    // only stores daily totals, not individual session lengths) — best-effort for that one stat.
    const focusLogPdf=(()=>{try{return JSON.parse(localStorage.getItem("hg_pomo_focuslog")||"{}");}catch(e){return{};}})();
    const rangeDates=[];for(let i=0;i<cutoffDays;i++){const d=new Date();d.setDate(d.getDate()-i);rangeDates.push(d.toLocaleDateString("en-CA"));}
    const totalFocusMins=rangeDates.reduce((s,d)=>s+((focusLogPdf[d]&&focusLogPdf[d].totalMin)||0),0);
    const totalSessions=rangeDates.reduce((s,d)=>s+((focusLogPdf[d]&&focusLogPdf[d].sessions)||0),0);
    const dailyAvgMins=Math.round(totalFocusMins/cutoffDays);
    const pomoHistory=(()=>{try{return JSON.parse(localStorage.getItem("hg_pomo_history")||"[]");}catch(e){return[];}})();
    const rangePomoForLongest=pomoHistory.filter(s=>rangeDates.includes(s.date));
    const longestSession=rangePomoForLongest.reduce((m,x)=>Math.max(m,x.mins||0),0);
    const dayMins={};
    rangeDates.forEach(d=>{const m=(focusLogPdf[d]&&focusLogPdf[d].totalMin)||0;if(m>0)dayMins[d]=m;});
    const wdFocusTot=[0,0,0,0,0,0,0],wdFocusCnt=[0,0,0,0,0,0,0];
    Object.entries(dayMins).forEach(([d,m])=>{const wd=new Date(d+"T12:00:00").getDay();wdFocusTot[wd]+=m;wdFocusCnt[wd]++;});
    let mostProdDay="-",bestFocusAvg=-1;
    wdFocusTot.forEach((tot,i)=>{if(wdFocusCnt[i]===0)return;const avg=tot/wdFocusCnt[i];if(avg>bestFocusAvg){bestFocusAvg=avg;mostProdDay=WD[i];}});

    // ── Executive Summary: real Momentum Score (matches the app everywhere else now — was
    // previously a separate, simplified SCORE/100 calc with only 4 components, silently
    // out of sync with the real 0-1000/9-component score shown on the Score page) ──
    const flNowPdf=(()=>{try{return JSON.parse(localStorage.getItem("hg_pomo_focuslog")||"{}");}catch{return{};}})();
    const pdfScoreResult=calculateMomentumScore(habits,goals,journals,flNowPdf,{active:false,wins:0,activeDays:0},goalStats);
    const priorStart=(()=>{const d=new Date();d.setDate(d.getDate()-(cutoffDays*2-1));return d.toLocaleDateString("en-CA");})();
    const priorEnd=(()=>{const d=new Date();d.setDate(d.getDate()-cutoffDays);return d.toLocaleDateString("en-CA");})();
    let priorTotalDone=0;
    habits.forEach(h=>{priorTotalDone+=Object.keys(h.log||{}).filter(d=>d>=priorStart&&d<=priorEnd&&isFullDoneOn(h,d,h.log[d])).length;});
    const trendDelta=totalHabitDone-priorTotalDone;
    const achievements=[];
    achievements.push("✅ "+totalHabitDone+" habit completions logged this period");
    if(bestStreakEver>0)achievements.push("🔥 Best streak: "+bestStreakEver+"d");
    achievements.push(trendDelta>0?"📈 Completions up "+trendDelta+" vs previous period":trendDelta<0?"📉 Completions down "+Math.abs(trendDelta)+" vs previous period":"➖ Completions steady vs previous period");
    if(habitRows.length>0)achievements.push("🎯 Most consistent habit: "+habitRows[0].name+" ("+habitRows[0].rate+"%)");
    if(catRows.length>0)achievements.push("🏆 Top category: "+catRows[0].cat+" ("+catRows[0].avg+"%)");

    // ── AI Coach Review — the one AI-narrated section, costs 3 credits, degrades gracefully ──
    const aiReview=await buildAICoachReview(habitRows,goalRiskRows,moodSummary);

    const parts=[];
    parts.push('<!DOCTYPE html><html><head><meta charset="UTF-8">');
    parts.push('<title>Habtix Report - '+displayName+'</title>');
    parts.push('<style>');
    parts.push('*{box-sizing:border-box;}');

    parts.push('table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:13px;}');
    parts.push('th{background:#0d0d0f;color:#f5c842;padding:8px 10px;text-align:left;font-size:12px;}');
    parts.push('td{padding:7px 10px;border-bottom:1px solid #e5e5e5;}');
    parts.push('tr:nth-child(even) td{background:#fafafa;}');
    parts.push('.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}');
    parts.push('.high{background:#fee2e2;color:#dc2626;} .med{background:#fef9c3;color:#ca8a04;} .low{background:#dcfce7;color:#16a34a;}');
    parts.push('.risk-green{background:#dcfce7;color:#16a34a;} .risk-yellow{background:#fef9c3;color:#ca8a04;} .risk-red{background:#fee2e2;color:#dc2626;}');
    parts.push('.done{color:#16a34a;font-weight:700;} .pending{color:#9ca3af;}');
    parts.push('.mood-great{color:#4ade80;} .mood-good{color:#86efac;} .mood-okay{color:#fbbf24;} .mood-low{color:#fb923c;} .mood-rough{color:#f87171;}');

  // ── Analytics Summary CSV — single-page rollup, pure calculation, no AI cost ──
  function analyticsSummaryRows(){
    const cutoffDays=range==="all"?3650:parseInt(range);
    const todayStr=new Date().toLocaleDateString("en-CA");
    const cutoffDate=(()=>{const d=new Date();d.setDate(d.getDate()-(cutoffDays-1));return d.toLocaleDateString("en-CA");})();

    // Aggregate completion rate across all habits within the selected range
    let totalDone=0,totalTracked=0;
    habits.forEach(h=>{
      const createdAt=h.createdAt||Object.keys(h.log||{}).sort()[0]||todayStr;
      const createdDaysAgo=Math.max(1,Math.ceil((new Date()-new Date(createdAt+"T00:00:00"))/86400000));
      const daysTracked=Math.min(cutoffDays,createdDaysAgo);
      const done=Object.keys(h.log||{}).filter(d=>d>=cutoffDate&&isFullDoneOn(h,d,h.log[d])).length;
      totalDone+=done;totalTracked+=daysTracked;
    });
    const completionRate=totalTracked>0?Math.round((totalDone/totalTracked)*100):0;
    const bestStreakEver=habits.length>0?Math.max(0,...habits.map(h=>h.best||0)):0;

    // Focus hours from Pomodoro history (localStorage — same source FocusChart uses)
    let focusMins=0;
    try{
      const hist=JSON.parse(localStorage.getItem("hg_pomo_history")||"[]");
      focusMins=hist.filter(s=>s.date&&s.date>=cutoffDate).reduce((s,x)=>s+(x.mins||0),0);
    }catch(e){}

    // Journal days with actual content, within range
    const journalDays=Object.entries(journals).filter(([d,e])=>{
      if(d<cutoffDate)return false;
      const entry=typeof e==="object"?e:{note:e||"",mood:null};
      return (entry.note&&entry.note.trim())||entry.mood!=null;
    }).length;

    // Goals completed within range (goalStats is permanent, never capped — accurate even after goalHistory trims)
    const goalsCompleted=(goalStats||[]).filter(s=>s.completedAt&&s.completedAt>=cutoffDate).length;

    // Best day of week — highest average habits-completed count
    const weekdayTotals=[0,0,0,0,0,0,0],weekdayCounts=[0,0,0,0,0,0,0];
    for(let i=0;i<cutoffDays;i++){
      const d=new Date();d.setDate(d.getDate()-i);
      const dateStr=d.toLocaleDateString("en-CA");
      const doneCount=habits.filter(h=>{const v=h.log&&h.log[dateStr];return isFullDoneOn(h,dateStr,v);}).length;
      weekdayTotals[d.getDay()]+=doneCount;weekdayCounts[d.getDay()]++;
    }
    const WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    let bestDay="-",bestAvg=-1;
    weekdayTotals.forEach((tot,i)=>{
      if(weekdayCounts[i]===0)return;
      const avg=tot/weekdayCounts[i];
      if(avg>bestAvg){bestAvg=avg;bestDay=WD[i];}
    });

    return [
      ["Metric","Value"],
      ["Active Habits",habits.length],
      ["Completion Rate",completionRate+"%"],
      ["Best Streak Ever",bestStreakEver+"d"],
      ["Total Focus Hours",(focusMins/60).toFixed(1)],
      ["Journal Days",journalDays],
      ["Goals Completed",goalsCompleted],
      ["Best Day",bestDay],
    ];
  }

// Item 39: referral tier ladder — 1→7d, 5→20d, 10→40d, 15→60d, nothing beyond 15. Hard 60-day lifetime cap regardless of timing/order.
const REFERRAL_TIERS=[{count:1,days:7},{count:5,days:20},{count:10,days:40},{count:15,days:60}];
const REFERRAL_LIFETIME_CAP_DAYS=60;
function referralEntitledDays(referralCount){
  let entitled=0;
  REFERRAL_TIERS.forEach(tier=>{if(referralCount>=tier.count)entitled=tier.days;});
  return Math.min(REFERRAL_LIFETIME_CAP_DAYS,entitled);
}
// Computes what to merge-write for a referrer's OWN milestone ladder (separate from any signup bonus they personally received).
// currentPlan/currentExpiry should be the plan ignoring this grant (e.g. "free" if just expired). Returns null if nothing to change —
// either already on Plus (banked silently, untouched) or no new tier has been crossed since the last grant.
function computeReferralGrant(currentPlan,currentExpiry,alreadyGranted,referralCount){
  if(currentPlan==="plus")return null;
  const entitled=referralEntitledDays(referralCount);
  const delta=entitled-(alreadyGranted||0);
  if(delta<=0)return null;
  const now=new Date();
  const curExp=currentExpiry?new Date(currentExpiry):null;
  const base=(curExp&&curExp>now)?curExp:now; // never reduces existing/paid time — only ever extends forward
  const newExpiry=new Date(base.getTime()+delta*86400000);
  return{plan:"pro",planExpiry:newExpiry.toISOString(),referralBonusDaysGranted:entitled};
}

// F9: Challenge winner shareable card — same canvas pattern as StreakShareModal
function ChallengeWinnerCard({t,challenge,winnerName,onClose}){
  const canvasRef=useRef();
  const[generated,setGenerated]=useState(false);
  const[copied,setCopied]=useState(false);
  const accentColor=t.accent||"#f5c842";
  const totalDays=challenge.durationDays;
  const winDays=challenge.winnerDays||totalDays;

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas)return;
    const ctx=canvas.getContext("2d");
    const W=canvas.width=540,H=canvas.height=540;

    function drawCard(moImg){
      ctx.fillStyle="#0d0d0f";
      ctx.fillRect(0,0,W,H);
      const grd=ctx.createRadialGradient(0,0,10,0,0,280);
      grd.addColorStop(0,accentColor+"44");
      grd.addColorStop(1,"transparent");
      ctx.fillStyle=grd;
      ctx.fillRect(0,0,W,H);
      ctx.strokeStyle=accentColor+"66";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.roundRect(12,12,W-24,H-24,24);
      ctx.stroke();

      if(moImg){
        const moW=92,moH=moW*(moImg.height/moImg.width);
        ctx.save();
        ctx.shadowColor=accentColor+"88";
        ctx.shadowBlur=18;
        ctx.drawImage(moImg,W-moW-22,22,moW,moH);
        ctx.restore();
      }

      ctx.fillStyle=accentColor;
      ctx.font="bold 22px system-ui,sans-serif";
      ctx.textAlign="left";
      ctx.fillText("⚡ Habtix",36,58);

      ctx.font="72px system-ui";
      ctx.textAlign="center";
      ctx.fillText("🏆",W/2,190);

      ctx.fillStyle="#f0eff4";
      ctx.font="bold 30px system-ui,sans-serif";
      ctx.textAlign="center";
      const title=(challenge.title||"Friend Challenge").length>20?challenge.title.slice(0,19)+"…":(challenge.title||"Friend Challenge");
      ctx.fillText(title,W/2,240);

      ctx.fillStyle=accentColor;
      ctx.font="bold 44px system-ui,sans-serif";
      ctx.textAlign="center";
      const wName=(winnerName||"").length>18?winnerName.slice(0,17)+"…":winnerName;
      ctx.fillText(wName,W/2,320);

      ctx.fillStyle="#7a7a8c";
      ctx.font="bold 24px system-ui,sans-serif";
      ctx.textAlign="center";
      ctx.fillText("WINNER — "+winDays+"/"+totalDays+" DAYS",W/2,362);

      ctx.fillStyle="#4a4a5a";
      ctx.font="16px system-ui,sans-serif";
      ctx.textAlign="center";
      ctx.fillText("app.habtix-app.com",W/2,505);

      setGenerated(true);
    }

    const moImg=new Image();
    moImg.crossOrigin="anonymous";
    moImg.onload=()=>drawCard(moImg);
    moImg.onerror=()=>drawCard(null);

function ReferralCard({t,user,pk,plan,referralCountLive}){
  const[copied,setCopied]=useState(false);
  const[referralCount,setReferralCount]=useState(0);
  const[referrals,setReferrals]=useState([]);
  const[loading,setLoading]=useState(true);
  const[diagResult,setDiagResult]=useState(null);
  const[diagLoading,setDiagLoading]=useState(false);
  // Prefer the authoritative count from /api/referral-grant (the same server call that
  // actually computed and applied the reward) so the displayed number can never drift from
  // what was actually granted. Falls back to this card's own query below only until that
  // prop arrives, or if the boot-time call failed for some reason.
  const displayCount=referralCountLive!=null?referralCountLive:referralCount;

  // Item 39: full UID, not a truncated/recased code — the count check compares against the exact full UID, so anything else never matches
  const refCode=user?.uid||"";
  const refLink="https://app.habtix-app.com/share-refer.html?ref="+refCode;

  useEffect(()=>{
    if(!user?.uid)return;
    // Load referral count from Firestore
    async function loadReferrals(){
      try{
        const refQ=fb.query(
          fb.collection(fb.db,"users"),
          fb.where("referredBy","==",user.uid),
          fb.where("onboardingCompleted","==",true)
        );
        const snap=await fb.getDocs(refQ);
        setReferralCount(snap.size);
        setReferrals(snap.docs.map(d=>({email:d.data().email||"Anonymous",date:d.data().signupDate||""})));
      }catch(e){
        // Silently fail if query fails
      }finally{setLoading(false);}
    }
    loadReferrals();
  },[user?.uid]);

  function copyLink(){
    navigator.clipboard.writeText(refLink).then(()=>{
      setCopied(true);
      setTimeout(()=>setCopied(false),2500);
      try{window.trackEvent&&window.trackEvent("referral_shared",{method:"copy"});}catch(e){}
    });
  }

  function shareLink(){
    const text="I've been using Habtix to build habits & crush goals 🔥\n\nJoin me — use my link and we both get 7 days Pro free!\n\n"+refLink;
    if(navigator.share){
      navigator.share({title:"Join Habtix",text});
      try{window.trackEvent&&window.trackEvent("referral_shared",{method:"share"});}catch(e){}
    } else {
      copyLink();
    }
  }

  const REWARDS=[
    {count:1,reward:"7 days Pro free",icon:"🎁"},
    {count:5,reward:"20 days Pro free",icon:"⚡"},
    {count:10,reward:"40 days Pro free",icon:"🏆"},
    {count:15,reward:"60 days Pro free",icon:"👑"},
  ];
  const nextReward=REWARDS.find(r=>r.count>displayCount);
  const toNext=nextReward?nextReward.count-displayCount:0;

  return(
    <div style={{background:t.card,border:"1px solid "+t.border,borderRadius:14,padding:16,marginBottom:12}}>
      <div style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:12,display:"flex",alignItems:"center",gap:5}}>{IC.gift(t.muted,11)} Refer & Earn</div>

      {/* Reward progress */}
      <div style={{background:"linear-gradient(135deg,"+t.accent+"14,"+t.accent+"03)",border:"1px solid "+t.accent+"33",borderRadius:12,padding:12,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:13,fontWeight:700,color:t.accent}}>Your Referrals</div>
          <div style={{fontSize:20,fontWeight:800,color:t.accent}}>{(loading&&referralCountLive==null)?"—":displayCount}</div>
        </div>
        {nextReward&&<>
          <div style={{fontSize:11,color:t.muted,marginBottom:6}}>
            {toNext>0?toNext+" more to unlock "+nextReward.reward+" "+nextReward.icon:"🎉 Reward unlocked! "+nextReward.icon}
          </div>
          <div style={{height:5,background:t.surface,borderRadius:4}}>
            <div style={{height:"100%",width:Math.min((displayCount/nextReward.count)*100,100)+"%",background:t.accent,borderRadius:4,transition:"width 0.5s"}}/>
          </div>
        </>}
        {!nextReward&&<div style={{fontSize:11,color:t.success,fontWeight:700}}>{IC.trophy(t.success,13)} You've unlocked all rewards!</div>}
      </div>

      {/* Referral link */}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:t.muted,marginBottom:7,textTransform:"uppercase",letterSpacing:0.5}}>Your Referral Link</div>
        <div style={{background:t.surface,border:"1px solid "+t.border,borderRadius:10,padding:"10px 12px",display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <div style={{flex:1,fontSize:11,color:t.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{refLink}</div>
          <button onClick={copyLink} style={{padding:"5px 10px",borderRadius:8,border:"1px solid "+(copied?t.success:t.accent+"44"),background:copied?t.success+"18":t.accent+"12",color:copied?t.success:t.accent,cursor:"pointer",fontSize:11,fontWeight:700,flexShrink:0,display:"inline-flex",alignItems:"center",gap:3}}>{copied?<>{IC.check(t.success,11)} Copied</>:<>{IC.plan(t.accent,11)} Copy</>}</button>
        </div>
        <button onClick={shareLink} style={{width:"100%",padding:"11px",borderRadius:11,border:"none",background:t.accent,color:"#000",fontWeight:700,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>{IC.share("#000",15)} Share Link</button>
      </div>

      {/* Reward tiers */}
      <div style={{marginBottom:referrals.length>0?12:0}}>
        <div style={{fontSize:11,fontWeight:700,color:t.muted,marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>Reward Tiers</div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {REWARDS.map(r=>{
            const unlocked=referralCount>=r.count;
            return(<div key={r.count} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:9,background:unlocked?t.success+"14":t.surface,border:"1px solid "+(unlocked?t.success+"44":t.border)}}>
              <span style={{fontSize:16}}>{r.icon}</span>
              <div style={{flex:1}}>
                <span style={{fontSize:12,fontWeight:600,color:unlocked?t.success:t.text}}>{r.count} referral{r.count>1?"s":""}</span>
                <span style={{fontSize:11,color:t.muted,marginLeft:6}}>→ {r.reward}</span>
              </div>
              {unlocked&&<span style={{fontSize:11,color:t.success,fontWeight:700}}>✅</span>}
              {!unlocked&&referralCount>0&&r.count===nextReward?.count&&<span style={{fontSize:9,color:t.accent,fontWeight:700}}>{toNext} to go</span>}
            </div>);
          })}
        </div>
      </div>

      {/* Who you referred */}
      {referrals.length>0&&<div>
        <div style={{fontSize:11,fontWeight:700,color:t.muted,marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>Friends You Referred</div>
        {referrals.slice(0,5).map((r,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:t.surface,borderRadius:9,marginBottom:5}}>
            <span>{IC.person(t.muted,14)}</span>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:600,color:t.text}}>{r.email.split("@")[0]}***</div>
              {r.date&&<div style={{fontSize:10,color:t.muted}}>Joined {r.date}</div>}
            </div>
            <span style={{fontSize:10,color:t.success,fontWeight:700}}>✓ Counted</span>
          </div>
        ))}
      </div>}

      <div style={{fontSize:10,color:t.muted,textAlign:"center",marginTop:10,lineHeight:1.6}}>
        When a friend signs up using your link, you both get 7 days Pro free automatically.
      </div>

      {/* Diagnostic tool — calls the same endpoint the app calls at boot, but shows the raw
          result or error directly instead of just logging it, so a genuine failure (endpoint
          unreachable, 401/500, misconfigured server) is immediately distinguishable from "it's
          working correctly and the real count is just 0" without needing DevTools open. */}
      <button onClick={async()=>{
        setDiagResult(null);setDiagLoading(true);
        try{
          const idToken=await user.getIdToken();
          const resp=await fetch("/api/referral-grant",{method:"POST",headers:{"Authorization":"Bearer "+idToken}});
          const body=await resp.json().catch(()=>({}));
          setDiagResult({ok:resp.ok,status:resp.status,body});
        }catch(e){
          setDiagResult({ok:false,status:"—",body:{error:"Request failed: "+(e?.message||"unknown — likely a network issue or the endpoint isn't reachable at all")}});
        }
        setDiagLoading(false);
      }} style={{width:"100%",marginTop:10,padding:"7px",borderRadius:8,border:"1px dashed "+t.border,background:"none",color:t.muted,fontSize:10,cursor:"pointer"}}>
        {diagLoading?"Checking…":"Check referral system"}
      </button>
      {diagResult&&(
        <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,background:diagResult.ok?t.surface:"#ef444422",border:"1px solid "+(diagResult.ok?t.border:"#ef444455"),fontSize:10,color:t.muted,fontFamily:"monospace",wordBreak:"break-word"}}>
          <div style={{fontWeight:700,color:diagResult.ok?t.text:"#ef4444",marginBottom:3}}>
            {diagResult.ok?"✓ Endpoint reached (HTTP "+diagResult.status+")":"✗ Failed (HTTP "+diagResult.status+")"}
          </div>
          {JSON.stringify(diagResult.body)}
        </div>
      )}
    </div>
  );
}

// H-Cards: renders a milestone card from a permanent snapshot {id,habitId,habitName,icon,color,streak,date,shared}.
// No longer takes a live habit — snapshot-based so it looks identical no matter how much later it's reopened/reshared from the Cards tab.
function StreakShareModal({t,card,onClose,onShared}){
  const canvasRef=useRef();
  const[generated,setGenerated]=useState(false);
  const[copied,setCopied]=useState(false);
  const accentColor=card.color||"#f5c842";

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas)return;
    const ctx=canvas.getContext("2d");
    const W=canvas.width=540,H=canvas.height=540;

    function drawCard(moImg){
    // Background — dark with accent glow
    ctx.fillStyle="#0d0d0f";
    ctx.fillRect(0,0,W,H);

    // Accent glow top-left
    const grd=ctx.createRadialGradient(0,0,10,0,0,280);
    grd.addColorStop(0,accentColor+"44");
    grd.addColorStop(1,"transparent");
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);

    // Border
    ctx.strokeStyle=accentColor+"66";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.roundRect(12,12,W-24,H-24,24);
    ctx.stroke();

    // Mo flexing — top-right corner, celebrating the streak
    if(moImg){
      const moW=92,moH=moW*(moImg.height/moImg.width);
      ctx.save();
      ctx.shadowColor=accentColor+"88";
      ctx.shadowBlur=18;
      ctx.drawImage(moImg,W-moW-22,22,moW,moH);
      ctx.restore();
    }

    // Habtix branding
    ctx.fillStyle=accentColor;
    ctx.font="bold 22px system-ui,sans-serif";
    ctx.textAlign="left";
    ctx.fillText("⚡ Habtix",36,58);

    // Habit icon + name
    ctx.font="72px system-ui";
    ctx.textAlign="center";
    ctx.fillText(card.icon||"🔥",W/2,190);

    ctx.fillStyle="#f0eff4";
    ctx.font="bold 34px system-ui,sans-serif";
    ctx.textAlign="center";
    const name=card.habitName.length>18?card.habitName.slice(0,17)+"…":card.habitName;
    ctx.fillText(name,W/2,240);

    // Streak number — big
    ctx.fillStyle=accentColor;
    ctx.font="bold 130px system-ui,sans-serif";
    ctx.textAlign="center";
    ctx.fillText(card.streak,W/2,385);

    // "DAY STREAK" label
    ctx.fillStyle="#7a7a8c";
    ctx.font="bold 26px system-ui,sans-serif";
    ctx.textAlign="center";
    ctx.fillText("DAY STREAK 🔥",W/2,425);

    // Milestone date
    ctx.fillStyle="#5a5a6a";
    ctx.font="14px system-ui,sans-serif";
    ctx.textAlign="center";
    ctx.fillText(new Date(card.date+"T12:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}),W/2,458);

    // App URL
    ctx.fillStyle="#4a4a5a";
    ctx.font="16px system-ui,sans-serif";
    ctx.textAlign="center";
    ctx.fillText("app.habtix-app.com",W/2,505);

    setGenerated(true);
    }

    const moImg=new Image();
    moImg.crossOrigin="anonymous";
    moImg.onload=()=>drawCard(moImg);
    moImg.onerror=()=>drawCard(null); // draw the card without Mo if the image fails to load
    moImg.src="https://raw.githubusercontent.com/Ritesh1716/habtix/main/mo/mo-flex.png";
  },[card,accentColor]);

  function shareCard(){
    const canvas=canvasRef.current;
    if(!canvas)return;
    canvas.toBlob(async blob=>{
      const file=new File([blob],"habtix-streak.png",{type:"image/png"});
      const txt="🔥 "+card.streak+"-day streak on "+card.icon+" "+card.habitName+"! Building momentum daily. Track yours → https://app.habtix-app.com/share-milestone.html";
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],text:txt});
      } else if(navigator.share){
        await navigator.share({title:"My Streak",text:txt});
      } else {
        const url=canvas.toDataURL("image/png");
        const a=document.createElement("a");a.href=url;a.download="habtix-"+card.habitName+"-"+card.streak+"d.png";a.click();
      }
      if(onShared)onShared();
    },"image/png");
  }

  function copyText(){
    const txt="🔥 "+card.streak+"-day streak on "+card.icon+" "+card.habitName+"! Building momentum daily. Track yours → https://app.habtix-app.com/share-milestone.html";
    navigator.clipboard.writeText(txt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);if(onShared)onShared();});
  }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2500,padding:20}}>
      <div style={{background:"#18181c",border:"1px solid #2a2a32",borderRadius:24,padding:24,width:"100%",maxWidth:360,textAlign:"center"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:15,fontWeight:800,color:"#f0eff4",display:"flex",alignItems:"center",gap:6}}>{IC.share("#f0eff4",15)} Share Your Streak</div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#7a7a8c",cursor:"pointer",fontSize:20,lineHeight:1}}>×</button>
        </div>

        {/* Canvas preview */}
        <div style={{borderRadius:16,overflow:"hidden",marginBottom:16,border:"1px solid #2a2a32"}}>
          <canvas ref={canvasRef} style={{width:"100%",height:"auto",display:"block"}}/>
        </div>

        {generated&&<>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <button onClick={shareCard} style={{flex:1,padding:"12px",borderRadius:12,border:"none",background:"#25D366",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13,display:"inline-flex",alignItems:"center",gap:5}}>{IC.mobile("#fff",14)} Share Image</button>
            <button onClick={copyText} style={{flex:1,padding:"12px",borderRadius:12,border:"1px solid #2a2a32",background:"none",color:copied?"#4ade80":"#f0eff4",fontWeight:700,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>{copied?<>{IC.check("#4ade80",13)} Copied!</>:<>{IC.plan("#f0eff4",13)} Copy Text</>}</button>
          </div>
          <div style={{fontSize:11,color:"#4a4a5a",marginBottom:4}}>Share to WhatsApp, Instagram, or anywhere!</div>
        </>}
        <button onClick={onClose} style={{width:"100%",padding:"10px",borderRadius:12,border:"1px solid #2a2a32",background:"none",color:"#7a7a8c",cursor:"pointer",fontSize:13,marginTop:6}}>Close</button>
      </div>
    </div>
  );
}

function AppHeader({t,user,displayName,pk,onCalendar,onNotif,onProfile,navMuted,onUp}){
