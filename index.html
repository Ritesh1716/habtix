  </>);}

  // Analytics page — Update 18: 4 tabs
  // ══════════════════════════════════════════════════════════════════
  // ANALYTICS — Batch 5. One screen, Week/Month/Year toggle, not four
  // separate tabs. Replaces the old Reviews/Habits/Goals/Cards tab set.
  // Deliberately does NOT read the old Momentum Score history — every
  // number here is recomputed live from real habit/goal-action data
  // (same "never trust a stored field" principle as streaks and the
  // obstacle engine), not the blended, cut Momentum Score pipeline.
  // "Cards" (streak share cards) isn't rebuilt here — Achievements is
  // its natural home; flagged in the batch summary, not silently lost.
  // ══════════════════════════════════════════════════════════════════
  // ANALYTICS-REDESIGN: full restructure — 3 sub-tabs (Overview/Habits/Patterns)
  // instead of one long scroll, and the Week/Month/Year toggle now genuinely scopes
  // everything under Overview instead of silently only affecting two of five
  // sections. Goals block dropped entirely (pure duplication of the Goals tab).
  // Habits tab stays scoped to pure habits only — goal-actions/standalone actions
  // already have their home on the Goals tab, per founder confirmation.
  function AnalyticsPage(){
    const isPro=pk!=="free";
    const range=["week","month","year"].includes(analyticsTab)?analyticsTab:"week";
    function setRange(id){
      if(id!=="week"&&!isPro){showUp("Unlock Month + Year analytics on Pro.");return;}
      setAnalyticsTab(id);
    }
    const section=["overview","habits","patterns"].includes(analyticsSection)?analyticsSection:"overview";
    function setSection(id){
      if(id!=="overview"&&!isPro){showUp("Unlock the Habits and Patterns tabs, plus CSV export, on Pro.");return;}
      setAnalyticsSection(id);
    }

    // ── Show-ups: Week = 7 boxes/1 row. Month = real calendar-month grid, same
    // day-of-week alignment as the Calendar tab (leading blanks, not "last 30
    // days"). Year = all 12 months, 10 boxes/row, stacked. Single green/blank
    // color only — rewarding "did you show up at all," nothing more nuanced. ──
    const weekDates=lastNDates(7).slice().reverse();
    const now=new Date();
    const curYear=now.getFullYear(),curMonth=now.getMonth();
    const daysInCurMonth=new Date(curYear,curMonth+1,0).getDate();
    const monthLeadingBlanks=new Date(curYear,curMonth,1).getDay();
    const monthDateStr=d=>curYear+"-"+String(curMonth+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const monthAllDates=Array.from({length:daysInCurMonth},(_,i)=>monthDateStr(i+1));
    const yearMonths=Array.from({length:12},(_,m)=>{
      const dim=new Date(curYear,m+1,0).getDate();
      const label=new Date(curYear,m,1).toLocaleDateString("en-US",{month:"short"});
      const dateStr=d=>curYear+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      return{label,days:Array.from({length:dim},(_,i)=>dateStr(i+1))};
    });
    const monthElapsed=monthAllDates.filter(d=>d<=today);
    const yearElapsed=yearMonths.flatMap(m=>m.days).filter(d=>d<=today);
    const showUpsCount=range==="week"?weekDates.filter(d=>isShowUpDay(habits,goals,d)).length
      :range==="month"?monthElapsed.filter(d=>isShowUpDay(habits,goals,d)).length
      :yearElapsed.filter(d=>isShowUpDay(habits,goals,d)).length;
    const showUpsTotal=range==="week"?7:range==="month"?monthElapsed.length:yearElapsed.length;

    // ── Completion trend: line graph, not bars. Same completionPctForDate scoping
    // as before (what was actually expected that day — habits already started,
    // goal-actions due that day — not literally every habit that ever existed). ──
    const trendPoints=range==="year"
      ?monthlyAvgCompletion(habits,goals,12).map(m=>({label:m.label,pct:m.avg}))
      :range==="month"
        ?monthAllDates.filter(d=>d<=today).map(d=>({label:String(Number(d.slice(8,10))),pct:completionPctForDate(habits,goals,d)}))
        :weekDates.map(d=>({label:new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"narrow"}),pct:completionPctForDate(habits,goals,d)}));

    const habitBreakdown=habits.map(h=>{
      const dates=lastNDates(30).filter(d=>habitStartDate(h)<=d);
      const doneCount=dates.filter(d=>isFullDoneOn(h,d,h.log&&h.log[d])).length;
      return{id:h.id,name:h.name,icon:h.icon||"",pct:dates.length>0?Math.round(doneCount/dates.length*100):0};
    }).sort((a,b)=>b.pct-a.pct);

    const obSignals=minionSignals(habits,goals);
    const patternHistory=OBSTACLES.filter(o=>isPro||o.tier==="free").map(o=>{
      const unlocked=isObstacleUnlocked(o.id);
      const rec=_obstacleStore.mastery[o.id]||{masteredAt:null,revived:false};
      const heldClean=!!(rec.masteredAt&&!rec.revived);
      return{...o,unlocked,heldClean,signal:unlocked?bossSignal(o.id,obSignals):0,masteredAt:rec.masteredAt,revived:rec.revived};
    });

    const boxStyle=(up,size,future)=>({aspectRatio:"1",borderRadius:size,border:(size>4?"2px":"1px")+" solid "+NB.ink,background:up?NB.green:"#fff",opacity:future?0.25:1});

    return(
    <div style={{padding:16,fontFamily:NB.font,minHeight:"100vh",background:NB.bg,paddingBottom:100}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"10px 0 14px"}}>
        <div style={{fontWeight:700,fontSize:18,color:NB.ink}}>Analytics</div>
        {isPro&&<div onClick={()=>{window.history.pushState({panelSheet:"export"},"",'/');setShowPanelExport(true);}} style={{fontSize:11.5,fontWeight:700,color:NB.ink,textDecoration:"underline",cursor:"pointer"}}>Export CSV</div>}
      </div>

      <div style={{display:"inline-flex",border:"3px solid "+NB.ink,borderRadius:NB.rPill,padding:3,marginBottom:12,background:NB.card,boxShadow:NB.shadowSm}}>
        {[["overview","Overview"],["habits","Habits"],["patterns","Patterns"]].map(([id,label])=>(
          <div key={id} onClick={()=>setSection(id)} style={{fontSize:12,fontWeight:700,padding:"7px 15px",borderRadius:NB.rPill,cursor:"pointer",background:section===id?NB.brand:"transparent",color:section===id?NB.brandInk:NB.muted,fontFamily:NB.font}}>{label}{id!=="overview"&&!isPro?" 🔒":""}</div>
        ))}
      </div>

      {section==="overview"&&<React.Fragment>
        <div style={{display:"inline-flex",border:"3px solid "+NB.ink,borderRadius:NB.rPill,padding:3,marginBottom:16,background:NB.card,boxShadow:NB.shadowSm}}>
          {[["week","Week"],["month","Month"],["year","Year"]].map(([id,label])=>(
            <div key={id} onClick={()=>setRange(id)} style={{fontSize:12,fontWeight:700,padding:"7px 15px",borderRadius:NB.rPill,cursor:"pointer",background:range===id?NB.brand:"transparent",color:range===id?NB.brandInk:NB.muted,fontFamily:NB.font}}>{label}{id!=="week"&&!isPro?" 🔒":""}</div>
          ))}
        </div>

        <div style={{background:NB.card,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:16,marginBottom:14,boxShadow:NB.shadowSm}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10}}>
            <div style={{fontWeight:700,fontSize:14,color:NB.ink}}>Show ups</div>
            <div style={{fontWeight:700,fontSize:13,color:NB.muted}}>{showUpsCount} of {showUpsTotal} days</div>
          </div>

          {range==="week"&&<div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
            {weekDates.map(d=><div key={d} title={d} style={boxStyle(isShowUpDay(habits,goals,d),8,false)}/>)}
          </div>}

          {range==="month"&&<div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
            {Array.from({length:monthLeadingBlanks}).map((_,i)=><div key={"b"+i}/>)}
            {monthAllDates.map(d=>{
              const future=d>today;
              return <div key={d} title={d} style={boxStyle(!future&&isShowUpDay(habits,goals,d),5,future)}/>;
            })}
          </div>}

          {range==="year"&&<div>
            {yearMonths.map(m=>(
              <div key={m.label} style={{display:"flex",gap:6,marginBottom:5,alignItems:"stretch"}}>
                <div style={{writingMode:"vertical-rl",fontSize:8.5,fontWeight:700,color:NB.muted,flexShrink:0}}>{m.label}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(10,1fr)",gap:2,flex:1}}>
                  {m.days.map(d=>{
                    const future=d>today;
                    return <div key={d} title={d} style={boxStyle(!future&&isShowUpDay(habits,goals,d),2,future)}/>;
                  })}
                </div>
              </div>
            ))}
          </div>}
        </div>

        <div style={{background:NB.card,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:16,marginBottom:14,boxShadow:NB.shadowSm}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:10,color:NB.ink}}>Completion trend</div>
          <TrendLineChart points={trendPoints}/>
        </div>
      </React.Fragment>}

      {section==="habits"&&(isPro
        ?<div style={{background:NB.card,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:16,marginBottom:14,boxShadow:NB.shadowSm}}>
          <div style={{fontWeight:700,fontSize:16,color:NB.ink,marginBottom:2}}>Habits</div>
          <div style={{fontSize:11.5,color:NB.muted,marginBottom:14}}>Your life actions — last 30 days</div>
          {habitBreakdown.length===0
            ?<div style={{fontSize:12,color:NB.muted}}>No habits yet.</div>
            :habitBreakdown.map(h=>(
              <div key={h.id} style={{marginBottom:11}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,marginBottom:4}}><span style={{color:NB.ink}}>{h.icon} {h.name}</span><span style={{fontWeight:700,color:NB.ink}}>{h.pct}%</span></div>
                <div style={{height:7,border:"2px solid "+NB.ink,borderRadius:NB.rPill,background:NB.bg,overflow:"hidden"}}><div style={{height:"100%",width:h.pct+"%",background:h.pct>=70?NB.green:NB.coral}}/></div>
              </div>
            ))
          }
        </div>
        :<div onClick={()=>showUp("Unlock the Habits and Patterns tabs, plus CSV export, on Pro.")} style={{background:NB.blueSoft,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:16,marginBottom:14,boxShadow:NB.shadowSm,cursor:"pointer",textAlign:"center"}}>
          <div style={{fontWeight:700,fontSize:13,color:NB.ink}}>Unlock deeper analytics — Pro</div>
          <div style={{fontSize:11.5,color:NB.muted,marginTop:3}}>Habits breakdown, pattern history, CSV export</div>
        </div>)}

      {section==="patterns"&&(isPro
        ?<React.Fragment>
          {patternHistory.map(p=>{
            const villain=VILLAINS[p.id];
            const barColor=villain?villain.color:NB.ink;
            const barPct=p.heldClean?0:p.signal;
            const statusLabel=!p.unlocked?"Locked":p.masteredAt?(p.revived?"Returning":"Mastered"):p.signal+"%";
            return(
            <div key={p.id} style={{background:NB.card,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:12,marginBottom:10,boxShadow:NB.shadowSm,display:"flex",alignItems:"center",gap:11,opacity:p.unlocked?1:0.55}}>
              <div style={{width:44,height:44,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                {p.unlocked?<VillainAvatar id={p.id} size={40}/>:<div style={{fontSize:18}}>🔒</div>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:13,color:NB.ink,marginBottom:5}}>{p.name}</div>
                <div style={{height:7,border:"2px solid "+NB.ink,borderRadius:NB.rPill,background:NB.bg,overflow:"hidden"}}>
                  <div style={{height:"100%",width:barPct+"%",background:barColor}}/>
                </div>
              </div>
              <div style={{fontSize:10.5,fontWeight:700,color:p.masteredAt&&!p.revived?NB.green:NB.muted,flexShrink:0,textAlign:"right",width:58}}>{statusLabel}</div>
            </div>);
          })}
        </React.Fragment>
        :<div onClick={()=>showUp("Unlock the Habits and Patterns tabs, plus CSV export, on Pro.")} style={{background:NB.blueSoft,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:16,marginBottom:14,boxShadow:NB.shadowSm,cursor:"pointer",textAlign:"center"}}>
          <div style={{fontWeight:700,fontSize:13,color:NB.ink}}>Unlock deeper analytics — Pro</div>
          <div style={{fontSize:11.5,color:NB.muted,marginTop:3}}>Habits breakdown, pattern history, CSV export</div>
        </div>)}
    </div>
    );}

  return(
    <div style={{minHeight:"100vh",background:t.bg,fontFamily:"'Sora',system-ui,sans-serif",color:t.text}}>
      <style>{"*{box-sizing:border-box;}input,textarea,select{outline:none;font-family:inherit;}\n      @keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}\n      .page-content{animation:pageIn 0.22s ease;}\n      .cat-tabs-scroll{scrollbar-width:none;-ms-overflow-style:none;}\n      .cat-tabs-scroll::-webkit-scrollbar{display:none;height:0;}\n      "}</style>
      {saving&&<div style={{position:"fixed",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,"+t.accent+","+t.accent+"88,"+t.accent+")",zIndex:9999,animation:"slideIn 0.3s ease"}}/>}
      {toast&&<div style={{position:"fixed",top:14,left:"50%",transform:"translateX(-50%)",zIndex:9998,background:toast.type==="badge"?t.accent:toast.type==="err"?(t.danger||"#ef4444"):t.success,color:"#000",padding:"9px 18px",borderRadius:20,fontWeight:700,fontSize:13,boxShadow:"0 8px 32px rgba(0,0,0,0.3)",whiteSpace:"nowrap",animation:"slideIn 0.3s ease"}}>{toast.msg}</div>}
      {obstacleToast&&<div key={obstacleToast.ts} style={{position:"fixed",top:14,left:"50%",transform:"translateX(-50%)",zIndex:9998,background:NB.card,border:"2.5px solid "+NB.ink,borderRadius:NB.rPill,padding:"9px 18px 9px 12px",display:"flex",alignItems:"center",gap:8,boxShadow:NB.shadowSm,animation:"slideIn 0.3s ease",fontFamily:"'Sora',sans-serif"}}>
        <span style={{width:26,height:26,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><VillainAvatar id={obstacleToast.id} size={26}/></span>
        <span style={{fontWeight:700,fontSize:12.5,color:NB.ink,whiteSpace:"nowrap"}}>{obstacleToast.name} mastered!</span>
      </div>}
      <Confetti on={confetti} done={()=>setConfetti(false)}/>
      {showReview&&<ReviewPopup t={t} onClose={()=>setShowReview(false)}/>}
      {milestoneCard&&<MilestonePopup t={t} card={milestoneCard} onShare={()=>{setViewCard(milestoneCard);setMilestoneCard(null);}} onDismiss={()=>setMilestoneCard(null)}/>}
      {viewCard&&<StreakShareModal t={t} card={viewCard} onClose={()=>setViewCard(null)} onShared={()=>{saveStreakCards(streakCards.map(c=>c.id===viewCard.id?{...c,shared:true}:c));}}/>}
      {editingHabit&&<EditHabitModal t={t} close={()=>setEditingHabit(null)} habit={editingHabit} onSave={updateH}/>}
      {modal==="upgrade"&&<UpgradeModal t={t} close={()=>window.history.back()} reason={upReason} user={user} habits={habits} goals={goals} pk={pk} pe={pe}/>}
      {showProTransition&&<ProTransitionModal onClose={()=>setShowProTransition(false)}/>}
      {showInertiaDay7Popup&&<InertiaDay7Popup data={showInertiaDay7Popup} onClose={()=>setShowInertiaDay7Popup(null)}/>}
      {showEditToday&&<EditTodayModal onClose={()=>setShowEditToday(false)}/>}
      {showCreateChoice&&<LifeActionCreateChoice/>}
      {showQuickLifeAction&&<QuickLifeActionModal/>}
      {showQuickOneTime&&<QuickOneTimeModal/>}

      {modal==="calendar"&&<CalModal t={t} close={()=>window.history.back()} habits={habits} goals={goals} plan={plan} showUp={showUp} dayNotes={dayNotes} saveDayNote={saveDayNote}/>}

      {modal==="notif"&&<NotifModal t={t} close={()=>window.history.back()} enabled={notif} setEnabled={setNotif} plan={plan} reminders={reminders} setReminders={setReminders} notifSound={notifSound} setNotifSound={setNotifSound} uid={user?.uid}/>}

      {/* ── L1: DPDP CONSENT MODAL ── */}
      {showOnboarding&&<OnboardingModal
        t={t}
        uid={user?.uid}
        userName={displayName||user?.displayName||""}
        habits={habits}
        setHabits={setHabits}
        goals={goals}
        journals={journals}
        tk={tk}
        save={async(h,g,j,theme,_gh,extra)=>{
          try{
            await fb.setDoc(fb.doc(fb.db,"users",user.uid),{
              habits:h,goals:g,journals:j,themeKey:theme,...(extra||{})
            },{merge:true});
          }catch(e){console.warn("Onboard Firestore err:",e);}
          setHabits(h);
        }}
        onDone={()=>{
          setShowOnboarding(false);
          localStorage.setItem("hg_onboard_done","1");
          navigateTo("dashboard");
          // Safety net: confirm the account's core profile fields actually exist. If the
          // initial creation write silently failed (e.g. dropped connection during signup),
          // this backfills email/plan/signupDate/userNumber right now, invisibly.
          if(user?.uid)ensureProfileFields(user.uid,user.email,user.displayName);
          // Sequence: DPDP first (if needed), then straight into the post-onboarding
          // sequence (push re-ask / welcome message) — the dashboard tour that used to
          // sit between these two steps has been removed (stale, referenced dashboard
          // elements that no longer exist); a proper tour gets rebuilt from scratch once
          // the redesign settles, not patched piecemeal.
          setTimeout(()=>{
            const k="momentum_dpdp_"+(user?.uid||"");
            const needsDpdp=k&&!localStorage.getItem(k);
            if(needsDpdp){
              setShowDpdpConsent(true);
              setPendingDashTour(true);// post-onboarding sequence fires after DPDP closes
            } else if(!localStorage.getItem("hg_dash_tour_done")){
              finishOnboardingSequence();
            }
          },600);
        }}
      />}
      {showPushReask&&<PushReaskModal t={t} onEnable={async()=>{
        localStorage.setItem("hg_push_asked","1");
        let granted=false;
        try{
          const p=await Notification.requestPermission();
          granted=p==="granted";
        }catch(e){}

          setNotif(true);
          localStorage.setItem("hg_notif","1");

          let rTime="20:00";
          try{
            const snap=await fb.getDoc(fb.doc(fb.db,"users",user.uid));
            rTime=snap.data()?.onboardReminderTime||"20:00";
          }catch(e){}
          await subscribeToPush(user.uid,rTime);
        }
        setShowPushReask(false);
        setTimeout(()=>setMoBubbleMsg(granted?"Perfect. I'll check in with you daily. 🔥":"You're all set. Let's build momentum."),400);

        localStorage.setItem("hg_push_asked","1");
        setShowPushReask(false);
        setTimeout(()=>setMoBubbleMsg("You're all set. Let's build momentum."),400);

        localStorage.setItem("hg_goals_tour_done","1");
      }}/>}
      {showAnalyticsTour&&<AnalyticsTour t={t} onDone={()=>{
        setShowAnalyticsTour(false);
        localStorage.setItem("hg_analytics_tour_done","1");
      }}/>}
      {showDay7Challenge&&<Day7ChallengePopup t={t} isPaid={pk==="pro"}

        }}
        onDismiss={()=>setShowDay7Challenge(false)}
      />}
      {showMonthlySummary&&monthlyRecapData&&<MonthlySummaryCard t={t} monthLabel={monthlyRecapData.monthLabel} stats={monthlyRecapData} onClose={()=>setShowMonthlySummary(false)}/>}
      {moBubbleMsg&&!showDashTour&&!showOnboarding&&<MoBubble t={t} message={moBubbleMsg} onDismiss={()=>setMoBubbleMsg(null)}/>}
      {showDpdpConsent&&<DpdpConsentModal t={t} user={user} onAccept={async()=>{

        // Firestore write is secondary (for cross-device sync) — failure is OK
        localStorage.setItem("momentum_dpdp_"+user.uid,"1");
        setShowDpdpConsent(false);
        try{window.loadAnalyticsIfConsented&&window.loadAnalyticsIfConsented();}catch(e){}
        // If the post-onboarding sequence was waiting on DPDP, fire it now
        if(pendingDashTour){
          setPendingDashTour(false);
          if(!localStorage.getItem("hg_dash_tour_done")){
            setTimeout(()=>finishOnboardingSequence(),500);
          }
        }
        try{await fb.setDoc(fb.doc(fb.db,"users",user.uid),{dpdpConsented:true,dpdpConsentDate:new Date().toISOString()},{merge:true});}
        catch(e){console.warn("DPDP Firestore write err (non-critical):",e);}
      }}/>}

      {/* ── L2: AI DISCLOSURE CONSENT MODAL ── */}
      {showAiConsent&&<AiConsentModal t={t} user={user} onAccept={async()=>{
        // Cache in localStorage immediately so future taps are instant
        const aiKey="momentum_ai_consent_"+user.uid;
        localStorage.setItem(aiKey,"1");
        setShowAiConsent(false);
        // Small timeout lets modal unmount cleanly before opening AI modal

<script>
(function(){
  function runApp(){
    try{
      var src=document.getElementById('app-src').textContent;
      var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;
      var s=document.createElement('script');
      s.textContent=out;
      document.body.appendChild(s);
    }catch(e){
      console.error('App transform/execute failed:',e);
      var st=document.getElementById('splash-status');
      if(st)st.textContent='Error loading app — check console';
    }
  }
  function waitBabel(tries){
    if(typeof Babel!=='undefined'&&typeof Babel.transform==='function'){
      runApp();
    } else if(tries>0){
      setTimeout(function(){waitBabel(tries-1);},200);
    } else {
      console.error('Babel failed to load after timeout');
    }
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){waitBabel(75);});
  } else {
    waitBabel(75);
  }
})();
</script>
<script>
// ── PWA Install prompt handler ──────────────────────────────────────────────
let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  // Exposed globally
  window._pwaInstallPrompt = e;
});
window.addEventListener('appinstalled', () => {
  _deferredInstallPrompt = null;
  window._pwaInstallPrompt = null;
  console.log('✅ Habtix PWA installed');
});

if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    navigator.serviceWorker.register('/sw.js')
      .then(r=>{
        console.log('⚡ SW ready:',r.scope);
        // Force check for SW update immediately
        r.update();
        r.addEventListener('updatefound',()=>{
          const nw=r.installing;
          nw.addEventListener('statechange',()=>{
            if(nw.state==='installed'&&navigator.serviceWorker.controller){
              nw.postMessage({type:'SKIP_WAITING'});
            }
          });
        });
        let refreshing=false;
        navigator.serviceWorker.addEventListener('controllerchange',()=>{
          // Bug fix: this used to force window.location.reload() the instant a new SW took
          // control, with zero regard for whether the user had something in flight (adding a
          // friend, creating a challenge, generating a Habtix ID — all involve a Firestore
          // round-trip during which an update could land and yank the page out from under the
          // result). Now it just notifies the app; the app decides when it's safe to reload.
          if(!refreshing){refreshing=true;window.dispatchEvent(new CustomEvent('momentum:update-available'));}
        });
        navigator.serviceWorker.ready.then(reg=>{
          if(reg.active){
            const rem=localStorage.getItem('hg_reminders');
            const notifOn=localStorage.getItem('hg_notif');
            if(rem)reg.active.postMessage({type:'SYNC_STORAGE',key:'hg_reminders',value:rem});
            if(notifOn)reg.active.postMessage({type:'SYNC_STORAGE',key:'hg_notif',value:notifOn});
            reg.active.postMessage({type:'UPDATE_REMINDERS'});
          }
        });
      })
      .catch(e=>console.error('SW error:',e));
  });
}
</script>
