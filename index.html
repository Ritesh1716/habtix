// Build the ordered list of ELIGIBLE situational notifications right now.
// Returns [{type, slot:'reward'|'nudge', body, tab, extra}], highest priority first.
function n2Evaluate(ctx){
  const out=[];
  const today=n2Today();
  const habits=ctx.habits||[];
  const pref=(t)=>ctx.prefs?ctx.prefs[t]!==false:true; // default on
  const gate=(t,d)=>n2GateOpen(ctx.lastShown,t,d);
  const isPaid=ctx.pk==="pro";
  const undone=habits.filter(h=>{const v=h.log&&h.log[today];return h.goalCount>0&&h.goalUnit?!(typeof v==="number"&&v>=h.goalCount):!v;});
  const allDone=habits.length>0&&undone.length===0;

  // ── REWARD-slot candidates (informational / celebratory; shown on open) ──
  // #2 Milestone — any habit crossed a badge threshold not yet notified.
  if(pref("milestones")){
    for(const h of habits){
      const st=n2TrueStreak(h);
      if(N2_BADGES_REF.includes(st)&&!(ctx.milestonesNotified||[]).includes(st)){
        const meta=N2_BADGE_META[st];
        out.push({type:"milestone",slot:"reward",tab:"habits",
          body:n2Fill(meta[0]+" "+st+" days{name}! You're a "+meta[1]+". That's real consistency.",ctx.name),
          extra:{streak:st}});
        break;
      }
    }
  }
  // #13 Perfect day — everything done today.
  if(pref("perfectday")&&allDone&&gate("perfectday",1)){
    out.push({type:"perfectday",slot:"reward",tab:"dashboard",
      body:n2Fill("🙌 Every habit done today{name}. THAT'S a perfect day. See you tomorrow.",ctx.name)});
  }
  // scoredigest generator removed — was built entirely around the deleted Momentum
  // Score (ctx.scoreVal). Type also dropped from NOTIF_TYPES/settings above.

  // ── NUDGE-slot candidates (forward-looking; shown only if still active) ──
  // #6 Comeback — dormant 3+ days.
  if(pref("comeback")&&habits.length>0&&!n2ActiveWithin(habits,3)&&gate("comeback",3)){
    out.push({type:"comeback",slot:"nudge",tab:"dashboard",
      body:n2Fill("🤗 Missed you{name}. One habit today picks your momentum right back up.",ctx.name)});
  }
  // challengenudge/challengestatus generators removed — built around the Friend
  // Challenges feature, which was mostly cut (only the friend-connection mechanism
  // survives, repurposed for referrals). Types also dropped from NOTIF_TYPES above.
  // #11 Feature discovery — rotate through unused features (~every 3 days).
  if(pref("features")&&gate("features",3)){
    const jUsed=ctx.journals&&Object.keys(ctx.journals).length>0;
    const feat=N2_FEATURES.find(f=>f.key==="journal"?!jUsed:true);
    if(feat)out.push({type:"features",slot:"nudge",tab:feat.tab,body:n2Fill(feat.msg,ctx.name)});
  }
  // aiteaser generator removed — deep-linked to the deleted AI Coach panel (tab:"coach"
  // has no route anymore). Type also dropped from NOTIF_TYPES above.
  // #7pool Encouragement — lowest-priority filler (~every 2 days).
  if(pref("encouragement")&&gate("encouragement",2)){
    const idx=parseInt(today.replace(/-/g,""),10)%N2_ENCOURAGE.length;
    out.push({type:"encouragement",slot:"nudge",tab:"dashboard",body:n2Fill(N2_ENCOURAGE[idx],ctx.name)});
  }
  return out;
}


// Returns up to 3 plain-language pattern strings — day-of-week, habit correlation, focus-timer correlation
function detectPatterns(habits,focusLog){
  const patterns=[];
  if(!habits||habits.length===0)return patterns;
  const last28=[];for(let i=0;i<28;i++){const d=new Date();d.setDate(d.getDate()-i);last28.push(d.toLocaleDateString("en-CA"));}

  // 1. Day-of-week completion pattern
  const dowStats={};
  last28.forEach(d=>{
    const dow=new Date(d+"T12:00:00").getDay();
    if(!dowStats[dow])dowStats[dow]={done:0,total:0};
    habits.forEach(h=>{
      dowStats[dow].total++;
      if(isFullDoneOn(h,d,h.log&&h.log[d]))dowStats[dow].done++;
    });
  });
  const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const dowRates=Object.entries(dowStats).map(([dow,s])=>({dow:Number(dow),rate:s.total>0?s.done/s.total:0,total:s.total})).filter(d=>d.total>=4);
  if(dowRates.length>=3){
    dowRates.sort((a,b)=>b.rate-a.rate);
    const best=dowRates[0],worst=dowRates[dowRates.length-1];
    if(best.rate-worst.rate>=0.15){
      patterns.push("You complete "+Math.round(best.rate*100)+"% of habits on "+DOW[best.dow]+"s vs only "+Math.round(worst.rate*100)+"% on "+DOW[worst.dow]+"s.");
    }
  }

  // 2. Habit-pair correlation — does completing A make B more likely?
  if(habits.length>=2){
    let bestPair=null;
    for(let i=0;i<habits.length;i++){
      for(let j=0;j<habits.length;j++){
        if(i===j)continue;
        const a=habits[i],b=habits[j];
        let aDoneB=0,aDone=0,aNotB=0,aNot=0;
        last28.forEach(d=>{
          const ad=isFullDoneOn(a,d,a.log&&a.log[d]);
          const bd=isFullDoneOn(b,d,b.log&&b.log[d]);
          if(ad){aDone++;if(bd)aDoneB++;}else{aNot++;if(bd)aNotB++;}
        });
        if(aDone>=4&&aNot>=4){
          const diff=(aDoneB/aDone)-(aNotB/aNot);
          if(diff>=0.25&&(!bestPair||diff>bestPair.diff))bestPair={a,b,diff};
        }
      }
    }
    if(bestPair){
      patterns.push("When you complete "+bestPair.a.icon+" "+bestPair.a.name+", "+bestPair.b.icon+" "+bestPair.b.name+" completion rises by "+Math.round(bestPair.diff*100)+"%.");
    }
  }

  // 3. Focus-timer correlation (focusLog from Pomodoro, Item 5)
  const focusEntries=Object.entries(focusLog||{}).filter(([d])=>last28.includes(d));
  if(focusEntries.length>=6){
    const high=focusEntries.filter(([,v])=>(v.totalMin||0)>=45).map(([d])=>d);
    const low=focusEntries.filter(([,v])=>(v.totalMin||0)<45).map(([d])=>d);
    if(high.length>=3&&low.length>=3){
      const rate=list=>{let done=0,total=0;list.forEach(d=>{habits.forEach(h=>{total++;if(isFullDoneOn(h,d,h.log&&h.log[d]))done++;});});return total>0?done/total:0;};
      const hr=rate(high),lr=rate(low);
      if(hr-lr>=0.15){
        patterns.push("On days with 45+ min of focus time, your habit completion is "+Math.round((hr-lr)*100)+"% higher.");
      }
    }
  }

  return patterns.slice(0,3);
}

// Per-goal pacing forecast: actions done/week vs needed pace to hit the deadline
function getGoalForecasts(goals){
  const week7=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);week7.push(d.toLocaleDateString("en-CA"));}
  return (goals||[]).filter(g=>!g.movedToHistory&&g.actions&&g.actions.length>0&&!g.actions.every(a=>a.done)).map(g=>{
    const total=g.actions.length;
    const done=g.actions.filter(a=>a.done).length;
    const remaining=total-done;
    const daysLeft=g.deadline?dLeft(g.deadline):null;
    const currentPace=g.actions.filter(a=>a.doneAt&&week7.includes(a.doneAt)).length;
    let status="active",neededPace=null;
    if(daysLeft!==null){
      if(daysLeft<0)status="overdue";
      else{
        const weeksLeft=Math.max(daysLeft/7,0.5);
        neededPace=Math.max(1,Math.ceil(remaining/weeksLeft));
        status=currentPace>=neededPace?"on-track":"behind";
      }
    }
    return{title:g.title,total,done,remaining,daysLeft,currentPace,neededPace,status,priority:g.priority||"Medium"};
  });
}

// Rule-based "Today's ONE Move" — single highest-leverage action: streak-at-risk > overdue priority action > most-skipped habit
function getOneMove(habits,goals,today){
  const atRisk=(habits||[]).filter(h=>(h.streak||0)>=3&&!isFullDoneOn(h,today,h.log&&h.log[today])).sort((a,b)=>(b.streak||0)-(a.streak||0));
  if(atRisk.length>0){
    return{icon:atRisk[0].icon||"🔥",text:"Complete "+atRisk[0].name+" — protect your "+atRisk[0].streak+"-day streak!"};
  }
  const urgent=(goals||[]).flatMap(g=>(g.actions||[]).filter(a=>!a.done&&a.dueDate&&a.dueDate<=today).map(a=>({...a,goalTitle:g.title,priority:g.priority||"Medium"})));
  const prOrder={High:0,Medium:1,Low:2};
  urgent.sort((a,b)=>(prOrder[a.priority]??1)-(prOrder[b.priority]??1));
  if(urgent.length>0){
    return{icon:"🎯",text:urgent[0].action+" (for \""+urgent[0].goalTitle+"\")"};
  }
  const week7=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);week7.push(d.toLocaleDateString("en-CA"));}
  const candidates=(habits||[]).filter(h=>!isFullDoneOn(h,today,h.log&&h.log[today])).map(h=>({h,doneCount:week7.filter(d=>isFullDoneOn(h,d,h.log&&h.log[d])).length})).sort((a,b)=>a.doneCount-b.doneCount);
  if(candidates.length>0){
    return{icon:candidates[0].h.icon||"⭐",text:"Complete "+candidates[0].h.name+" — rebuild momentum on your most-skipped habit."};
  }
  return{icon:"🎉",text:"You're all caught up — nothing urgent today!"};
}

function Confetti({on,done}){
  const r=useRef();
  useEffect(()=>{
    if(!on)return;
    const c=r.current;if(!c)return;
    c.width=window.innerWidth;c.height=window.innerHeight;
    const ctx=c.getContext("2d");
    const cols=["#f5c842","#e8853d","#4ade80","#60a5fa","#a78bfa","#f87171"];
    const ps=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20,r:3+Math.random()*5,spd:1.5+Math.random()*2,col:cols[Math.floor(Math.random()*6)],ang:0,ts:0.1+Math.random()*0.3}));
    let raf;
    const draw=()=>{ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.spd;p.ang+=p.ts;ctx.beginPath();ctx.lineWidth=p.r;ctx.strokeStyle=p.col;ctx.moveTo(p.x+Math.sin(p.ang)*8,p.y);ctx.lineTo(p.x+Math.sin(p.ang)*8+p.r*2,p.y+p.r*2);ctx.stroke();});if(ps.some(p=>p.y<c.height))raf=requestAnimationFrame(draw);else{ctx.clearRect(0,0,c.width,c.height);done&&done();}};
    draw();return()=>cancelAnimationFrame(raf);
  },[on]);
  if(!on)return null;
  return React.createElement("canvas",{ref:r,style:{position:"fixed",inset:0,pointerEvents:"none",zIndex:9999}});
}

}

// Theme-aware elevated shadow + premium gradient card background
function premiumShadow(t,col){
  if(col)return t.mode==="light"?"0 4px 18px "+col+"22":"0 4px 18px "+col+"33";
  return t.mode==="light"?"0 4px 16px rgba(0,0,0,0.05)":"0 4px 16px rgba(0,0,0,0.35)";
}
function premiumCard(t,tint){
  if(tint)return "linear-gradient(145deg,"+tint+"12 0%,"+t.card+" 60%)";
  return "linear-gradient(145deg,"+t.card+" 0%,"+t.surface+" 100%)";
}
function gradText(t,a,b){
  return {background:"linear-gradient(135deg,"+(a||t.accent)+","+(b||t.accent2)+")",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text"};
}

function Ring({pct,sz=80,sw=8,col,lbl,sub,t,glow=false}){
  const r=(sz-sw)/2,ci=2*Math.PI*r;
  return(<div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
    <div style={{position:"relative",width:sz,height:sz,filter:glow?"drop-shadow(0 0 6px "+col+"88)":"none"}}>
      <svg width={sz} height={sz} style={{transform:"rotate(-90deg)"}}>
        <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={t.border} strokeWidth={sw}/>
        <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={col} strokeWidth={sw} strokeDasharray={ci} strokeDashoffset={ci-(pct/100)*ci} strokeLinecap="round" style={{transition:"stroke-dashoffset 0.6s"}}/>

// PAY-D: Proration helpers
function calcProration(pk,pe,targetCycle,aiCredits,aiCreditsBonus){
  // Remaining Pro days
  const today=new Date();today.setHours(0,0,0,0);
  const expiry=pe?new Date(pe):today;expiry.setHours(0,0,0,0);
  const proRemDays=Math.max(0,Math.floor((expiry-today)/86400000));
  // Daily rates
  const isProYearly=pk==="pro"&&proRemDays>60;// heuristic: >60 days left = was yearly
  const proDailyRate=isProYearly?(699/365):(79/30);
  const plusDailyRate=targetCycle==="yearly"?(1499/365):(149/30);
  // Pro credit value → bonus Plus days
  const proCredit=proRemDays*proDailyRate;
  const bonusDays=Math.floor(proCredit/plusDailyRate);
  // New expiry
  const baseDays=targetCycle==="yearly"?365:30;
  const newExpiry=new Date();newExpiry.setDate(newExpiry.getDate()+baseDays+bonusDays);
  const newExpiryStr=newExpiry.toLocaleDateString("en-CA");
  const newExpiryFmt=newExpiry.toLocaleDateString("en-US",{day:"numeric",month:"short",year:"numeric"});
  // AI credits: monthly Pro→Plus: add remaining (0-10) to first month 50
  // Yearly Pro→Plus: full bonus pool = remaining this month + (remaining months×10)
  const carryCredits=Math.min(aiCredits||0,10);
  let bonusPool=aiCreditsBonus||0;
  if(isProYearly){
    const remMonths=Math.max(0,Math.floor(proRemDays/30));
    bonusPool=(aiCredits||0)+(remMonths*10);
  }
  return{proRemDays,bonusDays,baseDays,newExpiryStr,newExpiryFmt,carryCredits,bonusPool,isProYearly,proDailyRate:proDailyRate.toFixed(2),plusDailyRate:plusDailyRate.toFixed(2)};
}

            <span style={{fontSize:9,color:hasData?dataColor:isToday3?t.accent:t.muted,fontWeight:hasData||isToday3?700:400}}>{day}</span>

            <div style={{flex:1,background:t.surface,borderRadius:10,padding:"8px 6px",textAlign:"center"}}>
              <div style={{fontSize:15,fontWeight:800,color:t.accent}}>{log.sessions}</div>
              <div style={{fontSize:9,color:t.muted,marginTop:2}}>Sessions</div>

            {Object.entries(log.byCategory).sort((a,b)=>b[1]-a[1]).map(([label,mins])=>(
              <div key={label} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:12}}>
                <span style={{color:t.text}}>{label}</span>

          </div>}
          {daySessions.length>0&&<div>
            <div style={{fontSize:11,fontWeight:700,color:t.text,marginBottom:8}}>Sessions</div>
            {daySessions.map((s,i)=>{

              return(<div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:premiumCard(t,mCol),borderLeft:"3px solid "+mCol,borderRadius:"6px 10px 10px 6px",marginBottom:5}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:600,color:t.text}}>{s.label||"Focus"}{s.partial&&<span style={{fontSize:9,color:t.muted,fontWeight:400}}> · partial</span>}</div>
                </div>

    })()}
  </>);
}


function CalModal({t,close,habits,goals,plan,showUp,dayNotes,saveDayNote}){
  const now=new Date();
  const[yr,setYr]=useState(now.getFullYear());
  const[mo,setMo]=useState(now.getMonth());
  const[selDay,setSelDay]=useState(null);
  const[dayNote,setDayNote]=useState("");
  const[saved,setSaved]=useState(false);
  const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const days=new Date(yr,mo+1,0).getDate(),fd=new Date(yr,mo,1).getDay(),today=td();
  const ds=d=>yr+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");

    setSelDay(dateStr);setSaved(false);

    const missedHabits=habits.filter(h=>!isFullDoneOn(h,selDay,h.log&&h.log[selDay]));
    const doneActions=goals.flatMap(g=>g.actions.filter(a=>a.doneAt===selDay).map(a=>({...a,goalTitle:g.title})));

    const actionsDueBlock=actionsDue.length>0&&(<div style={{marginBottom:14}}>

      {actionsDue.map(a=>{
        return(<div key={a.id} style={{padding:"9px 11px",background:NB.card,border:"2.5px solid "+NB.ink,borderRadius:12,marginBottom:7}}>
          <div style={{fontSize:12,fontWeight:700,color:NB.ink,marginBottom:2}}>{a.action}</div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:9,color:NB.muted,fontWeight:600}}>{a.goalTitle}</span>
            <span style={{fontSize:9,padding:"2px 7px",borderRadius:NB.rPill,border:"1.5px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700}}>{a.goalPriority}</span>
          </div>
        </div>);
      })}
    </div>);
    const displayDate=new Date(selDay+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});

    return(<Modal t={t} close={close} title={<span style={{display:"inline-flex",alignItems:"center",gap:6}}>{IC.calendar(NB.ink,16)} Calendar</span>}>

      <span onClick={()=>setSelDay(null)} style={{display:"flex",alignItems:"center",gap:5,color:NB.ink,cursor:"pointer",fontSize:13,marginBottom:14,padding:0,fontWeight:700,width:"fit-content"}}>← Back to {MN[mo]}</span>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:17,fontWeight:800,color:NB.ink,marginBottom:3,fontFamily:NB.font}}>{displayDate}</div>
        <div style={{fontSize:11,fontWeight:700,color:NB.muted}}>{selDay===today?"Today — check in below":isFuture?"Future — Day Planner":"Past day"}</div>
      </div>

      {isPast&&<div>
        {doneHabits.length>0&&<div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:NB.ink,textTransform:"uppercase",letterSpacing:1,marginBottom:7,display:"flex",alignItems:"center",gap:4,fontFamily:NB.font}}>{IC.checkCircle(NB.ink,11)} Life Actions Done ({doneHabits.length})</div>
          {doneHabits.map(h=>(
            <div key={h.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 11px",background:NB.greenSoft,border:"2.5px solid "+NB.ink,borderRadius:12,marginBottom:7,fontSize:13}}>
              <span>{h.icon}</span><span style={{fontWeight:700}}>{h.name}</span>
            </div>
          ))}
        </div>}
        {missedHabits.length>0&&habits.length>0&&<div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:NB.coral,textTransform:"uppercase",letterSpacing:1,marginBottom:7,display:"flex",alignItems:"center",gap:4,fontFamily:NB.font}}>{IC.xCircle(NB.coral,11)} Life Actions Missed ({missedHabits.length})</div>
          {missedHabits.map(h=>(
            <div key={h.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 11px",background:NB.card,border:"2px dashed "+NB.ink,borderRadius:12,marginBottom:7,fontSize:13,opacity:0.7}}>
              <span>{h.icon}</span><span>{h.name}</span>
            </div>
          ))}
        </div>}
        {doneActions.length>0&&<div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:NB.blue,textTransform:"uppercase",letterSpacing:1,marginBottom:7,display:"flex",alignItems:"center",gap:4,fontFamily:NB.font}}>{IC.target(NB.blue,11)} Goal Actions Completed ({doneActions.length})</div>
          {doneActions.map(a=>(
            <div key={a.id} style={{padding:"8px 11px",background:NB.blueSoft,border:"2.5px solid "+NB.ink,borderRadius:12,marginBottom:7}}>
              <div style={{fontSize:12,fontWeight:700,color:NB.ink}}>{a.action}</div>
              <div style={{fontSize:10,color:NB.muted,fontWeight:600}}>{a.goalTitle}</div>
            </div>
          ))}
        </div>}
        {actionsDueBlock}
        {deadlineGoals.length>0&&<div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:NB.ink,textTransform:"uppercase",letterSpacing:1,marginBottom:7,display:"flex",alignItems:"center",gap:4,fontFamily:NB.font}}>{IC.target(NB.ink,11)} Goal Deadlines</div>
          {deadlineGoals.map(g=><div key={g.id} style={{fontSize:12,color:NB.ink,padding:"8px 11px",background:NB.brand,border:"2.5px solid "+NB.ink,borderRadius:12,marginBottom:7,fontWeight:700}}>{g.title}</div>)}
        </div>}
        {habits.length===0&&<div style={{textAlign:"center",color:NB.muted,padding:20,fontSize:13}}>No habit data for this day yet.</div>}
        <div style={{marginTop:4}}>
          <div style={{fontSize:11,fontWeight:700,color:NB.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:7,display:"flex",alignItems:"center",gap:4,fontFamily:NB.font}}>{IC.note(NB.muted,11)} Day Note</div>
          <textarea value={dayNote} onChange={e=>setDayNote(e.target.value)} placeholder="Add a personal note for this day..." maxLength={500} style={{width:"100%",height:72,padding:"10px 12px",border:"2.5px solid "+NB.ink,borderRadius:14,fontSize:13,resize:"none",lineHeight:1.5,fontFamily:"'Sora',sans-serif"}}/>
          <div onClick={saveNote} style={{marginTop:8,padding:"9px 18px",borderRadius:NB.rPill,border:"2.5px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:NB.font,width:"fit-content"}}>{saved?"Saved ✓":"Save Note"}</div>
        </div>
      </div>}

      {isFuture&&<div>
        {actionsDueBlock}
        {deadlineGoals.length>0&&<div style={{background:NB.brand,border:"2.5px solid "+NB.ink,borderRadius:14,padding:"11px 13px",marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:NB.brandInk,textTransform:"uppercase",letterSpacing:1,marginBottom:7,display:"flex",alignItems:"center",gap:4,fontFamily:NB.font}}>{IC.target(NB.brandInk,11)} Goal Deadlines on this day</div>
          {deadlineGoals.map(g=>{
            const gActions2=g.actions||[];
            const done=gActions2.filter(a=>a.done).length;
            const pct=gActions2.length>0?Math.round((done/gActions2.length)*100):0;
            return(<div key={g.id} style={{padding:"9px 11px",background:NB.card,borderRadius:10,marginBottom:7,border:"2px solid "+NB.ink}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                <div style={{fontSize:13,fontWeight:700,color:NB.ink}}>{g.title}</div>
                <span style={{fontSize:12,fontWeight:700,color:NB.ink}}>{pct}%</span>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <span style={{fontSize:9,padding:"2px 7px",borderRadius:NB.rPill,border:"1.5px solid "+NB.ink,fontWeight:700}}>{g.priority}</span>
                <div style={{fontSize:9,color:NB.muted,fontWeight:600}}>{done}/{gActions2.length} actions done</div>
              </div>
            </div>);
          })}
        </div>}
        <textarea value={dayNote} onChange={e=>setDayNote(e.target.value)} placeholder="Plan your day, set intentions, list tasks..." maxLength={500} style={{width:"100%",height:110,padding:"11px 13px",border:"2.5px solid "+NB.ink,borderRadius:14,fontSize:13,resize:"none",lineHeight:1.6,marginBottom:12,fontFamily:"'Sora',sans-serif"}}/>
        <div onClick={saveNote} style={{width:"100%",textAlign:"center",padding:"12px",borderRadius:NB.rBtn,border:"2.5px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:13,fontFamily:NB.font,boxSizing:"border-box"}}>{saved?"Saved ✓ ":"Save Plan"}</div>
      </div>}
      </div>
    </Modal>);
  }

  // Calendar grid view
  return(<Modal t={t} close={close} title={<span style={{display:"inline-flex",alignItems:"center",gap:6}}>{IC.calendar(NB.ink,16)} Calendar</span>}>
    <div style={{fontFamily:"'Sora',sans-serif"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,background:NB.card,border:"2.5px solid "+NB.ink,borderRadius:14,padding:"8px 6px"}}>
      <span onClick={()=>{if(mo===0){setMo(11);setYr(y=>y-1);}else setMo(m=>m-1);}} style={{cursor:"pointer",borderRadius:8,padding:"5px 12px",fontSize:18,fontWeight:700}}>‹</span>
      <span style={{fontWeight:800,fontSize:15,color:NB.ink,fontFamily:NB.font}}>{MN[mo]} {yr}</span>
      <span onClick={()=>{if(mo===11){setMo(0);setYr(y=>y+1);}else setMo(m=>m+1);}} style={{cursor:"pointer",borderRadius:8,padding:"5px 12px",fontSize:18,fontWeight:700}}>›</span>
    </div>
    {plan.heat&&habits.length>0&&(()=>{
      const dayTotals=[0,0,0,0,0,0,0],dayPossible=[0,0,0,0,0,0,0];
      for(let d=1;d<=days;d++){
        const ds3=ds(d);
        if(ds3>today)continue;
        const wd=new Date(ds3+"T12:00:00").getDay();
        const doneCount=habits.filter(h=>isFullDoneOn(h,ds3,h.log&&h.log[ds3])).length;
        dayTotals[wd]+=doneCount;dayPossible[wd]+=habits.length;
      }
      const rates=dayTotals.map((t2,i)=>dayPossible[i]>0?t2/dayPossible[i]:-1);
      const bestIdx=rates.indexOf(Math.max(...rates));
      if(bestIdx===-1||rates[bestIdx]<=0)return null;
      const WD=["Sundays","Mondays","Tuesdays","Wednesdays","Thursdays","Fridays","Saturdays"];
      return(<div style={{fontSize:11,color:NB.ink,fontWeight:700,marginBottom:12,textAlign:"center",background:NB.blueSoft,border:"2px solid "+NB.ink,borderRadius:12,padding:"7px 8px"}}>{IC.chartUp?IC.chartUp(NB.ink,11):"📈"} Your best day this month: {WD[bestIdx]} ({Math.round(rates[bestIdx]*100)}% completion)</div>);
    })()}
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:6}}>
      {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:NB.muted}}>{d}</div>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
      {Array.from({length:fd}).map((_,i)=><div key={"e"+i}/>)}

        const d=i+1,ds2=ds(d);
        const hd=habits.filter(h=>isFullDoneOn(h,ds2,h.log&&h.log[ds2])).length;
        const habitDivisor=habits.length;
        const deadlineGoalsOnDay=goals.filter(g=>g.deadline===ds2);
        const hasDeadline=deadlineGoalsOnDay.length>0;
        const isT=ds2===today,isFut=ds2>today;
        const hasNote=!!(dayNotes&&dayNotes[ds2]&&dayNotes[ds2].trim());
        const intensity=habitDivisor>0?hd/habitDivisor:0;
        const cellBg=isT?NB.brand:intensity>=0.75?NB.green:intensity>=0.5?"#A9DBB6":intensity>0?NB.greenSoft:NB.card;
        const textCol=isT?NB.brandInk:NB.ink;
        return(<div key={d} onClick={()=>openDay(ds2)} style={{borderRadius:8,padding:"3px 1px",textAlign:"center",background:cellBg,border:"2px solid "+NB.ink,minHeight:36,cursor:"pointer",position:"relative"}}>
          <div style={{fontSize:10,fontWeight:isT?800:600,color:textCol,lineHeight:1.4}}>{d}</div>
          {hd>0&&<div style={{fontSize:7,color:textCol,fontWeight:700}}>{hd}✓</div>}
          {/* Bug fix: this used to also render the full goal title text inline for any
              future-dated deadline day, stretching that cell and distorting the whole
              week row (see Sept vs Aug screenshots). The icon alone is the correct,
              consistent treatment for every day — the full name only ever shows in the
              day-detail view (openDay), never in this month-grid cell. */}
          {hasDeadline&&<div style={{lineHeight:1}}>{IC.target(NB.coral,8)}</div>}
          {hasNote&&<div style={{position:"absolute",top:2,right:2,width:5,height:5,borderRadius:"50%",background:NB.blue,border:"1px solid "+NB.ink}}/>}
        </div>);
      })}
    </div>
    <div style={{display:"flex",gap:8,marginTop:14,fontSize:10,color:NB.muted,flexWrap:"wrap",alignItems:"center",fontWeight:600}}>
      <span style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:10,height:10,borderRadius:3,background:NB.greenSoft,border:"1.5px solid "+NB.ink,display:"inline-block"}}/>1-25%</span>
      <span style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:10,height:10,borderRadius:3,background:"#A9DBB6",border:"1.5px solid "+NB.ink,display:"inline-block"}}/>50%</span>
      <span style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:10,height:10,borderRadius:3,background:NB.green,border:"1.5px solid "+NB.ink,display:"inline-block"}}/>100%</span>
      <span>📌 Deadline</span>
      <span style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:6,height:6,borderRadius:"50%",background:NB.blue,display:"inline-block"}}/>Note</span>
      <span style={{color:NB.ink,fontWeight:700}}>● Today</span>
    </div>
    <div style={{marginTop:10,fontSize:11,color:NB.muted,textAlign:"center"}}>Tap any date for details or to plan ahead</div>
    </div>
  </Modal>);
}

// Fix 16: Journal mini calendar — proper component (not IIFE, hooks must be at top level)
function JournalMiniCal({t,journals,loadDate,parseEntry,fmt,MOODS,MCOLS,today2}){
  const[calMonth,setCalMonth]=useState(()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");});
  const[popupEntry,setPopupEntry]=useState(null);
  const[cmYr,cmMo]=calMonth.split("-").map(Number);
  const daysInMonth=new Date(cmYr,cmMo,0).getDate();
  const firstDay=new Date(cmYr,cmMo-1,1).getDay();
  const prevMonth=()=>{const d=new Date(cmYr,cmMo-2,1);setCalMonth(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));};
  const nextMonth=()=>{const d=new Date(cmYr,cmMo,1);const now=new Date();if(d<=new Date(now.getFullYear(),now.getMonth(),1))setCalMonth(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));};
  const mnName=new Date(cmYr,cmMo-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  return(<>
    <div style={{background:premiumCard(t),border:"1px solid "+t.border,borderRadius:14,padding:12,marginBottom:12,boxShadow:premiumShadow(t)}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <button onClick={prevMonth} style={{background:"none",border:"none",color:t.muted,cursor:"pointer",fontSize:16,padding:"0 6px"}}>‹</button>
        <div style={{fontSize:12,fontWeight:700,...gradText(t)}}>{mnName}</div>
        <button onClick={nextMonth} style={{background:"none",border:"none",color:t.muted,cursor:"pointer",fontSize:16,padding:"0 6px"}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
        {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:9,color:t.muted,fontWeight:700,padding:"2px 0"}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {Array.from({length:firstDay}).map((_,i)=><div key={"e"+i}/>)}
        {Array.from({length:daysInMonth}).map((_,i)=>{
          const day=i+1;
          const dateStr=cmYr+"-"+String(cmMo).padStart(2,"0")+"-"+String(day).padStart(2,"0");
          const hasEntry=!!journals[dateStr];
          const isToday3=dateStr===today2;
          const isFuture=dateStr>today2;

function HabitDetailPage({t,habit,habits,setHabits,saveF,back,onShare,onFreeze,plan}){

  const doneToday=!!log[today];
  const total=Object.entries(log).filter(([d,v])=>isFullDoneOn(habit,d,v)).length;
  const createdDaysAgo=habit.createdAt?Math.max(1,Math.ceil((new Date()-new Date(habit.createdAt))/86400000)):Math.max(1,Object.keys(log).length);
  const rate=Math.min(100,Math.round((total/createdDaysAgo)*100));
  const hColor=habit.color||t.accent;
  const hasGoal=habit.goalCount>0&&habit.goalUnit;
  // Tile count per date — stored in habit log as number or true

  const WLBLS=["Mo","Tu","We","Th","Fr","Sa","Su"];

  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const firstDay=new Date(yr,mo,1).getDay();

  // Week/month rates — full completion only
  const weekDone=week7.filter(d=>{const v=log[d];return isFullDoneOn(habit,d,v);}).length;
  const weekRate=Math.round((weekDone/7)*100);

    const months={};Object.entries(log).forEach(([d,v])=>{if(!v)return;const[y,m]=d.split("-");const k=y+"-"+m;if(!months[k])months[k]=[];months[k].push(d);});
    return Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);

// Web Audio sound player
function playSound(type){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    // Resume context (required after user gesture on mobile)
    if(ctx.state==="suspended")ctx.resume();
    const master=ctx.createGain();
    master.connect(ctx.destination);

    if(type==="bell"){
      // Rich bell — doubled oscillators for fullness, much louder
      [880,1760].forEach((freq,layer)=>{
        const o=ctx.createOscillator();const g=ctx.createGain();
        o.connect(g);g.connect(master);o.type="sine";
        o.frequency.setValueAtTime(freq,ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(freq/2,ctx.currentTime+1.2);
        g.gain.setValueAtTime(layer===0?0.9:0.4,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.4);
        o.start();o.stop(ctx.currentTime+1.4);
      });

    }else if(type==="beep"){
      // 3 loud sharp beeps
      [0,0.25,0.5].forEach(t2=>{
        const o=ctx.createOscillator();const g=ctx.createGain();
        o.connect(g);g.connect(master);o.type="square";o.frequency.value=1000;
        g.gain.setValueAtTime(0.8,ctx.currentTime+t2);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t2+0.18);
        o.start(ctx.currentTime+t2);o.stop(ctx.currentTime+t2+0.2);
      });

    }else if(type==="chime"){
      // Ascending chime — C5 E5 G5 C6
      [523,659,784,1047].forEach((f,i)=>{
        const o=ctx.createOscillator();const g=ctx.createGain();
        o.connect(g);g.connect(master);o.type="sine";o.frequency.value=f;
        g.gain.setValueAtTime(0,ctx.currentTime+i*0.18);
        g.gain.linearRampToValueAtTime(0.85,ctx.currentTime+i*0.18+0.04);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.18+0.55);
        o.start(ctx.currentTime+i*0.18);o.stop(ctx.currentTime+i*0.18+0.6);
      });

    }else if(type==="alarm"){
      // Urgent pulsing alarm — 8 fast bursts
      for(let i=0;i<8;i++){
        const f=i%2===0?880:1100;
        const o=ctx.createOscillator();const g=ctx.createGain();
        o.connect(g);g.connect(master);o.type="sawtooth";o.frequency.value=f;
        g.gain.setValueAtTime(0.85,ctx.currentTime+i*0.13);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.13+0.11);
        o.start(ctx.currentTime+i*0.13);o.stop(ctx.currentTime+i*0.13+0.12);
      }

    }else if(type==="siren"){
      // Rising siren — good for important reminders
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.connect(g);g.connect(master);o.type="sawtooth";
      o.frequency.setValueAtTime(300,ctx.currentTime);
      o.frequency.linearRampToValueAtTime(900,ctx.currentTime+0.4);
      o.frequency.linearRampToValueAtTime(300,ctx.currentTime+0.8);
      o.frequency.linearRampToValueAtTime(900,ctx.currentTime+1.2);
      g.gain.setValueAtTime(0.8,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.4);
      o.start();o.stop(ctx.currentTime+1.4);

    }else if(type==="ding"){
      // Single sharp high ding — minimal, clean
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.connect(g);g.connect(master);o.type="sine";o.frequency.value=1400;
      g.gain.setValueAtTime(0.95,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
      o.start();o.stop(ctx.currentTime+0.85);

    }else if(type==="drum"){
      // Bold percussion thud — great on mobile speakers
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.connect(g);g.connect(master);o.type="sine";
      o.frequency.setValueAtTime(200,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(40,ctx.currentTime+0.3);
      g.gain.setValueAtTime(1.0,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
      o.start();o.stop(ctx.currentTime+0.4);
      // noise layer
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.1,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.4;
      const src=ctx.createBufferSource();src.buffer=buf;
      const ng=ctx.createGain();src.connect(ng);ng.connect(master);
      ng.gain.setValueAtTime(0.6,ctx.currentTime);
      ng.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.1);
      src.start();

    }else if(type==="trumpet"){
      // Bold fanfare — memorable, hard to miss
      [[392,0],[523,0.15],[659,0.3],[784,0.45]].forEach(([f,t2])=>{
        const o=ctx.createOscillator();const g=ctx.createGain();
        o.connect(g);g.connect(master);o.type="square";o.frequency.value=f;
        g.gain.setValueAtTime(0,ctx.currentTime+t2);
        g.gain.linearRampToValueAtTime(0.7,ctx.currentTime+t2+0.05);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t2+0.35);
        o.start(ctx.currentTime+t2);o.stop(ctx.currentTime+t2+0.4);
      });
    }

    setTimeout(()=>ctx.close(),3000);
  }catch(e){console.log("Sound error:",e);}
}

function fmt12(timeStr){
  if(!timeStr)return"";
  const[h,m]=timeStr.split(":").map(Number);
  const ampm=h>=12?"PM":"AM";
  const h12=h%12||12;
  return h12+":"+String(m).padStart(2,"0")+" "+ampm;
}

// ── C3: FCM SUBSCRIBE HELPER ─────────────────────────────────────
// Requests an FCM registration token and stores it (plus the user's chosen
// check-in time and timezone offset) on their user doc, so the hourly cron
// (/api/push.js) can deliver a single daily push at the right local hour even
// when the app is fully closed. Returns true on success, false otherwise.
// Safe to call repeatedly — getToken is idempotent and returns the same token.
async function subscribeToPush(uid,checkInTime){
  try{
    const fb=window._fb;
    if(!fb||!fb.messaging||!fb.getToken||!uid)return false;
    if(typeof Notification==="undefined"||Notification.permission!=="granted")return false;
    // The SW must be registered & ready before FCM can bind a token to it.
    const reg=await navigator.serviceWorker.ready;
    const token=await fb.getToken(fb.messaging,{vapidKey:fb.VAPID_KEY,serviceWorkerRegistration:reg});
    if(!token)return false;
    // Parse "HH:MM" → hour/minute. Default to 20:00 if missing/invalid.
    let hh=20,mm=0;
    if(typeof checkInTime==="string"&&/^\d{2}:\d{2}$/.test(checkInTime)){
      const p=checkInTime.split(":").map(Number);hh=p[0];mm=p[1];
    }
    // tzOffsetMin: minutes to ADD to UTC to get local time (IST = +330).
    const tzOffsetMin=-new Date().getTimezoneOffset();
    await fb.setDoc(fb.doc(fb.db,"users",uid),{
      fcmToken:token,
      notifEnabled:true,
      checkInHour:hh,
      checkInMinute:mm,
      tzOffsetMin:tzOffsetMin,
      fcmUpdatedAt:new Date().toISOString(),
    },{merge:true});
    return true;
  }catch(e){console.warn("subscribeToPush failed:",e?.message);return false;}
}

  // N.3: Manage Notifications — per-type toggles. Pro/Plus can edit; Free can view only.
  // Reads/writes _notifStore.prefs (already loaded on app boot by loadNotifStore) so the
  // N.2 engine picks up changes immediately without a page reload.
  // Tier via plan's own boolean field (plan.heat = Pro).
  const myTier=plan.heat?"pro":"free";
  const isPaidPlan=myTier!=="free";

  async function enable(){
    if(typeof Notification==="undefined"){
      alert("Notifications not supported here.\n\nTry:\n1. Install app (Add to Home Screen)\n2. Use Chrome on Android\n3. Use desktop Chrome/Firefox");
      return;
    }
    if(Notification.permission==="denied"){
      alert("Notifications blocked!\n\nTo fix:\n1. Tap 🔒 in address bar\n2. Set Notifications → Allow\n3. Refresh page");
      return;
    }
    const p=await Notification.requestPermission();
    setStatus(p);
    if(p==="granted"){setEnabled(true);localStorage.setItem("hg_notif","1");localStorage.setItem("hg_push_asked","1");
      // Sentry JAVASCRIPT-3: new Notification() throws "Illegal constructor" once a service
      // worker is registered, on a real chunk of Chrome/Android users — this was completely
      // unguarded before, so it crashed the whole enable() flow right after permission was
      // already granted. reg.showNotification() is what's actually required in that case.
      try{
        if('serviceWorker' in navigator){
          navigator.serviceWorker.ready.then(reg=>{
            reg.showNotification("⚡ Habtix",{body:"Notifications enabled! 🎉",icon:"/icon-192.png"}).catch(()=>{});
          }).catch(()=>{});
        }else{
          new Notification("⚡ Habtix",{body:"Notifications enabled! 🎉",icon:"/icon-192.png"});
        }
      }catch(e){}
      // C3: register for closed-app FCM push. Use the earliest custom reminder as
      // the daily check-in time; fall back to 20:00 if none set.
      const custom=(reminders||[]).filter(r=>!r.isHabit&&r.time).map(r=>r.time).sort();
      subscribeToPush(uid,custom[0]||"20:00").catch(()=>{});
    }
  }
  function disable(){
    setEnabled(false);
    localStorage.setItem("hg_notif","0");

    // push cron (api/push.js) checks Firestore's notifEnabled flag, not anything local —
    // without this write, disabling here did nothing server-side and the daily check-in
    // would keep arriving forever regardless of what the app showed.
    try{
      if(uid&&window._fb){

      }
