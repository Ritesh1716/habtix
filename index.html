// ── C10: Error Boundary ─────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  componentDidCatch(error,info){
    console.error("Habtix ErrorBoundary caught:",error,info);
    // C5: report to Sentry if it's loaded (safe no-op pre-consent or if Sentry hasn't finished loading yet)
    try{
      if(window.Sentry&&window.Sentry.captureException){
        window.Sentry.captureException(error,{extra:{componentLabel:this.props.label||"unknown",componentStack:info?.componentStack}});
      }
    }catch(e){}
  }
  reset(){this.setState({hasError:false,error:null});}
  render(){
    if(this.state.hasError){
      const t=this.props.t||{bg:"#0d0d0f",card:"#18181c",border:"#2a2a32",text:"#f0eff4",muted:"#7a7a8c",accent:"#f5c842",danger:"#ef4444",surface:"#1a1a20"};
      return(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:220,padding:"32px 20px",textAlign:"center",background:t.card,borderRadius:16,border:"1px solid "+t.border,margin:16}}>
          <div style={{marginBottom:12}}>{typeof IC!=="undefined"?IC.warning(t.danger,40):<span style={{fontSize:36}}>⚠️</span>}</div>
          <div style={{fontSize:16,fontWeight:800,color:t.text,marginBottom:6}}>Something went wrong</div>
          <div style={{fontSize:12,color:t.muted,marginBottom:16,lineHeight:1.6,maxWidth:280}}>
            {this.props.label||"This section"} ran into a problem. Your data is safe — tap Try Again or reload the page.
          </div>
          <button onClick={()=>this.reset()} style={{padding:"10px 22px",borderRadius:10,border:"none",background:t.accent,color:"#000",fontWeight:700,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>
            Try Again
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}


// ── MoImg: Canvas-based white background removal for all Mo images ──────────
// Uses BFS flood-fill from edges — same algorithm as splash screen
// Works on ANY background color, not just pure black
// ── MoImg: simple, instant Mo image renderer ─────────────────────────────────
// All 50 Mo poses are properly exported transparent PNGs (alpha channel
// baked in) — no canvas, no flood-fill, no processing needed. Just a
// plain <img> tag with a glow shadow. Loads instantly, zero corruption
// risk, clean edges with no whitish halo.
//
// MO_ASSET_VERSION: bump this whenever Mo image FILES change in the repo
// (new poses, re-exported transparency fixes, etc.) even if no other app
// code changed. It's appended as a query string to every Mo image URL,
// which guarantees a genuinely new URL the browser's HTTP cache, any CDN
// edge cache, and the Service Worker have never seen before — bypassing
// every caching layer at once, no matter how aggressively configured.
const MO_ASSET_VERSION="2";
function MoImg({src,size=130,alt="Mo",style={}}){
  const versionedSrc=src?(src+(src.includes("?")?"&":"?")+"v="+MO_ASSET_VERSION):src;
  return(
    <img src={versionedSrc} alt={alt}
      style={{
        width:size,height:size,objectFit:"contain",
        filter:"drop-shadow(0 8px 28px rgba(245,185,50,0.55))",
        flexShrink:0,
        ...style,
      }}
      onError={e=>{e.target.style.display="none";}}
    />
  );
}

function App(){
  // Preload all onboarding/auth Mo images immediately on app mount so every
  // screen shows Mo instantly with zero loading delay — browser caches them
  // well before the user reaches each step.
  React.useEffect(()=>{
    const preloadList=[
      "mo-wave-hello.png","mo-handshake.png","mo-comeback.png","mo-presenting.png",
      "mo-arms-crossed.png","mo-writing.png","mo-sit-relax.png","mo-megaphone.png","mo-wink.png",
    ];
    preloadList.forEach(name=>{const img=new Image();img.src="/mo/"+name;});
  },[]);
  const[user,setUser]=useState(null);
  const[loading,setLoading]=useState(true);
  // Confirmed root cause of the white-screen gap: the splash used to hide the
  // instant ANYTHING rendered into #root, including the plain background-color
  // div shown below while this was still true. Firestore could still be
  // mid-fetch at that point — the splash would vanish, and this empty
  // placeholder was what actually sat underneath it until real data arrived.
  // This fires the splash's own readiness signal explicitly, only once loading
  // has genuinely finished, rather than relying on a DOM check that couldn't
  // distinguish a placeholder from real content.
  useEffect(()=>{
    if(!loading&&window.__markAppReady)window.__markAppReady();
  },[loading]);
  const[signingIn,setSigningIn]=useState(false);
  const[tk,setTk]=useState("ivory");// THEME-1: Ivory-only now, was "obsidian"
  const[habits,setHabits]=useState([]);
  // F4: standalone goal-actions — the one genuinely new data concept in this whole
  // batch of work. Not a habit (no recurrence, no streak), not tied to any goal
  // (unlike goal.actions[]). Shape: {id,name,done,doneAt,createdAt}.
  const[standaloneActions,setStandaloneActions]=useState([]);
  const standaloneActionsRef=useRef([]);
  useEffect(()=>{standaloneActionsRef.current=standaloneActions;},[standaloneActions]);
  const[goals,setGoals]=useState([]);
  const[journals,setJournals]=useState({});
  const[goalHistory,setGoalHistory]=useState([]);// completed goals history (browsable, capped at 50, user-deletable)
  const[goalStats,setGoalStats]=useState([]);// permanent completion snapshots for Yearly Review — never capped or deleted
  const[streakCards,setStreakCards]=useState([]);// H-Cards: permanent snapshots of milestone streak-share cards (habitId,habitName,icon,color,streak,date,shared)
  const[milestoneCard,setMilestoneCard]=useState(null);// card object just earned — triggers the Mo "Share now?" popup
  const[viewCard,setViewCard]=useState(null);// card tapped open from the Cards tab / milestone popup — feeds StreakShareModal
  const[showGoalHistory,setShowGoalHistory]=useState(false);// history modal open
  const[expandedHistGoal,setExpandedHistGoal]=useState(null);// which history goal's actions are expanded
  const[pk,setPk]=useState("free");
  const[pe,setPe]=useState(null);
  const[signupDate,setSignupDate]=useState(null);
  const[manifVision,setManifVision]=useState("");// B9: cheap top-level check for Dashboard card copy; full record lives on the manifestation page
  const[manifLinkedGoalId,setManifLinkedGoalId]=useState(null);// B9: so Goals page can show a bidirectional badge without a separate fetch
  const[manifTotalLogged,setManifTotalLogged]=useState(0);
  const[tomorrowPlan,setTomorrowPlan]=useState(null);// {date,items:[{kind,id,label,order}],source:"manual"|"ai"} — own lightweight field, not part of the main habits/goals save cycle
  // H-ROLLOVER: the real isolated draft for tomorrow — {date,touched,gridSlots,
  // slotAssignments:{"h:<id>"/"a:<id>"/"s:<id>":[minutes]}}. Nothing in Plan Tomorrow
  // writes to live habits/goals/standaloneActions/gridSlots anymore (that was the bug —
  // Today's display changed the instant Plan Tomorrow was edited). This draft is applied
  // to the live schedule only once, at the actual midnight rollover — see loadData's
  // rollover block below. null until the user has saved at least one Plan Tomorrow edit.
  const[tomorrowDraft,setTomorrowDraftState]=useState(null);
  // H4 — the grid's current split structure for TODAY: an array of {start,duration}
  // covering all 1440 minutes of a day, start in minutes-from-midnight, duration in
  // {15,30,60}. Defaults to 24 unsplit hours. This is the LIVE, currently-displayed
  // structure — Plan Tomorrow no longer edits this directly (see tomorrowDraft above);
  // it only becomes live via the rollover at the next actual day boundary.
  const[gridSlots,setGridSlots]=useState(()=>Array.from({length:24},(_,h)=>({start:h*60,duration:60})));
  // AI credit display — reads the SAME shared aiCredits/aiCreditsResetMonth fields
  // every AI feature in the app already draws from (confirmed in AI_Coach_Architecture
  // doc: api/ai.js deducts from this one pool, not a per-feature pool). This is
  // DISPLAY ONLY — the real enforcement is a Firestore transaction inside api/ai.js,
  // a server-side file this session has no access to edit or verify. 40 here is the
  // number asked for; if api/ai.js's own cap hasn't also been updated to 40, this
  // display and the real enforced limit will disagree. Flagged explicitly, not
  // silently assumed synced.
  const MONTHLY_AI_CREDIT_CAP=40;
  const[aiCreditsRemaining,setAiCreditsRemaining]=useState(MONTHLY_AI_CREDIT_CAP);
  const[dayNotes,setDayNotes]=useState({});// {dateStr:noteText} — moved off localStorage (was device-only, lost on reinstall/device switch) onto Firestore, same field-per-concern pattern as tomorrowPlan
  const[backfillResult,setBackfillResult]=useState(null);// admin-only: one-time profile-field backfill result
  const[backfillRunning,setBackfillRunning]=useState(false);
  async function runProfileBackfill(){
    if(backfillRunning||!user)return;
    setBackfillRunning(true);setBackfillResult(null);
    try{
      const idToken=await user.getIdToken();
      const resp=await fetch("/api/backfill-profiles",{method:"POST",headers:{"Authorization":"Bearer "+idToken}});
      const data=await resp.json().catch(()=>({}));
      setBackfillResult(resp.ok?data:{error:data.error||("HTTP "+resp.status)});
    }catch(e){setBackfillResult({error:e.message});}
    setBackfillRunning(false);
  }
  const[userNumber,setUserNumber]=useState(null);
  const[birthday,setBirthday]=useState("");// UI-PA2: ISO date string e.g. "2004-06-27"
  const[momentumId,setMomentumId]=useState("");// UI-PA5: MO-DisplayName-UniqueCode
  const[friendReqCount,setFriendReqCount]=useState(0);// F1: pending incoming friend requests badge
  const[challengeInviteCount,setChallengeInviteCount]=useState(0);// pending challenge invites badge
  const[referralCountLive,setReferralCountLive]=useState(null);// authoritative count from /api/referral-grant, null until first boot check completes
  const[page,setPage]=useState(null);// null = waiting for loadData to set it
  const[modal,setModal]=useState(null);
  const[detailHabit,setDetailHabit]=useState(null);
  // C1: Offline
  const[isOffline,setIsOffline]=useState(!navigator.onLine);
  const[updateAvailable,setUpdateAvailable]=useState(false);
  useEffect(()=>{
    function onUpdate(){setUpdateAvailable(true);}
    window.addEventListener('momentum:update-available',onUpdate);
    return()=>window.removeEventListener('momentum:update-available',onUpdate);
  },[]);
  const[offlineBanner,setOfflineBanner]=useState(!navigator.onLine);
  // #33: the online-event listener below is registered once on mount ([] deps) — without
  // this ref, its closure would keep calling whatever `save`/`user` looked like at that first
  // render (often before auth has even resolved), silently no-op'ing forever after. This ref
  // is updated every render so the effect always calls the current, correct save().
  const saveRef=React.useRef(null);
  // C2: Onboarding
  const[showOnboarding,setShowOnboarding]=useState(false);
  // C2: Onboarding state
  const[showDashTour,setShowDashTour]=useState(false);// unused now the tour is removed; state kept harmlessly rather than touching every call site
  // Runs what used to be DashboardTour's onDone — push-notification re-ask, or a
  // welcome message if push is already sorted. Extracted so it can fire directly
  // now that the (stale) dashboard tour itself has been removed.
  function finishOnboardingSequence(){
    localStorage.setItem("hg_dash_tour_done","1");
    const alreadyAsked=localStorage.getItem("hg_push_asked")==="1";
    const notGranted=typeof Notification==="undefined"||Notification.permission!=="granted";
    if(!alreadyAsked&&notGranted&&typeof Notification!=="undefined"&&Notification.permission!=="denied"){
      setTimeout(()=>setShowPushReask(true),500);
    }else{
      setTimeout(()=>setMoBubbleMsg("You're all set. Let's build momentum."),400);
    }

  // C1: Offline/online listeners + queue flush
  useEffect(()=>{
    function goOffline(){setIsOffline(true);setOfflineBanner(true);}
    function goOnline(){
      setIsOffline(false);
      // #33: flush whatever's pending from being offline — this key is durable (localStorage,
      // not just an in-memory ref), so it also covers the case where the person closed the
      // app entirely while offline and only reopens it after connectivity is already back.
      try{
        const raw=localStorage.getItem("hg_offline_pending");
        if(raw){
          const p=JSON.parse(raw);
          if(p&&p.habits&&saveRef.current){
            saveRef.current(p.habits,p.goals,p.journals,p.themeKey,undefined,p.standaloneActions);
            showToast("Back online — synced!");
          }
        }
      }catch(e){console.warn("Offline flush err:",e);}

    }

    window.addEventListener("online",goOnline);

  },[]);

  // Notifications — poll every 30s, fire when time matches
  useEffect(()=>{
    if(!notif)return;
    if(typeof Notification==="undefined"||Notification.permission!=="granted")return;

    const firedKey="hg_notif_fired"; // track fired reminders today
    function getFired(){try{return JSON.parse(localStorage.getItem(firedKey)||"{}");}catch{return{};}}
    function markFired(id){const f=getFired();f[id]=td();localStorage.setItem(firedKey,JSON.stringify(f));}
    function wasFiredToday(id){return getFired()[id]===td();}
    function cleanOldFired(){const f=getFired();const today2=td();Object.keys(f).forEach(k=>{if(f[k]!==today2)delete f[k];});localStorage.setItem(firedKey,JSON.stringify(f));}

    function checkAndFire(){
      cleanOldFired();
      const now=new Date();
      const hh=String(now.getHours()).padStart(2,"0");
      const mm=String(now.getMinutes()).padStart(2,"0");
      const currentTime=hh+":"+mm;
      const today2=td();

      // Notification consolidation: per-habit reminders no longer fire. This used to
      // read h.reminder directly off each habit regardless of what's in the global
      // reminders list (that's why patching updateH() alone wasn't enough — this loop
      // doesn't go through that list). Left as an empty array rather than deleting the
      // branch below, so the isHabit-labeled body-building logic stays inert but intact
      // in case per-task reminders need similar formatting later.
      const habitReminders=[];
      const globalReminders=reminders.filter(r=>r.enabled&&r.time);
      const allReminders=[
        ...globalReminders.map(r=>({id:r.id||r.label,time:r.time,label:r.label,isHabit:false})),
        ...habitReminders.map(h=>({id:"habit_"+h.id,time:h.reminder.time,label:h.icon+" "+h.name,isHabit:true,habitId:h.id})),
      ];

      allReminders.forEach(r=>{
        if(!r.time||r.time!==currentTime)return;
        const fireId=r.id+"_"+r.time+"_"+today2;
        if(wasFiredToday(fireId))return;

        // Build notification body
        let body="",moPoseIcon="/mo/mo-clock.png";
        if(r.isHabit){
          const h=habits.find(hb=>hb.id===r.habitId);
          const done=h&&h.log&&h.log[today2];
          const hasGoal=h&&h.goalCount>0&&h.goalUnit;
          const count=h&&typeof h.log[today2]==="number"?h.log[today2]:done?h.goalCount:0;
          const hstreak=h&&h.streak||0;
          body=done
            ?(hasGoal?r.label+" — "+count+"/"+h.goalCount+" "+h.goalUnit+" done. That's how momentum compounds. ✅":r.label+" — Done today. Momentum compounding. ✅")
            :(hstreak>=3?r.label+" — 🔥 "+hstreak+"-day streak on the line. A few minutes is all it takes.":r.label+" — A few minutes is all it takes. Let's build.");
          moPoseIcon=done?"/mo/mo-celebrate.png":"/mo/mo-clock.png";
        } else {
          const undone=habits.filter(hb=>{
            const hasGoal=hb.goalCount>0&&hb.goalUnit;
            const logVal=hb.log&&hb.log[today2];
            return hasGoal?(!(typeof logVal==="number"&&logVal>=hb.goalCount)):!logVal;
          });
          const maxStreak=habits.reduce((m,hb)=>Math.max(m,hb.streak||0),0);
          // Prefix with the reminder's own label so multiple custom reminders at the
          // same time read distinctly (fixes identical-triples bug), not the same text.
          const lbl=r.label?r.label+" — ":"";
          body=undone.length>0
            ?(maxStreak>=3
                ?lbl+"🔥 "+maxStreak+"-day streak at risk — "+undone.length+" habit"+(undone.length>1?"s":"")+" left before the day ends."
                :lbl+undone.length+" habit"+(undone.length>1?"s":"")+" still open today — a few minutes is all it takes.")
            :lbl+"Fully done today. That's how momentum compounds. See you tomorrow. ✅";
          moPoseIcon=undone.length>0?"/mo/mo-clock.png":"/mo/mo-celebrate.png";
        }

        // Show browser notification
        try{
          const n=new Notification("⚡ Habtix",{
            body,
            icon:moPoseIcon,
            image:moPoseIcon,
            badge:"/icon-192.png",
            tag:fireId,
            requireInteraction:false,
            vibrate:[200,100,200],
          });
          n.onclick=()=>{window.focus();n.close();};
        }catch(e){
          // Try SW notification as fallback
          try{
            if(navigator.serviceWorker&&navigator.serviceWorker.controller){
              navigator.serviceWorker.ready.then(reg=>{
                reg.showNotification("⚡ Habtix",{body,icon:"/icon-192.png",image:moPoseIcon,tag:fireId,vibrate:[200,100,200]});
              });
            }
          }catch(e2){}
        }

        // Vibrate (mobile)
        try{if(navigator.vibrate)navigator.vibrate([300,100,300,100,500]);}catch(e){}

        // Play selected sound
        try{playSound(notifSound);}catch(e){}

        markFired(fireId);
      });
    }

    // Check immediately and every 30 seconds
    checkAndFire();
    const iv=setInterval(checkAndFire,30000);
    return()=>clearInterval(iv);
  },[notif,reminders,habits,notifSound]);

  // ── N.2: In-app situational notification driver (2-slot rhythm) ──────────────
  // On app open (and when core data is ready): evaluate the rotation, fire the top
  // REWARD notification now, then — only if the user is still active ~6 min later —
  // fire the top NUDGE. Max 2/session, spaced, active-only. Persists notifLastShown
  // (+ milestonesNotified, freeDripDay) to Firestore so intervals gate across devices.
  const _n2Ran=React.useRef(false);
  const _n2LastActivity=React.useRef(Date.now());
  useEffect(()=>{
    function bump(){_n2LastActivity.current=Date.now();}
    window.addEventListener("pointerdown",bump);
    window.addEventListener("keydown",bump);
    return()=>{window.removeEventListener("pointerdown",bump);window.removeEventListener("keydown",bump);};
  },[]);
  useEffect(()=>{
    if(_n2Ran.current)return;
    if(!notif)return;
    if(typeof Notification==="undefined"||Notification.permission!=="granted")return;
    if(!user||page===null||showOnboarding)return; // wait for boot, don't interrupt onboarding
    if(!habits)return;
    _n2Ran.current=true;

    async function fireN2(item){
      // Persist gate stamp (+ milestone record) BEFORE showing, so a refresh can't double-fire.
      _notifStore.lastShown[item.type]=n2Today();
      const patch={notifLastShown:_notifStore.lastShown};
      if(item.type==="milestone"&&item.extra&&item.extra.streak!=null){
        if(!_notifStore.milestonesNotified.includes(item.extra.streak)){
          _notifStore.milestonesNotified.push(item.extra.streak);
          patch.milestonesNotified=_notifStore.milestonesNotified;
        }
      }
      try{await fb.setDoc(fb.doc(fb.db,"users",user.uid),patch,{merge:true});}catch(e){}
      // Deep-link tab travels via the SW notification (closed) OR onclick (open tab).
      const url="/?tab="+(item.tab||"dashboard");
      // Same routing rule as the boot-time deep-link handler: journal/pomodoro/coach
      // modal special-casing removed along with those features — every remaining
      // tab value is a real page, routed directly.
      function goToTarget(){
        const tb=item.tab;
        try{navigateTo(tb||"dashboard");}catch(e){}
      }
      // M7: Mo face per notification type, instead of the generic app icon for every single one.
      const MO_ICON_MAP={milestone:"/mo/mo-fist-pump.png",perfectday:"/mo/mo-celebrate.png",comeback:"/mo/mo-comeback.png",features:"/mo/mo-presenting.png",encouragement:"/mo/mo-thumbs-up.png"};
      const moIcon=MO_ICON_MAP[item.type]||"/icon-192.png";
      try{
        const n=new Notification("⚡ Habtix",{body:item.body,icon:moIcon,image:moIcon,badge:"/icon-192.png",tag:"n2_"+item.type+"_"+n2Today(),vibrate:[200,100,200],data:{url}});
        n.onclick=()=>{window.focus();goToTarget();n.close();};
      }catch(e){
        try{if(navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(reg=>reg.showNotification("⚡ Habtix",{body:item.body,icon:moIcon,image:moIcon,tag:"n2_"+item.type+"_"+n2Today(),vibrate:[200,100,200],data:{url}}));}}catch(e2){}
      }
      try{playSound(notifSound);}catch(e){}
    }

    // Build context + evaluate. Score delta from the already-loaded score store.
    const flNow=(()=>{try{return JSON.parse(localStorage.getItem("hg_pomo_focuslog")||"{}");}catch{return{};}})();
    const sd=getScoreWithDelta(habits||[],goals||[],journals||{},flNow,{active:false,wins:0,activeDays:0},goalStats);
    const dripDone=_notifStore.freeDripDay>=7||(signupDate&&n2DaysBetween(signupDate,n2Today())>=7);
    const ctx={
      habits:habits||[],goals:goals||[],journals:journals||{},
      pk,name:(displayName||user.displayName||"").trim().split(" ")[0]||"",
      signupDate,lastShown:_notifStore.lastShown,prefs:_notifStore.prefs,
      milestonesNotified:_notifStore.milestonesNotified,
      scoreVal:sd.score,scoreDelta:sd.delta,dowSun:new Date().getDay()===0,dripDone,
      challengeSummary:_challengeSummary,// N.2 challenge wiring: cheap summary from FriendsPage
    };
    const eligible=n2Evaluate(ctx);

    // ── FREE 7-DAY DRIP (overrides rotation for Free users in their first week) ──
    // One fixed message per day, sequenced. Uses signupDate to derive the day index.
    const isPaidUser=pk==="pro";
    if(!isPaidUser&&signupDate){
      const dayIdx=n2DaysBetween(signupDate,n2Today()); // 0 on signup day
      if(dayIdx>=0&&dayIdx<7){
        const dripKey="drip_"+dayIdx;
        if(!_notifStore.lastShown[dripKey]){
          const dripItem={type:dripKey,slot:"reward",tab:(dayIdx===6?"coach":dayIdx===1?"journal":dayIdx===2?"pomodoro":dayIdx===3?"analytics":dayIdx===4?"goals":"dashboard"),
            body:n2Fill(N2_DRIP[dayIdx],ctx.name)};
          const t2=setTimeout(()=>{fireN2(dripItem);},2500);
          return()=>clearTimeout(t2);
        }
      }
    }

    if(eligible.length===0)return;

    // SLOT 1 (reward): prefer a reward-slot item; else the top item. Fire ~2s after open.
    const reward=eligible.find(e=>e.slot==="reward")||eligible[0];
    const rewardTimer=setTimeout(()=>{fireN2(reward);},2500);

    // SLOT 2 (nudge): a different-type nudge, only if user still active ~6 min in.
    const nudge=eligible.find(e=>e.slot==="nudge"&&e.type!==reward.type);
    let nudgeTimer=null;
    if(nudge){
      nudgeTimer=setTimeout(()=>{
        // Active = interacted within the last 90s. Otherwise skip (never fire into idle).
        if(Date.now()-_n2LastActivity.current<=90000)fireN2(nudge);
      },6*60000);
    }
    return()=>{clearTimeout(rewardTimer);if(nudgeTimer)clearTimeout(nudgeTimer);};
  },[user,page,showOnboarding,habits,notif]);

  async function handleLogin(){

    try{
      // Try popup first (works on most browsers)
      await fb.signInWithPopup(fb.auth,fb.provider);
    }catch(e){
      if(e.code==="auth/popup-blocked"||e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request"){

  async function handleLogout(){
    if(user){localStorage.removeItem("momentum_gh_"+user.uid);localStorage.removeItem("momentum_gs_"+user.uid);}
    await fb.signOut(fb.auth);
    setUser(null);setHabits([]);setGoals([]);setJournals({});setPk("free");setPe(null);
  }

  // openAIModal removed — its only callers (FloatingMo, the coach notification deep-link)
  // are gone. AiConsentModal, showAiConsent and pendingAiOpen are kept below as dormant
  // infrastructure: neither live AI feature (Plan Tomorrow's AI-assist, the new Goal
  // Architect) currently gates on this consent check, which is a real gap worth wiring
  // properly rather than losing the modal that would be needed to fix it.

  // Reliability fix: self-heal accounts whose initial profile write silently failed (e.g. a dropped
  // connection during signup), leaving habits/onboarding data but no email/displayName/dpdpConsented.
  // email + displayName are fully recoverable from Firebase Auth (always present the instant sign-in
  // succeeds).
  //
  // plan/planExpiry/userNumber/referredBy/referralBonusDaysGranted are deliberately NOT healed here —
  // this function was trying to client-write them, but those are exactly the fields the Firestore
  // rules protect as server-only (affectsProtectedFields), and correctly reject a client write that
  // sets them from missing to a value. That's not a rules bug to route around: loosening that
  // protection to let this function through would also loosen it for anyone else. Each of these
  // fields already has a safe fallback elsewhere when missing — plan defaults to free via
  // PLANS[pk]||PLANS.free, missing referredBy just means no referral credit, missing userNumber just
  // means no "user #N" badge shows — so leaving them unhealed costs a cosmetic detail, not function.
  async function ensureProfileFields(uid,authEmail,authDisplayName){
    try{
      const ref=fb.doc(fb.db,"users",uid);
      const snap=await fb.getDoc(ref);
      if(!snap.exists())return; // nothing to heal — normal creation path will handle it
      const d=snap.data();
      if(d.email&&d.displayName&&d.dpdpConsented!==undefined)return; // profile already intact, nothing to do
      const patch={};
      if(!d.email)patch.email=authEmail||null;
      if(!d.displayName&&authDisplayName)patch.displayName=authDisplayName;
      // Honest default, not a real consent grant — makes the field consistently
      // queryable for DPDP auditing (B2/B3) instead of silently absent on old
      // accounts that got stuck before ever reaching the consent step.
      if(d.dpdpConsented===undefined){patch.dpdpConsented=false;patch.dpdpConsentDate=null;}
      if(Object.keys(patch).length===0)return;
      patch.dataRecovered=true;
      patch.dataRecoveredAt=new Date().toISOString();
      await fb.setDoc(ref,patch,{merge:true});
      console.warn("Self-healed incomplete profile for uid:",uid,patch);
    }catch(e){console.error("Profile self-heal err:",e);}
  }

  async function loadData(uid,email,authDisplayName,authUser){
    try{
      const ref=fb.doc(fb.db,"users",uid);
      const snap=await fb.getDoc(ref);
      if(snap.exists()){
        const d=snap.data();
        if(!d.email||!d.plan||!d.displayName||d.dpdpConsented===undefined){
          ensureProfileFields(uid,email,authDisplayName||d.displayName).catch(()=>{});
        }
        // H-ROLLOVER: apply carry-forward/rollover logic once per actual day boundary
        // crossed. scheduleDate tracks which date the live gridSlots +
        // habits/goals/standaloneActions.minuteSlots currently represent. If it doesn't
        // match today, a day boundary has passed since this was last anchored:
        //   - a touched draft saved specifically for today → becomes the live schedule
        //   - no draft, a stale draft (wrong date), or an untouched draft → the live
        //     schedule is left exactly as loaded, i.e. carried forward unchanged — this
        //     is the literal "same box structure as the day before" behavior, confirmed.
        // Either way scheduleDate gets re-anchored to today and the consumed/stale draft
        // is cleared, so a leftover draft never lingers or gets misapplied on a later day.
        let liveHabits=d.habits||[],liveGoals=d.goals||[],liveStandalone=d.standaloneActions||[];
        let liveGridSlots=Array.isArray(d.tomorrowGridSlots)&&d.tomorrowGridSlots.length>0?d.tomorrowGridSlots:null;
        let scheduleRolloverPatch=null;
        const loadedDraft=(d.tomorrowDraft&&typeof d.tomorrowDraft==="object")?d.tomorrowDraft:null;
        if((d.scheduleDate||null)!==today){
          if(loadedDraft&&loadedDraft.date===today&&loadedDraft.touched){
            const assign=loadedDraft.slotAssignments||{};
            liveHabits=liveHabits.map(h=>({...h,minuteSlots:assign["h:"+h.id]||[]}));
            liveGoals=liveGoals.map(g=>({...g,actions:(g.actions||[]).map(a=>({...a,minuteSlots:assign["a:"+a.id]||[]}))}));
            liveStandalone=liveStandalone.map(a=>({...a,minuteSlots:assign["s:"+a.id]||[]}));
            if(Array.isArray(loadedDraft.gridSlots)&&loadedDraft.gridSlots.length>0)liveGridSlots=loadedDraft.gridSlots;
          }
          scheduleRolloverPatch={habits:liveHabits,goals:liveGoals,standaloneActions:liveStandalone,scheduleDate:today,tomorrowDraft:null};
          if(liveGridSlots)scheduleRolloverPatch.tomorrowGridSlots=liveGridSlots;
        }
        setTomorrowDraftState(scheduleRolloverPatch?null:loadedDraft);
        setHabits(liveHabits);setGoals(liveGoals);setJournals(d.journals||{});
        setStandaloneActions(liveStandalone);
        // Fix 12: Load goalHistory from localStorage cache first (instant), then sync from subcollection
        const ghCacheKey="momentum_gh_"+uid;
        const ghCached=localStorage.getItem(ghCacheKey);
        if(ghCached){try{setGoalHistory(JSON.parse(ghCached));}catch(e){}}
        // Load from subcollection in background
        try{
          const ghRef=fb.collection(fb.db,"users",uid,"goalHistory");
          const ghSnap=await fb.getDocs(ghRef);
          const ghArr=[];ghSnap.forEach(d2=>ghArr.push({id:d2.id,...d2.data()}));
          ghArr.sort((a,b)=>(a.completedAt||"").localeCompare(b.completedAt||""));
          setGoalHistory(ghArr);
          localStorage.setItem(ghCacheKey,JSON.stringify(ghArr));
        }catch(e){}
        // Permanent goalStats — never capped/deleted, used for Yearly Review accuracy
        const gsCacheKey="momentum_gs_"+uid;
        const gsCached=localStorage.getItem(gsCacheKey);
        if(gsCached){try{setGoalStats(JSON.parse(gsCached));}catch(e){}}
        if(d.goalStats)setGoalStats(d.goalStats);
        if(d.streakCards)setStreakCards(d.streakCards);
        const loadedPlan=d.plan||"free";
        const loadedExpiry=d.planExpiry||null;
        // THEME-1: Ivory-only now — force any existing user on a non-Ivory themeKey
        // (mainly Obsidian, the old default) onto Ivory on next load, per confirmed
        // decision. Corrected in Firestore too, not just the display, so it doesn't
        // re-trigger every load.
        if(d.themeKey&&d.themeKey!=="ivory"){
          setTk("ivory");
          fb.setDoc(fb.doc(fb.db,"users",uid),{themeKey:"ivory"},{merge:true}).catch(e=>console.error("Theme migration save err:",e));
        }else{
          setTk(d.themeKey||"ivory");
        }
        setPk(loadedPlan);setPe(loadedExpiry);
        // Bug fix: plan/planExpiry/referralBonusDaysGranted are protected fields — client
        // writes to them are correctly blocked by design once the doc exists. That's exactly
        // right for security, but it meant BOTH the auto-downgrade-on-expiry write below AND
        // the referral grant write were being silently denied every single time, for every
        // user — the reward was being computed correctly, just never actually saved. Moved
        // both into one server-side call that verifies the caller and writes via Admin SDK,
        // which bypasses client rules entirely (that's the whole point of "server-only" fields).
        try{
          // Was reading the outer `user` state closure here, which this listener captured
          // once on mount (useEffect with [] deps) and never sees updated — meaning it was
          // always null at this exact point, on every single login, guaranteed. This check
          // silently failed every time as a result. authUser is the actual Firebase user
          // object handed straight from the auth callback, so it's always current.
          const idToken=await authUser.getIdToken();
          const resp=await fetch("/api/referral-grant",{method:"POST",headers:{"Authorization":"Bearer "+idToken}});
          if(resp.ok){
            const grantResult=await resp.json();
            setPk(grantResult.plan);setPe(grantResult.planExpiry||null);
            setReferralCountLive(grantResult.referralCount||0);
          }
        }catch(e){console.error("Referral/plan grant check err:",e);}
        if(d.displayName)setDisplayName(d.displayName);
        if(d.signupDate)setSignupDate(d.signupDate);
        if(d.userNumber)setUserNumber(d.userNumber);
        if(d.birthday)setBirthday(d.birthday);
        if(d.momentumId)setMomentumId(d.momentumId);
        if(d.manifestation){
          setManifVision(d.manifestation.vision||"");
          setManifLinkedGoalId(d.manifestation.linkedGoalId??null);
          setManifTotalLogged(d.manifestation.totalLogged||0);
        }
        if(d.tomorrowPlan&&d.tomorrowPlan.date===tomorrowStr()){
          // Only restore if it's still for the upcoming day — a stale plan from
          // a previous day just gets dropped rather than shown as if current.
          setTomorrowPlan(d.tomorrowPlan);
        }
        if(Array.isArray(liveGridSlots)&&liveGridSlots.length>0){
          const needsRepair=liveGridSlots.some(s=>s.duration>60);
          const loadedSlots=needsRepair?repairOversizedGridSlots(liveGridSlots):liveGridSlots;
          setGridSlots(loadedSlots);
          if(needsRepair){
            fb.setDoc(fb.doc(fb.db,"users",uid),{tomorrowGridSlots:loadedSlots},{merge:true}).catch(e=>console.error("Grid repair save err:",e));
          }
        }
        // H-ROLLOVER: fire the day-boundary patch computed above, if one was needed.
        // Background/non-blocking — nothing in the UI waits on this, same pattern as
        // the grid-repair write just above.
        if(scheduleRolloverPatch){
          fb.setDoc(fb.doc(fb.db,"users",uid),scheduleRolloverPatch,{merge:true}).catch(e=>console.error("Schedule rollover save err:",e));
        }
        if(d.dayNotes&&typeof d.dayNotes==="object")setDayNotes(d.dayNotes);
        {
          const thisMonth=new Date().toISOString().slice(0,7);
          const validBalance=d.aiCreditsResetMonth===thisMonth&&typeof d.aiCredits==="number";
          setAiCreditsRemaining(validBalance?d.aiCredits:MONTHLY_AI_CREDIT_CAP);
        }
        loadScoreStore(d);// SC2: load dated score history (scoreHistory + scoreMonthly) for real deltas
        loadObstacleStore(d);// Obstacle Engine: load persisted mastery state (same pattern as score history)
        loadCompletionStore(d);// H5: load completion-time rollups (log + monthly + yearly), same pattern
        loadNotifStore(d);// N.2: load notification rotation state (lastShown, prefs, milestones, drip)
        refreshFriendReqCount(uid).catch(()=>{});// F1: background, non-blocking
        refreshChallengeInviteCount(uid).catch(()=>{});
        // C2: Firestore is primary truth — localStorage only a cache
        if(d.onboardingCompleted===true){
          localStorage.setItem("hg_onboard_done","1");
          setPage("dashboard");
        } else if(d.onboardingCompleted===false){
          localStorage.removeItem("hg_onboard_done");
          setShowOnboarding(true);
          setPage("dashboard");// onboarding overlay covers this
        } else {
          // Old account, no field → treat as done
          localStorage.setItem("hg_onboard_done","1");
          setPage("dashboard");
        }
      } else {
        localStorage.removeItem("hg_onboard_done");
        setShowOnboarding(true);
        setPage("dashboard");// onboarding overlay covers dashboard
        let num=101;
        // Was unwrapped — if this transaction fails for ANY reason (and it currently
        // does, every time: the Firestore rules have no coverage for the meta
        // collection at all, so this is permission-denied on every single new signup),
        // the throw was jumping straight past account creation entirely, meaning the
        // Firestore user doc for a brand-new signup never got written. Falls back to
        // the timestamp-based number below rather than blocking account creation on
        // a purely cosmetic sequential counter.
        try{
          await fb.runTransaction(fb.db,async tx=>{
            const cRef=fb.doc(fb.db,"meta","userCount");
            const cSnap=await tx.get(cRef);
            num=cSnap.exists()?(cSnap.data().count||0)+1:1;
            tx.set(cRef,{count:num},{merge:true});
          });
        }catch(e){
          console.warn("User count transaction failed (falling back to a non-sequential number):",e);
          num=100000+Math.floor(Date.now()/1000)%900000;// still unique-ish, just not sequential
        }
        // Check for referral code in URL — Item 39: full UIDs are case-sensitive, so no upper/lowercasing here
        // REFERRAL FIX: fall back to the localStorage value captured on app load, since a
        // mobile Google sign-in redirect wipes the URL params before we reach this point.
        let urlRef=new URLSearchParams(window.location.search).get("ref");
        if(!urlRef){try{urlRef=localStorage.getItem("hg_pending_ref");}catch(e){}}
        // A user cannot refer themselves.
        if(urlRef===uid)urlRef=null;
        const referredBy=urlRef||null;
        // Item 39: referred signups get 7 days Pro free immediately — a one-time, isolated grant separate from
        // this user's own future referrer ladder (which starts fresh at 0 the moment THEY make their first referral)
        let plan2="free",expStr=null;
        if(referredBy){
          plan2="pro";
          const exp=new Date();exp.setDate(exp.getDate()+7);
          expStr=exp.toISOString();
        }
        setPk(plan2);setPe(expStr);

        const newAccountData={habits:[],goals:[],journals:{},themeKey:"ivory",plan:plan2,planExpiry:expStr,signupDate:today,userNumber:num,email,displayName:authDisplayName||null,referredBy:referredBy||null,referralBonusDaysGranted:0,onboardingCompleted:false};
        // Reliability fix: account creation is critical — retry silently on transient failures
        // (flaky mobile connections) instead of letting the write fail silently and leaving
        // a user with no profile fields once onboarding's own save creates a bare-bones doc.
        let created=false;
        for(let attempt=0;attempt<3&&!created;attempt++){
          try{
            await fb.setDoc(ref,newAccountData);
            created=true;
          }catch(e){
            console.warn("Account creation attempt "+(attempt+1)+" failed:",e);
            if(attempt<2)await new Promise(r=>setTimeout(r,600*(attempt+1)));
          }
        }
        if(!created)console.error("Account creation failed after 3 attempts — will self-heal on next login via the existing-account backfill check.");
        // REFERRAL FIX: consume the pending ref so it can't attach to a different account
        // created later on the same device.
        try{localStorage.removeItem("hg_pending_ref");}catch(e){}
      }
    }catch(e){console.error("Load err:",e);setPage("dashboard");}// Always unblock on error
  }

  async function save(h,g,j,theme,gh,sa){
    const actualSa=sa!==undefined?sa:standaloneActionsRef.current;
    if(!user)return;
    // #33: offline mode was never actually wired up — saveOfflineAware() existed but was
    // never called anywhere, so every habit/goal tap while offline just let fb.setDoc hang
    // (no IndexedDB persistence is configured on this Firestore instance) with zero durable
    // record of the attempt. Handling it here instead of at each of the 28+ call sites means
    // every existing mutation gets offline support automatically, with nothing else to change.
    if(isOffline){
      try{

        showToast("Saved locally — will sync when you're back online");
      }catch(e){console.warn("Offline snapshot err:",e);}
      return;// skip the Firestore write attempt entirely — nothing to hang on
    }
    setSaving(true);
    // SC3+SC4: compute score + components and persist to Firestore alongside user data
    const flNow=(()=>{try{return JSON.parse(localStorage.getItem("hg_pomo_focuslog")||"{}");}catch{return{};}})();
    const scoreResult=calculateMomentumScore(h||[],g||[],j||{},flNow,{active:false,wins:0,activeDays:0},goalStats);
    // SC2: record today's score into dated history (365-day daily + permanent monthly)
    const scoreSnap=recordScoreSnapshot(scoreResult.total);
    // Obstacle Engine: advance the rolling mastery clock (idempotent per calendar day)
    // using the freshest habits/goals passed into this save — same lifecycle as the
    // score snapshot above, so mastery survives across sessions instead of resetting
    // to empty on every page load.
    const{justMasteredId,inertiaDay7Popup}=advanceObstacleMastery(h||[],g||[],pk,actualSa);
    if(inertiaDay7Popup)setShowInertiaDay7Popup(inertiaDay7Popup);
    // If mastery landed exactly on day 7, the popup above IS the celebration —
    // suppress the generic toast for this one case so it's not shown twice for the
    // same event. Mastery reached later (the rolling window crossing on some other
    // day, after day 7's popup already fired with mastered:false) still gets the
    // normal toast below, same as every other obstacle.
    const inertiaHandledByDay7Popup=justMasteredId==="inertia"&&inertiaDay7Popup&&inertiaDay7Popup.mastered;
    if(justMasteredId&&!inertiaHandledByDay7Popup){

        const nowShown=currentObstacleState(h||[],g||[],pk);
        if(!(nowShown.obstacle&&nowShown.obstacle.id===justMasteredId)){
          const def=justMasteredId==="inertia"?{name:"Inertia"}:OBSTACLES.find(o=>o.id===justMasteredId);
          if(def){
            setObstacleToast({id:justMasteredId,name:def.name,ts:Date.now()});
            setTimeout(()=>setObstacleToast(null),3500);

    const obstacleSnap=snapshotObstacleStore();
    // H5: completion-time rollups (raw 30-day log + 12-month + permanent yearly buckets) —
    // updated live as completions happen (see recordCompletion, called from the toggle
    // functions below), just snapshotted here for the write, same as obstacleSnap above.
    const completionSnap=snapshotCompletionStore();
    // Fix 12: goalHistory no longer stored in main document — uses subcollection instead
    try{await fb.setDoc(fb.doc(fb.db,"users",user.uid),{
      habits:h,goals:g,journals:j,themeKey:theme,
      standaloneActions:actualSa,
      displayName:sanitizeInput(displayName||user.displayName||"",50),
      momentumScore:scoreResult.total,

      scoreComponents:scoreResult.components,

      completionLog:completionSnap.completionLog,
      completionMonthly:completionSnap.completionMonthly,
      completionYearly:completionSnap.completionYearly
    },{merge:true});
    // #33: a pending offline snapshot exists only if a save happened while offline and
    // hasn't synced yet. Once a real online save succeeds, whatever's pending is now stale
    // (this save is newer) — clear it so a later reconnect doesn't re-push old data over new.
    try{localStorage.removeItem("hg_offline_pending");}catch(e){}
    }

  // addTpl() removed (H4 fix) — was only used by the deleted legacy pill-style template picker
  // Real before/after signal delta on today's featured obstacle — not decoration.
  // Only fires for states where "fighting" actually makes narrative sense: active
  // (currently elevated), warning (defending mastery), or climbing toward mastery.
  // Deliberately excludes "maintaining" (already held, nothing at risk — dealing
  // more damage to something already conquered doesn't mean anything) and
  // building/inertia (different mechanics, no percentage to move at all).
  // Floor/cap keep the displayed number consistent action to action even though the
  // real math is chunky — Doubt's per-goal percentages can swing 40-50+ points from
  // one tap, Distraction's day-rate swings are much smaller — without ever showing a
  // number that isn't grounded in what actually happened.
  function computeObstacleDamage(beforeHabits,beforeGoals,afterHabits,afterGoals){
    const state=currentObstacleState(beforeHabits,beforeGoals,pk);
    const fightable=state.mode==="active"||(state.mode==="guarded"&&!state.maintaining);
    if(!fightable||!state.obstacle)return null;
    const obstacleId=state.obstacle.id;
    const sigBefore=bossSignal(obstacleId,minionSignals(beforeHabits,beforeGoals));
    const sigAfter=bossSignal(obstacleId,minionSignals(afterHabits,afterGoals));
    const delta=sigBefore-sigAfter;
    if(delta<=0)return null;// no improvement (or it got worse) — no pop either way
    return{amount:Math.max(2,Math.min(18,Math.round(delta))),obstacleId};
  }
  function triggerDamagePop(beforeHabits,beforeGoals,afterHabits,afterGoals){
    try{
      const dmg=computeObstacleDamage(beforeHabits,beforeGoals,afterHabits,afterGoals);

    }catch(e){console.warn("Damage pop calc err:",e);}

  function toggleH(id){
    const h=habits.map(hb=>{
      if(hb.id!==id)return hb;
      const wasFullDone=isFullDoneOn(hb,today,hb.log[today]);// H5: pre-mutation state, to detect the transition below
      const log={...hb.log};
      const hasGoal=hb.goalCount>0&&hb.goalUnit;
      if(hasGoal){
        // Count-based: increment count, mark done only when count >= goalCount
        const current=typeof log[today]==="number"?log[today]:log[today]?hb.goalCount:0;
        if(current>=hb.goalCount){
          // Already complete — reset to 0 (untick all)
          delete log[today];
        } else {
          // Increment by 1
          const next=current+1;
          log[today]=next>=hb.goalCount?hb.goalCount:next;
        }
      } else {
        // Simple toggle
        const was=!!log[today];
        if(was)delete log[today];else log[today]=true;
      }
      const isDone=hasGoal?(typeof log[today]==="number"&&log[today]>=hb.goalCount):!!log[today];
      // H5: only fires on the not-done → done transition, and only if this habit has an
      // assigned time slot (Plan Tomorrow/Edit Today grid) to compare the completion time against.
      if(!wasFullDone&&isDone&&hb.minuteSlots&&hb.minuteSlots.length)recordCompletion("h",id,hb.minuteSlots);
      // Streak requires FULL completion only
      const isFullDone=(dateStr,lg,hbObj)=>isFullDoneOn(hbObj,dateStr,lg[dateStr]);
      let streak=0,best=hb.best||0;
      const d=new Date();
      while(true){const s=d.toLocaleDateString("en-CA");if(!isFullDone(s,log,hb))break;streak++;d.setDate(d.getDate()-1);}
      if(streak>best)best=streak;
      if(isDone&&BADGES.some(b=>b.d===streak)){setConfetti(true);showToast("🏆 "+streak+"-day streak badge!","badge");pushStreakCard(hb,streak);}
      if(isDone&&streak===7&&!localStorage.getItem("hg_reviewed")){
        setTimeout(()=>setShowReview(true),2000);
      }
      return{...hb,log,streak,best};
    });
    triggerDamagePop(habits,goals,h,goals);
    setHabits(h);save(h,goals,journals,tk);
  }

  // H5: Pomodoro → Habit time link. Adds focused minutes to a time-based habit's log for today.
  // Auto-completes the habit once the target is reached — manual +1 tap (toggleH) still works independently and untouched.
  // Not capped at goalCount: going over shows as "+extra" (e.g. 75/60 min) so overtime focus is visible, not hidden.
  function logHabitTime(habitId,minutesAdded){
    if(!habitId||!minutesAdded)return null;
    let result=null;
    const h=habits.map(hb=>{
      if(hb.id!==habitId)return hb;
      if(!(hb.goalCount>0&&isTimeUnit(hb.goalUnit))){result={skipped:true};return hb;}
      const mult=timeUnitMinutesMultiplier(hb.goalUnit);
      const unitsToAdd=minutesAdded/mult;
      const log={...hb.log};
      const before=typeof log[today]==="number"?log[today]:(log[today]?hb.goalCount:0);
      const wasComplete=before>=hb.goalCount;
      const after=Math.round((before+unitsToAdd)*100)/100;
      log[today]=after;
      const nowComplete=after>=hb.goalCount;
      const isFullDone=(dateStr,lg,hbObj)=>isFullDoneOn(hbObj,dateStr,lg[dateStr]);
      let streak=0,best=hb.best||0;
      const d=new Date();
      while(true){const s=d.toLocaleDateString("en-CA");if(!isFullDone(s,log,hb))break;streak++;d.setDate(d.getDate()-1);}
      if(streak>best)best=streak;
      if(!wasComplete&&nowComplete&&BADGES.some(b=>b.d===streak)){setConfetti(true);showToast("🏆 "+streak+"-day streak badge!","badge");pushStreakCard(hb,streak);}
      result={justCompleted:!wasComplete&&nowComplete,habitName:hb.name,goalCount:hb.goalCount,goalUnit:hb.goalUnit,total:after,extra:Math.max(0,Math.round((after-hb.goalCount)*100)/100)};
      return{...hb,log,streak,best};
    });
    setHabits(h);save(h,goals,journals,tk);
    return result;
  }

    // Cap at 50 — remove oldest if exceeded
    const capped=newGH.length>50?newGH.slice(newGH.length-50):newGH;

      const ghRef=fb.collection(fb.db,"users",uid,"goalHistory");
      const existing=await fb.getDocs(ghRef);

      existing.forEach(d=>batch.delete(d.ref));
      await batch.commit();
      for(const g of capped){
        const docRef=fb.doc(fb.collection(fb.db,"users",uid,"goalHistory"),String(g.id||Date.now()));

                <div style={{flexShrink:0,width:24,height:24,borderRadius:8,border:"2px solid "+NB.ink,background:isStarred?NB.brand:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,opacity:isStarred?1:0.35}}>⭐</div>

                  <div style={{fontSize:9,fontWeight:700,color:NB.ink,whiteSpace:"nowrap",fontFamily:"'Sora',sans-serif"}}>{timeLabel}</div>
                </div>
              </div>);
            });

        {/* Fixed floating pair, bottom-right — replaces the two full-width inline
            buttons. Positioned above the bottom nav bar (which is itself

            list scrolls normally underneath both regardless of length. */}
        <div style={{position:"fixed",bottom:88,right:16,display:"flex",gap:9,zIndex:490}}>
          <div onClick={()=>setShowEditToday(true)} title="Edit Today" style={{width:44,height:44,borderRadius:12,background:NB.card,border:"3px solid "+NB.ink,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",boxShadow:NB.shadow,flexShrink:0}}>

            <span style={{fontSize:22,fontWeight:800,color:NB.brandInk,lineHeight:1}}>+</span>

  // Inertia's day-7 check-in popup. Fires exactly once, on the 7th calendar
  // day of the check-in window, regardless of outcome. Tone is governed by
  // showUpCount>3 specifically — a DIFFERENT number than the 5-of-7 mastery
  // bar — so someone who showed real effort (4 of 7) still gets a proud
  // framing even short of mastery, rather than the same flat message as
  // barely showing up at all.
  // ══════════════════════════════════════════════════════════════════
  function InertiaDay7Popup({data,onClose}){
    const{showUpCount,otherCount,mastered}=data;
    const warmTone=showUpCount>3;
    let heading,body,emoji;
    if(mastered){
      heading="Inertia — Mastered";
      body="A full week of actually showing up. That's not luck — that's how starting works. Procrastination is next.";
      emoji="🏆";
    }else if(warmTone){
      heading="So Close";
      body="You showed up "+showUpCount+" of 7 days — real momentum. A little more and this is done. Mastery's delayed, not gone — keep going.";
      emoji="💪";
    }else{
      heading="Keep Coming Back";
      body="This week didn't go as planned, and that's alright — starting is hard, that's the whole point of this one. "+showUpCount+" of 7 days showed up. Mastery's delayed, not gone — it's still there to earn.";
      emoji="🌱";
    }
    return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:1200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,fontFamily:"'Sora',sans-serif"}}

        <div style={{fontFamily:NB.font,fontWeight:800,fontSize:19,color:NB.ink,marginBottom:8}}>{heading}</div>
        <div style={{fontSize:13,color:NB.ink,opacity:0.85,lineHeight:1.5,marginBottom:16}}>{body}</div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <div style={{flex:1,background:NB.card,border:"2.5px solid "+NB.ink,borderRadius:12,padding:"9px 10px"}}>
            <div style={{fontFamily:NB.font,fontWeight:800,fontSize:16,color:NB.ink}}>{showUpCount} of 7</div>
            <div style={{fontSize:9,fontWeight:700,color:NB.muted,textTransform:"uppercase"}}>Days shown up</div>
          </div>
          <div style={{flex:1,background:NB.card,border:"2.5px solid "+NB.ink,borderRadius:12,padding:"9px 10px"}}>
            <div style={{fontFamily:NB.font,fontWeight:800,fontSize:16,color:NB.ink}}>{Math.min(otherCount,3)} of 3</div>
            <div style={{fontSize:9,fontWeight:700,color:NB.muted,textTransform:"uppercase"}}>Real actions</div>
          </div>
        </div>
        <div onClick={onClose} style={{width:"100%",padding:"12px",borderRadius:NB.rBtn,border:"3px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:14,fontFamily:NB.font}}>Got it</div>
      </div>
    </div>
    );
  }
