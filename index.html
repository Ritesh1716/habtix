          </div>);
        })}
      </div>
    </div>
    );}

  // ══════════════════════════════════════════════════════════════════
  // PLAN TOMORROW — Batch 3. Manual list on Free; AI-assist toggle is
  // Pro-only and calls the same /api/ai proxy used elsewhere, with its
  // own lightweight usageType ("tomorrow_plan") and a 1-credit cost —
  // deliberately separate from the existing multi-day AI Goal Architect
  // ("planner" usageType), which is a bigger, more expensive feature
  // this doesn't touch. AI only reorders what the user already picked;
  // it never invents new items.
  // ══════════════════════════════════════════════════════════════════
  function PlanTomorrowPage(){
    const tmr=tomorrowStr();
    const alreadyPlanned=tomorrowPlan&&tomorrowPlan.date===tmr;
    const candidates=React.useMemo(()=>[
      ...habits.map(h=>({kind:"habit",id:h.id,label:h.name})),
      ...goals.flatMap(g=>(g.actions||[]).filter(a=>!a.done).map(a=>({kind:"action",id:a.id,label:a.action})))
    ],[habits,goals]);

    const[draftItems,setDraftItems]=useState(()=>alreadyPlanned?tomorrowPlan.items:candidates.slice(0,3));
    const[noteText,setNoteText]=useState(()=>(dayNotes&&dayNotes[tmr])||"");
    const[aiNote,setAiNote]=useState("");
    const[aiLoading,setAiLoading]=useState(false);
    const[justSaved,setJustSaved]=useState(false);

    const inDraft=id=>draftItems.some(d=>d.id===id);
    function addItem(c){if(inDraft(c.id))return;setDraftItems(prev=>[...prev,c]);}
    function removeItem(idx){setDraftItems(prev=>prev.filter((_,i)=>i!==idx));}
    function moveItem(idx,dir){
      setDraftItems(prev=>{
        const next=[...prev];
        const swap=idx+dir;
        if(swap<0||swap>=next.length)return prev;
        [next[idx],next[swap]]=[next[swap],next[idx]];
        return next;
      });
    }

    async function handleSave(){
      if(draftItems.length===0&&!noteText.trim())return;
      if(draftItems.length>0){
        const planObj={date:tmr,items:draftItems,source:aiNote?"ai":"manual"};
        await saveTomorrowPlan(planObj);
      }
      if(noteText.trim()!==((dayNotes&&dayNotes[tmr])||"")){
        await saveDayNote(tmr,noteText);
      }
      setJustSaved(true);
      setTimeout(()=>setJustSaved(false),2000);
    }

    async function handleAiPrioritize(){
      if(draftItems.length===0||aiLoading)return;
      setAiLoading(true);setAiNote("");
      try{
        const idToken=await user.getIdToken();
        const resp=await fetch("/api/ai",{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},
          body:JSON.stringify({
            creditCost:1,
            usageType:"tomorrow_plan",
            model:MODEL,
            max_tokens:300,
            system:"You are Mo, a calm and stoic productivity guide — not a hype-man. Given a short list of tomorrow's tasks as JSON, return ONLY valid JSON, no markdown backticks. Format: {\"order\":[0,2,1],\"note\":\"one short plain sentence, no exclamation marks, no motivational language\"}. 'order' is the input indices reordered by what should genuinely happen first, considering typical focus/energy patterns. Never invent new tasks, never drop any, 'order' must contain every input index exactly once.",
            messages:[{role:"user",content:JSON.stringify(draftItems.map((it,i)=>({i,label:it.label})))}]
          })
        });
        if(resp.status===402){showToast("Out of AI credits this month — order kept as-is.");setAiLoading(false);return;}
        if(!resp.ok){const errBody=await resp.text();throw new Error("HTTP "+resp.status+": "+errBody.slice(0,150));}
        const data=await resp.json();
        if(data.error)throw new Error(String(data.error.message||JSON.stringify(data.error)).slice(0,150));
        if(!data.content||!data.content[0]||typeof data.content[0].text!=="string")throw new Error("Unexpected AI response shape");
        const raw=data.content[0].text.replace(/```json|```/g,"").trim();
        const parsed=JSON.parse(raw);
        if(!Array.isArray(parsed.order)||parsed.order.length!==draftItems.length)throw new Error("Bad order shape");
        // Defensive: confirm it's an actual permutation of every index exactly once —
        // right length alone doesn't rule out a duplicate index silently dropping one
        // task and doubling another. Caught by testing, not assumed safe.
        const seen=new Set(parsed.order);
        if(seen.size!==draftItems.length||parsed.order.some(i=>!Number.isInteger(i)||i<0||i>=draftItems.length))throw new Error("Order is not a valid permutation");
        const reordered=parsed.order.map(idx=>draftItems[idx]);
        if(reordered.every(x=>x!==undefined))setDraftItems(reordered);
        setAiNote(typeof parsed.note==="string"?parsed.note.slice(0,140):"");
        try{window.trackEvent&&window.trackEvent("ai_used",{feature:"tomorrow_plan"});}catch(e){}
      }catch(e){
        console.error("Tomorrow AI error:",e);
        showToast("❌ AI prioritize failed — your order is kept as-is.");
      }
      setAiLoading(false);
    }

    return(
    <div style={{padding:16,fontFamily:NB.font,minHeight:"100vh",background:NB.bg,paddingBottom:100}}>
      <div style={{display:"flex",alignItems:"center",gap:9,padding:"8px 0 16px"}}>
        <div onClick={()=>navigateTo("dashboard")} style={{width:38,height:38,border:"3px solid "+NB.ink,borderRadius:12,background:NB.card,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:NB.shadowSm,cursor:"pointer"}}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={NB.ink} strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div style={{fontWeight:700,fontSize:16,color:NB.ink}}>Plan Tomorrow</div>
      </div>

      <div style={{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:NB.muted,fontWeight:700,marginBottom:9,fontFamily:"'Sora',sans-serif"}}>{fmt(tmr)}</div>

      {draftItems.length===0
        ?<div style={{textAlign:"center",padding:"22px 14px",color:NB.muted,fontSize:13,border:"3px dashed "+NB.ink,borderRadius:NB.rCard,marginBottom:14,fontFamily:"'Sora',sans-serif"}}>Nothing planned yet — add something from below.</div>
        :draftItems.map((item,idx)=>(
          <div key={item.kind+"-"+item.id} style={{display:"flex",alignItems:"center",gap:10,background:NB.card,border:"3px solid "+NB.ink,borderRadius:16,padding:"11px 13px",marginBottom:9,boxShadow:NB.shadowSm}}>
            <div style={{width:24,height:24,borderRadius:8,background:NB.brand,border:"2.5px solid "+NB.ink,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,flexShrink:0,fontFamily:NB.font}}>{idx+1}</div>
            <div style={{fontSize:13.5,fontWeight:600,color:NB.ink,flex:1,fontFamily:"'Sora',sans-serif"}}>{item.label}</div>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              <span onClick={()=>moveItem(idx,-1)} style={{cursor:idx===0?"default":"pointer",opacity:idx===0?0.3:1,fontSize:11,lineHeight:1}}>▲</span>
              <span onClick={()=>moveItem(idx,1)} style={{cursor:idx===draftItems.length-1?"default":"pointer",opacity:idx===draftItems.length-1?0.3:1,fontSize:11,lineHeight:1}}>▼</span>
            </div>
            <span onClick={()=>removeItem(idx)} style={{color:NB.coral,fontSize:16,cursor:"pointer",lineHeight:1,padding:"0 2px"}}>×</span>
          </div>
        ))
      }

      {aiNote&&<div style={{fontSize:13,lineHeight:1.5,background:NB.greenSoft,border:"2.5px solid "+NB.ink,borderRadius:14,padding:"9px 12px",marginBottom:14,fontFamily:"'Sora',sans-serif"}}>Mo: "{aiNote}"</div>}

      {candidates.filter(c=>!inDraft(c.id)).length>0&&<React.Fragment>
        <div style={{fontWeight:700,fontSize:13,color:NB.ink,margin:"2px 0 9px",fontFamily:NB.font}}>Add from today's list</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:16}}>
          {candidates.filter(c=>!inDraft(c.id)).slice(0,10).map(c=>(
            <div key={c.kind+"-"+c.id} onClick={()=>addItem(c)} style={{fontSize:12,fontWeight:600,border:"2.5px solid "+NB.ink,borderRadius:NB.rPill,padding:"6px 13px",background:NB.card,boxShadow:NB.shadowSm,cursor:"pointer",fontFamily:"'Sora',sans-serif"}}>+ {c.label}</div>
          ))}
        </div>
      </React.Fragment>}

      <div style={{fontFamily:NB.font,fontWeight:700,fontSize:13,color:NB.ink,margin:"2px 0 9px"}}>Note for tomorrow</div>
      <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Anything to remember, plan for, or set your intention on..." maxLength={500} style={{width:"100%",height:70,padding:"10px 12px",border:"3px solid "+NB.ink,borderRadius:16,fontSize:13,resize:"none",marginBottom:14,fontFamily:"'Sora',sans-serif",boxShadow:NB.shadowSm}}/>

      <div style={{background:NB.card,border:"3px solid "+NB.ink,borderRadius:16,padding:"12px 13px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:NB.shadowSm}}>
        <div>
          <div style={{fontWeight:700,fontSize:13,fontFamily:NB.font}}>Let AI prioritize</div>
          <div style={{fontSize:10.5,color:NB.muted,fontFamily:"'Sora',sans-serif"}}>{pk==="free"?"Pro feature":"Reorders what's above, uses 1 credit"}</div>
        </div>
        {pk==="free"
          ?<span onClick={()=>showUp("Unlock AI-assisted tomorrow planning, deep analytics and unlimited goals on Pro.")} style={{fontSize:11,fontWeight:700,color:NB.brandInk,background:NB.brand,border:"2px solid "+NB.ink,borderRadius:NB.rPill,padding:"5px 12px",cursor:"pointer",fontFamily:NB.font}}>Unlock</span>
          :<span onClick={handleAiPrioritize} style={{fontSize:11,fontWeight:700,color:"#fff",background:aiLoading?NB.muted:NB.coral,border:"2px solid "+NB.ink,borderRadius:NB.rPill,padding:"5px 12px",cursor:aiLoading||draftItems.length===0?"default":"pointer",fontFamily:NB.font}}>{aiLoading?"Thinking…":"Prioritize"}</span>
        }
      </div>

      <div onClick={(draftItems.length>0||noteText.trim())?handleSave:undefined} style={{fontFamily:NB.font,fontWeight:700,fontSize:15,textAlign:"center",border:"3px solid "+NB.ink,borderRadius:NB.rBtn,background:(draftItems.length===0&&!noteText.trim())?NB.muted:(justSaved?NB.green:NB.brand),color:justSaved?"#fff":NB.brandInk,padding:14,boxShadow:NB.shadow,cursor:(draftItems.length>0||noteText.trim())?"pointer":"default"}}>
        {justSaved?"Saved ✓":"Save tomorrow's plan"}
      </div>
    </div>
    );}

    const earnedSet=new Set();

    // Earned date approximation: find a habit with that streak, use today as fallback
    function earnedDateFor(badge){
      const h=habits.find(hb=>(hb.best||hb.streak||0)>=badge.d);
      if(!h)return today;
      // Find the earliest date in log where streak was first hit (approx: createdAt + badge.d days)
      const start=h.createdAt||Object.keys(h.log||{}).sort()[0]||today;
      const d=new Date(start+"T12:00:00");d.setDate(d.getDate()+badge.d-1);
      return d.toLocaleDateString("en-CA");

    function generateMomentumId(){

        window._fb.setDoc(window._fb.doc(window._fb.db,"momentumIdIndex",id),{uid:user.uid},{merge:true}).catch(()=>{});

        {/* ── PA4b: 30-day dot grid — N2-C: GitHub-style habit completion ── */}
        {habits.length>0&&(()=>{
          const today2=new Date().toLocaleDateString("en-CA");
          const days30=Array.from({length:30},(_,i)=>{
            const d=new Date();d.setDate(d.getDate()-(29-i));
            return d.toLocaleDateString("en-CA");
          });
          const dotsPerRow=10;
          const rows=[];
          for(let r=0;r<3;r++) rows.push(days30.slice(r*dotsPerRow,(r+1)*dotsPerRow));
          return(
          <div style={{background:premiumCard(t),border:"1px solid "+t.border,borderRadius:16,padding:"14px 16px",marginBottom:14,boxShadow:premiumShadow(t)}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:700,color:t.text}}>Last 30 Days</div>
              <div style={{fontSize:10,color:t.muted}}>Daily habit completion</div>
            </div>
            {rows.map((row,ri)=>(

  // ── F1/F3–F6: Friends Page (Phase 9, Block 1) ─────────────────────────────

    const myOwnScore=(()=>{try{const fl=JSON.parse(localStorage.getItem("hg_pomo_focuslog")||"{}");return getScoreWithDelta(habits,goals,journals,fl,{active:false,wins:0,activeDays:0},goalStats).score;}catch{return null;}})();// R9-G: for the corner comparison capsule

          batch.set(fb.doc(fb.db,"users",req.fromUid,"friends",user.uid),{uid:user.uid,momentumId,displayName:displayName||user.displayName||"User",photoURL:user.photoURL||null,addedAt:new Date().toISOString()},{merge:true});

    // ── F7–F9: Challenges (Phase 9 Block 2) ─────────────────────────────────
    function habitById(id){return habits.find(h=>h.id===id);}

    function computeProgress(habitId,startDate,endDate){
      const habit=habitById(habitId);
      const todayStr=today;
      const end=endDate<todayStr?endDate:todayStr;// never score past today
      let d=new Date(startDate+"T12:00:00");
      const endD=new Date(end+"T12:00:00");
      let daysCompleted=0,streakFreezeUsed=0;const completedDates=[];
      while(d<=endD){
        const ds=d.toLocaleDateString("en-CA");
        if(habit){
          if(isChallengeDayDone(habit,ds)){daysCompleted++;completedDates.push(ds);}
          if(habit.log&&habit.log[ds]==="freeze")streakFreezeUsed++;
        }
        d.setDate(d.getDate()+1);
      }
      return{daysCompleted,completedDates,streakFreezeUsed};
    }

    const hasLoadedChallengesOnce=React.useRef(false);
    async function loadChallenges(){
      if(!user?.uid)return;
      if(!hasLoadedChallengesOnce.current)setLoadingC(true);
      try{
        const[mineSnap,invSnap]=await Promise.all([
          fb.getDocs(fb.query(fb.collection(fb.db,"challenges"),fb.where("participants","array-contains",user.uid))),
          fb.getDocs(fb.query(fb.collection(fb.db,"challenges"),fb.where("invitedUids","array-contains",user.uid)))
        ]);
        const mine=[];mineSnap.forEach(d=>mine.push({id:d.id,...d.data()}));
        const inv=[];invSnap.forEach(d=>inv.push({id:d.id,...d.data()}));
        // enrich each of my challenges with the participants' progress + sync my own first
        const enriched=await Promise.all(mine.map(async c=>{
          const myProg=(c.participantHabits||{})[user.uid];
          if(myProg){
            try{
              const p=computeProgress(myProg.habitId,c.startDate,c.endDate);
              await fb.setDoc(fb.doc(fb.db,"challenges",c.id,"progress",user.uid),{
                uid:user.uid,momentumId,displayName:displayName||user.displayName||"User",photoURL:user.photoURL||null,
                linkedHabitId:myProg.habitId,linkedHabitName:myProg.habitName,
                ...p,lastSyncedAt:new Date().toISOString()
              },{merge:true});
            }catch(e){/* progress rules not deployed yet */}
          }
          let progressList=[];
          try{
            const pSnap=await fb.getDocs(fb.collection(fb.db,"challenges",c.id,"progress"));
            pSnap.forEach(pd=>progressList.push(pd.data()));
          }catch(e){}
          progressList.sort((a,b)=>(b.daysCompleted||0)-(a.daysCompleted||0));
          const ended=c.endDate<today;
          return{...c,progressList,ended};
        }));
        setMyChallenges(enriched);
        setChallengeInvites(inv);
        setChallengeInviteCount(inv.length);// keep App-level dashboard badge in sync
        // N.2 challenge-notif wiring: report a LIGHTWEIGHT summary to the shared store
        // instead of duplicating this expensive multi-query load inside the App-scope
        // engine. The engine reads _challengeSummary (cheap, already-computed) rather
        // than re-querying challenges/progress on every notification evaluation.
        try{
          const active=enriched.filter(c=>!c.ended);
          _challengeSummary.hasActive=active.length>0;
          _challengeSummary.hasFriendsNoChallenge=(friendsList?.length||0)>0&&active.length===0;
          _challengeSummary.standings=active.map(c=>{
            const mine=c.progressList.find(p=>p.uid===user.uid);
            const others=c.progressList.filter(p=>p.uid!==user.uid);
            const topOther=others.sort((a,b)=>(b.daysCompleted||0)-(a.daysCompleted||0))[0];
            if(!mine||!topOther)return null;
            const diff=(mine.daysCompleted||0)-(topOther.daysCompleted||0);
            return{challengeId:c.id,leading:diff>0,tied:diff===0,friendName:topOther.displayName||"a friend",diff:Math.abs(diff)};
          }).filter(Boolean);
        }catch(e){}
      }catch(e){console.error("Challenges load err:",e);}
      hasLoadedChallengesOnce.current=true;
      setLoadingC(false);
    }
    React.useEffect(()=>{loadChallenges();},[]);

    async function createChallenge(){
      if(pk==="free"){showUp("Creating challenges is a Pro feature — join is free, creating needs Pro or Plus.");return;}
      if(challengeLimit!==Infinity&&myChallenges.filter(c=>!c.ended).length>=challengeLimit){
        showUp("You've reached your active challenge limit — upgrade to Plus for unlimited challenges.");return;
      }
      if(!newHabitId||newHabitId==="__new__"){showToast("Pick or create a habit to track","err");return;}
      if(newFriendUids.length===0){showToast("Pick at least one friend","err");return;}
      const maxMembers=20;
      if(newFriendUids.length+1>maxMembers){showToast("Too many members for this plan","err");return;}
      setBusy(true);
      try{
        const habit=habitById(newHabitId);
        const start=today;
        const endD=new Date(start+"T12:00:00");endD.setDate(endD.getDate()+newDuration-1);
        const end=endD.toLocaleDateString("en-CA");
        const title=sanitizeInput(newTitle.trim(),60)||((habit?.name||"Habit")+" — "+newDuration+" Day Challenge");
        // habitTemplate: the creator's exact habit settings (name/icon/category/color/frequency/
        // goal count+unit — NOT reminder time, streak, or log, which are personal/fresh per
        // person) so every invitee who joins gets an identical habit auto-created, rather than
        // having to pick or build their own from scratch.
        const habitTemplate=habit?{name:habit.name,cat:habit.cat,icon:habit.icon,color:habit.color,freq:habit.freq,goalCount:habit.goalCount||0,goalUnit:habit.goalUnit||""}:null;
        const ref=await fb.addDoc(fb.collection(fb.db,"challenges"),{
          creatorUid:user.uid,title,durationDays:newDuration,startDate:start,endDate:end,
          participants:[user.uid],invitedUids:newFriendUids,maxMembers,status:"active",
          participantHabits:{[user.uid]:{habitId:newHabitId,habitName:habit?.name||"Habit"}},
          habitTemplate,
          createdAt:new Date().toISOString()
        });
        await fb.setDoc(fb.doc(fb.db,"challenges",ref.id,"progress",user.uid),{
          uid:user.uid,momentumId,displayName:displayName||user.displayName||"User",photoURL:user.photoURL||null,
          linkedHabitId:newHabitId,linkedHabitName:habit?.name||"Habit",
          daysCompleted:0,completedDates:[],streakFreezeUsed:0,lastSyncedAt:new Date().toISOString()
        },{merge:true});
        showToast("Challenge created!");
        setShowCreateChallenge(false);setNewTitle("");setNewHabitId("");setNewDuration(7);setNewFriendUids([]);
        loadChallenges();
      }catch(e){console.error(e);showToast("Couldn't create challenge — try again","err");}
      setBusy(false);
    }

    async function acceptInvite(c){
      if(challengeLimit!==Infinity&&myChallenges.filter(x=>!x.ended).length>=challengeLimit){
        showUp("You've reached your active challenge limit — upgrade to Plus for unlimited challenges.");return;
      }
      if((c.participants||[]).length>=(c.maxMembers||20)){showToast("This challenge is full","err");return;}
      setBusy(true);
      try{
        // Robustness fix: c.participants/c.invitedUids come from whenever loadChallenges()
        // last ran, which could be stale by the time this write actually happens — and the
        // deployed rule compares against the server's CURRENT arrays at write time. Even a
        // slightly-stale local copy fails that equality check the exact same way the
        // arrayUnion/arrayRemove sentinel issue did. Fetching fresh right before building
        // the write closes that gap.
        const freshSnap=await fb.getDoc(fb.doc(fb.db,"challenges",c.id));
        if(!freshSnap.exists()){showToast("This challenge no longer exists","err");setBusy(false);return;}
        const freshData=freshSnap.data();
        // Auto-clone the creator's exact habit settings — no more manual habit picking.
        // Older challenges created before this change won't have habitTemplate; for those,
        // fall back to a plain habit named after the challenge so joining still works.
        const tmpl=c.habitTemplate||freshData.habitTemplate||{name:c.title,cat:"Health",icon:"⭐",color:t.accent,freq:"daily",goalCount:0,goalUnit:""};
        const newHabitId=Date.now();
        const newHabit={
          id:newHabitId,name:tmpl.name,cat:tmpl.cat,icon:tmpl.icon,color:tmpl.color,freq:tmpl.freq,
          goalCount:tmpl.goalCount||0,goalUnit:tmpl.goalUnit||"",remTime:"",streak:0,best:0,log:{},
          challengeId:c.id,challengeEndDate:c.endDate// tags this habit as challenge-linked for the badge + auto-cleanup of the tag
        };
        const updatedHabits=[...habits,newHabit];
        setHabits(updatedHabits);save(updatedHabits,goals,journals,tk);
        // Bug fix: the deployed rule verifies participants/invitedUids with plain == against
        // literal arrays (participants.concat([uid]), invitedUids.removeAll([uid])). arrayUnion/
        // arrayRemove are sentinel transforms — the rules engine can't resolve them at
        // evaluation time, so that equality check always failed and every join was silently
        // denied ("Couldn't join — try again"). Writing explicit arrays, built from the FRESH
        // data above, so the rule can actually verify them.
        await fb.setDoc(fb.doc(fb.db,"challenges",c.id),{
          participants:[...(freshData.participants||[]),user.uid],
          invitedUids:(freshData.invitedUids||[]).filter(x=>x!==user.uid),
          [`participantHabits.${user.uid}`]:{habitId:newHabitId,habitName:tmpl.name}
        },{merge:true});
        await fb.setDoc(fb.doc(fb.db,"challenges",c.id,"progress",user.uid),{
          uid:user.uid,momentumId,displayName:displayName||user.displayName||"User",photoURL:user.photoURL||null,
          linkedHabitId:newHabitId,linkedHabitName:tmpl.name,
          daysCompleted:0,completedDates:[],streakFreezeUsed:0,lastSyncedAt:new Date().toISOString()
        },{merge:true});
        showToast(tmpl.icon+" "+tmpl.name+" added to your habits — challenge joined!");
        try{window.trackEvent&&window.trackEvent("challenge_joined",{});}catch(e){}
        loadChallenges();
      }catch(e){
        console.error("acceptInvite error:",e);
        // Surface the real reason instead of a generic message — permission-denied (rules not
        // deployed/mismatched) looks nothing like a network error, and the person shouldn't
        // need DevTools open to tell the two apart.
        const reason=e?.code==="permission-denied"?"blocked by security rules (may need redeploying)":(e?.message||"unknown error");
        showToast("Couldn't join — "+reason,"err");
      }
      setBusy(false);
    }

    async function declineInvite(c){
      setBusy(true);
      try{
        // Same fixes as acceptInvite — fetch fresh to avoid a stale local copy failing the
        // rule's equality check, and explicit array instead of the arrayRemove sentinel.
        const freshSnap=await fb.getDoc(fb.doc(fb.db,"challenges",c.id));
        const freshInvited=freshSnap.exists()?(freshSnap.data().invitedUids||[]):[];
        await fb.setDoc(fb.doc(fb.db,"challenges",c.id),{invitedUids:freshInvited.filter(x=>x!==user.uid)},{merge:true});
        loadChallenges();
      }catch(e){
        console.error("declineInvite error:",e);
        const reason=e?.code==="permission-denied"?"blocked by security rules (may need redeploying)":(e?.message||"unknown error");

    async function deleteChallenge(c){

              {momentumId&&<button onClick={()=>{

                  <div style={{display:"flex",justifyContent:"space-between",padding:"4px 0"}}><span>Friends since</span><span style={{color:t.text,fontWeight:600}}>{viewFriend.addedAt?fmt(viewFriend.addedAt):"—"}</span></div>
                  <div style={{display:"flex",justifyContent:"space-between",padding:"4px 0"}}><span>Challenges together</span><span style={{color:t.text,fontWeight:600}}>{myChallenges.filter(c=>(c.participants||[]).includes(viewFriend.uid)).length}</span></div>

                </div>

              <div onClick={e=>e.stopPropagation()} style={{background:t.card,border:"1px solid "+t.border,borderRadius:16,padding:20,width:"100%",maxWidth:340}}>
                <div style={{fontSize:14,fontWeight:800,color:t.text,marginBottom:6}}>Remove {confirmUnfriend.displayName}?</div>
                <div style={{fontSize:12,color:t.muted,marginBottom:18,lineHeight:1.5}}>You'll stop seeing each other's progress and any shared challenges will lose this connection. They won't be notified.</div>
                <div style={{display:"flex",gap:8}}>

                  <button onClick={()=>unfriend(confirmUnfriend)} disabled={busy} style={{flex:1,padding:"10px",borderRadius:10,border:"none",background:t.danger,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>Remove</button>
                </div>

            </div>}

            {/* Challenge Detail modal — same progress data already computed for the inline
                card, just with fuller context (exact dates, linked habit names, streak
                freezes) since the inline card only has room for the compact summary. */}
            {viewChallenge&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:9500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={()=>setViewChallenge(null)}>
              <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:480,maxHeight:"85vh",overflowY:"auto",background:t.card,borderRadius:"22px 22px 0 0",padding:"22px 20px 34px",animation:"slideUp 0.25s ease"}}>
                <div style={{width:36,height:4,borderRadius:2,background:t.border,margin:"0 auto 18px"}}/>
                <div style={{fontSize:16,fontWeight:800,color:t.text,marginBottom:4}}>{viewChallenge.title}</div>
                <div style={{fontSize:11,color:t.muted,marginBottom:16}}>
                  {viewChallenge.ended?"Ended "+fmt(viewChallenge.endDate):"Day "+Math.min(viewChallenge.durationDays,Math.floor((new Date(Math.min(new Date(),new Date(viewChallenge.endDate+"T12:00:00")))-new Date(viewChallenge.startDate+"T12:00:00"))/86400000)+1)+" of "+viewChallenge.durationDays}
                  {" · "}{fmt(viewChallenge.startDate)} → {fmt(viewChallenge.endDate)}
                </div>
                <div style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:12}}>Standings</div>
                {viewChallenge.progressList.length>0&&(()=>{
                  const p1=viewChallenge.progressList[0],p2=viewChallenge.progressList[1],p3=viewChallenge.progressList[2];
                  const spot=(p,rank,standH,avSize,crown)=>p?(
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:88}}>
                      {crown&&<div style={{marginBottom:2}}>{IC.crown(t.accent,20)}</div>}
                      <AvatarCircle photoURL={p.photoURL} name={p.displayName} size={avSize} color={rank===1?t.accent:t.muted}/>
                      <div style={{fontSize:11,fontWeight:rank===1?800:600,color:t.text,marginTop:6,textAlign:"center",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"100%"}}>{p.displayName}{p.uid===user.uid?" (you)":""}</div>
                      <div style={{fontSize:10,fontWeight:700,color:rank===1?t.accent:t.muted,marginBottom:6}}>{p.daysCompleted||0}d</div>
                      <div style={{width:"100%",height:standH,background:rank===1?t.accent:t.accent+(rank===2?"77":"44"),borderRadius:"8px 8px 0 0",display:"flex",alignItems:"flex-start",justifyContent:"center",paddingTop:8,boxShadow:rank===1?"0 0 14px "+t.accent+"55":"none"}}>
                        <span style={{fontSize:rank===1?18:14,fontWeight:900,color:"#000"}}>{rank}</span>
                      </div>
                    </div>
                  ):<div style={{width:88}}/>;
                  return(
                    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",gap:6,marginBottom:20}}>
                      {spot(p2,2,58,46,false)}
                      {spot(p1,1,80,60,true)}

                {viewChallenge.progressList.slice(3).map((p,i)=>(

                    <span style={{fontSize:12,fontWeight:800,color:t.muted,width:16}}>{i+4}</span>
                    <AvatarCircle photoURL={p.photoURL} name={p.displayName} size={32} color={t.muted}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:p.uid===user.uid?800:600,color:t.text}}>{p.displayName}{p.uid===user.uid?" (you)":""}</div>
                      <div style={{fontSize:10,color:t.muted,marginTop:1}}>{p.linkedHabitName||"—"}{p.streakFreezeUsed>0?" · 🛡 "+p.streakFreezeUsed+" freeze used":""}</div>
                    </div>
                    <div style={{fontSize:13,fontWeight:800,color:t.text}}>{p.daysCompleted||0}d</div>
                  </div>
                ))}
                <button onClick={()=>setViewChallenge(null)} style={{width:"100%",padding:"11px",borderRadius:11,border:"1px solid "+t.border,background:"none",color:t.muted,fontWeight:600,fontSize:12,cursor:"pointer",marginTop:8}}>Close</button>
                {viewChallenge.creatorUid===user.uid&&<button onClick={()=>setConfirmDeleteChallenge(viewChallenge)} style={{width:"100%",padding:"11px",borderRadius:11,border:"1px solid "+t.danger+"44",background:t.danger+"12",color:t.danger,fontWeight:700,fontSize:12,cursor:"pointer",marginTop:8}}>Delete Challenge</button>}
              </div>
            </div>}

            {/* Delete Challenge double-confirmation — creator only, matches the Firestore rule */}
            {confirmDeleteChallenge&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:9700,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 24px"}} onClick={()=>setConfirmDeleteChallenge(null)}>
              <div onClick={e=>e.stopPropagation()} style={{background:t.card,border:"1px solid "+t.border,borderRadius:16,padding:20,width:"100%",maxWidth:340}}>
                <div style={{fontSize:14,fontWeight:800,color:t.text,marginBottom:6}}>Delete "{confirmDeleteChallenge.title}"?</div>
                <div style={{fontSize:12,color:t.muted,marginBottom:18,lineHeight:1.5}}>This ends the challenge for everyone and can't be undone. Habits already created from joining will stay in each person's own Habits list — this only removes the challenge itself.</div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setConfirmDeleteChallenge(null)} style={{flex:1,padding:"10px",borderRadius:10,border:"1px solid "+t.border,background:"none",color:t.muted,fontWeight:600,fontSize:12,cursor:"pointer"}}>Cancel</button>
                  <button onClick={()=>deleteChallenge(confirmDeleteChallenge)} disabled={busy} style={{flex:1,padding:"10px",borderRadius:10,border:"none",background:t.danger,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>Delete</button>

      </div>

  // ── UI-MS1–MS9: Momentum Score Full Page ─────────────────────────────────────

  // ── B9: Manifestation Journal — "1% Better" ──────────────────────────────
  // Setup once, then one daily Yes/No + optional photo. Deliberately isolated
  // from Momentum Score and Friend Challenges (own streak counter, own
  // Firestore subcollection) — see habtix.md Section 6 for why. Photos:
  // trial/free stay local (IndexedDB) and sync to Firestore only once the
  // account is on an active Pro/Plus plan — "sync the record, localize the
  // photo" (the check-in itself always syncs so history/streak never depends
  // on one specific device).

  // Habits page — Updates 11-14: stats bar, day nav, week dots, category filter
  function HabitsPage(){
    const isToday=viewD===today;
    const[arrowsForId,setArrowsForId]=useState(null); // H2 rework: id of habit currently showing ↑/↓ reorder arrows

    // Day navigation helpers
    function prevDay(){const d=new Date(viewD+"T12:00:00");d.setDate(d.getDate()-1);setViewD(d.toISOString().split("T")[0]);}
    function nextDay(){if(isToday)return;const d=new Date(viewD+"T12:00:00");d.setDate(d.getDate()+1);setViewD(d.toISOString().split("T")[0]);}

    // Update 11: stats bar values
    const doneForDay=habits.filter(h=>{const v=h.log&&h.log[viewD];return isFullDoneOn(h,viewD,v);}).length;
    const bestStreak=habits.length>0?Math.max(...habits.map(h=>h.streak||0)):0;
    // TODAY% — count-based for current day, or past day's completion %
    const viewDUnitsTotal=habits.reduce((s,h)=>{const gc=goalCountAt(h,viewD);if(gc>0)return s+gc;return s+1;},0);
    const viewDUnitsDone=habits.reduce((s,h)=>{const v=h.log&&h.log[viewD];if(!v)return s;const gc=goalCountAt(h,viewD);if(gc>0)return s+(typeof v==="number"?Math.min(v,gc):0);return s+1;},0);
    const todayPctBar=viewDUnitsTotal>0?Math.round(viewDUnitsDone/viewDUnitsTotal*100):0;
    // Streak on that day — for past days, recalculate from that date
    const streakOnDay=isToday?bestStreak:(()=>{
      const best=habits.length>0?Math.max(...habits.map(h=>{
        let s=0;const d=new Date(viewD+"T12:00:00");
        while(true){const ds=d.toLocaleDateString("en-CA");const v=h.log&&h.log[ds];const full=isFullDoneOn(h,ds,v);if(!full)break;s++;d.setDate(d.getDate()-1);}
        return s;
      }),0):0;
      return best;
    })();

    // Update 13: last 7 days for week dots
    function getLast7(){const arr=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);arr.push(d.toLocaleDateString("en-CA"));}return arr;}
    const week7=getLast7();

    // Update 14: unique cats for filter tabs
    const allCats=["All",...[...new Set(habits.map(h=>h.cat))].filter(Boolean)];
    const filtered=catFilter==="All"?habits:habits.filter(h=>h.cat===catFilter);

    // H2 rework: tap-arrows reorder replaces the old continuous-drag system.
    // Long-press a capsule → ↑/↓ arrows appear on it → tap an arrow to move it one position → arrows
    // auto-dismiss on any tap outside them, or on browser/phone back navigation.
    function moveHabit(hid,dir){
      setHabits(prev=>{
        const arr=[...prev];
        const idx=arr.findIndex(h=>h.id===hid);
        const swapIdx=idx+dir;
        if(idx===-1||swapIdx<0||swapIdx>=arr.length)return prev;
        [arr[idx],arr[swapIdx]]=[arr[swapIdx],arr[idx]];
        save(arr,goals,journals,tk);
        return arr;
      });
    }
    useEffect(()=>{
      if(!arrowsForId)return;
      function handleOutside(e){
        if(e.target.closest&&e.target.closest('[data-reorder-arrows="1"]'))return;
        setArrowsForId(null);
      }
      function handlePop(){setArrowsForId(null);}
      document.addEventListener("pointerdown",handleOutside,true);
      window.addEventListener("popstate",handlePop);
      return()=>{
        document.removeEventListener("pointerdown",handleOutside,true);
        window.removeEventListener("popstate",handlePop);
      };
    },[arrowsForId]);

    // Long-press the capsule itself to reveal the reorder arrows — replaces the old always-visible grip-dot handle.
    // Buttons and the checkbox are excluded so normal taps still work; a real drag/scroll gesture cancels the timer before it fires.
    const longPressTimer=useRef(null);
    const longPressStart=useRef({x:0,y:0});
    function startLongPress(e,hid){
      if(e.target.closest&&e.target.closest("button,[data-checkbox]"))return;
      const pt=e.touches?e.touches[0]:e;
      longPressStart.current={x:pt.clientX,y:pt.clientY};
      longPressTimer.current=setTimeout(()=>{
        if(navigator.vibrate)navigator.vibrate(20);
        setArrowsForId(hid);
        longPressTimer.current=null;
      },3500);
    }
    function moveLongPress(e){
      if(!longPressTimer.current)return;
      const pt=e.touches?e.touches[0]:e;
      if(Math.abs(pt.clientX-longPressStart.current.x)>10||Math.abs(pt.clientY-longPressStart.current.y)>10){
        clearTimeout(longPressTimer.current);longPressTimer.current=null;
      }
    }
    function endLongPress(){
      if(longPressTimer.current){clearTimeout(longPressTimer.current);longPressTimer.current=null;}
    }

    return(
    <div style={{padding:16,fontFamily:NB.font,minHeight:"100vh",background:NB.bg,paddingBottom:100}}>
      <AppHeader t={t} user={user} displayName={displayName} pk={pk} onCalendar={()=>openModal("calendar")} onNotif={()=>openModal("notif")} onProfile={()=>{window.history.pushState({showHamburger:true,page:page},"",'/');setShowHamburger(true);}} navMuted={navMuted} onUp={()=>showUp("Unlock unlimited goals, deep analytics, AI planning & more!")}/>
      <div style={{fontWeight:700,fontSize:18,color:NB.ink,margin:"10px 0 16px",fontFamily:NB.font}}>Manage Habits</div>

      {isToday&&habits.length>0&&doneForDay===habits.length&&<div style={{background:NB.greenSoft,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:"12px 16px",marginBottom:14,display:"flex",alignItems:"center",gap:10,boxShadow:NB.shadowSm}}>
        <span style={{fontSize:22}}>🎉</span>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:NB.ink,fontFamily:NB.font}}>All habits done today</div>
          <div style={{fontSize:11,color:NB.muted,fontFamily:"'Sora',sans-serif"}}>Every one of them, checked off.</div>
        </div>
      </div>}

      <div style={{display:"flex",gap:8,marginBottom:14,fontFamily:NB.font}}>
        {[["Total",habits.length],["Done",doneForDay+"/"+habits.length],["Streak",streakOnDay+"d"],[isToday?"Today":"%",todayPctBar+"%"]].map(([lbl,val])=>(
          <div key={lbl} style={{flex:1,background:NB.card,border:"3px solid "+NB.ink,borderRadius:16,padding:"9px 4px",textAlign:"center",boxShadow:NB.shadowSm}}>
            <div style={{fontSize:15,fontWeight:800,color:NB.ink}}>{val}</div>
            <div style={{fontSize:8,color:NB.muted,textTransform:"uppercase",letterSpacing:0.3,marginTop:2,fontFamily:"'Sora',sans-serif",fontWeight:700}}>{lbl}</div>
          </div>
        ))}
      </div>

      <div style={{display:"flex",gap:8,marginBottom:isToday?4:14,fontFamily:NB.font}}>
        <div style={{flex:1.6,display:"flex",alignItems:"center",justifyContent:"space-between",background:NB.card,border:"3px solid "+NB.ink,borderRadius:16,padding:"9px 8px",boxShadow:NB.shadowSm}}>
          <span onClick={prevDay} style={{cursor:"pointer",padding:"4px 9px",fontSize:15,flexShrink:0,fontWeight:700}}>‹</span>
          <div style={{fontWeight:700,fontSize:12,color:NB.ink,whiteSpace:"nowrap"}}>{isToday?"Today":new Date(viewD+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</div>
          <span onClick={nextDay} style={{cursor:isToday?"default":"pointer",padding:"4px 9px",fontSize:15,flexShrink:0,fontWeight:700,opacity:isToday?0.3:1}}>›</span>
        </div>
        {isToday&&<div onClick={()=>{setShowHF(v=>!v);setShowTpl(false);}} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:4,padding:"9px 4px",borderRadius:16,border:"3px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:11.5,whiteSpace:"nowrap",boxShadow:NB.shadowSm}}>
          <span style={{fontSize:15,lineHeight:1}}>+</span> New Habit
        </div>}
        {isToday&&<div onClick={()=>{setShowTpl(v=>!v);setShowHF(false);}} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:4,padding:"9px 6px",borderRadius:16,border:"3px solid "+NB.ink,background:showTpl?NB.blueSoft:NB.card,color:NB.ink,fontWeight:700,cursor:"pointer",fontSize:12,boxShadow:NB.shadowSm}}>
          {IC.plan(NB.ink,13)} Templates
        </div>}
      </div>
      {!isToday&&<div style={{fontSize:10,color:NB.muted,textAlign:"center",marginBottom:14,fontFamily:"'Sora',sans-serif"}}>Read-only · past day</div>}

      {!plan.heat&&<div style={{background:NB.blueSoft,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:"12px 15px",marginBottom:14,fontSize:12.5,color:NB.ink,fontFamily:"'Sora',sans-serif",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:NB.shadowSm}}>
        <span><b style={{fontFamily:NB.font}}>{habits.length}/{PLANS.free.maxH} habits</b> — free, forever</span>
        <span onClick={()=>showUp("Grow more areas of your life at once — unlimited habits and deep analytics on Pro.")} style={{color:NB.ink,cursor:"pointer",fontWeight:700,fontFamily:NB.font,fontSize:12,border:"2px solid "+NB.ink,borderRadius:NB.rPill,padding:"4px 12px",background:NB.brand,flexShrink:0}}>Grow more →</span>

  // Goals page
  function GoalsPage(){
    const[goalSortMode,setGoalSortMode]=useState("priority");
    // AI Goal Architect — extracted from the old AI Coach panel's Planner tab, rewritten
    // simpler: no local credit-tracking (ai.js already does an atomic server-side check;
    // this just calls it and handles a 402 gracefully, same pattern as Plan Tomorrow's
    // AI-assist). No local usage history either — that lived in the History tab, which
    // isn't coming back with this cut. Habit-suggestion checkboxes from the old version
    // are also dropped for this pass — goal + actions only, a real scope reduction, not
    // an oversight.
    const[showAIArchitect,setShowAIArchitect]=useState(false);
    const[archInput,setArchInput]=useState("");
    const[archDifficulty,setArchDifficulty]=useState("medium");
    const[archDays,setArchDays]=useState(60);
    const[archLoading,setArchLoading]=useState(false);
    const[archResult,setArchResult]=useState(null);

    function flattenArchPlan(data){
      if(data.phases&&data.phases.length>0){
        let id=1;const actions=[];
        data.phases.forEach(ph=>(ph.tasks||[]).forEach(task=>{actions.push({id:id++,action:task.action,done:false,dueDate:task.dueDate||"",result:task.successCriteria||""});}));
        return actions;
      }
      return (data.actions||[]).map((a,i)=>({id:i+1,action:a.action,done:false,dueDate:a.dueDate||"",result:a.result||""}));
    }

    async function generateAIGoalPlan(){
      if(!archInput.trim())return;
      if(pk==="free"){showUp("Unlock AI Goal Architect on Pro — break any goal into a real plan.");return;}
      setArchLoading(true);setArchResult(null);
      try{
        const deadline=new Date();deadline.setDate(deadline.getDate()+archDays);
        const deadlineStr=deadline.toISOString().split("T")[0];
        const idToken=await user.getIdToken();
        const resp=await fetch("/api/ai",{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},
          body:JSON.stringify({
            creditCost:4,
            usageType:"planner",
            model:MODEL,
            max_tokens:4000,
            system:"You are an expert execution-focused goal coach. Create a "+archDays+"-day "+archDifficulty+"-difficulty plan. Return ONLY valid JSON, no markdown backticks. Format: "+PLAN_FORMAT_EXAMPLE+". Rules: exactly 4 phases covering the full "+archDays+"-day timeframe with non-overlapping 'dayRange' values (e.g. 'Days 1-7'); each phase has 2-4 SMALL SPECIFIC tasks (not vague milestones) with realistic 'time' estimates and measurable 'successCriteria', dueDate within that phase's range; 8-16 tasks total across all phases; 'todayTask' = the first task of Phase 1; 'riskFactors' = 2-3 specific reasons THIS goal commonly fails; 'recoveryPlan' = 2-3 concrete steps if the user falls 3+ days behind; 'successProbability' = realistic 0-100 based on difficulty and timeframe.",
            messages:[{role:"user",content:"Create a "+archDays+"-day "+archDifficulty+" difficulty plan for: "+archInput+"\n\nToday: "+today+"\nDeadline: "+deadlineStr}]
          })
        });
        if(resp.status===402){showToast("Out of AI credits this month.");setArchLoading(false);return;}
        if(!resp.ok){const errBody=await resp.text();throw new Error("HTTP "+resp.status+": "+errBody.slice(0,150));}
        const data=await resp.json();
        if(data.error)throw new Error(String(data.error.message||JSON.stringify(data.error)).slice(0,150));
        if(!data.content||!data.content[0]||typeof data.content[0].text!=="string")throw new Error("Unexpected response shape");
        if(data.stop_reason==="max_tokens")throw new Error("Plan was too long to finish — try a shorter duration.");
        const raw=data.content[0].text.replace(/```json|```/g,"").trim();
        const parsed=JSON.parse(raw);
        setArchResult(parsed);
        try{window.trackEvent&&window.trackEvent("ai_used",{feature:"goal_architect"});}catch(e){}
      }catch(e){
        console.error("Goal Architect error:",e);
        showToast("❌ "+String(e.message||e).slice(0,100));
      }
      setArchLoading(false);
    }

    }

  // Analytics page — Update 18: 4 tabs
  // ══════════════════════════════════════════════════════════════════
  // ANALYTICS — Batch 5. One screen, Week/Month/Year toggle, not four
  // separate tabs. Replaces the old Reviews/Habits/Goals/Cards tab set.
  // Deliberately does NOT read the old Momentum Score history — every
  // number here is recomputed live from real habit/goal-action data
  // (same "never trust a stored field" principle as streaks and the
  // obstacle engine), not the blended, cut Momentum Score pipeline.
  // "Cards" (streak share cards) isn't rebuilt here — Achievements is
  // its natural home; flagged in the batch summary, not silently lost.
  // ══════════════════════════════════════════════════════════════════
  function AnalyticsPage(){
    const isPro=pk!=="free";
    const range=["week","month","year"].includes(analyticsTab)?analyticsTab:"week";
    function setRange(id){
      if(id!=="week"&&!isPro){showUp("Unlock Month + Year analytics, per-habit breakdown and pattern history on Pro.");return;}
      setAnalyticsTab(id);
    }

    const heatCount=range==="year"?60:(range==="month"?30:14);
    const heatDates=lastNDates(heatCount).slice().reverse();
    const showUpsInRange=heatDates.filter(d=>isShowUpDay(habits,goals,d)).length;

    const trendDates=range==="month"?lastNDates(30).slice().reverse():lastNDates(7).slice().reverse();
    const monthlyBars=range==="year"?monthlyAvgCompletion(habits,goals,12):null;

    const goalBars=goals.filter(g=>!g.movedToHistory).map(g=>{
      const acts=g.actions||[];
      const done=acts.filter(a=>a.done).length;
      return{id:g.id,title:g.title,pct:acts.length>0?Math.round(done/acts.length*100):0};
    });

    const habitBreakdown=isPro?habits.map(h=>{
      const dates=lastNDates(30).filter(d=>habitStartDate(h)<=d);
      const doneCount=dates.filter(d=>isFullDoneOn(h,d,h.log&&h.log[d])).length;
      return{id:h.id,name:h.name,icon:h.icon||"",pct:dates.length>0?Math.round(doneCount/dates.length*100):0};

              const locked=isProTheme&&!plan.proThemes;
              const lockLabel="PRO";
              const isPending=panelPendingTheme===k;
              return(
                <button key={k} onClick={()=>locked?showUp("This theme is a Pro feature! ⚡"):setPanelPendingTheme(k)}

                  <div style={{width:22,height:22,borderRadius:"50%",background:"linear-gradient(135deg,"+th.accent+","+th.accent2+")",flexShrink:0,boxShadow:"0 0 8px "+th.accent+"88"}}/>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13,color:t.text}}>{th.name}</div>
                    <div style={{fontSize:10,color:t.muted}}>{th.desc}{isProTheme?" · Pro only":""}</div>
                  </div>
                  {locked&&<span style={{fontSize:9,fontWeight:700,color:t.accent,background:t.accent+"22",padding:"2px 6px",borderRadius:8}}>{lockLabel}</span>}
                  {!locked&&isPending&&<span style={{color:th.accent,fontSize:16}}>✓</span>}
                </button>
              );

          <button onClick={()=>{chTheme(panelPendingTheme);setShowPanelTheme(false);}}
            style={{width:"100%",padding:"13px",borderRadius:12,border:"none",background:"linear-gradient(135deg,"+(TH[panelPendingTheme]?.accent||t.accent)+","+(TH[panelPendingTheme]?.accent2||t.accent2)+")",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer",boxShadow:"0 4px 20px "+(TH[panelPendingTheme]?.accent||t.accent)+"66"}}>

        </div>

      {/* ── PANEL: Refer & Earn Bottom Sheet ── */}

        <div style={{background:t.card,borderRadius:"22px 22px 0 0",padding:"22px 20px 44px",width:"100%",maxWidth:480,animation:"slideUp 0.25s ease",maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
          <div style={{width:36,height:4,borderRadius:2,background:t.border,margin:"0 auto 16px"}}/>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
            <div style={{fontSize:16,fontWeight:800,color:t.text}}>Refer & Earn</div>
          </div>

      {/* ── PANEL: Data & Export Bottom Sheet ── */}
      {showPanelExport&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:9300,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={()=>setShowPanelExport(false)}>

          <div style={{width:36,height:4,borderRadius:2,background:t.border,margin:"0 auto 16px"}}/>
          <div style={{fontSize:16,fontWeight:800,color:t.text,marginBottom:4}}>Data & Export</div>
          <div style={{fontSize:11,color:t.muted,marginBottom:16}}>Download your Habtix data</div>
          {plan.csv
            ?<ExportPanel t={t} habits={habits||[]} goals={goals||[]} journals={journals||{}} goalStats={goalStats||[]} displayName={displayName||user?.displayName||"User"} canPDF={plan.pdf} user={user} isPlus={pk==="pro"}/>
            :<div style={{textAlign:"center",padding:"20px 0"}}>
              <div style={{marginBottom:12}}>{IC.package(t.muted,40)}</div>
              <div style={{fontSize:14,fontWeight:700,color:t.text,marginBottom:8}}>Export your data</div>
              <div style={{fontSize:12,color:t.muted,marginBottom:16,lineHeight:1.6}}>CSV export is a Pro feature — unlocks your full habit history, goals, and journal as downloadable files. The AI Coach PDF Report needs Plus.</div>
              <button onClick={()=>{setShowPanelExport(false);showUp("CSV export is a Pro feature! Upgrade to export your data.");}}
                style={{padding:"11px 24px",borderRadius:12,border:"none",background:t.accent,color:"#000",fontWeight:800,fontSize:13,cursor:"pointer"}}>
                {IC.bolt("#000",13)} Upgrade to Pro →
              </button>
            </div>
          }
          <button onClick={()=>setShowPanelExport(false)}
            style={{width:"100%",padding:"12px",borderRadius:12,border:"1px solid "+t.border,background:"none",color:t.muted,fontWeight:600,fontSize:13,cursor:"pointer",marginTop:14}}>
            Close
          </button>
        </div>
      </div>}

      {/* ── UI-H1/H5: BOTTOM NAV — clean 4 tabs only (N3: SVG icons) ── */}
      {offlineBanner&&(
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:9100,background:isOffline?"#92400e":"#14532d",color:isOffline?"#fef3c7":"#dcfce7",padding:"9px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:11,fontWeight:600,gap:8}}>
          <span style={{display:"flex",alignItems:"center",gap:5}}>
            {isOffline
              ?<>{IC.warning("#fef3c7",11)} Offline — changes saved locally</>
              :<>{IC.check("#dcfce7",11)} Back online — syncing…</>
            }
          </span>
          {isOffline&&<button onClick={()=>setOfflineBanner(false)} style={{background:"none",border:"none",color:"#fef3c7",cursor:"pointer",fontSize:16,padding:"0",lineHeight:1}}>×</button>}
        </div>

      {updateAvailable&&!offlineBanner&&(
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:9100,background:t.accent,color:"#000",padding:"9px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:11,fontWeight:700,gap:8}}>
          <span style={{display:"flex",alignItems:"center",gap:5}}>{IC.bolt("#000",11)} A new version is ready.</span>
          <button onClick={()=>window.location.reload()} style={{background:"#000",border:"none",color:t.accent,cursor:"pointer",fontSize:11,fontWeight:700,padding:"4px 12px",borderRadius:20}}>Refresh</button>
        </div>
      )}
      {!showOnboarding&&<div className="bn" style={{position:"fixed",bottom:0,left:0,right:0,background:t.card,borderTop:"1px solid "+t.border,zIndex:500}}>
        <div style={{display:"flex",justifyContent:"space-around",padding:"5px 4px 7px"}}>
          {NAV.map(item=>{
            const active=page===item.id;
            const col=active?t.accent:navMuted;
            return(
            <button key={item.id} onClick={()=>navOrMenu(item.id)}
              style={{background:"none",border:"none",cursor:"pointer",padding:"3px 6px",
                display:"flex",flexDirection:"column",alignItems:"center",gap:2,flex:1}}>
              <span style={{color:col,display:"flex",alignItems:"center"}}>{IC[item.icon]?.(col,22)}</span>
              <span style={{fontSize:9,fontWeight:active?800:400,color:col,letterSpacing:0.2}}>{item.label}</span>
              {active&&<div style={{width:18,height:3,borderRadius:2,background:t.accent,marginTop:1}}/>}
            </button>
            );
          })}
        </div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<script>
(function(){
  function runApp(){
    try{
      var src=document.getElementById('app-src').textContent;
      var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;
      var s=document.createElement('script');
      s.textContent=out;
      document.body.appendChild(s);
    }catch(e){
      console.error('App transform/execute failed:',e);
      var st=document.getElementById('splash-status');
      if(st)st.textContent='Error loading app — check console';
    }
  }
  function waitBabel(tries){
    if(typeof Babel!=='undefined'&&typeof Babel.transform==='function'){
      runApp();
    } else if(tries>0){
      setTimeout(function(){waitBabel(tries-1);},200);
    } else {
      console.error('Babel failed to load after timeout');
    }
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){waitBabel(75);});
  } else {
    waitBabel(75);
  }
})();
</script>
<script>
// ── PWA Install prompt handler ──────────────────────────────────────────────
let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  // Exposed globally
  window._pwaInstallPrompt = e;
});
window.addEventListener('appinstalled', () => {
  _deferredInstallPrompt = null;
  window._pwaInstallPrompt = null;
  console.log('✅ Habtix PWA installed');
});

if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    navigator.serviceWorker.register('/sw.js')
      .then(r=>{
        console.log('⚡ SW ready:',r.scope);
        // Force check for SW update immediately
        r.update();
        r.addEventListener('updatefound',()=>{
          const nw=r.installing;
          nw.addEventListener('statechange',()=>{
            if(nw.state==='installed'&&navigator.serviceWorker.controller){
              nw.postMessage({type:'SKIP_WAITING'});
            }
          });
        });
        let refreshing=false;
        navigator.serviceWorker.addEventListener('controllerchange',()=>{
          // Bug fix: this used to force window.location.reload() the instant a new SW took
          // control, with zero regard for whether the user had something in flight (adding a
          // friend, creating a challenge, generating a Habtix ID — all involve a Firestore
          // round-trip during which an update could land and yank the page out from under the
          // result). Now it just notifies the app; the app decides when it's safe to reload.
          if(!refreshing){refreshing=true;window.dispatchEvent(new CustomEvent('momentum:update-available'));}
        });
        navigator.serviceWorker.ready.then(reg=>{
          if(reg.active){
            const rem=localStorage.getItem('hg_reminders');
            const notifOn=localStorage.getItem('hg_notif');
            if(rem)reg.active.postMessage({type:'SYNC_STORAGE',key:'hg_reminders',value:rem});
            if(notifOn)reg.active.postMessage({type:'SYNC_STORAGE',key:'hg_notif',value:notifOn});
            reg.active.postMessage({type:'UPDATE_REMINDERS'});
          }
        });
      })
      .catch(e=>console.error('SW error:',e));
  });
}
</script>
