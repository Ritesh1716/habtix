  function ObstacleFocusCard({obState,onOpen,damagePop}){
    if(obState.mode==="inertia"){
      const villainColor=VILLAINS.inertia.color;
      const badgeTint=lightTint(villainColor);
      const checklistDoneCount=obState.items.filter(i=>i.done).length;
      const otherCount=obState.checkInStats?Math.min(obState.checkInStats.otherCount,3):0;
      const showUpCount=obState.checkInStats?obState.checkInStats.showUpCount:0;
      // Combined progress across everything that counts toward mastery — the 4
      // checklist items, the 3 non-life-action requirement, and the 7-day show-up
      // requirement, all as one pool (14 total) so every single qualifying action
      // visibly moves the fill, not just the 4 checkpoint moments. Same drain
      // direction as every other obstacle: full color at zero progress, draining
      // toward white as more gets done.
      const earnedPoints=checklistDoneCount+otherCount+showUpCount;
      const fillPercent=Math.max(0,100-(earnedPoints/14*100));
      const avatarCovered=fillPercent>=65;
      return(
      <div style={{position:"relative",border:"3px solid "+NB.ink,borderRadius:NB.rCard,marginBottom:14,boxShadow:NB.shadow,overflow:"hidden",background:"#fff"}}>
        <div style={{position:"absolute",inset:0,width:fillPercent+"%",background:villainColor,transition:"width 0.4s ease"}}/>
        <div style={{position:"relative",padding:18,color:NB.ink}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <div style={{fontSize:11,letterSpacing:1,textTransform:"uppercase",fontWeight:700,opacity:0.85,fontFamily:"'Sora',sans-serif"}}>Standing In Your Way</div>
              <div style={{fontFamily:NB.font,fontWeight:800,fontSize:23,margin:"5px 0 2px"}}>Inertia</div>
            </div>
            <div style={{width:60,height:60,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <VillainAvatar id="inertia" size={60} style={avatarCovered?{filter:"brightness(0.15) saturate(0.4)"}:undefined}/>
            </div>
          </div>
          <div style={{fontSize:13,lineHeight:1.5,background:badgeTint,borderRadius:14,padding:"9px 12px",marginBottom:12}}>
            {obState.checkInStarted
              ?"You've started — now prove it. Show up most days and take real action to master this for good."
              :"Everyone starts here. Weaken it by actually trying the app."}
          </div>
          {[
            {id:"onboarding",label:obState.items[0].icon+" "+obState.items[0].label,done:obState.items[0].done},
            {id:"firstHabit",label:obState.items[1].icon+" "+obState.items[1].label,done:obState.items[1].done},
            {id:"firstGoal",label:obState.items[2].icon+" "+obState.items[2].label,done:obState.items[2].done},
            {id:"plannedTomorrow",label:obState.items[3].icon+" "+obState.items[3].label,done:obState.items[3].done},
          ].map(item=>(
            <div key={item.id} style={{display:"flex",alignItems:"center",gap:9,padding:"6px 0"}}>
              <div style={{width:20,height:20,borderRadius:6,border:"2px solid "+NB.ink,background:item.done?NB.ink:"rgba(255,255,255,0.7)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {item.done&&<span style={{color:"#fff",fontSize:11,fontWeight:900}}>✓</span>}
              </div>
              <span style={{fontSize:12.5,fontWeight:600,textDecoration:item.done?"line-through":"none",opacity:item.done?0.6:1,fontFamily:"'Sora',sans-serif"}}>{item.label}</span>
            </div>
          ))}
          <div style={{display:"flex",alignItems:"center",gap:9,padding:"6px 0"}}>
            <div style={{width:20,height:20,borderRadius:6,border:"2px solid "+NB.ink,background:otherCount>=3?NB.ink:"rgba(255,255,255,0.7)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {otherCount>=3&&<span style={{color:"#fff",fontSize:11,fontWeight:900}}>✓</span>}
            </div>
            <span style={{fontSize:12.5,fontWeight:600,textDecoration:otherCount>=3?"line-through":"none",opacity:otherCount>=3?0.6:1,fontFamily:"'Sora',sans-serif",flex:1}}>✅ Complete 3 actions (other than life-actions)</span>
            <span style={{fontSize:10.5,fontWeight:700,padding:"3px 8px",borderRadius:NB.rPill,background:badgeTint,flexShrink:0}}>{otherCount}/3</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:9,padding:"6px 0"}}>
            <div style={{width:20,height:20,borderRadius:6,border:"2px solid "+NB.ink,background:showUpCount>=5?NB.ink:"rgba(255,255,255,0.7)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {showUpCount>=5&&<span style={{color:"#fff",fontSize:11,fontWeight:900}}>✓</span>}
            </div>
            <span style={{fontSize:12.5,fontWeight:600,textDecoration:showUpCount>=5?"line-through":"none",opacity:showUpCount>=5?0.6:1,fontFamily:"'Sora',sans-serif",flex:1}}>🔥 Show up and complete at least 1 life-action, on 5 of your first 7 days</span>
            <span style={{fontSize:10.5,fontWeight:700,padding:"3px 8px",borderRadius:NB.rPill,background:badgeTint,flexShrink:0}}>{showUpCount}/7</span>
          </div>
        </div>
      </div>);
    }
    if(obState.mode==="building"){
      return(
      <div style={{background:NB.blueSoft,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:18,marginBottom:14,boxShadow:NB.shadow}}>
        <div style={{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:NB.ink,fontWeight:700,opacity:0.75,fontFamily:"'Sora',sans-serif"}}>Finding what's holding you back</div>
        <div style={{fontFamily:NB.font,fontWeight:800,fontSize:19,color:NB.ink,margin:"6px 0 4px"}}>Not enough to name yet</div>
        <div style={{fontSize:12.5,color:NB.ink,opacity:0.75,fontFamily:"'Sora',sans-serif"}}>Keep logging habits and actions — {obState.daysNeeded>0?obState.daysNeeded+" more day"+(obState.daysNeeded>1?"s":""):"almost there"} until Habtix can tell you what's really in your way.</div>
      </div>);
    }
    const o=obState.obstacle;
    const isActive=obState.mode==="active";
    const isWarning=!!obState.warning;
    const villainColor=(VILLAINS[o.id]&&VILLAINS[o.id].color)||NB.ink;
    const badgeTint=lightTint(villainColor);
    // Display-only override: NEVER touches obState.signal (that value drives active-
    // vs-climbing mode selection in currentObstacleState and must stay untouched —
    // forcing it to 100 there would make every freshly-unlocked obstacle immediately
    // classify as active, breaking already-verified Batch 6 behavior). This is purely
    // "what fraction of the card shows colored," computed fresh, right here.
    const isUnlockDay=obState.mastery&&obState.mastery.unlockedAt===today;
    const displaySignal=isUnlockDay?100:obState.signal;
    // Avatar sits at the card's right edge; the fill grows from the left. Since the
    // avatar's exact pixel position varies with label length and screen width, an
    // approximate threshold is used rather than real DOM measurement — the avatar
    // typically sits past the layout's midpoint, so ~65% is a reasonable stand-in for
    // "the fill has reached where the avatar is." Worth a visual confirmation once
    // live; either side of the exact crossing pixel is defensible per spec.
    const avatarCovered=displaySignal>=65;
    const stateColor=isActive?NB.coral:(isWarning?NB.brand:(obState.maintaining?NB.green:NB.blue));
    // Climbing-mode message logic — three real states, not one generic line covering
    // all of them: unlock day, "already clean the very first day evaluated" (credit,
    // not silence), "still elevated" (honest percentage + what to do), then the
    // existing established-climb copy. daysSinceClimbStart / shortfall check below
    // covers the 14-days-on-still-short case specifically, once, the day it's true.
    let daysSinceClimbStart=null,isShortfallDay=false;
    if(!isActive&&!isWarning&&!obState.maintaining&&obState.mastery){
      const startedAt=climbStartedAt(obState.mastery.cleanDays);
      if(startedAt){
        daysSinceClimbStart=Math.floor((new Date(today)-new Date(startedAt))/86400000)+1;
        isShortfallDay=daysSinceClimbStart===OBSTACLE_MASTERY_WINDOW_DAYS&&cleanDayCount(obState.mastery.cleanDays)<OBSTACLE_MASTERY_HOLD_DAYS;
      }
    }
    // Confirmed bug, found by tracing (then verified by simulation): if the real
    // signal was ALSO already clean on the unlock day itself — hidden behind the
    // unlock-day override, which only affects DISPLAY, not the real cleanDays
    // recording — climbStartedAt anchors to the unlock day, not the day after. That
    // makes justCrossed read false on day 2, silently skipping the "already below
    // 15%, great work" acknowledgment for exactly the scenario it exists to cover.
    // This catches that case directly: day 2 specifically, genuinely clean right now,
    // regardless of what climbStartedAt independently says.
    const daysSinceUnlock=obState.mastery&&obState.mastery.unlockedAt?Math.floor((new Date(today)-new Date(obState.mastery.unlockedAt))/86400000):null;
    const isDayAfterUnlockAndClean=daysSinceUnlock===1&&obState.signal<=OBSTACLE_MASTERY_MAX;
    const showAlreadyCleanMessage=isDayAfterUnlockAndClean||obState.justCrossed;
    return(
    <div onClick={onOpen} style={{position:"relative",border:"3px solid "+NB.ink,borderRadius:NB.rCard,marginBottom:14,boxShadow:NB.shadow,cursor:"pointer",overflow:"hidden",background:"#fff"}}>
      {/* Jelly-fill — side-to-side, anchored left, width IS the strength indicator.
          No separate bar anywhere else on this card. */}
      <div style={{position:"absolute",inset:0,width:displaySignal+"%",background:villainColor,transition:"width 0.4s ease"}}/>
      <div style={{position:"relative",padding:18,color:isActive?"#fff":NB.ink}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:8}}>
              <span style={{width:11,height:11,borderRadius:"50%",background:stateColor,border:"2px solid "+NB.ink,flexShrink:0}}/>
              <span style={{fontFamily:NB.font,fontWeight:800,fontSize:23}}>{o.name}</span>
            </div>
          </div>
          <div style={{width:60,height:60,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2,position:"relative"}}>
            {/* Avatar art is already drawn in its own villain color by default — no
                filter needed for the "uncovered, villain-colored" state at all. Only
                "covered by the fill, should read as black" needs one, and it's a soft
                darken rather than brightness(0): a full crush-to-black would also
                crush the white eye-areas to the same black as the body, making eyes
                disappear on characters where they're part of what's recognizable
                (Distraction's scattered eyes, Erratic Rhythm's mismatched sizes). */}
            <VillainAvatar id={o.id} size={60} style={avatarCovered?{filter:"brightness(0.15) saturate(0.4)"}:undefined}/>
            {damagePop&&damagePop.obstacleId===o.id&&
              <span key={damagePop.ts} style={{position:"absolute",top:-14,left:"50%",transform:"translateX(-50%)",fontFamily:NB.font,fontWeight:800,fontSize:15,color:isActive?"#fff":NB.coral,textShadow:"0 1px 3px rgba(0,0,0,0.35)",animation:"dmgPop 1.1s ease-out forwards",pointerEvents:"none",whiteSpace:"nowrap"}}>
                −{damagePop.amount}
              </span>
            }
          </div>
        </div>
        <div style={{fontSize:13,lineHeight:1.5,background:isActive?"rgba(0,0,0,0.18)":badgeTint,borderRadius:14,padding:"9px 12px",marginTop:4}}>
          {isActive
            ?"Every action today weakens it — tap to see what's working."
            :(isWarning
              ?o.name+" is creeping back — act now to keep it mastered."
              :(obState.maintaining
                ?"Mastered "+timeAgoShort(obState.mastery.masteredAt)+" — still holding steady."
                :(isUnlockDay
                  ?"Just unlocked — "+o.name+" starts at full strength. Every action from here weakens it."
                  :(isShortfallDay
                    ?"A few days this window pushed mastery back — recover in the days ahead and it's still there to earn."
                    :(showAlreadyCleanMessage
                      ?"Already below 15% — great work. The real test starts now: hold it there most days for two weeks to master it."
                      :(obState.signal>OBSTACLE_MASTERY_MAX
                        ?"Strength "+obState.signal+"% right now — bring it below 15% to start weakening it."
                        :(obState.daysToMastery>0?obState.daysToMastery+" more clean day"+(obState.daysToMastery>1?"s":"")+" until it's mastered.":"Almost mastered — keep going.")))))))
          }
        </div>
        <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
          <div style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,background:isActive?"rgba(255,255,255,0.35)":badgeTint,color:isActive?"#fff":NB.ink}}>Strength: {displaySignal}%</div>
          {obState.daysToMastery!==undefined&&
            <div style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,background:badgeTint,color:NB.ink}}>{OBSTACLE_MASTERY_HOLD_DAYS-obState.daysToMastery} of {OBSTACLE_MASTERY_WINDOW_DAYS} days</div>
          }
        </div>
      </div>
    </div>);  }

  function timeAgoShort(dateStr){
    if(!dateStr)return"";
    const days=Math.floor((Date.now()-new Date(dateStr))/86400000);
    if(days<=0)return"today";
    if(days===1)return"1 day ago";
    if(days<30)return days+" days ago";
    return Math.floor(days/30)+" mo ago";
  }
  // Active-mode signal (35-100, since that's the active threshold) bucketed into
  // calm, non-alarming language — matches Mo's tone, not meant to read as a warning.
  function strengthLabel(signal){
    if(signal>=75)return"Strong";
    if(signal>=55)return"Moderate";
    return"Mild";
  }

  // ══════════════════════════════════════════════════════════════════
  // OBSTACLE DETAIL — tap-in from the Focus card. Shows the two minion
  // sub-bars (real per-minion signal, not flavor text), the "shows up
  // as" flavor pills (pure narrative, zero tracked state), actions that
  // help, and the all-patterns badge row (replaces the old city/map).
  // ══════════════════════════════════════════════════════════════════
  function ObstacleDetailPage(){
    const obState=React.useMemo(()=>currentObstacleState(habits,goals,pk),[habits,goals,pk]);
    // Session-local browsing only — resets naturally to null every time this page
    // mounts fresh (leaving via Today and coming back), since useState's initial
    // value applies on every genuine remount. Never touches what Today's card shows.
    const[browsedId,setBrowsedId]=useState(null);
    const[showMasteryPopup,setShowMasteryPopup]=useState(false);

    const displayState=browsedId
      ?(browsedId==="inertia"?{mode:"inertia",...inertiaChecklist(habits,goals)}:computeSpecificObstacleState(browsedId,habits,goals))
      :obState;

    function BackRow({title}){
      return(
      <div style={{display:"flex",alignItems:"center",gap:9,padding:"8px 0 16px"}}>
        <div onClick={()=>navigateTo("dashboard")} style={{width:38,height:38,border:"3px solid "+NB.ink,borderRadius:12,background:NB.card,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:NB.shadowSm,cursor:"pointer"}}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={NB.ink} strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div style={{fontFamily:NB.font,fontWeight:700,fontSize:16,color:NB.ink}}>{title}</div>
      </div>);
    }

    // Corner lock badges for the grid — plain grey for "not yet earned," filled gold
    // for "Pro" specifically, so the two blocked states read as visually distinct at
    // a glance, not just via the text underneath them.
    function LockBadge({pro}){
      return pro
        ?<svg width="15" height="15" viewBox="0 0 24 24" fill={NB.brand} stroke={NB.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        :<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={NB.muted} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>;
    }

    // The interactive grid — shared by every branch below (building/inertia/normal),
    // since it needs to render regardless of what's currently displayed above it.
    // No blur on locked boxes: name and avatar show clearly for every obstacle,
    // locked or not — only a small corner badge marks what's blocked and why.
    const gridList=[{id:"inertia",name:"Inertia",tier:"free"},...OBSTACLES];
    function ObstacleGrid(){
      return(
      <React.Fragment>
        <div style={{fontFamily:NB.font,fontWeight:700,fontSize:14,color:NB.ink,margin:"14px 0 9px"}}>Every Obstacle</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:9}}>
          {gridList.map(def=>{
            const tierBlocked=def.tier==="pro"&&pk!=="pro";
            const chainUnlocked=isObstacleUnlocked(def.id);
            const visible=!tierBlocked&&chainUnlocked;
            const showProLabel=tierBlocked;// always Pro-badge when tier-blocked, regardless of chain status underneath
            const rec=_obstacleStore.mastery[def.id]||{};
            const isMastered=def.id==="inertia"?!!rec.allDoneAt:(!!rec.masteredAt&&!rec.revived);
            const isCurrentlyBrowsed=(displayState.obstacle&&displayState.obstacle.id===def.id)||(displayState.mode==="inertia"&&def.id==="inertia");
            function handleTap(){
              if(visible){setBrowsedId(def.id);}
              else if(showProLabel){showUp("Unlock "+def.name+" and every obstacle after it with Pro.");}
              // Chain-locked (not yet earned) — no action. Nothing to prompt about;
              // it isn't a paywall, it just hasn't been reached yet.
            }
            return(
            <div key={def.id} onClick={handleTap} style={{borderRadius:16,border:"2.5px solid "+(isCurrentlyBrowsed?NB.coral:NB.ink),background:isMastered?NB.greenSoft:NB.card,padding:"9px 6px",textAlign:"center",cursor:(visible||showProLabel)?"pointer":"default",position:"relative"}}>
              {!visible&&<div style={{position:"absolute",top:5,right:5}}><LockBadge pro={showProLabel}/></div>}
              <div style={{display:"flex",justifyContent:"center",marginBottom:4}}><VillainAvatar id={def.id} size={34}/></div>
              <div style={{fontSize:9.5,fontWeight:700,color:NB.muted,textTransform:"uppercase",fontFamily:"'Sora',sans-serif"}}>{def.name}{isMastered?" ✓":""}</div>
            </div>);
          })}
        </div>
      </React.Fragment>
      );
    }

    if(displayState.mode==="building"){
      return(
      <div style={{padding:16,fontFamily:NB.font,minHeight:"100vh",background:NB.bg,paddingBottom:100}}>
        <BackRow title="Your Obstacles"/>
        <div style={{textAlign:"center",padding:"40px 20px",color:NB.muted,fontSize:14,fontFamily:"'Sora',sans-serif"}}>Still learning what's holding you back — check back in a few days.</div>
        <ObstacleGrid/>
      </div>);
    }

    if(displayState.mode==="inertia"){
      const villainColor=VILLAINS.inertia.color;
      const badgeTint=lightTint(villainColor);
      const checklistDoneCount=displayState.items.filter(i=>i.done).length;
      const otherCount=displayState.checkInStats?Math.min(displayState.checkInStats.otherCount,3):0;
      const showUpCount=displayState.checkInStats?displayState.checkInStats.showUpCount:0;
      return(
      <div style={{padding:16,fontFamily:NB.font,minHeight:"100vh",background:NB.bg,paddingBottom:100}}>
        <BackRow title="Your Obstacles"/>
        <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:10,marginBottom:-14,position:"relative",zIndex:1,paddingRight:8}}>
          <span onClick={()=>setShowMasteryPopup(true)} title="How mastery works" style={{width:26,height:26,borderRadius:"50%",border:"2px solid "+NB.ink,background:NB.card,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,cursor:"pointer",boxShadow:NB.shadowSm}}>?</span>
          <VillainAvatar id="inertia" size={72}/>
        </div>
        <div style={{borderRadius:NB.rCard,background:villainColor,border:"3px solid "+NB.ink,padding:"18px 16px 14px",marginBottom:16,boxShadow:NB.shadow}}>
          <div style={{fontFamily:NB.font,fontWeight:800,fontSize:20,color:"#14120F",textAlign:"center",marginBottom:10}}>Inertia</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center"}}>
            <div style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,background:"rgba(255,255,255,0.6)",color:"#14120F"}}>{checklistDoneCount} of 4 started</div>
            {displayState.checkInStarted&&<React.Fragment>
              <div style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,background:"rgba(255,255,255,0.6)",color:"#14120F"}}>{showUpCount} of 7 days</div>
              <div style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,background:"rgba(255,255,255,0.6)",color:"#14120F"}}>{otherCount} of 3 actions</div>
            </React.Fragment>}
          </div>
        </div>
        <div style={{fontFamily:NB.font,fontWeight:700,fontSize:14,color:NB.ink,margin:"2px 0 9px"}}>What's tracked</div>
        {displayState.items.map(item=>(
          <div key={item.id} style={{display:"flex",alignItems:"center",gap:9,background:NB.card,border:"3px solid "+NB.ink,borderLeft:"7px solid "+villainColor,borderRadius:16,padding:"11px 13px",marginBottom:9,boxShadow:NB.shadowSm}}>
            <div style={{width:20,height:20,borderRadius:6,border:"2px solid "+NB.ink,background:item.done?NB.ink:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {item.done&&<span style={{color:"#fff",fontSize:11,fontWeight:900}}>✓</span>}
            </div>
            <span style={{fontSize:12.5,color:NB.ink,fontWeight:600,textDecoration:item.done?"line-through":"none",opacity:item.done?0.6:1,fontFamily:"'Sora',sans-serif"}}>{item.icon} {item.label}</span>
          </div>
        ))}
        {/* Same two extra rows as Today's card — shown here too so the full mechanic
            is explained wherever Inertia appears, not just on the smaller card. */}
        <div style={{display:"flex",alignItems:"center",gap:9,background:NB.card,border:"3px solid "+NB.ink,borderLeft:"7px solid "+villainColor,borderRadius:16,padding:"11px 13px",marginBottom:9,boxShadow:NB.shadowSm}}>
          <div style={{width:20,height:20,borderRadius:6,border:"2px solid "+NB.ink,background:otherCount>=3?NB.ink:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            {otherCount>=3&&<span style={{color:"#fff",fontSize:11,fontWeight:900}}>✓</span>}
          </div>
          <span style={{fontSize:12.5,color:NB.ink,fontWeight:600,textDecoration:otherCount>=3?"line-through":"none",opacity:otherCount>=3?0.6:1,fontFamily:"'Sora',sans-serif",flex:1}}>✅ Complete 3 actions (other than life-actions)</span>
          <span style={{fontSize:10.5,fontWeight:700,padding:"3px 8px",borderRadius:NB.rPill,background:badgeTint,flexShrink:0}}>{otherCount}/3</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:9,background:NB.card,border:"3px solid "+NB.ink,borderLeft:"7px solid "+villainColor,borderRadius:16,padding:"11px 13px",marginBottom:9,boxShadow:NB.shadowSm}}>
          <div style={{width:20,height:20,borderRadius:6,border:"2px solid "+NB.ink,background:showUpCount>=5?NB.ink:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            {showUpCount>=5&&<span style={{color:"#fff",fontSize:11,fontWeight:900}}>✓</span>}
          </div>
          <span style={{fontSize:12.5,color:NB.ink,fontWeight:600,textDecoration:showUpCount>=5?"line-through":"none",opacity:showUpCount>=5?0.6:1,fontFamily:"'Sora',sans-serif",flex:1}}>🔥 Show up, 1 life-action, on 5 of your first 7 days</span>
          <span style={{fontSize:10.5,fontWeight:700,padding:"3px 8px",borderRadius:NB.rPill,background:badgeTint,flexShrink:0}}>{showUpCount}/7</span>
        </div>
        <ObstacleGrid/>

        {showMasteryPopup&&
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:1200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,fontFamily:"'Sora',sans-serif"}}
            onClick={e=>{if(e.target===e.currentTarget)setShowMasteryPopup(false);}}>
            <div style={{background:NB.bg,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:20,width:"100%",maxWidth:400,boxShadow:NB.shadow}}>
              <div style={{fontFamily:NB.font,fontWeight:800,fontSize:16,color:NB.ink,marginBottom:12}}>How mastering Inertia works</div>
              <div style={{fontSize:12.5,color:NB.ink,opacity:0.85,lineHeight:1.55,marginBottom:12}}>
                Everyone starts here. The 4 items above get you going — once all 4 are done, a real 7-day check-in window begins.
              </div>
              <div style={{fontSize:12.5,color:NB.ink,opacity:0.85,lineHeight:1.55,marginBottom:12}}>
                During that week: show up and complete at least one life-action on 5 of the 7 days, and complete 3 actions that aren't life-actions — goal-linked or standalone, either counts. Both are needed to master it.
              </div>
              <div style={{fontSize:12.5,color:NB.ink,opacity:0.85,lineHeight:1.55,marginBottom:16}}>

            </div>
          </div>

          villain-color swap logic from Batch 2 doesn't apply here at all). */}
      <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:10,marginBottom:-14,position:"relative",zIndex:1,paddingRight:8}}>
        <span onClick={()=>setShowMasteryPopup(true)} title="How mastery works" style={{width:26,height:26,borderRadius:"50%",border:"2px solid "+NB.ink,background:NB.card,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,cursor:"pointer",boxShadow:NB.shadowSm}}>?</span>
        <VillainAvatar id={o.id} size={72}/>
      </div>

      <div style={{borderRadius:NB.rCard,background:villainColor,border:"3px solid "+NB.ink,padding:"18px 16px 14px",marginBottom:16,boxShadow:NB.shadow}}>
        <div style={{fontFamily:NB.font,fontWeight:800,fontSize:20,color:"#14120F",textAlign:"center",marginBottom:10}}>{o.name}</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center"}}>
          <div style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,background:"rgba(255,255,255,0.6)",color:"#14120F"}}>Strength: {displayState.signal}%</div>
          {displayState.daysToMastery!==undefined&&
            <div style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,background:"rgba(255,255,255,0.6)",color:"#14120F"}}>{OBSTACLE_MASTERY_HOLD_DAYS-displayState.daysToMastery} of {OBSTACLE_MASTERY_WINDOW_DAYS} days</div>
          }
        </div>
      </div>

      <div style={{fontFamily:NB.font,fontWeight:700,fontSize:14,color:NB.ink,margin:"2px 0 9px"}}>What feeds it</div>
      {o.minions.map(m=>{
        const val=displayState.minions?(displayState.minions[m.id]||0):0;
        return(
        <div key={m.id} style={{background:NB.card,border:"3px solid "+NB.ink,borderLeft:"7px solid "+villainColor,borderRadius:16,padding:"11px 13px",marginBottom:9,boxShadow:NB.shadowSm}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <div style={{fontSize:12.5,fontWeight:700,color:NB.ink,fontFamily:"'Sora',sans-serif"}}>{m.name}</div>
            <div style={{fontSize:11,fontWeight:700,color:NB.muted,fontFamily:"'Sora',sans-serif"}}>{val}%</div>
          </div>
          <div style={{height:8,border:"2px solid "+NB.ink,borderRadius:NB.rPill,background:NB.bg,overflow:"hidden"}}>
            <div style={{height:"100%",width:val+"%",background:val>=50?NB.coral:NB.brand}}/>
          </div>
        </div>);
      })}

      {flavor.length>0&&<React.Fragment>
        <div style={{fontFamily:NB.font,fontWeight:700,fontSize:14,color:NB.ink,margin:"14px 0 9px"}}>Sounds like</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:16}}>
          {flavor.map((f,i)=>(<div key={i} style={{fontSize:12,fontWeight:600,border:"2.5px solid "+NB.ink,borderRadius:NB.rPill,padding:"6px 13px",background:NB.card,boxShadow:NB.shadowSm,fontFamily:"'Sora',sans-serif"}}>"{f}"</div>))}
        </div>
      </React.Fragment>}

      <ObstacleGrid/>

      {showMasteryPopup&&
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:1200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,fontFamily:"'Sora',sans-serif"}}
          onClick={e=>{if(e.target===e.currentTarget)setShowMasteryPopup(false);}}>
          <div style={{background:NB.bg,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:20,width:"100%",maxWidth:400,boxShadow:NB.shadow}}>
            <div style={{fontFamily:NB.font,fontWeight:800,fontSize:16,color:NB.ink,marginBottom:12}}>How mastery works</div>
            <div style={{fontSize:12.5,color:NB.ink,opacity:0.85,lineHeight:1.55,marginBottom:12}}>
              Every action weakens {o.name} right now. Bring it below 15% and the real test begins — hold it there on at least {OBSTACLE_MASTERY_HOLD_DAYS} of the next {OBSTACLE_MASTERY_WINDOW_DAYS} days to master it for good.
            </div>
            <div style={{fontSize:12.5,color:NB.ink,opacity:0.85,lineHeight:1.55,marginBottom:12}}>
              A bad day doesn't reset anything — it just doesn't count, and it ages out of the window on its own as time passes. If more than {OBSTACLE_MASTERY_WINDOW_DAYS-OBSTACLE_MASTERY_HOLD_DAYS} days in the trailing {OBSTACLE_MASTERY_WINDOW_DAYS} fall short, mastery is delayed — never failed. It's still there to earn as soon as those days roll out of the window.
            </div>
            <div style={{fontSize:12.5,color:NB.ink,opacity:0.85,lineHeight:1.55,marginBottom:16}}>
              Once mastered, it can only come back if it climbs past {OBSTACLE_REVIVAL_THRESHOLD}% again — that's the bar you've earned by getting here.
            </div>
            <div onClick={()=>setShowMasteryPopup(false)} style={{width:"100%",padding:"11px",borderRadius:NB.rBtn,border:"3px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:14,textAlign:"center",fontFamily:NB.font}}>Got it</div>
          </div>
        </div>
      }
    </div>
    );}

  // ══════════════════════════════════════════════════════════════════
  // PLAN TOMORROW — Batch 3. Manual list on Free; AI-assist toggle is
  // Pro-only and calls the same /api/ai proxy used elsewhere, with its
  // own lightweight usageType ("tomorrow_plan") and a 1-credit cost —
  // deliberately separate from the existing multi-day AI Goal Architect
  // ("planner" usageType), which is a bigger, more expensive feature
  // this doesn't touch. AI only reorders what the user already picked;
  // it never invents new items.
  // ══════════════════════════════════════════════════════════════════
  // Shared between PlanTomorrowPage and EditTodayModal — shows an occupied box's
  // full text (grid cells themselves stay a fixed size with truncated text, since
  // letting long action names stretch the grid was the actual problem being
  // solved here). Uses its own independent popstate listener, scoped to just this
  // component's lifecycle, rather than adding a new case to the app's main
  // history handler — that handler is already complex enough that new cases risk
  // breaking existing modals' back-behavior, and a purely local listener achieves
  // the same "hardware back closes this" result without touching it at all.
  function TimeBoxDetailPopup({occ,timeLabel,isStarred,onToggleStar,onClose}){
    useEffect(()=>{
      window.history.pushState({timeBoxDetail:true},"","/");
      function handlePop(){onClose();}
      window.addEventListener("popstate",handlePop);
      return()=>window.removeEventListener("popstate",handlePop);
    },[]);
    return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:1400,display:"flex",alignItems:"center",justifyContent:"center",padding:16,fontFamily:"'Sora',sans-serif"}}
      onClick={e=>{if(e.target===e.currentTarget)window.history.back();}}>
      <div style={{background:NB.bg,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:18,width:"100%",maxWidth:380,boxShadow:NB.shadow,position:"relative"}}>
        <span onClick={onToggleStar} style={{position:"absolute",top:12,left:12,fontSize:18,cursor:"pointer",opacity:isStarred?1:0.35}}>⭐</span>
        <div style={{flexShrink:0,border:"2px solid "+NB.ink,borderRadius:10,background:NB.blueSoft,padding:"5px 10px",position:"absolute",top:12,right:12}}>
          <div style={{fontSize:10,fontWeight:700,color:NB.ink,whiteSpace:"nowrap"}}>{timeLabel}</div>
        </div>
        <div style={{fontSize:14.5,fontWeight:600,color:NB.ink,lineHeight:1.5,margin:"32px 0 18px",wordBreak:"break-word"}}>{occ.label}</div>
        <div onClick={()=>window.history.back()} style={{width:"100%",padding:"11px",borderRadius:NB.rBtn,border:"3px solid "+NB.ink,background:NB.card,color:NB.ink,fontWeight:700,cursor:"pointer",fontSize:13,textAlign:"center",fontFamily:NB.font}}>Back</div>
      </div>
    </div>
    );
  }

  function EditTodayModal({onClose}){
    // Draft snapshot, taken once on mount — every edit inside this modal mutates
    // ONLY these local copies. Nothing touches the real habits/goals/standaloneActions/
    // gridSlots/dayNotes until "Update Today" is explicitly pressed. Cancel or back
    // navigation just closes without ever having written anything.
    const[draftHabits,setDraftHabits]=useState(()=>habits);
    const[draftGoals,setDraftGoals]=useState(()=>goals);
    const[draftStandalone,setDraftStandalone]=useState(()=>standaloneActions);
    const[draftGridSlots,setDraftGridSlots]=useState(()=>gridSlots);
    const[draftNote,setDraftNote]=useState(()=>(dayNotes&&dayNotes[today])||"");
    const[selectedMinutes,setSelectedMinutes]=useState([]);
    const[updating,setUpdating]=useState(false);
    const[detailPopup,setDetailPopup]=useState(null);// {occ,start} — which occupied box's full-text detail is showing

    function timeLabelFn(startMin){
      const h24=Math.floor(startMin/60),m=startMin%60;
      const period=h24<12?"am":"pm";
      const display=h24===0?12:(h24>12?h24-12:h24);
      return display+(m===0?":00":":"+(m<10?"0"+m:m))+period;
    }

    const hourAssignments={};
    draftHabits.forEach(h=>{(h.minuteSlots||[]).forEach(m=>{hourAssignments[m]={kind:"habit",id:h.id,label:h.name};});});
    draftGoals.forEach(g=>{(g.actions||[]).forEach(a=>{(a.minuteSlots||[]).forEach(m=>{hourAssignments[m]={kind:"action",id:a.id,label:a.action,gid:g.id};});});});
    draftStandalone.forEach(a=>{(a.minuteSlots||[]).forEach(m=>{hourAssignments[m]={kind:"standalone",id:a.id,label:a.name};});});
    const isOccupied=start=>!!hourAssignments[start];

    // Same shape as PlanTomorrowPage's updateItemMinuteSlots, but writes to the
    // draft setters instead of the real ones — nothing here calls save() or
    // touches Firestore at all until Update Today commits everything at once.
    function updateItemMinuteSlots(occ,updater){
      if(occ.kind==="habit"){
        setDraftHabits(prev=>prev.map(hh=>hh.id===occ.id?{...hh,minuteSlots:updater(hh.minuteSlots||[])}:hh));
      }else if(occ.kind==="action"){
        setDraftGoals(prev=>prev.map(gl=>gl.id!==occ.gid?gl:{...gl,actions:(gl.actions||[]).map(a=>a.id===occ.id?{...a,minuteSlots:updater(a.minuteSlots||[])}:a)}));
      }else{
        setDraftStandalone(prev=>prev.map(a=>a.id===occ.id?{...a,minuteSlots:updater(a.minuteSlots||[])}:a));
      }
    }
    function assignMinutes(candidate){
      if(selectedMinutes.length===0)return;
      const mins=[...selectedMinutes];
      updateItemMinuteSlots(candidate,()=>mins);
      setSelectedMinutes([]);
    }
    function unassignMinute(m){
      const occ=hourAssignments[m];
      if(!occ)return;
      updateItemMinuteSlots(occ,slots=>slots.filter(x=>x!==m));
      const slot=draftGridSlots.find(s=>s.start===m);
      if(slot&&slot.starred){
        setDraftGridSlots(prev=>prev.map(s=>s.start===m?{...s,starred:false}:s));
      }
    }
    function toggleStar(start){
      const slot=draftGridSlots.find(s=>s.start===start);
      if(!slot)return;
      const currentlyStarred=!!slot.starred;
      const starredCount=draftGridSlots.filter(s=>s.starred).length;
      if(!currentlyStarred&&starredCount>=3){
        showToast("Only 3 priorities at a time — unstar one first.");
        return;
      }
      setDraftGridSlots(prev=>prev.map(s=>s.start===start?{...s,starred:!currentlyStarred}:s));
    }
    function toggleMinuteSelect(m){
      if(hourAssignments[m])return;
      setSelectedMinutes(prev=>prev.includes(m)?prev.filter(x=>x!==m):[...prev,m]);
    }
    function doSplit(start){
      const idx=draftGridSlots.findIndex(s=>s.start===start);
      if(idx===-1)return;
      const slot=draftGridSlots[idx];
      if(slot.duration!==60&&slot.duration!==30)return;
      const halfDur=slot.duration/2;
      setDraftGridSlots([...draftGridSlots.slice(0,idx),{start:slot.start,duration:halfDur},{start:slot.start+halfDur,duration:halfDur},...draftGridSlots.slice(idx+1)]);
      setSelectedMinutes([]);
    }
    function doMerge(start){
      const idx=draftGridSlots.findIndex(s=>s.start===start);
      if(idx===-1)return;
      const slot=draftGridSlots[idx];
      const slotHour=Math.floor(slot.start/60);
      let newSlots=null;
      if(idx+1<draftGridSlots.length&&!isOccupied(draftGridSlots[idx+1].start)&&Math.floor(draftGridSlots[idx+1].start/60)===slotHour){
        const right=draftGridSlots[idx+1];
        newSlots=[...draftGridSlots.slice(0,idx),{start:slot.start,duration:slot.duration+right.duration},...draftGridSlots.slice(idx+2)];
      }else if(idx-1>=0&&!isOccupied(draftGridSlots[idx-1].start)&&Math.floor(draftGridSlots[idx-1].start/60)===slotHour){
        const left=draftGridSlots[idx-1];
        newSlots=[...draftGridSlots.slice(0,idx-1),{start:left.start,duration:left.duration+slot.duration},...draftGridSlots.slice(idx+1)];
      }
      if(!newSlots)return;
      setDraftGridSlots(newSlots);
      setSelectedMinutes([]);
    }

    const singleSelectedSlot=selectedMinutes.length===1?draftGridSlots.find(s=>s.start===selectedMinutes[0]):null;
    const canSplit=singleSelectedSlot&&(singleSelectedSlot.duration===60||singleSelectedSlot.duration===30);
    const canMerge=singleSelectedSlot&&singleSelectedSlot.duration<60&&(()=>{
      const idx=draftGridSlots.findIndex(s=>s.start===singleSelectedSlot.start);
      const slotHour=Math.floor(singleSelectedSlot.start/60);
      const rightOk=idx+1<draftGridSlots.length&&!isOccupied(draftGridSlots[idx+1].start)&&Math.floor(draftGridSlots[idx+1].start/60)===slotHour;
      const leftOk=idx-1>=0&&!isOccupied(draftGridSlots[idx-1].start)&&Math.floor(draftGridSlots[idx-1].start/60)===slotHour;
      return rightOk||leftOk;
    })();

    const weekCapDate=endOfCurrentWeekOrTomorrow();
    const actionCandidates=[
      ...draftHabits.filter(h=>!(h.minuteSlots&&h.minuteSlots.length)).map(h=>({kind:"habit",id:h.id,label:h.name})),
      ...draftGoals.flatMap(g=>(g.actions||[]).filter(a=>!a.done&&!(a.minuteSlots&&a.minuteSlots.length)&&(!a.dueDate||a.dueDate<=weekCapDate)).map(a=>({kind:"action",id:a.id,label:a.action,gid:g.id}))),
      ...draftStandalone.filter(a=>!a.done&&!(a.minuteSlots&&a.minuteSlots.length)).map(a=>({kind:"standalone",id:a.id,label:a.name}))
    ];

    // Commits the whole draft at once — habits, goals, standalone actions, grid
    // structure, and the note, all in one pass. This is the ONLY place in this
    // modal that ever calls save()/Firestore.
    async function handleUpdate(){
      setUpdating(true);
      setHabits(draftHabits);
      setGoals(draftGoals);
      setStandaloneActions(draftStandalone);
      await save(draftHabits,draftGoals,journals,tk,undefined,draftStandalone);
      await saveGridSlots(draftGridSlots);
      if(draftNote!==((dayNotes&&dayNotes[today])||"")){
        await saveDayNote(today,draftNote);
      }
      setUpdating(false);
      showToast("Today updated! ✅");
      onClose();
    }

    return(
    <div style={{position:"fixed",inset:0,background:NB.bg,zIndex:1300,overflowY:"auto",fontFamily:NB.font}}>
      <div style={{padding:16,paddingBottom:100}}>
        <div style={{display:"flex",alignItems:"center",gap:9,padding:"8px 0 16px"}}>
          <div onClick={onClose} style={{width:38,height:38,border:"3px solid "+NB.ink,borderRadius:12,background:NB.card,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:NB.shadowSm,cursor:"pointer"}}>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={NB.ink} strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </div>
          <div style={{fontWeight:700,fontSize:16,color:NB.ink}}>Edit Today</div>
        </div>

        <div style={{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:NB.muted,fontWeight:700,marginBottom:9,fontFamily:"'Sora',sans-serif"}}>{fmt(today)}</div>
        <div style={{fontSize:11,color:NB.muted,marginBottom:14,fontFamily:"'Sora',sans-serif"}}>Changes here only apply once you tap Update Today below.</div>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"2px 0 3px"}}>
          <div style={{fontFamily:NB.font,fontWeight:700,fontSize:13,color:NB.ink}}>Time-box your day</div>
          <div style={{display:"flex",gap:6}}>
            {canSplit&&<div onClick={()=>doSplit(singleSelectedSlot.start)} style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,border:"2px solid "+NB.ink,background:NB.card,color:NB.ink,cursor:"pointer",fontFamily:NB.font}}>Split</div>}
            {canMerge&&<div onClick={()=>doMerge(singleSelectedSlot.start)} style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,border:"2px solid "+NB.ink,background:NB.card,color:NB.ink,cursor:"pointer",fontFamily:NB.font}}>Merge</div>}
          </div>
        </div>
        <div style={{fontSize:10.5,color:NB.muted,marginBottom:9,fontFamily:"'Sora',sans-serif"}}>Select an empty box to split or merge it.</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:0,border:"3px solid "+NB.ink,borderRadius:14,overflow:"hidden",marginBottom:12}}>
          {draftGridSlots.map((slot,i)=>{
            const start=slot.start;
            const occ=hourAssignments[start];
            const isSelected=selectedMinutes.includes(start);
            const prevSlot=draftGridSlots[i-1];
            const sameRow=prevSlot&&Math.floor(i/6)===Math.floor((i-1)/6);
            const chronoPrevSame=occ&&prevSlot&&hourAssignments[prevSlot.start]&&hourAssignments[prevSlot.start].id===occ.id&&hourAssignments[prevSlot.start].kind===occ.kind;
            const borderJoinsPrev=sameRow&&chronoPrevSame;
            const cellHeight=slot.duration>=60?48:(slot.duration>=30?40:34);
            return(
            <div key={start} onClick={()=>occ?setDetailPopup({occ,start}):toggleMinuteSelect(start)} style={{
              borderLeft:borderJoinsPrev?"none":undefined,
              position:"relative",height:cellHeight,overflow:"hidden",
              borderRight:i%6!==5?"1.5px solid "+NB.ink:"none",borderBottom:"1.5px solid "+NB.ink,
              background:occ?lightTint(NB.blue,0.75):(isSelected?NB.brand:NB.card),
              cursor:"pointer",
              display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"2px 14px"
            }}>
              {occ
                ?<React.Fragment>
                  <span style={{display:"block",width:"100%",fontSize:7.5,fontWeight:700,color:NB.ink,textAlign:"center",lineHeight:1.1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{occ.label}</span>
                  <span style={{fontSize:6,fontWeight:600,color:NB.muted}}>{timeLabelFn(start)}</span>
                  <span onClick={e=>{e.stopPropagation();toggleStar(start);}} style={{position:"absolute",top:1,left:1,fontSize:9,cursor:"pointer",lineHeight:1,padding:2,opacity:slot.starred?1:0.35}}>⭐</span>
                  <span onClick={e=>{e.stopPropagation();unassignMinute(start);}} style={{position:"absolute",top:1,right:1,fontSize:9,color:NB.coral,fontWeight:900,cursor:"pointer",lineHeight:1,padding:2}}>×</span>
                </React.Fragment>
                :<span style={{fontSize:7,fontWeight:600,color:isSelected?NB.brandInk:NB.muted}}>{timeLabelFn(start)}</span>
              }
            </div>);
          })}
        </div>
        {detailPopup&&<TimeBoxDetailPopup occ={detailPopup.occ} timeLabel={timeLabelFn(detailPopup.start)} isStarred={!!(draftGridSlots.find(s=>s.start===detailPopup.start)||{}).starred} onToggleStar={()=>toggleStar(detailPopup.start)} onClose={()=>setDetailPopup(null)}/>}

        <div style={{fontSize:11.5,fontWeight:700,color:NB.ink,marginBottom:8,fontFamily:"'Sora',sans-serif",minHeight:16}}>
          {selectedMinutes.length>0
            ?selectedMinutes.length+" box"+(selectedMinutes.length>1?"es":"")+" selected — tap something below to place it there."
            :"Tap boxes above, then tap an action below to place it."}
        </div>

        <div style={{fontWeight:700,fontSize:13,color:NB.ink,margin:"2px 0 9px",fontFamily:NB.font}}>Add from actions list</div>
        {actionCandidates.length===0
          ?<div style={{fontSize:12,color:NB.muted,padding:"12px",border:"2px dashed "+NB.ink,borderRadius:14,marginBottom:16,textAlign:"center",fontFamily:"'Sora',sans-serif"}}>Everything's either time-boxed or done — nice.</div>
          :<div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:20}}>
            {actionCandidates.slice(0,20).map(c=>(
              <div key={c.kind+"-"+c.id} onClick={()=>assignMinutes(c)} style={{fontSize:12,fontWeight:600,border:"2.5px solid "+NB.ink,borderRadius:NB.rPill,padding:"6px 13px",background:selectedMinutes.length>0?NB.card:NB.bg,opacity:selectedMinutes.length>0?1:0.5,boxShadow:NB.shadowSm,cursor:selectedMinutes.length>0?"pointer":"default",fontFamily:"'Sora',sans-serif"}}>{c.label}</div>
            ))}
          </div>
        }

        <div onClick={()=>{setCreateContext("today");setShowCreateChoice(true);}} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:NB.brand,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:"12px 16px",marginBottom:16,boxShadow:NB.shadowSm,cursor:"pointer"}}>
          <span style={{fontSize:15,fontWeight:800,color:NB.brandInk,lineHeight:1}}>+</span>
          <span style={{fontFamily:NB.font,fontWeight:700,fontSize:13,color:NB.brandInk}}>Add something new</span>
        </div>

        <div style={{fontFamily:NB.font,fontWeight:700,fontSize:13,color:NB.ink,margin:"2px 0 9px"}}>Note for today</div>
        <textarea value={draftNote} onChange={e=>setDraftNote(e.target.value)} placeholder="Anything to remember or set your intention on..." maxLength={500} style={{width:"100%",height:70,padding:"10px 12px",border:"3px solid "+NB.ink,borderRadius:16,fontSize:13,resize:"none",marginBottom:14,fontFamily:"'Sora',sans-serif",boxShadow:NB.shadowSm,boxSizing:"border-box"}}/>

        <div style={{display:"flex",gap:9}}>
          <div onClick={onClose} style={{flex:1,fontFamily:NB.font,fontWeight:700,fontSize:14,textAlign:"center",border:"3px solid "+NB.ink,borderRadius:NB.rBtn,background:NB.card,color:NB.ink,padding:14,cursor:"pointer"}}>Cancel</div>
          <div onClick={updating?undefined:handleUpdate} style={{flex:2,fontFamily:NB.font,fontWeight:700,fontSize:15,textAlign:"center",border:"3px solid "+NB.ink,borderRadius:NB.rBtn,background:NB.brand,color:NB.brandInk,padding:14,boxShadow:NB.shadow,cursor:updating?"default":"pointer",opacity:updating?0.6:1}}>{updating?"Updating...":"Update Today"}</div>
        </div>
      </div>
    </div>
    );}

  function PlanTomorrowPage(){
    const tmr=tomorrowStr();
    const[noteText,setNoteText]=useState(()=>(dayNotes&&dayNotes[tmr])||"");
    const[justSaved,setJustSaved]=useState(false);
    const[saveError,setSaveError]=useState(false);
    // Multi-select for the hour grid — tapping an empty box toggles it in here;
    // tapping a candidate below then assigns it to every box currently selected.
    const[selectedMinutes,setSelectedMinutes]=useState([]);
    const[detailPopup,setDetailPopup]=useState(null);// {occ,start} — which occupied box's full-text detail is showing

    // H-ROLLOVER: full draft isolation, mirroring EditTodayModal's own draft-then-commit
    // pattern exactly. Nothing in this whole page touches live habits/goals/
    // standaloneActions/gridSlots or calls save()/saveGridSlots() anymore — every edit
    // here mutates ONLY these local drafts. If a real saved draft already exists for
    // tomorrow's date (resuming an edit), it's used as the starting point; otherwise the
    // draft is seeded from today's live schedule — the literal "carry forward the same
    // box structure" default. Nothing commits to the real schedule until "Save tomorrow's
    // plan" is pressed, and even then it writes to the separate tomorrowDraft field, not
    // the live one — the actual rollover only happens at the next real day boundary,
    // in loadData.
    const resumingDraft=tomorrowDraft&&tomorrowDraft.date===tmr?tomorrowDraft:null;
    const[draftGridSlots,setDraftGridSlots]=useState(()=>resumingDraft?resumingDraft.gridSlots.map(s=>({...s})):gridSlots.map(s=>({...s})));
    const[draftAssignments,setDraftAssignments]=useState(()=>{
      if(resumingDraft)return{...resumingDraft.slotAssignments};
      const seed={};
      habits.forEach(h=>{if(h.minuteSlots&&h.minuteSlots.length)seed["h:"+h.id]=[...h.minuteSlots];});
      goals.forEach(g=>(g.actions||[]).forEach(a=>{if(a.minuteSlots&&a.minuteSlots.length)seed["a:"+a.id]=[...a.minuteSlots];}));
      standaloneActions.forEach(a=>{if(a.minuteSlots&&a.minuteSlots.length)seed["s:"+a.id]=[...a.minuteSlots];});
      return seed;
    });
    function timeLabel(startMin){
      const h24=Math.floor(startMin/60),m=startMin%60;
      const period=h24<12?"am":"pm";
      const display=h24===0?12:(h24>12?h24-12:h24);
      return display+(m===0?":00":":"+(m<10?"0"+m:m))+period;
    }

    // ══════════════════════════════════════════════════════════════════
    // H1/H4 — items reference their assigned slot(s) by minute-from-midnight start.
    // Split/Merge replaced the earlier 5-second-hold design with explicit buttons —
    // simpler and more predictable, and it resolves what was previously a genuine
    // ambiguity (a 30-min box could reasonably mean either "split further" or
    // "merge back" on a single hold) by making both always separately available
    // and visible rather than guessed at from one gesture.
    // Reads draftAssignments (not live minuteSlots) — labels are still looked up from
    // the live habits/goals/standaloneActions arrays by id, since names/text don't
    // change, only the slot assignment does.
    // ══════════════════════════════════════════════════════════════════
    const hourAssignments={};
    Object.keys(draftAssignments).forEach(key=>{
      const sep=key.indexOf(":");
      const kindShort=key.slice(0,sep),id=Number(key.slice(sep+1));
      const kind=kindShort==="h"?"habit":kindShort==="a"?"action":"standalone";
      let label="",gid;
      if(kind==="habit"){const h=habits.find(x=>x.id===id);label=h?h.name:"";}
      else if(kind==="action"){for(const g of goals){const a=(g.actions||[]).find(x=>x.id===id);if(a){label=a.action;gid=g.id;break;}}}
      else{const a=standaloneActions.find(x=>x.id===id);label=a?a.name:"";}
      (draftAssignments[key]||[]).forEach(m=>{hourAssignments[m]={kind,id,label,gid};});
    });
    const isOccupied=start=>!!hourAssignments[start];

    function updateItemMinuteSlots(occ,updater){
      const key=(occ.kind==="habit"?"h:":occ.kind==="action"?"a:":"s:")+occ.id;
      setDraftAssignments(prev=>{
        const next=updater(prev[key]||[]);
        const copy={...prev};
        if(next&&next.length)copy[key]=next;else delete copy[key];
        return copy;
      });
    }

    function assignMinutes(candidate){
      if(selectedMinutes.length===0)return;
      const mins=[...selectedMinutes];
      updateItemMinuteSlots(candidate,()=>mins);
      setSelectedMinutes([]);
    }
    function unassignMinute(m){
      const occ=hourAssignments[m];
      if(!occ)return;
      updateItemMinuteSlots(occ,slots=>slots.filter(x=>x!==m));
      const slot=draftGridSlots.find(s=>s.start===m);
      if(slot&&slot.starred){
        setDraftGridSlots(prev=>prev.map(s=>s.start===m?{...s,starred:false}:s));
      }
    }
    // H3 (corrected) — a priority star, not a "start"/timer. Lives on the draft grid
    // slot entry itself, not the assigned item. Stays isolated in draftGridSlots like
    // everything else on this page — only reaches the live schedule via the rollover.
    function toggleStar(start){
      const slot=draftGridSlots.find(s=>s.start===start);
      if(!slot)return;
      const currentlyStarred=!!slot.starred;
      const starredCount=draftGridSlots.filter(s=>s.starred).length;
      if(!currentlyStarred&&starredCount>=3){
        showToast("Only 3 priorities at a time — unstar one first.");
        return;
      }
      setDraftGridSlots(prev=>prev.map(s=>s.start===start?{...s,starred:!currentlyStarred}:s));
    }
    function toggleMinuteSelect(m){
      if(hourAssignments[m])return;// occupied boxes never enter selection — nothing to split/merge there, and assignment happens via the actions list below, not by reselecting an occupied box
      setSelectedMinutes(prev=>prev.includes(m)?prev.filter(x=>x!==m):[...prev,m]);
    }

    // Split — always exactly in half, only ever offered for a clean 60 or 30 min
    // box. Never offered for an occupied box (selection itself excludes those), so
    // there's no assigned item to worry about preserving.
    function doSplit(start){
      const idx=draftGridSlots.findIndex(s=>s.start===start);
      if(idx===-1)return;
      const slot=draftGridSlots[idx];
      if(slot.duration!==60&&slot.duration!==30)return;
      const halfDur=slot.duration/2;
      setDraftGridSlots([...draftGridSlots.slice(0,idx),{start:slot.start,duration:halfDur},{start:slot.start+halfDur,duration:halfDur},...draftGridSlots.slice(idx+1)]);
      setSelectedMinutes([]);
    }
    // Merge — combines with an empty adjacent neighbor, right (next) preferred,
    // falling back to left (previous) only if right isn't available. Resulting
    // duration is simply the sum, not constrained to a "clean" 15/30/60 value —
    // deliberately more flexible than the earlier binary-tree design, matching
    // exactly how it was described: two 15s next to a filled box can end up as one
    // 30, and that 30 can go on to merge with a further empty 15 into 45.
    function doMerge(start){
      const idx=draftGridSlots.findIndex(s=>s.start===start);
      if(idx===-1)return;
      const slot=draftGridSlots[idx];
      const slotHour=Math.floor(slot.start/60);
      let newSlots=null;
      // A merge must stay within the hour it originally came from — see the identical
      // comment in EditTodayModal for the bug this guards against.
      if(idx+1<draftGridSlots.length&&!isOccupied(draftGridSlots[idx+1].start)&&Math.floor(draftGridSlots[idx+1].start/60)===slotHour){
        const right=draftGridSlots[idx+1];
        newSlots=[...draftGridSlots.slice(0,idx),{start:slot.start,duration:slot.duration+right.duration},...draftGridSlots.slice(idx+2)];
      }else if(idx-1>=0&&!isOccupied(draftGridSlots[idx-1].start)&&Math.floor(draftGridSlots[idx-1].start/60)===slotHour){
        const left=draftGridSlots[idx-1];
        newSlots=[...draftGridSlots.slice(0,idx-1),{start:left.start,duration:left.duration+slot.duration},...draftGridSlots.slice(idx+1)];
      }
      if(!newSlots)return;// neither neighbor available within the same hour — button shouldn't have been shown, but guard anyway
      setDraftGridSlots(newSlots);
      setSelectedMinutes([]);
    }

    // Split/Merge button eligibility — exactly one box selected, and it's empty
    // (an occupied box never even enters selectedMinutes, per toggleMinuteSelect
    // above, so "selected" already implies "empty" here).
    const singleSelectedSlot=selectedMinutes.length===1?draftGridSlots.find(s=>s.start===selectedMinutes[0]):null;
    const canSplit=singleSelectedSlot&&(singleSelectedSlot.duration===60||singleSelectedSlot.duration===30);
    const canMerge=singleSelectedSlot&&singleSelectedSlot.duration<60&&(()=>{
      const idx=draftGridSlots.findIndex(s=>s.start===singleSelectedSlot.start);
      const slotHour=Math.floor(singleSelectedSlot.start/60);
      const rightOk=idx+1<draftGridSlots.length&&!isOccupied(draftGridSlots[idx+1].start)&&Math.floor(draftGridSlots[idx+1].start/60)===slotHour;
      const leftOk=idx-1>=0&&!isOccupied(draftGridSlots[idx-1].start)&&Math.floor(draftGridSlots[idx-1].start/60)===slotHour;
      return rightOk||leftOk;
    })();

    // The comprehensive list (point 9): every life-action without a slot yet in the
    // DRAFT (not live — an item can sit at a different time tomorrow than it does
    // today), every remaining (not-done) goal-action regardless of date without a
    // draft slot, and every open standalone action without a draft slot. Goal-actions
    // capped to end of current week (or tomorrow, whichever is later).
    const weekCapDate=endOfCurrentWeekOrTomorrow();
    const actionCandidates=[
      ...habits.filter(h=>!(draftAssignments["h:"+h.id]&&draftAssignments["h:"+h.id].length)).map(h=>({kind:"habit",id:h.id,label:h.name})),
      ...goals.flatMap(g=>(g.actions||[]).filter(a=>!a.done&&!(draftAssignments["a:"+a.id]&&draftAssignments["a:"+a.id].length)&&(!a.dueDate||a.dueDate<=weekCapDate)).map(a=>({kind:"action",id:a.id,label:a.action,gid:g.id}))),
      ...standaloneActions.filter(a=>!a.done&&!(draftAssignments["s:"+a.id]&&draftAssignments["s:"+a.id].length)).map(a=>({kind:"standalone",id:a.id,label:a.name}))
    ];

    // Commits the draft — gridSlots + per-item slot assignments — to the isolated
    // tomorrowDraft field only. This does NOT touch live habits/goals/
    // standaloneActions/gridSlots and does NOT affect Today's display in any way —
    // that only happens via the rollover logic at the next real day boundary.
    async function handleSave(){
      const hasContent=noteText.trim()||Object.values(draftAssignments).some(v=>v&&v.length);
      if(!hasContent)return;
      let ok=await saveTomorrowDraft({date:tmr,touched:true,gridSlots:draftGridSlots,slotAssignments:draftAssignments});
      // Legacy summary field — kept for backward compatibility, not read by any
      // live UI anymore now that tomorrowDraft is the real source of truth.
      const items=Object.keys(draftAssignments).filter(k=>draftAssignments[k]&&draftAssignments[k].length).map(k=>{
        const o=hourAssignments[(draftAssignments[k]||[])[0]];
        return o?{kind:o.kind,id:o.id,label:o.label,minuteSlots:draftAssignments[k]}:null;
      }).filter(Boolean);
      if(items.length>0)saveTomorrowPlan({date:tmr,items,source:"manual"}).catch(()=>{});
      if(ok&&noteText.trim()!==((dayNotes&&dayNotes[tmr])||"")){
        ok=await saveDayNote(tmr,noteText);
      }
      if(ok){
        setJustSaved(true);setSaveError(false);
        showToast("Tomorrow's plan saved! 📋");
        setTimeout(()=>setJustSaved(false),2000);
      }else{
        setSaveError(true);
        showToast("Couldn't save — check your connection and try again.");
      }
    }
    const hasAnythingToSave=noteText.trim()||Object.values(draftAssignments).some(v=>v&&v.length);

    return(
    <div style={{padding:16,fontFamily:NB.font,minHeight:"100vh",background:NB.bg,paddingBottom:100}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:9,padding:"8px 0 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div onClick={()=>navigateTo("dashboard")} style={{width:38,height:38,border:"3px solid "+NB.ink,borderRadius:12,background:NB.card,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:NB.shadowSm,cursor:"pointer"}}>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={NB.ink} strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </div>
          <div style={{fontWeight:700,fontSize:16,color:NB.ink}}>Plan Tomorrow</div>
        </div>
        <div onClick={()=>setShowEditToday(true)} style={{fontSize:11,fontWeight:700,padding:"7px 13px",borderRadius:NB.rPill,border:"2.5px solid "+NB.ink,background:NB.card,color:NB.ink,cursor:"pointer",boxShadow:NB.shadowSm,fontFamily:NB.font,whiteSpace:"nowrap"}}>Edit Today</div>
      </div>

      <div style={{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:NB.muted,fontWeight:700,marginBottom:9,fontFamily:"'Sora',sans-serif"}}>{fmt(tmr)}</div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"2px 0 3px"}}>
        <div style={{fontFamily:NB.font,fontWeight:700,fontSize:13,color:NB.ink}}>Time-box your day</div>
        <div style={{display:"flex",gap:6}}>
          {canSplit&&<div onClick={()=>doSplit(singleSelectedSlot.start)} style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,border:"2px solid "+NB.ink,background:NB.card,color:NB.ink,cursor:"pointer",fontFamily:NB.font}}>Split</div>}
          {canMerge&&<div onClick={()=>doMerge(singleSelectedSlot.start)} style={{fontSize:10.5,fontWeight:700,padding:"5px 11px",borderRadius:NB.rPill,border:"2px solid "+NB.ink,background:NB.card,color:NB.ink,cursor:"pointer",fontFamily:NB.font}}>Merge</div>}
        </div>
      </div>
      <div style={{fontSize:10.5,color:NB.muted,marginBottom:9,fontFamily:"'Sora',sans-serif"}}>Select an empty box to split or merge it.</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:0,border:"3px solid "+NB.ink,borderRadius:14,overflow:"hidden",marginBottom:12}}>
        {draftGridSlots.map((slot,i)=>{
          const start=slot.start;
          const occ=hourAssignments[start];
          const isSelected=selectedMinutes.includes(start);
          const prevSlot=draftGridSlots[i-1];
          const sameRow=prevSlot&&Math.floor(i/6)===Math.floor((i-1)/6);
          const chronoPrevSame=occ&&prevSlot&&hourAssignments[prevSlot.start]&&hourAssignments[prevSlot.start].id===occ.id&&hourAssignments[prevSlot.start].kind===occ.kind;
          const borderJoinsPrev=sameRow&&chronoPrevSame;
          const cellHeight=slot.duration>=60?48:(slot.duration>=30?40:34);
          return(
          <div key={start} onClick={()=>occ?setDetailPopup({occ,start}):toggleMinuteSelect(start)} style={{
            borderLeft:borderJoinsPrev?"none":undefined,
            position:"relative",height:cellHeight,overflow:"hidden",
            borderRight:i%6!==5?"1.5px solid "+NB.ink:"none",borderBottom:"1.5px solid "+NB.ink,
            background:occ?lightTint(NB.blue,0.75):(isSelected?NB.brand:NB.card),
            cursor:"pointer",
            display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"2px 14px"
          }}>
            {occ
              ?<React.Fragment>
                <span style={{display:"block",width:"100%",fontSize:7.5,fontWeight:700,color:NB.ink,textAlign:"center",lineHeight:1.1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{occ.label}</span>
                <span style={{fontSize:6,fontWeight:600,color:NB.muted}}>{timeLabel(start)}</span>
                <span onClick={e=>{e.stopPropagation();toggleStar(start);}} style={{position:"absolute",top:1,left:1,fontSize:9,cursor:"pointer",lineHeight:1,padding:2,opacity:slot.starred?1:0.35}}>⭐</span>
                <span onClick={e=>{e.stopPropagation();unassignMinute(start);}} style={{position:"absolute",top:1,right:1,fontSize:9,color:NB.coral,fontWeight:900,cursor:"pointer",lineHeight:1,padding:2}}>×</span>
              </React.Fragment>
              :<span style={{fontSize:7,fontWeight:600,color:isSelected?NB.brandInk:NB.muted}}>{timeLabel(start)}</span>
            }
          </div>);
        })}
      </div>
      {detailPopup&&<TimeBoxDetailPopup occ={detailPopup.occ} timeLabel={timeLabel(detailPopup.start)} isStarred={!!(draftGridSlots.find(s=>s.start===detailPopup.start)||{}).starred} onToggleStar={()=>toggleStar(detailPopup.start)} onClose={()=>setDetailPopup(null)}/>}

      <div style={{fontSize:11.5,fontWeight:700,color:NB.ink,marginBottom:8,fontFamily:"'Sora',sans-serif",minHeight:16}}>
        {selectedMinutes.length>0
          ?selectedMinutes.length+" box"+(selectedMinutes.length>1?"es":"")+" selected — tap something below to place it there."
          :"Tap boxes above, then tap an action below to place it."}
      </div>

      <div style={{fontWeight:700,fontSize:13,color:NB.ink,margin:"2px 0 9px",fontFamily:NB.font}}>Add from actions list</div>
      {actionCandidates.length===0
        ?<div style={{fontSize:12,color:NB.muted,padding:"12px",border:"2px dashed "+NB.ink,borderRadius:14,marginBottom:16,textAlign:"center",fontFamily:"'Sora',sans-serif"}}>Everything's either time-boxed or done — nice.</div>
        :<div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:20}}>
          {actionCandidates.slice(0,20).map(c=>(
            <div key={c.kind+"-"+c.id} onClick={()=>assignMinutes(c)} style={{fontSize:12,fontWeight:600,border:"2.5px solid "+NB.ink,borderRadius:NB.rPill,padding:"6px 13px",background:selectedMinutes.length>0?NB.card:NB.bg,opacity:selectedMinutes.length>0?1:0.5,boxShadow:NB.shadowSm,cursor:selectedMinutes.length>0?"pointer":"default",fontFamily:"'Sora',sans-serif"}}>{c.label}</div>
          ))}
        </div>
      }

      {/* F1: same unified creation entry point as Today — one door, everywhere */}
      <div onClick={()=>{setCreateContext("tomorrow");setShowCreateChoice(true);}} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:NB.brand,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:"12px 16px",marginBottom:16,boxShadow:NB.shadowSm,cursor:"pointer"}}>
        <span style={{fontSize:15,fontWeight:800,color:NB.brandInk,lineHeight:1}}>+</span>
        <span style={{fontFamily:NB.font,fontWeight:700,fontSize:13,color:NB.brandInk}}>Add something new</span>
      </div>

      <div style={{fontFamily:NB.font,fontWeight:700,fontSize:13,color:NB.ink,margin:"2px 0 9px"}}>Note for tomorrow</div>
      <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Anything to remember, plan for, or set your intention on..." maxLength={500} style={{width:"100%",height:70,padding:"10px 12px",border:"3px solid "+NB.ink,borderRadius:16,fontSize:13,resize:"none",marginBottom:14,fontFamily:"'Sora',sans-serif",boxShadow:NB.shadowSm}}/>

      <div onClick={hasAnythingToSave?handleSave:undefined} style={{fontFamily:NB.font,fontWeight:700,fontSize:15,textAlign:"center",border:"3px solid "+NB.ink,borderRadius:NB.rBtn,background:!hasAnythingToSave?NB.muted:(saveError?NB.coral:(justSaved?NB.green:NB.brand)),color:(justSaved||saveError)?"#fff":NB.brandInk,padding:14,boxShadow:NB.shadow,cursor:hasAnythingToSave?"pointer":"default"}}>
        {saveError?"Couldn't save — tap to retry":(justSaved?"Saved ✓":"Save tomorrow's plan")}
      </div>
    </div>
    );}

  // ── UI-PA1–PA6: Profile & Achievements Page ──────────────────────────────────
  function ProfilePage(){
    // PA2: birthday local edit state
    const[editBday,setEditBday]=React.useState(false);

    // PA3: badge tap bottom sheet
    const[badgeSheet,setBadgeSheet]=React.useState(null);// {badge,earnedDate}

    // ── PA4: Stats grid values ──────────────────────────────────────────────
    const bestStreak=habits.length>0?Math.max(...habits.map(h=>h.best||h.streak||0)):0;
    const flNow=(()=>{try{return JSON.parse(localStorage.getItem("hg_pomo_focuslog")||"{}");}catch{return{};}})();
    const scoreData=getScoreWithDelta(habits,goals,journals,flNow,{active:false,wins:0,activeDays:0},goalStats);
    const currentScore=scoreData.score;
    // Lifetime habits done: count all log entries that are fully done across all habits
    const lifetimeHabitsDone=habits.reduce((s,h)=>s+Object.keys(h.log||{}).filter(d=>isFullDoneOn(h,d,h.log[d])).length,0);
    // Goals completed: active fully-done + goalStats snapshots
    const goalsCompleted=(goals.filter(g=>g.actions.length>0&&g.actions.every(a=>a.done)).length)+(goalStats||[]).length;

    // ── PA3: Badge showcase — all 14 badges, earned vs locked ──────────────
    const earnedSet=new Set();

      const start=h.createdAt||Object.keys(h.log||{}).sort()[0]||today;

        window._fb.setDoc(window._fb.doc(window._fb.db,"momentumIdIndex",id),{uid:user.uid},{merge:true}).catch(()=>{});
      }
      return id;
    }
