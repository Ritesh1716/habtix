    function saveBirthday(val){
      setBirthday(val);setEditBday(false);
      if(user?.uid)window._fb.setDoc(window._fb.doc(window._fb.db,"users",user.uid),{birthday:val},{merge:true});
    }

    return(
    <div style={{position:"fixed",inset:0,background:t.bg,zIndex:800,display:"flex",flexDirection:"column",animation:"slideInRight 0.25s ease"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"16px 20px 12px",background:t.card,borderBottom:"1px solid "+t.border,flexShrink:0}}>
        <button onClick={()=>navigateTo("dashboard")} style={{background:"none",border:"none",color:t.muted,fontSize:22,cursor:"pointer",padding:"2px 6px",lineHeight:1}}>‹</button>
        <div style={{fontSize:16,fontWeight:800,color:t.text}}>My Profile</div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"16px 20px 100px"}}>

        {/* ── PA1: Profile card — photo + name + email + birthday ── */}
        <div style={{background:premiumCard(t),border:"1px solid "+t.border,borderRadius:16,padding:"18px 16px",marginBottom:14,boxShadow:premiumShadow(t),textAlign:"center"}}>
          {/* Photo */}
          <div style={{width:72,height:72,borderRadius:"50%",overflow:"hidden",margin:"0 auto 10px",border:"3px solid "+t.accent+"55"}}>
            {user?.photoURL
              ?<img src={user.photoURL} style={{width:"100%",height:"100%",display:"block"}} alt=""/>
              :<div style={{width:"100%",height:"100%",background:t.accent+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,fontWeight:900,color:t.accent}}>
                {(displayName||user?.displayName||"?").charAt(0).toUpperCase()}
              </div>
            }
          </div>
          {/* Name */}
          <div style={{fontSize:18,fontWeight:800,color:t.text,marginBottom:2}}>{displayName||user?.displayName}</div>
          {/* Email */}
          <div style={{fontSize:11,color:t.muted,marginBottom:12}}>{user?.email}</div>
          {/* Birthday — PA2 */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            <span style={{fontSize:11,color:t.muted,display:"inline-flex",alignItems:"center",gap:4}}>{IC.cake(t.muted,11)} Birthday:</span>
            {editBday
              ?<div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <input type="date" value={bdayVal} onChange={e=>setBdayVal(e.target.value)}
                    style={{padding:"5px 8px",borderRadius:8,border:"1px solid "+t.border,background:t.surface,color:t.text,fontSize:11,colorScheme:t.mode||"dark"}}/>
                  <button onClick={()=>saveBirthday(bdayVal)}
                    style={{padding:"5px 10px",borderRadius:8,border:"none",background:t.accent,color:"#000",fontWeight:700,fontSize:11,cursor:"pointer"}}>Save</button>
                  <button onClick={()=>setEditBday(false)}
                    style={{padding:"5px 8px",borderRadius:8,border:"none",background:"none",color:t.muted,fontSize:12,cursor:"pointer"}}>✕</button>
                </div>
              :<div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:11,color:birthday?t.text:t.muted}}>
                    {birthday?new Date(birthday+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"Not set"}
                  </span>
                  <button onClick={()=>{setBdayVal(birthday||"");setEditBday(true);}}
                    style={{padding:"3px 8px",borderRadius:7,border:"1px solid "+t.border,background:"none",color:t.muted,fontSize:10,cursor:"pointer"}}>Edit</button>
                </div>
            }
          </div>
        </div>

        {/* ── PA3: Badge carousel — horizontal scroll, R12 ── */}
        <div style={{background:premiumCard(t),border:"1px solid "+t.border,borderRadius:16,padding:"14px 0 14px 16px",marginBottom:14,boxShadow:premiumShadow(t)}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,paddingRight:16}}>
            <div style={{fontSize:12,fontWeight:700,color:t.text}}>Achievements</div>
            <div style={{fontSize:10,color:t.accent,fontWeight:700}}>{earnedSet.size}/{BADGES.length} earned</div>
          </div>
          {/* Scrollable carousel — earned first, then locked */}
          <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:6,paddingRight:16,scrollbarWidth:"none",WebkitOverflowScrolling:"touch"}}>
            {[...BADGES.filter(b=>earnedSet.has(b.d)),...BADGES.filter(b=>!earnedSet.has(b.d))].map(b=>{
              const earned=earnedSet.has(b.d);
              return(
              <button key={b.d} onClick={()=>earned&&setBadgeSheet({badge:b,earnedDate:earnedDateFor(b)})}
                style={{flexShrink:0,width:68,padding:"10px 6px 8px",borderRadius:14,
                  border:"1px solid "+(earned?b.c+"66":t.border),
                  background:earned?"linear-gradient(135deg,"+b.c+"22,"+b.c+"0a)":t.surface,
                  cursor:earned?"pointer":"default",textAlign:"center",position:"relative",
                  opacity:earned?1:0.4,
                  boxShadow:earned?"0 0 12px "+b.c+"44":"none",
                  transition:"transform 0.15s ease",
                  transform:earned?"scale(1)":"scale(0.92)"}}>
                <div style={{fontSize:26,marginBottom:3,lineHeight:1}}>{b.i}</div>
                <div style={{fontSize:8,fontWeight:700,color:earned?b.c:t.muted,lineHeight:1.2,marginBottom:2}}>{b.l}</div>
                <div style={{fontSize:7,color:t.muted}}>{b.d}-day</div>
                {earned&&<div style={{position:"absolute",top:4,right:4,width:8,height:8,borderRadius:"50%",background:b.c,boxShadow:"0 0 6px "+b.c}}/>}
              </button>
              );
            })}
          </div>
          <div style={{fontSize:10,color:t.muted,marginTop:6,paddingRight:16}}>Tap any earned badge for details</div>
        </div>

        {/* ── PA4: Stats grid 2×3 — N2-A/B: context labels + current streak + today's focus ── */}
        {(()=>{
          // N2-B: current streak = streak of best performing habit right now
          const currentStreak=habits.length>0?Math.max(...habits.map(h=>h.streak||0)):0;
          // N2-D: today's focus from focusLog
          const todayFocusMin=flNow[new Date().toLocaleDateString("en-CA")]?.totalMin||0;
          const statCells=[
            {ic:(c)=>IC.flame(c,16),label:"Best Streak",val:bestStreak>0?bestStreak+"d":"—",ctx:"all time",col:t.accent},
            {ic:(c)=>IC.score(c,16),label:"Momentum Score",val:currentScore,ctx:"/ 1000 today",col:"#a78bfa"},
            {ic:(c)=>IC.flame(c,16),label:"Current Streak",val:currentStreak>0?currentStreak+"d":"—",ctx:"right now",col:t.success},
            {ic:(c)=>IC.target(c,16),label:"Goals Done",val:goalsCompleted,ctx:"total completed",col:t.info},
            {ic:(c)=>IC.habits(c,16),label:"Habits Active",val:habits.length,ctx:"currently tracking",col:t.success},
            {ic:(c)=>IC.pomodoro(c,16),label:"Today's Focus",val:todayFocusMin>0?todayFocusMin+"m":"—",ctx:"focus today",col:t.accent},
          ];
          return(
          <div style={{background:premiumCard(t),border:"1px solid "+t.border,borderRadius:16,padding:"14px 16px",marginBottom:14,boxShadow:premiumShadow(t)}}>
            <div style={{fontSize:12,fontWeight:700,color:t.text,marginBottom:12}}>Habtix Stats</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {statCells.map(({ic,label,val,ctx,col})=>(
                <div key={label} style={{background:t.surface,borderRadius:12,padding:"10px 8px",textAlign:"center",border:"1px solid "+t.border}}>
                  <div style={{display:"flex",justifyContent:"center",marginBottom:3}}>{ic(col)}</div>
                  <div style={{fontSize:19,fontWeight:900,color:col,lineHeight:1}}>{val}</div>
                  <div style={{fontSize:8,color:t.muted,marginTop:1,textTransform:"uppercase",letterSpacing:0.3}}>{label}</div>
                  <div style={{fontSize:8,color:t.muted,opacity:0.7,marginTop:1}}>{ctx}</div>
                </div>
              ))}
            </div>
          </div>
          );
        })()}

        {/* ── PA4b: 30-day dot grid — N2-C: GitHub-style habit completion ── */}
        {habits.length>0&&(()=>{
          const today2=new Date().toLocaleDateString("en-CA");
          const days30=Array.from({length:30},(_,i)=>{
            const d=new Date();d.setDate(d.getDate()-(29-i));
            return d.toLocaleDateString("en-CA");
          });
          const dotsPerRow=10;
          const rows=[];
          for(let r=0;r<3;r++) rows.push(days30.slice(r*dotsPerRow,(r+1)*dotsPerRow));
          return(
          <div style={{background:premiumCard(t),border:"1px solid "+t.border,borderRadius:16,padding:"14px 16px",marginBottom:14,boxShadow:premiumShadow(t)}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:700,color:t.text}}>Last 30 Days</div>
              <div style={{fontSize:10,color:t.muted}}>Daily habit completion</div>
            </div>
            {rows.map((row,ri)=>(
              <div key={ri} style={{display:"flex",gap:5,marginBottom:5}}>
                {row.map(d=>{
                  const doneCnt=habits.filter(h=>{const v=h.log&&h.log[d];return isFullDoneOn(h,d,v);}).length;
                  const total=habits.length;
                  const pct=total>0?doneCnt/total:0;
                  const isToday=d===today2;
                  const isFuture=d>today2;
                  const bg=isFuture?t.border:pct>=0.8?t.success:pct>=0.5?t.accent:pct>0?t.accent+"66":t.surface;
                  const border=isToday?"2px solid "+t.accent:"1px solid "+t.border+"88";
                  return(
                    <div key={d} title={d+(doneCnt>0?" · "+doneCnt+"/"+total+" habits":"")} style={{
                      flex:1,aspectRatio:"1",borderRadius:4,background:bg,border:border,
                      opacity:isFuture?0.2:1,
                      boxShadow:pct>=0.8?"0 0 4px "+t.success+"66":isToday?"0 0 4px "+t.accent+"88":"none",
                      transition:"background 0.2s"
                    }}/>
                  );
                })}
              </div>
            ))}
            {/* Legend */}
            <div style={{display:"flex",alignItems:"center",gap:12,marginTop:8,justifyContent:"flex-end"}}>
              {[["None",t.surface],["50%+",t.accent+"66"],["80%+",t.accent],["100%",t.success]].map(([lbl,col])=>(
                <div key={lbl} style={{display:"flex",alignItems:"center",gap:3}}>
                  <div style={{width:10,height:10,borderRadius:2,background:col,border:"1px solid "+t.border+"55"}}/>
                  <span style={{fontSize:8,color:t.muted}}>{lbl}</span>
                </div>
              ))}
            </div>
          </div>
          );
        })()}

        {/* ── PA5: Habtix ID (display only — internal field/var names unchanged, see A5 notes) ── */}
        <div style={{background:premiumCard(t),border:"1px solid "+t.border,borderRadius:16,padding:"14px 16px",marginBottom:14,boxShadow:premiumShadow(t)}}>
          <div style={{fontSize:12,fontWeight:700,color:t.text,marginBottom:10}}>Habtix ID</div>
          {moId
            ?<>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                <div style={{flex:1,background:t.surface,border:"1px solid "+t.border,borderRadius:10,padding:"9px 12px",fontFamily:"monospace",fontSize:13,fontWeight:700,color:t.accent,letterSpacing:0.5}}>
                  {moId}
                </div>
                <button onClick={()=>{navigator.clipboard&&navigator.clipboard.writeText(moId);showToast("Habtix ID copied!");}}
                  style={{padding:"9px 10px",borderRadius:10,border:"1px solid "+t.border,background:"none",color:t.muted,cursor:"pointer",fontSize:12,fontWeight:700}}>{IC.copy(t.muted,14)}</button>
              </div>
              <div style={{fontSize:10,color:t.muted}}>Share this so friends can add you.</div>
            </>
            :<div style={{textAlign:"center",padding:"8px 0"}}>
              <div style={{fontSize:11,color:t.muted,marginBottom:10}}>Generate your unique Habtix ID to connect with friends.</div>
              <button onClick={generateMomentumId}
                style={{padding:"10px 20px",borderRadius:10,border:"none",background:t.accent,color:"#000",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                Generate My ID →
              </button>
            </div>
          }
        </div>

        {/* ── F1: Friends entry point ── */}
        <button onClick={()=>navigateTo("friends")} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",background:premiumCard(t),border:"1px solid "+t.border,borderRadius:16,padding:"14px 16px",marginBottom:14,boxShadow:premiumShadow(t),cursor:"pointer"}}>
          <span style={{display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:700,color:t.text}}>{IC.person(t.accent,16)} Friends</span>
          <span style={{display:"flex",alignItems:"center",gap:8}}>
            {friendReqCount>0&&<span style={{fontSize:10,fontWeight:800,color:"#000",background:t.accent,borderRadius:10,padding:"2px 7px"}}>{friendReqCount}</span>}
            <span style={{color:t.muted,fontSize:16}}>›</span>
          </span>
        </button>

        {/* ── PA6: Journey started ── */}
        {journeyDays&&(
        <div style={{background:premiumCard(t),border:"1px solid "+t.border,borderRadius:16,padding:"14px 16px",marginBottom:14,boxShadow:premiumShadow(t)}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:13,fontWeight:800,color:t.text}}>Day {journeyDays} of your Habtix journey</div>
              <div style={{fontSize:11,color:t.muted,marginTop:3}}>Joined {joinedLabel}</div>
            </div>
            <div>{IC.rocket(t.accent,28)}</div>
          </div>
        </div>
        )}

      </div>

      {/* ── PA3: Badge bottom sheet ── */}
      {badgeSheet&&<div style={{position:"fixed",inset:0,background:"#000a",zIndex:1200,display:"flex",alignItems:"flex-end"}} onClick={()=>setBadgeSheet(null)}>
        <div style={{width:"100%",background:t.card,borderRadius:"20px 20px 0 0",padding:"20px",boxShadow:"0 -8px 32px #0006"}} onClick={e=>e.stopPropagation()}>
          <div style={{width:40,height:4,borderRadius:2,background:t.border,margin:"0 auto 16px"}}/>
          <div style={{textAlign:"center",marginBottom:14}}>
            <div style={{fontSize:40,marginBottom:6}}>{badgeSheet.badge.i}</div>
            <div style={{fontSize:17,fontWeight:800,color:badgeSheet.badge.c}}>{badgeSheet.badge.l}</div>
            <div style={{fontSize:11,color:t.muted,marginTop:4}}>
              {badgeSheet.badge.d}-day streak · Earned {new Date(badgeSheet.earnedDate+"T12:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}
            </div>
          </div>
          <div style={{background:t.surface,borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:11,color:t.muted,lineHeight:1.6,textAlign:"center"}}>
            {"You completed a "+badgeSheet.badge.d+"-day streak — "+badgeSheet.badge.l+"! Every day you showed up and built something lasting."}
          </div>
          <button onClick={()=>setBadgeSheet(null)}
            style={{width:"100%",padding:"12px",borderRadius:12,border:"none",background:t.surface,color:t.muted,fontWeight:700,fontSize:13,cursor:"pointer"}}>
            Close
          </button>
        </div>
      </div>}

    </div>
    );
  }

  // ── F1/F3–F6: Friends Page (Phase 9, Block 1) ─────────────────────────────
  function FriendsPage(){
    const[tab,setTab]=React.useState("friends");
    const[friendsList,setFriendsList]=React.useState([]);
    const[incoming,setIncoming]=React.useState([]);
    const[outgoing,setOutgoing]=React.useState([]);
    const[loadingF,setLoadingF]=React.useState(true);
    const[busy,setBusy]=React.useState(false);
    const[searchVal,setSearchVal]=React.useState("");
    const[confirmUnfriend,setConfirmUnfriend]=React.useState(null);// double-confirm before removing a friend
    const[viewFriend,setViewFriend]=React.useState(null);// friend profile modal
    const[viewChallenge,setViewChallenge]=React.useState(null);// challenge detail modal
    const[confirmDeleteChallenge,setConfirmDeleteChallenge]=React.useState(null);// double-confirm before deleting a challenge
    // F7–F9: Challenges (Phase 9 Block 2)
    const[myChallenges,setMyChallenges]=React.useState([]);
    const[challengeInvites,setChallengeInvites]=React.useState([]);
    const[loadingC,setLoadingC]=React.useState(true);
    const[showCreateChallenge,setShowCreateChallenge]=React.useState(false);
    const[newTitle,setNewTitle]=React.useState("");
    const[newHabitId,setNewHabitId]=React.useState("");
    const[newDuration,setNewDuration]=React.useState(7);
    const[newFriendUids,setNewFriendUids]=React.useState([]);
    const[newHabitTextC,setNewHabitTextC]=React.useState("");// inline "+ Create new habit" input — Create Challenge form
    const[winnerCard,setWinnerCard]=React.useState(null);// {challenge,winnerName}

    const friendLimit=pk==="pro"?Infinity:1;// R9-E: Free can accept (not send) up to 1 friend, enough to join a challenge
    const challengeLimit=pk==="pro"?3:1;// R9-E: Free can join (not create) 1 active challenge
    const myOwnScore=(()=>{try{const fl=JSON.parse(localStorage.getItem("hg_pomo_focuslog")||"{}");return getScoreWithDelta(habits,goals,journals,fl,{active:false,wins:0,activeDays:0},goalStats).score;}catch{return null;}})();// R9-G: for the corner comparison capsule
    // B16: leaderboard ranking — lifted to page level so both the scrollable
    // standings list and the fixed Your Position bar (rendered outside the
    // scroll area, always pinned) can share the same computed rank.
    const myBestStreak=habits.length>0?Math.max(...habits.map(h=>h.best||h.streak||0)):0;
    const me={uid:user?.uid,displayName:displayName||user?.displayName||"You",photoURL:user?.photoURL||null,score:myOwnScore,streak:myBestStreak,habitCount:habits.length,isMe:true};
    const ranked=[...friendsList.map(f=>({...f,isMe:false})),me].sort((a,b)=>(b.score||0)-(a.score||0));
    const myRank=ranked.findIndex(r=>r.isMe)+1;

    const hasLoadedFriendsOnce=React.useRef(false);
    async function loadAll(){
      if(!user?.uid)return;
      if(!hasLoadedFriendsOnce.current)setLoadingF(true);
      try{
        const[inSnap,outSnap,frSnap]=await Promise.all([
          fb.getDocs(fb.query(fb.collection(fb.db,"friendRequests"),fb.where("toUid","==",user.uid),fb.where("status","==","pending"))),
          fb.getDocs(fb.query(fb.collection(fb.db,"friendRequests"),fb.where("fromUid","==",user.uid),fb.where("status","==","pending"))),
          fb.getDocs(fb.collection(fb.db,"users",user.uid,"friends"))
        ]);
        const inc=[];inSnap.forEach(d=>inc.push({id:d.id,...d.data()}));
        const out=[];outSnap.forEach(d=>out.push({id:d.id,...d.data()}));
        const frList=[];frSnap.forEach(d=>frList.push({id:d.id,...d.data()}));
        const enriched=await Promise.all(frList.map(async f=>{
          try{
            const pSnap=await fb.getDoc(fb.doc(fb.db,"publicProfiles",f.uid));
            const pd=pSnap.exists()?pSnap.data():{};
            return{...f,score:pd.score??null,streak:pd.streak??null,habitCount:pd.habitCount??null,challengeWins:pd.challengeWins||0};
          }catch(e){return{...f,score:null,streak:null,habitCount:null,challengeWins:0};}
        }));
        enriched.sort((a,b)=>(b.score||0)-(a.score||0));
        setIncoming(inc);setOutgoing(out);setFriendsList(enriched);
        setFriendReqCount(inc.length);// keep App-level badge in sync
      }catch(e){console.error("Friends load err:",e);}
      hasLoadedFriendsOnce.current=true;
      setLoadingF(false);
    }
    React.useEffect(()=>{loadAll();},[]);

    async function syncMyPublicProfile(){
      if(!user?.uid||!momentumId)return;
      try{
        const flNow=(()=>{try{return JSON.parse(localStorage.getItem("hg_pomo_focuslog")||"{}");}catch{return{};}})();
        const scoreData=getScoreWithDelta(habits,goals,journals,flNow,{active:false,wins:0,activeDays:0},goalStats);
        const bestStreak=habits.length>0?Math.max(...habits.map(h=>h.best||h.streak||0)):0;
        await fb.setDoc(fb.doc(fb.db,"publicProfiles",user.uid),{
          momentumId,displayName:displayName||user.displayName||"User",photoURL:user.photoURL||null,
          score:scoreData.score,streak:bestStreak,habitCount:habits.length,
          challengeWins:0,// F9: wired once Challenges (Block 2) ship
          updatedAt:new Date().toISOString()
        },{merge:true});
      }catch(e){/* publicProfiles rules not deployed yet — expected until rules session */}
    }
    React.useEffect(()=>{if(momentumId)syncMyPublicProfile();},[momentumId]);

    async function sendRequest(){
      if(pk==="free"){showUp("Adding friends is a Pro feature — add up to 3 on Pro, unlimited on Plus.");return;}
      const targetId=sanitizeInput(searchVal.trim(),40);
      if(!targetId){showToast("Enter a Habtix ID","err");return;}
      if(friendsList.length>=friendLimit){showUp("You've reached your friend limit — upgrade for more room.");return;}
      if(friendsList.some(f=>f.momentumId===targetId)){showToast("Already friends","err");return;}
      if(outgoing.some(o=>o.toMomentumId===targetId)){showToast("Request already sent","err");return;}
      setBusy(true);
      try{
        const idxSnap=await fb.getDoc(fb.doc(fb.db,"momentumIdIndex",targetId));
        if(!idxSnap.exists()){showToast("No user found with that Habtix ID","err");setBusy(false);return;}
        const targetUid=idxSnap.data().uid;
        if(targetUid===user.uid){showToast("That's your own Habtix ID","err");setBusy(false);return;}
        const reqId=user.uid+"_"+targetUid;
        await fb.setDoc(fb.doc(fb.db,"friendRequests",reqId),{
          fromUid:user.uid,toUid:targetUid,
          fromMomentumId:momentumId,fromDisplayName:displayName||user.displayName||"User",fromPhotoURL:user.photoURL||null,
          toMomentumId:targetId,
          status:"pending",createdAt:new Date().toISOString()
        },{merge:true});
        showToast("Friend request sent!");
        setSearchVal("");
        loadAll();
      }catch(e){console.error(e);showToast("Couldn't send request — try again","err");}
      setBusy(false);
    }

    async function respond(req,accept){
      setBusy(true);
      try{
        if(accept){
          if(friendsList.length>=friendLimit){showUp("You've reached your friend limit — upgrade for more room.");setBusy(false);return;}
          const batch=fb.writeBatch(fb.db);
          batch.set(fb.doc(fb.db,"friendRequests",req.id),{status:"accepted",respondedAt:new Date().toISOString()},{merge:true});
          batch.set(fb.doc(fb.db,"users",user.uid,"friends",req.fromUid),{uid:req.fromUid,momentumId:req.fromMomentumId,displayName:req.fromDisplayName,photoURL:req.fromPhotoURL||null,addedAt:new Date().toISOString()},{merge:true});
          batch.set(fb.doc(fb.db,"users",req.fromUid,"friends",user.uid),{uid:user.uid,momentumId,displayName:displayName||user.displayName||"User",photoURL:user.photoURL||null,addedAt:new Date().toISOString()},{merge:true});
          await batch.commit();
          showToast("Friend added!");
        }else{
          await fb.deleteDoc(fb.doc(fb.db,"friendRequests",req.id));
        }
        loadAll();
      }catch(e){console.error(e);showToast("Couldn't complete — try again","err");}
      setBusy(false);
    }

    // F-picker: creates a real habit (same shape as the Habits tab's own add-flow) so it shows

    // ── F7–F9: Challenges (Phase 9 Block 2) ─────────────────────────────────
    function habitById(id){return habits.find(h=>h.id===id);}

    function computeProgress(habitId,startDate,endDate){
      const habit=habitById(habitId);
      const todayStr=today;
      const end=endDate<todayStr?endDate:todayStr;// never score past today
      let d=new Date(startDate+"T12:00:00");
      const endD=new Date(end+"T12:00:00");
      let daysCompleted=0,streakFreezeUsed=0;const completedDates=[];
      while(d<=endD){
        const ds=d.toLocaleDateString("en-CA");
        if(habit){
          if(isChallengeDayDone(habit,ds)){daysCompleted++;completedDates.push(ds);}
          if(habit.log&&habit.log[ds]==="freeze")streakFreezeUsed++;
        }
        d.setDate(d.getDate()+1);
      }
      return{daysCompleted,completedDates,streakFreezeUsed};
    }

    const hasLoadedChallengesOnce=React.useRef(false);
    async function loadChallenges(){
      if(!user?.uid)return;
      if(!hasLoadedChallengesOnce.current)setLoadingC(true);
      try{
        const[mineSnap,invSnap]=await Promise.all([
          fb.getDocs(fb.query(fb.collection(fb.db,"challenges"),fb.where("participants","array-contains",user.uid))),
          fb.getDocs(fb.query(fb.collection(fb.db,"challenges"),fb.where("invitedUids","array-contains",user.uid)))
        ]);
        const mine=[];mineSnap.forEach(d=>mine.push({id:d.id,...d.data()}));
        const inv=[];invSnap.forEach(d=>inv.push({id:d.id,...d.data()}));
        // enrich each of my challenges with the participants' progress + sync my own first
        const enriched=await Promise.all(mine.map(async c=>{
          const myProg=(c.participantHabits||{})[user.uid];
          if(myProg){
            try{
              const p=computeProgress(myProg.habitId,c.startDate,c.endDate);
              await fb.setDoc(fb.doc(fb.db,"challenges",c.id,"progress",user.uid),{
                uid:user.uid,momentumId,displayName:displayName||user.displayName||"User",photoURL:user.photoURL||null,
                linkedHabitId:myProg.habitId,linkedHabitName:myProg.habitName,
                ...p,lastSyncedAt:new Date().toISOString()
              },{merge:true});
            }catch(e){/* progress rules not deployed yet */}
          }
          let progressList=[];
          try{
            const pSnap=await fb.getDocs(fb.collection(fb.db,"challenges",c.id,"progress"));
            pSnap.forEach(pd=>progressList.push(pd.data()));
          }catch(e){}
          progressList.sort((a,b)=>(b.daysCompleted||0)-(a.daysCompleted||0));
          const ended=c.endDate<today;
          return{...c,progressList,ended};
        }));
        setMyChallenges(enriched);
        setChallengeInvites(inv);
        setChallengeInviteCount(inv.length);// keep App-level dashboard badge in sync
        // N.2 challenge-notif wiring: report a LIGHTWEIGHT summary to the shared store
        // instead of duplicating this expensive multi-query load inside the App-scope
        // engine. The engine reads _challengeSummary (cheap, already-computed) rather
        // than re-querying challenges/progress on every notification evaluation.
        try{
          const active=enriched.filter(c=>!c.ended);
          _challengeSummary.hasActive=active.length>0;
          _challengeSummary.hasFriendsNoChallenge=(friendsList?.length||0)>0&&active.length===0;
          _challengeSummary.standings=active.map(c=>{
            const mine=c.progressList.find(p=>p.uid===user.uid);
            const others=c.progressList.filter(p=>p.uid!==user.uid);
            const topOther=others.sort((a,b)=>(b.daysCompleted||0)-(a.daysCompleted||0))[0];
            if(!mine||!topOther)return null;
            const diff=(mine.daysCompleted||0)-(topOther.daysCompleted||0);
            return{challengeId:c.id,leading:diff>0,tied:diff===0,friendName:topOther.displayName||"a friend",diff:Math.abs(diff)};
          }).filter(Boolean);
        }catch(e){}
      }catch(e){console.error("Challenges load err:",e);}
      hasLoadedChallengesOnce.current=true;
      setLoadingC(false);
    }
    React.useEffect(()=>{loadChallenges();},[]);

    async function createChallenge(){
      if(pk==="free"){showUp("Creating challenges is a Pro feature — join is free, creating needs Pro or Plus.");return;}
      if(challengeLimit!==Infinity&&myChallenges.filter(c=>!c.ended).length>=challengeLimit){
        showUp("You've reached your active challenge limit — upgrade to Plus for unlimited challenges.");return;
      }
      if(!newHabitId||newHabitId==="__new__"){showToast("Pick or create a habit to track","err");return;}
      if(newFriendUids.length===0){showToast("Pick at least one friend","err");return;}
      const maxMembers=20;
      if(newFriendUids.length+1>maxMembers){showToast("Too many members for this plan","err");return;}
      setBusy(true);
      try{
        const habit=habitById(newHabitId);
        const start=today;
        const endD=new Date(start+"T12:00:00");endD.setDate(endD.getDate()+newDuration-1);
        const end=endD.toLocaleDateString("en-CA");
        const title=sanitizeInput(newTitle.trim(),60)||((habit?.name||"Habit")+" — "+newDuration+" Day Challenge");
        // habitTemplate: the creator's exact habit settings (name/icon/category/color/frequency/
        // goal count+unit — NOT reminder time, streak, or log, which are personal/fresh per
        // person) so every invitee who joins gets an identical habit auto-created, rather than
        // having to pick or build their own from scratch.
        const habitTemplate=habit?{name:habit.name,cat:habit.cat,icon:habit.icon,color:habit.color,freq:habit.freq,goalCount:habit.goalCount||0,goalUnit:habit.goalUnit||""}:null;
        const ref=await fb.addDoc(fb.collection(fb.db,"challenges"),{
          creatorUid:user.uid,title,durationDays:newDuration,startDate:start,endDate:end,
          participants:[user.uid],invitedUids:newFriendUids,maxMembers,status:"active",
          participantHabits:{[user.uid]:{habitId:newHabitId,habitName:habit?.name||"Habit"}},
          habitTemplate,
          createdAt:new Date().toISOString()
        });
        await fb.setDoc(fb.doc(fb.db,"challenges",ref.id,"progress",user.uid),{
          uid:user.uid,momentumId,displayName:displayName||user.displayName||"User",photoURL:user.photoURL||null,
          linkedHabitId:newHabitId,linkedHabitName:habit?.name||"Habit",
          daysCompleted:0,completedDates:[],streakFreezeUsed:0,lastSyncedAt:new Date().toISOString()
        },{merge:true});
        showToast("Challenge created!");
        setShowCreateChallenge(false);setNewTitle("");setNewHabitId("");setNewDuration(7);setNewFriendUids([]);
        loadChallenges();
      }catch(e){console.error(e);showToast("Couldn't create challenge — try again","err");}
      setBusy(false);
    }

    async function acceptInvite(c){
      if(challengeLimit!==Infinity&&myChallenges.filter(x=>!x.ended).length>=challengeLimit){
        showUp("You've reached your active challenge limit — upgrade to Plus for unlimited challenges.");return;
      }
      if((c.participants||[]).length>=(c.maxMembers||20)){showToast("This challenge is full","err");return;}
      setBusy(true);
      try{
        // Robustness fix: c.participants/c.invitedUids come from whenever loadChallenges()
        // last ran, which could be stale by the time this write actually happens — and the
        // deployed rule compares against the server's CURRENT arrays at write time. Even a
        // slightly-stale local copy fails that equality check the exact same way the
        // arrayUnion/arrayRemove sentinel issue did. Fetching fresh right before building
        // the write closes that gap.
        const freshSnap=await fb.getDoc(fb.doc(fb.db,"challenges",c.id));
        if(!freshSnap.exists()){showToast("This challenge no longer exists","err");setBusy(false);return;}
        const freshData=freshSnap.data();
        // Auto-clone the creator's exact habit settings — no more manual habit picking.
        // Older challenges created before this change won't have habitTemplate; for those,
        // fall back to a plain habit named after the challenge so joining still works.
        const tmpl=c.habitTemplate||freshData.habitTemplate||{name:c.title,cat:"Health",icon:"⭐",color:t.accent,freq:"daily",goalCount:0,goalUnit:""};
        const newHabitId=Date.now();
        const newHabit={
          id:newHabitId,name:tmpl.name,cat:tmpl.cat,icon:tmpl.icon,color:tmpl.color,freq:tmpl.freq,
          goalCount:tmpl.goalCount||0,goalUnit:tmpl.goalUnit||"",remTime:"",streak:0,best:0,log:{},
          challengeId:c.id,challengeEndDate:c.endDate// tags this habit as challenge-linked for the badge + auto-cleanup of the tag
        };
        const updatedHabits=[...habits,newHabit];
        setHabits(updatedHabits);save(updatedHabits,goals,journals,tk);
        // Bug fix: the deployed rule verifies participants/invitedUids with plain == against
        // literal arrays (participants.concat([uid]), invitedUids.removeAll([uid])). arrayUnion/
        // arrayRemove are sentinel transforms — the rules engine can't resolve them at
        // evaluation time, so that equality check always failed and every join was silently
        // denied ("Couldn't join — try again"). Writing explicit arrays, built from the FRESH
        // data above, so the rule can actually verify them.
        await fb.setDoc(fb.doc(fb.db,"challenges",c.id),{
          participants:[...(freshData.participants||[]),user.uid],
          invitedUids:(freshData.invitedUids||[]).filter(x=>x!==user.uid),
          [`participantHabits.${user.uid}`]:{habitId:newHabitId,habitName:tmpl.name}
        },{merge:true});
        await fb.setDoc(fb.doc(fb.db,"challenges",c.id,"progress",user.uid),{
          uid:user.uid,momentumId,displayName:displayName||user.displayName||"User",photoURL:user.photoURL||null,
          linkedHabitId:newHabitId,linkedHabitName:tmpl.name,
          daysCompleted:0,completedDates:[],streakFreezeUsed:0,lastSyncedAt:new Date().toISOString()
        },{merge:true});
        showToast(tmpl.icon+" "+tmpl.name+" added to your habits — challenge joined!");
        try{window.trackEvent&&window.trackEvent("challenge_joined",{});}catch(e){}
        loadChallenges();
      }catch(e){
        console.error("acceptInvite error:",e);
        // Surface the real reason instead of a generic message — permission-denied (rules not
        // deployed/mismatched) looks nothing like a network error, and the person shouldn't
        // need DevTools open to tell the two apart.
        const reason=e?.code==="permission-denied"?"blocked by security rules (may need redeploying)":(e?.message||"unknown error");
        showToast("Couldn't join — "+reason,"err");
      }
      setBusy(false);
    }

    async function declineInvite(c){
      setBusy(true);
      try{
        // Same fixes as acceptInvite — fetch fresh to avoid a stale local copy failing the
        // rule's equality check, and explicit array instead of the arrayRemove sentinel.
        const freshSnap=await fb.getDoc(fb.doc(fb.db,"challenges",c.id));
        const freshInvited=freshSnap.exists()?(freshSnap.data().invitedUids||[]):[];
        await fb.setDoc(fb.doc(fb.db,"challenges",c.id),{invitedUids:freshInvited.filter(x=>x!==user.uid)},{merge:true});

        console.error("declineInvite error:",e);
        const reason=e?.code==="permission-denied"?"blocked by security rules (may need redeploying)":(e?.message||"unknown error");

    }

                  </div>
                  {c.progressList.map((p,i)=>(
                    <div key={p.uid} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",opacity:i===0?1:0.75}}>

            {pk!=="free"&&(

                }} title="Copy ID" style={{background:t.surface,border:"1px solid "+t.border,borderRadius:8,padding:"4px 7px",cursor:"pointer",display:"flex",alignItems:"center",flexShrink:0}}>{IC.copy(t.muted,13)}</button>}
              </div>
              <div style={{fontSize:10,color:t.muted,marginBottom:momentumId?10:0}}>Share this so friends can add you.</div>
              {/* #26: same Web Share API pattern as ReferralCard's shareLink(), but its own

                        <span style={{fontSize:rank===1?18:14,fontWeight:900,color:"#000"}}>{rank}</span>

                  return(
                    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",gap:6,marginBottom:20}}>
                      {spot(p2,2,58,46,false)}
                      {spot(p1,1,80,60,true)}

                  </div>

            {/* Delete Challenge double-confirmation — creator only, matches the Firestore rule */}
            {confirmDeleteChallenge&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:9700,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 24px"}} onClick={()=>setConfirmDeleteChallenge(null)}>
              <div onClick={e=>e.stopPropagation()} style={{background:t.card,border:"1px solid "+t.border,borderRadius:16,padding:20,width:"100%",maxWidth:340}}>

        </div>}

      </div>

  // Setup once, then one daily Yes/No + optional photo. Deliberately isolated
  // from Momentum Score and Friend Challenges (own streak counter, own
  // Firestore subcollection) — see habtix.md Section 6 for why. Photos:
  // trial/free stay local (IndexedDB) and sync to Firestore only once the

  // photo" (the check-in itself always syncs so history/streak never depends
  // on one specific device).

  // Habits page — Updates 11-14: stats bar, day nav, week dots, category filter
  function HabitsPage(){
    return(

  function GoalsPage(){
    const[goalSortMode,setGoalSortMode]=useState("priority");
    // AI Goal Architect — extracted from the old AI Coach panel's Planner tab, rewritten
    // simpler: no local credit-tracking (ai.js already does an atomic server-side check;
    // this just calls it and handles a 402 gracefully, same pattern as Plan Tomorrow's
    // AI-assist). No local usage history either — that lived in the History tab, which
    // isn't coming back with this cut. Habit-suggestion checkboxes from the old version
    // are also dropped for this pass — goal + actions only, a real scope reduction, not
    // an oversight.
    const[showAIArchitect,setShowAIArchitect]=useState(false);
    const[archInput,setArchInput]=useState("");
    const[archDifficulty,setArchDifficulty]=useState("medium");
    const[archDays,setArchDays]=useState(60);
    const[archLoading,setArchLoading]=useState(false);
    const[archResult,setArchResult]=useState(null);
    const[showFullPlan,setShowFullPlan]=useState(false);

    function flattenArchPlan(data){
      if(data.phases&&data.phases.length>0){
        let id=1;const actions=[];
        data.phases.forEach(ph=>(ph.tasks||[]).forEach(task=>{actions.push({id:id++,action:task.action,done:false,dueDate:task.dueDate||"",result:task.successCriteria||""});}));
        return actions;
      }
      return (data.actions||[]).map((a,i)=>({id:i+1,action:a.action,done:false,dueDate:a.dueDate||"",result:a.result||""}));
    }

    async function generateAIGoalPlan(){
      if(!archInput.trim())return;
      if(pk==="free"){showUp("Unlock AI Goal Architect on Pro — break any goal into a real plan.");return;}
      setArchLoading(true);setArchResult(null);
      try{
        const deadline=new Date();deadline.setDate(deadline.getDate()+archDays);
        const deadlineStr=deadline.toISOString().split("T")[0];
        const idToken=await user.getIdToken();
        const resp=await fetch("/api/ai",{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},
          body:JSON.stringify({
            creditCost:4,
            usageType:"planner",
            model:MODEL,
            max_tokens:4000,
            system:"You are an expert execution-focused goal coach. Create a "+archDays+"-day "+archDifficulty+"-difficulty plan. Return ONLY valid JSON, no markdown backticks. Format: "+PLAN_FORMAT_EXAMPLE+". Rules: exactly 4 phases covering the full "+archDays+"-day timeframe with non-overlapping 'dayRange' values (e.g. 'Days 1-7'); each phase has 2-4 SMALL SPECIFIC tasks (not vague milestones) with realistic 'time' estimates and measurable 'successCriteria', dueDate within that phase's range; 8-16 tasks total across all phases; 'todayTask' = the first task of Phase 1; 'riskFactors' = 2-3 specific reasons THIS goal commonly fails; 'recoveryPlan' = 2-3 concrete steps if the user falls 3+ days behind; 'successProbability' = realistic 0-100 based on difficulty and timeframe.",
            messages:[{role:"user",content:"Create a "+archDays+"-day "+archDifficulty+" difficulty plan for: "+archInput+"\n\nToday: "+today+"\nDeadline: "+deadlineStr}]
          })
        });
        if(resp.status===402){showToast("Out of AI credits this month.");setArchLoading(false);return;}
        if(!resp.ok){const errBody=await resp.text();throw new Error("HTTP "+resp.status+": "+errBody.slice(0,150));}
        const data=await resp.json();
        if(data.error)throw new Error(String(data.error.message||JSON.stringify(data.error)).slice(0,150));
        if(!data.content||!data.content[0]||typeof data.content[0].text!=="string")throw new Error("Unexpected response shape");
        if(data.stop_reason==="max_tokens")throw new Error("Plan was too long to finish — try a shorter duration.");
        const raw=data.content[0].text.replace(/```json|```/g,"").trim();
        const parsed=JSON.parse(raw);
        setArchResult(parsed);
        try{window.trackEvent&&window.trackEvent("ai_used",{feature:"goal_architect"});}catch(e){}
        refreshAiCredits();
      }catch(e){
        console.error("Goal Architect error:",e);
        showToast("❌ "+String(e.message||e).slice(0,100));
      }
      setArchLoading(false);
    }

    }

        {[[compGY+"/"+totalGY,"Goals Done",NB.green],[doneAY+"/"+totalAY,"Actions Done",NB.blue],[totalOverdueG+"","Overdue",totalOverdueG>0?NB.coral:NB.muted]].map(([v,l,c])=>(

      {showGF&&<div style={{background:NB.card,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:16,marginBottom:14,boxShadow:NB.shadowSm,fontFamily:"'Sora',sans-serif"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontSize:14,fontWeight:700,color:NB.ink,display:"flex",alignItems:"center",gap:5,fontFamily:NB.font}}>{IC.target(NB.ink,14)} Create New Goal</div>
          <span onClick={()=>{setShowGF(false);setNewGActions([]);setNewGPriorityState("Medium");}} style={{color:NB.muted,cursor:"pointer",fontSize:20,padding:"0 4px"}}>×</span>
        </div>

        <input defaultValue={_newGTitle.current} onChange={e=>_newGTitle.current=e.target.value} placeholder="What do you want to achieve?" style={{width:"100%",padding:"10px 12px",border:"2.5px solid "+NB.ink,borderRadius:14,fontSize:14,marginBottom:12,fontFamily:"'Sora',sans-serif"}}/>

        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,color:NB.muted,fontWeight:700,marginBottom:5,textTransform:"uppercase",letterSpacing:0.5}}>Priority</div>
          <div style={{display:"flex",gap:6}}>
            {["High","Medium","Low"].map(p=>(
              <span key={p} onClick={()=>{_newGPriority.current=p;setNewGPriorityState(p);}} style={{flex:1,padding:"7px 4px",borderRadius:NB.rPill,border:"2.5px solid "+NB.ink,background:newGPriorityState===p?NB.brand:NB.card,color:NB.ink,cursor:"pointer",fontSize:11,fontWeight:newGPriorityState===p?700:600,textAlign:"center"}}>{p}</span>
            ))}
          </div>
        </div>

        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,color:NB.muted,fontWeight:700,marginBottom:5,textTransform:"uppercase",letterSpacing:0.5}}>Deadline <span style={{fontWeight:400,textTransform:"none"}}>(optional)</span></div>
          <input type="date" defaultValue={_newGDeadline.current} onChange={e=>_newGDeadline.current=e.target.value} style={{width:"100%",padding:"9px 12px",border:"2.5px solid "+NB.ink,borderRadius:14,fontFamily:"'Sora',sans-serif"}}/>
        </div>

        <textarea defaultValue={_newGNotes.current} onChange={e=>_newGNotes.current=e.target.value} placeholder="Notes, motivation, context..." maxLength={500} style={{width:"100%",height:56,padding:"9px 12px",border:"2.5px solid "+NB.ink,borderRadius:14,fontSize:13,resize:"none",marginBottom:14,fontFamily:"'Sora',sans-serif"}}/>

        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:NB.ink,textTransform:"uppercase",letterSpacing:0.5,display:"flex",alignItems:"center",gap:4}}>{IC.bolt(NB.ink,11)} Action Steps</div>
            <span onClick={()=>setNewGActions(a=>[...a,{action:"",result:"",dueDate:"",dueTime:""}])} style={{padding:"4px 10px",borderRadius:NB.rPill,border:"2px solid "+NB.ink,background:NB.card,color:NB.ink,cursor:"pointer",fontSize:11,fontWeight:700}}>+ Add Step</span>
          </div>
          {newGActions.length===0&&<div style={{fontSize:12,color:NB.muted,padding:"10px 12px",border:"2px dashed "+NB.ink,borderRadius:14,textAlign:"center"}}>No steps yet — tap "+ Add Step" to break this goal down</div>}
          {newGActions.map((a,i)=>(
            <div key={i} style={{background:NB.bg,borderRadius:14,padding:10,marginBottom:8,border:"2.5px solid "+NB.ink}}>
              <div style={{display:"flex",gap:7,marginBottom:7,alignItems:"center"}}>
                <span style={{fontSize:11,color:NB.muted,fontWeight:700,flexShrink:0}}>#{i+1}</span>
                <input
                  defaultValue={a.action}
                  onBlur={e=>{const u=[...newGActions];u[i]={...u[i],action:e.target.value};setNewGActions(u);}}
                  placeholder="Action step..."
                  style={{flex:1,padding:"7px 10px",border:"2px solid "+NB.ink,borderRadius:10,background:NB.card,fontSize:13,fontFamily:"'Sora',sans-serif"}}
                />
                <span onClick={()=>setNewGActions(aa=>aa.filter((_,j)=>j!==i))} style={{color:NB.coral,cursor:"pointer",fontSize:16,flexShrink:0,padding:"0 2px"}}>×</span>
              </div>
              <input
                defaultValue={a.result}
                onBlur={e=>{const u=[...newGActions];u[i]={...u[i],result:e.target.value};setNewGActions(u);}}
                placeholder="Expected result (optional)"
                style={{width:"100%",padding:"6px 10px",border:"2px solid "+NB.ink,borderRadius:10,background:NB.card,fontSize:12,marginBottom:7,fontFamily:"'Sora',sans-serif"}}
              />
              <div style={{display:"flex",gap:6}}>
                <input type="date" defaultValue={a.dueDate} onBlur={e=>{const u=[...newGActions];u[i]={...u[i],dueDate:e.target.value};setNewGActions(u);}} style={{flex:1,padding:"6px 8px",border:"2px solid "+NB.ink,borderRadius:10,background:NB.card,fontSize:11,fontFamily:"'Sora',sans-serif"}}/>
                <input type="time" defaultValue={a.dueTime} onBlur={e=>{const u=[...newGActions];u[i]={...u[i],dueTime:e.target.value};setNewGActions(u);}} style={{flex:1,padding:"6px 8px",border:"2px solid "+NB.ink,borderRadius:10,background:NB.card,fontSize:11,fontFamily:"'Sora',sans-serif"}}/>
              </div>
            </div>
          ))}
        </div>

        <div style={{display:"flex",gap:8}}>
          <div onClick={addG} style={{flex:1,padding:"11px",borderRadius:NB.rBtn,border:"3px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:14,display:"inline-flex",alignItems:"center",justifyContent:"center",gap:5,fontFamily:NB.font,boxShadow:NB.shadowSm}}>{IC.target(NB.brandInk,14)} Create Goal{newGActions.length>0?" + "+newGActions.length+" Steps":""}</div>
          <div onClick={()=>{setShowGF(false);setNewGActions([]);setNewGPriorityState("Medium");}} style={{padding:"11px 14px",borderRadius:NB.rBtn,border:"2.5px solid "+NB.ink,background:NB.card,color:NB.ink,cursor:"pointer",fontSize:13,fontFamily:NB.font,fontWeight:700}}>Cancel</div>
        </div>
      </div>}
      {goals.length===0&&<div style={{textAlign:"center",color:NB.muted,padding:36,border:"3px dashed "+NB.ink,borderRadius:NB.rCard,fontFamily:"'Sora',sans-serif"}}>
        <img src="/mo/mo-determined.png" alt="" style={{width:110,height:110,objectFit:"contain",marginBottom:8}} onError={e=>e.target.style.display="none"}/>
        <div style={{fontWeight:600}}>No goals yet. Create your first!</div>
      </div>}

      {/* B6: sort control — priority (default), deadline, or creation order */}
      {goals.length>1&&<div style={{display:"flex",gap:6,marginBottom:12}}>
        {[["priority","Priority"],["deadline","Deadline"],["creation","Newest"]].map(([k,l])=>(
          <button key={k} onClick={()=>setGoalSortMode(k)} style={{flex:1,padding:"6px 8px",borderRadius:9,border:"1px solid "+(goalSortMode===k?t.accent:t.border),background:goalSortMode===k?t.accent+"18":t.surface,color:goalSortMode===k?t.accent:t.muted,cursor:"pointer",fontSize:11,fontWeight:goalSortMode===k?700:400}}>{l}</button>
        ))}
      </div>}

      {sortGoalsBy(goals,goalSortMode).map((g,gIdx)=>{
        const gActions=g.actions||[];
        const done=gActions.filter(a=>a.done).length,pct=gActions.length>0?Math.round((done/gActions.length)*100):0;
        const dl=g.deadline?Math.ceil((new Date(g.deadline)-new Date())/86400000):null;
        const exp=expG===g.id,pCol=g.priority==="High"?t.danger:g.priority==="Medium"?t.accent:t.success;
        const isEditing=editG===g.id;
        return(<div key={g.id} data-tour={gIdx===0?"goal-card-0":undefined} style={{background:NB.card,border:"3px solid "+NB.ink,borderRadius:NB.rCard,overflow:"hidden",marginBottom:12,boxShadow:NB.shadowSm,fontFamily:"'Sora',sans-serif"}}>
          <div style={{padding:"13px 13px"}}>
            {/* G1: Controlled edit mode — all saved together on Done ✓ */}
            {isEditing?(
              <div style={{fontFamily:"'Sora',sans-serif"}}>
                <div style={{fontSize:11,fontWeight:700,color:NB.ink,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Editing Goal</div>
                <input defaultValue={_editGTitle.current} onChange={e=>setEditGTitle(e.target.value)} placeholder="Goal title..." maxLength={150} style={{width:"100%",padding:"9px 11px",border:"2.5px solid "+NB.ink,borderRadius:12,fontSize:14,fontWeight:700,marginBottom:9,fontFamily:NB.font}}/>
                <div style={{display:"flex",gap:7,marginBottom:9}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:10,color:NB.muted,marginBottom:4,fontWeight:700}}>Priority</div>
                    <select defaultValue={_editGPriority.current} onChange={e=>setEditGPriority(e.target.value)} style={{width:"100%",padding:"8px 9px",border:"2.5px solid "+NB.ink,borderRadius:12,fontSize:12,fontFamily:"'Sora',sans-serif"}}>
                      {["High","Medium","Low"].map(p=><option key={p}>{p}</option>)}
                    </select>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:10,color:NB.muted,marginBottom:4,fontWeight:700}}>Deadline <span style={{fontWeight:400}}>(optional)</span></div>
                    <input type="date" defaultValue={_editGDeadline.current} onChange={e=>setEditGDeadline(e.target.value)} style={{width:"100%",padding:"8px 9px",border:"2.5px solid "+NB.ink,borderRadius:12,fontSize:12,fontFamily:"'Sora',sans-serif"}}/>
                  </div>
                </div>
                <textarea defaultValue={_editGNotes.current} onChange={e=>setEditGNotes(e.target.value)} placeholder="Notes (optional)..." maxLength={500} style={{width:"100%",height:52,padding:"8px 9px",border:"2.5px solid "+NB.ink,borderRadius:12,fontSize:12,resize:"none",marginBottom:9,fontFamily:"'Sora',sans-serif"}}/>
                <div style={{display:"flex",gap:7}}>
                  <span onClick={saveEditG} style={{padding:"9px 20px",borderRadius:NB.rPill,border:"2.5px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:13,fontFamily:NB.font}}>Save Changes ✓</span>
                  <span onClick={()=>setEditG(null)} style={{padding:"9px 12px",borderRadius:NB.rPill,border:"2.5px solid "+NB.ink,background:NB.card,color:NB.ink,cursor:"pointer",fontSize:12,fontFamily:NB.font,fontWeight:700}}>Cancel</span>
                </div>
              </div>
            ):(
              <div style={{display:"flex",alignItems:"flex-start",gap:7}}>
                <div style={{flex:1,cursor:"pointer"}} onClick={()=>setExpG(exp?null:g.id)}>
                  <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:4,flexWrap:"wrap"}}>
                    <span style={{fontWeight:700,fontSize:14.5,color:NB.ink,fontFamily:NB.font}}>{g.title}</span>
                    <span style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:NB.rPill,border:"2px solid "+NB.ink,background:pCol+"33",color:NB.ink}}>{g.priority}</span>
                    {pct===100&&<span>✅</span>}
                  </div>
                  {g.deadline&&<div style={{fontSize:11,color:dl!==null&&dl<3?NB.coral:NB.muted,marginBottom:7,display:"flex",alignItems:"center",gap:4,fontWeight:600}}>{IC.calendar(dl!==null&&dl<3?NB.coral:NB.muted,11)} {dl===null?"":dl<0?"Overdue!":dl===0?"Due today!":dl+"d left"} · {fmt(g.deadline)}</div>}
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:NB.muted,marginBottom:4,fontWeight:600}}><span>{done}/{gActions.length} actions</span><span style={{fontWeight:700,color:NB.ink}}>{pct}%</span></div>
                  <div style={{height:9,background:NB.bg,border:"2px solid "+NB.ink,borderRadius:NB.rPill,overflow:"hidden"}}><div style={{height:"100%",width:pct+"%",background:pct===100?NB.green:NB.blue,transition:"width 0.5s"}}/></div>
                </div>
                <div style={{display:"flex",gap:3,flexShrink:0}}>
                  <button onClick={()=>openEditG(g)} style={{background:t.surface,border:"none",color:navMuted,cursor:"pointer",borderRadius:8,padding:"4px 8px",display:"flex",alignItems:"center"}}>{IC.edit(navMuted,15)}</button>
                  <button onClick={()=>setExpG(exp?null:g.id)} style={{background:t.surface,border:"none",color:t.muted,cursor:"pointer",borderRadius:8,padding:"4px 8px",fontSize:11}}>{exp?"▲":"▼"}</button>
                  <button onClick={()=>delG(g.id)} style={{background:"none",border:"none",color:t.danger,cursor:"pointer",padding:"0 2px",display:"flex",alignItems:"center"}}>{IC.trash(t.danger,15)}</button>
                </div>
              </div>
            )}
          </div>
          {exp&&!isEditing&&<div style={{borderTop:"3px solid "+NB.ink,padding:"14px 13px",background:NB.bg,fontFamily:"'Sora',sans-serif"}}>
            {g.notes&&<div style={{fontSize:12,color:NB.muted,fontStyle:"italic",marginBottom:10,padding:"7px 10px",background:NB.card,border:"2px solid "+NB.ink,borderRadius:12,display:"flex",alignItems:"flex-start",gap:5}}>{IC.note(NB.muted,11)}{g.notes}</div>}
            {sortActions(gActions).map(a=>(
              editA===a.id?(
              <div key={a.id} style={{padding:"10px 11px",borderRadius:12,marginBottom:7,background:NB.card,border:"2.5px solid "+NB.ink}}>
                <input defaultValue={_editAAction.current} onChange={e=>setEditAAction(e.target.value)} placeholder="Action step..." style={{width:"100%",padding:"7px 9px",border:"2px solid "+NB.ink,borderRadius:10,fontSize:12,marginBottom:6,fontFamily:"'Sora',sans-serif"}}/>
                <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
                  <input type="date" defaultValue={_editADueDate.current} onChange={e=>setEditADueDate(e.target.value)} style={{padding:"6px 9px",border:"2px solid "+NB.ink,borderRadius:10,fontSize:12,fontFamily:"'Sora',sans-serif"}}/>
                  <input type="time" defaultValue={_editADueTime.current} onChange={e=>setEditADueTime(e.target.value)} style={{padding:"6px 9px",border:"2px solid "+NB.ink,borderRadius:10,fontSize:12,fontFamily:"'Sora',sans-serif"}}/>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <span onClick={saveEditA} style={{padding:"7px 16px",borderRadius:NB.rPill,border:"2px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:NB.font}}>Save ✓</span>
                  <span onClick={()=>setEditA(null)} style={{padding:"7px 12px",borderRadius:NB.rPill,border:"2px solid "+NB.ink,background:NB.card,color:NB.ink,cursor:"pointer",fontSize:12,fontFamily:NB.font,fontWeight:700}}>Cancel</span>
                </div>
              </div>
              ):(
              <div key={a.id} style={{display:"flex",alignItems:"flex-start",gap:9,padding:"10px 11px",borderRadius:12,marginBottom:7,background:a.done?NB.greenSoft:NB.card,border:"2.5px solid "+NB.ink}}>
                <div onClick={()=>toggleA(g.id,a.id)} style={{width:18,height:18,borderRadius:6,border:"2px solid "+NB.ink,background:a.done?NB.green:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1,cursor:"pointer"}}>
                  {a.done&&<span style={{color:"#fff",fontSize:10,fontWeight:900}}>✓</span>}
                </div>
                <div style={{flex:1,cursor:"pointer"}} onClick={()=>toggleA(g.id,a.id)}>
                  <div style={{fontSize:13,color:a.done?NB.muted:NB.ink,textDecoration:a.done?"line-through":"none",fontWeight:600}}>{a.action}</div>
                  {a.result&&<div style={{fontSize:11,color:NB.blue,marginTop:1,fontWeight:600}}>→ {a.result}</div>}
                  {(a.dueDate||a.dueTime)&&<div style={{fontSize:10,color:a.dueDate===today?NB.coral:NB.muted,marginTop:3,fontWeight:700,display:"flex",alignItems:"center",gap:3}}>
                    {IC.calendar(a.dueDate===today?NB.coral:NB.muted,10)} {a.dueDate?fmt(a.dueDate):""}{a.dueTime?" · "+fmt12(a.dueTime):""}
                    {a.dueDate===today&&!a.done&&<span style={{marginLeft:4,color:NB.coral}}>— Due today!</span>}
                  </div>}
                </div>
                <span onClick={()=>openEditA(g.id,a)} style={{cursor:"pointer",padding:"0 2px",flexShrink:0,display:"flex",alignItems:"center"}}>{IC.edit(NB.ink,14)}</span>
                <span onClick={()=>delA(g.id,a.id)} style={{color:NB.coral,cursor:"pointer",fontSize:13,padding:"0 2px",flexShrink:0}}>✕</span>
              </div>
              )
            ))}
            <div style={{marginTop:9,marginBottom:9}}>
              <div style={{display:"flex",gap:6,marginBottom:6,flexWrap:"wrap"}}>
                <input value={getAddDraft(g.id).action} onChange={e=>setAddDraftField(g.id,"action",e.target.value)} onKeyDown={e=>e.key==="Enter"&&addA(g.id)} placeholder="Action step..." style={{flex:2,minWidth:100,padding:"7px 9px",border:"2px solid "+NB.ink,borderRadius:10,fontSize:12,fontFamily:"'Sora',sans-serif"}}/>
                <input value={getAddDraft(g.id).result} onChange={e=>setAddDraftField(g.id,"result",e.target.value)} placeholder="Expected result..." style={{flex:2,minWidth:100,padding:"7px 9px",border:"2px solid "+NB.ink,borderRadius:10,fontSize:12,fontFamily:"'Sora',sans-serif"}}/>
                <span onClick={()=>addA(g.id)} style={{padding:"7px 14px",borderRadius:10,border:"2px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer"}}>+</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span onClick={()=>setShowNewAExtra(showNewAExtra===g.id?null:g.id)} style={{fontSize:11,color:NB.ink,cursor:"pointer",padding:0,display:"flex",alignItems:"center",gap:3,fontWeight:700}}>
                  {IC.calendar(NB.ink,11)} {showNewAExtra===g.id?"Hide":"Add due date & time"}
                </span>
                {showNewAExtra===g.id&&<React.Fragment>
                  <input type="date" value={getAddDraft(g.id).dueDate} onChange={e=>setAddDraftField(g.id,"dueDate",e.target.value)} style={{padding:"6px 10px",border:"2px solid "+NB.ink,borderRadius:10,fontSize:12,fontFamily:"'Sora',sans-serif"}}/>
                  <input type="time" value={getAddDraft(g.id).dueTime} onChange={e=>setAddDraftField(g.id,"dueTime",e.target.value)} style={{padding:"6px 10px",border:"2px solid "+NB.ink,borderRadius:10,fontSize:12,fontFamily:"'Sora',sans-serif"}}/>
                </React.Fragment>}
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4}}>
              <span onClick={()=>setShowBulk(showBulk===g.id?null:g.id)} style={{fontSize:12,color:NB.ink,cursor:"pointer",padding:0,display:"inline-flex",alignItems:"center",gap:3,fontWeight:700}}>{IC.plan(NB.ink,11)} Bulk upload</span>
              <span onClick={()=>completeGoal(g.id)} style={{padding:"6px 13px",borderRadius:NB.rPill,border:"2px solid "+NB.ink,background:NB.greenSoft,color:NB.ink,fontWeight:700,cursor:"pointer",fontSize:10,flexShrink:0}}>✅ Complete</span>
            </div>
            {showBulk===g.id&&<div style={{marginTop:9}}>
              <textarea defaultValue="" onChange={e=>setBulk(e.target.value)} placeholder={"ACTION | EXPECTED RESULT\nStudy Chapter 1 | Understand basics"} style={{width:"100%",height:70,padding:"9px 11px",border:"2.5px solid "+NB.ink,borderRadius:12,fontSize:12,resize:"none",marginBottom:8,fontFamily:"'Sora',sans-serif"}}/>
              <span onClick={()=>bulkUp(g.id)} style={{padding:"7px 16px",borderRadius:NB.rPill,border:"2.5px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:NB.font}}>Upload</span>
            </div>}
          </div>}
        </div>);
      })}

      {/* Standalone actions — not tied to any goal, not a recurring life-action.
          Named "Other Actions" rather than "Direct Actions": parallels the existing
          "Life Actions" / "Goal Actions" naming already established elsewhere in the
          app, so it's immediately clear how this category relates to the other two
          rather than introducing an unrelated third term. */}
      <div style={{background:"#DEDAD1",border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:16,marginTop:18,marginBottom:20}}>
        <div onClick={()=>setExpandOtherActions(e=>!e)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
          <div>
            <div style={{fontFamily:NB.font,fontWeight:800,fontSize:15,color:NB.ink,marginBottom:3}}>Other Actions</div>
            <div style={{fontSize:11.5,color:NB.muted,fontFamily:"'Sora',sans-serif"}}>Not tied to any goal — one-off things with their own date, if they need one.</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            <span style={{fontSize:12,fontWeight:700,color:NB.ink,fontFamily:NB.font,whiteSpace:"nowrap"}}>{standaloneActions.filter(a=>a.done).length}/{standaloneActions.length}</span>
            <span style={{fontSize:11,transform:expandOtherActions?"rotate(180deg)":"none",display:"inline-block"}}>▼</span>
          </div>
        </div>

        {expandOtherActions&&<div style={{marginTop:12}}>
        {standaloneActions.length===0
          ?<div style={{fontSize:12,color:NB.muted,padding:"10px 2px",fontFamily:"'Sora',sans-serif"}}>Nothing here yet.</div>
          :standaloneActions.map(a=>(
            <div key={a.id} style={{background:NB.card,border:"2.5px solid "+NB.ink,borderRadius:14,padding:"10px 12px",marginBottom:8}}>
              {editDirect===a.id
                ?<React.Fragment>
                  <input defaultValue={a.name} onChange={e=>{_editDirectName.current=e.target.value;}} style={{width:"100%",padding:"8px 10px",border:"2px solid "+NB.ink,borderRadius:10,fontSize:13,marginBottom:7,fontFamily:"'Sora',sans-serif",boxSizing:"border-box"}}/>
                  <div style={{display:"flex",gap:7}}>
                    <input type="date" defaultValue={a.dueDate||""} onChange={e=>{_editDirectDate.current=e.target.value;}} style={{flex:1,padding:"7px 9px",border:"2px solid "+NB.ink,borderRadius:10,fontSize:12,fontFamily:"'Sora',sans-serif"}}/>
                    <span onClick={saveEditDirect} style={{padding:"7px 14px",borderRadius:10,border:"2px solid "+NB.ink,background:NB.brand,color:NB.brandInk,fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:NB.font}}>Save</span>
                    <span onClick={()=>setEditDirect(null)} style={{padding:"7px 14px",borderRadius:10,border:"2px solid "+NB.ink,background:NB.card,color:NB.ink,fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:NB.font}}>Cancel</span>
                  </div>
                </React.Fragment>
                :<div style={{display:"flex",alignItems:"center",gap:9}}>
                  <div onClick={()=>toggleStandaloneAction(a.id)} style={{width:20,height:20,border:"2px solid "+NB.ink,borderRadius:7,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:a.done?NB.green:"#fff",cursor:"pointer"}}>
                    {a.done&&<svg width="10" height="8" viewBox="0 0 11 8" fill="none"><path d="M1 4l3 3 6-6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  </div>
                  <div style={{flex:1,minWidth:0}}>

        </div>}
      </div>
