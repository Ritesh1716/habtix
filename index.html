  rCard:22,rBtn:16,rIcon:14,rPill:999,
  font:"'Baloo 2',sans-serif"
};

function findObstacleDef(id){return OBSTACLES.find(o=>o.id===id)||null;}
// "Sounds like" pills — pure narrative flavor, zero tracked state, no production cost
// beyond this list. Not minions (those are the real sub-bars above) — just color.
const OBSTACLE_FLAVOR={
  procrastination:["I'll start tomorrow","Just one more video","Perfect time","Overthinking"],
  distraction:["Just 5 minutes","One more scroll","I'll focus after this","Notification check"],
  doubt:["What if I fail?","Not ready yet","Someone else does it better","Need more research first"],
  breaker:["I'll restart Monday","Missed one, ruined it","Too far behind now","No point today"],
  overload:["I'll add this too","So many things to fix","Starting fresh feels good","One more won't hurt"],
  erraticrhythm:["I'll catch up this weekend","Whenever I get to it","No fixed time anyway","I'm not a morning person... or evening"],
  goalhopping:["This one's better anyway","I lost interest in the old one","New year, new goal","Starting over is exciting"]
};
function clamp100(n){return Math.max(0,Math.min(100,Math.round(n)));}

// Same fallback chain the rest of the codebase already uses for "when did this
// habit start" (createdAt → earliest log entry → id timestamp) — matched here
// rather than assuming createdAt is always set, since it isn't.
function habitStartDate(h){
  if(h.createdAt)return h.createdAt;
  const logKeys=Object.keys(h.log||{}).sort();
  if(logKeys.length)return logKeys[0];
  return h.id?new Date(h.id).toLocaleDateString("en-CA"):td();
}

function lastNDates(n){
  const arr=[];
  for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);arr.push(d.toLocaleDateString("en-CA"));}
  return arr;// today first, oldest last
}
function tomorrowStr(){
  const d=new Date();d.setDate(d.getDate()+1);return d.toLocaleDateString("en-CA");
}
// The cap for "Add from actions list" (Plan Tomorrow / Edit Today): end of the
// current calendar week, or tomorrow — whichever is later. The "or tomorrow" part
// matters specifically on the last day of the week (Saturday), where the current
// week's own boundary is today, but tomorrow (Sunday, technically next week)
// still needs to be visible so the day's own planning isn't cut off by the
// boundary that's supposed to be a soft cap, not a hard wall between adjacent days.
function endOfCurrentWeekOrTomorrow(){
  const now=new Date();
  const dow=now.getDay();// 0=Sunday..6=Saturday
  const daysUntilSaturday=6-dow;
  const endOfWeek=new Date(now);
  endOfWeek.setDate(now.getDate()+daysUntilSaturday);
  const endOfWeekStr=endOfWeek.toLocaleDateString("en-CA");
  const tmr=tomorrowStr();
  return endOfWeekStr>tmr?endOfWeekStr:tmr;
}

// ── Time-of-day capsules — Rise / Momentum / Night ────────────────────────────
// Removed entirely (was here through v278). Explicit founder decision: it added
// more complexity than value, and reintroduced exactly the "too much on the
// dashboard" problem the whole redesign was trying to get away from. Today's
// actions are a single flat list now, and standalone/goal-actions no longer ask
// for a time-of-day at creation either.


// ── show-ups: did the user do ANYTHING that counts, on this date? ──
// Deliberately forgiving — one completed habit OR one completed goal action
// is enough, same "anything counts" spirit as isChallengeDayDone above.
function isShowUpDay(habits,goals,date){
  const habitDone=(habits||[]).some(h=>{
    const v=h.log?h.log[date]:undefined;
    return isFullDoneOn(h,date,v);
  });
  if(habitDone)return true;
  return (goals||[]).some(g=>(g.actions||[]).some(a=>a.doneAt===date));
}
// Analytics: % of that day's scheduled items actually completed. Deliberately NOT
// reading _scoreStore/scoreHistory — that pipeline is tied to the old Momentum Score
// (a blended, opaque 0-1000 number, cut from every UI surface as broken/confusing).
// This recomputes live from real habit/goal-action data instead, same "never trust a
// stored field" principle already used for streaks and the obstacle engine. Returns
// null (not 0) when nothing was scheduled that day, so charts can distinguish "did
// nothing" from "had nothing to do."
function completionPctForDate(habits,goals,date){
  let total=0,done=0;
  (habits||[]).forEach(h=>{
    if(habitStartDate(h)>date)return;
    total++;
    const v=h.log?h.log[date]:undefined;
    if(isFullDoneOn(h,date,v))done++;
  });
  (goals||[]).forEach(g=>(g.actions||[]).forEach(a=>{
    if(a.dueDate!==date)return;
    total++;
    if(a.done)done++;
  }));
  return total>0?Math.round(done/total*100):null;
}
// Real calendar-month averages for the Year view — not a "every 30th day" shortcut.
// Skips future days within the current month; skips days with nothing scheduled
// (completionPctForDate returning null) rather than counting them as 0%.
function monthlyAvgCompletion(habits,goals,monthsBack){
  const results=[];
  const now=new Date();
  for(let m=monthsBack-1;m>=0;m--){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-m);
    const year=d.getFullYear(),month=d.getMonth();
    const daysInMonth=new Date(year,month+1,0).getDate();
    let sum=0,count=0;
    for(let day=1;day<=daysInMonth;day++){
      const dt=new Date(year,month,day);
      if(dt>now)continue;
      const pct=completionPctForDate(habits,goals,dt.toLocaleDateString("en-CA"));
      if(pct!==null){sum+=pct;count++;}
    }
    results.push({label:d.toLocaleDateString("en-US",{month:"short"}),avg:count>0?Math.round(sum/count):null});
  }
  return results;
}
function showUpCountInWindow(habits,goals,days){
  return lastNDates(days).filter(d=>isShowUpDay(habits,goals,d)).length;
}
// Was anything actually expected on this date? Needed so Breaker's "missed"
// signal is measured against days something was due, not every calendar day —
// a goal-only user with a task not due until next week shouldn't read as 100%
// missed just because they have zero habits.
function hasExpectedActivity(habits,goals,date){
  const habitExpected=(habits||[]).some(h=>habitStartDate(h)<=date);
  if(habitExpected)return true;
  return (goals||[]).some(g=>(g.actions||[]).some(a=>a.dueDate&&a.dueDate<=date&&(!a.done||a.doneAt===date)));
}
function expectedDaysInWindow(habits,goals,days){
  return lastNDates(days).filter(d=>hasExpectedActivity(habits,goals,d)).length;
}
function missedExpectedDays(habits,goals,days){
  return lastNDates(days).filter(d=>hasExpectedActivity(habits,goals,d)&&!isShowUpDay(habits,goals,d)).length;
}
// Longest gap between consecutive show-up days, walked only across days
// something was expected — the "Broken Chains" signal. 0 means no gaps.
function longestShowUpGap(habits,goals,days){
  const expectedDates=lastNDates(days).slice().reverse().filter(d=>hasExpectedActivity(habits,goals,d));
  let maxGap=0,curGap=0;
  expectedDates.forEach(d=>{
    if(isShowUpDay(habits,goals,d)){curGap=0;}
    else{curGap++;if(curGap>maxGap)maxGap=curGap;}
  });
  return maxGap;
}

// Rolling window, recomputed fresh every call — this is what makes "no fixed
// campaign duration" work. Nothing to fail, nothing to restart; the number
// just reflects the last 7 days, always, today included.
const OBSTACLE_WINDOW=7;

// Returns raw 0-100 intensity per minion, built from real habit/goal fields —
// no new tracked data required except where flagged below.
// Per-obstacle window size for fair-start purposes: an obstacle only ever looks
// back as far as its own unlock date, capped at the normal 7 days. NOT safe to
// apply everywhere uniformly — see the per-obstacle notes below for which ones
// actually benefit from this and which ones would break the same way Doubt's
// grace period broke once already (shrinking a window that does an EXISTENCE
// check — "was there any real engagement in here" — can hide genuine recent
// activity and make someone look worse, not better protected). This is only
// safe for calculations where badness comes from the PRESENCE of a recent bad
// day/event, since shrinking then only excludes OLD bad data, never hides good.
function windowDaysFor(obstacleId){
  const rec=_obstacleStore.mastery[obstacleId];
  if(!rec||!rec.unlockedAt)return OBSTACLE_WINDOW;// no record yet — shouldn't matter, locked obstacles aren't evaluated
  const daysSinceUnlock=Math.floor((new Date(td())-new Date(rec.unlockedAt))/86400000)+1;// unlock day itself = day 1
  return Math.max(1,Math.min(OBSTACLE_WINDOW,daysSinceUnlock));
}

function minionSignals(habits,goals){
  const fullDates=lastNDates(OBSTACLE_WINDOW);
  const procDates=lastNDates(windowDaysFor("procrastination"));
  const distDates=lastNDates(windowDaysFor("distraction"));
  const allActions=(goals||[]).flatMap(g=>g.actions||[]);

  // PROCRASTINATION — completed later than planned, vs. still overdue right now.
  // Safe to window-shrink on unlock: badness here is the PRESENCE of a recent late-
  // completion event or a currently-overdue item, so a smaller window only ever
  // excludes OLD instances — it can't hide genuine recent good behavior the way an
  // existence-check can. leftForTomorrow additionally needs its own explicit fix,
  // separate from the general windowing above: it was never a lookback at all, just
  // "is anything overdue right now" with no time boundary — an item overdue for
  // three weeks before this obstacle even unlocked would count on unlock day one
  // otherwise, which predates the obstacle being visible at all.
  const procUnlockedAt=(_obstacleStore.mastery["procrastination"]&&_obstacleStore.mastery["procrastination"].unlockedAt)||"0000-00-00";
  const delayedStartActs=allActions.filter(a=>a.done&&a.doneAt&&a.dueDate&&a.doneAt>a.dueDate&&procDates.includes(a.doneAt));
  const leftForTomorrowActs=allActions.filter(a=>!a.done&&a.dueDate&&a.dueDate<td()&&a.dueDate>=procUnlockedAt);
  // Confirmed bug, now fixed: this only ever looked at goal-actions, even though
  // habits was a parameter of this whole function. leftForTomorrow's concept —
  // "still not done, past when it should have been" — extends naturally to
  // habits: a habit missed on a recent day it was expected is the same kind of
  // overdue as an unfinished goal-action past its due date. Counted as distinct
  // HABITS with at least one recent miss, not total missed days, so one habit
  // missed three days running still contributes the same +20 as a single overdue
  // goal-action — keeping both halves of this count on the same scale.
  // delayedStart deliberately stays goal-action-only: it measures completing
  // something LATER than planned, which needs a due-date-vs-completion-date
  // comparison. Habits only track WHICH DATE they were done, not what time —
  // there's no "late within the day" signal to read, so extending this one would
  // be inventing data the app doesn't have rather than fixing a real gap.
  const habitsWithRecentMiss=(habits||[]).filter(h=>{
    const startStr=habitStartDate(h);
    const relevantDates=procDates.filter(d=>d>=startStr&&d<td()&&d>=procUnlockedAt);
    return relevantDates.some(d=>!isFullDoneOn(h,d,h.log&&h.log[d]));
  });
  const delayedStart=clamp100(delayedStartActs.length*20);
  const leftForTomorrow=clamp100((leftForTomorrowActs.length+habitsWithRecentMiss.length)*20);

  // DISTRACTION — logged but under target, vs. no entry at all. Safe to window-
  // shrink: every day in the (possibly smaller) window gets evaluated on its own
  // merits, so there's no day that could hide real engagement — a smaller sample
  // just means a noisier early estimate that self-corrects as real days accumulate.
  let brokenFocusHits=0,skippedHits=0,trackedDays=0;
  (habits||[]).forEach(h=>{
    const startStr=habitStartDate(h);
    distDates.forEach(d=>{
      if(startStr>d)return;// habit didn't exist yet on this date
      trackedDays++;
      const v=h.log?h.log[d]:undefined;
      if(v==null){skippedHits++;return;}
      if(!isFullDoneOn(h,d,v))brokenFocusHits++;// logged something, didn't hit target
    });
  });
  const brokenFocus=trackedDays?clamp100(brokenFocusHits/trackedDays*140):0;
  const skipped=trackedDays?clamp100(skippedHits/trackedDays*140):0;

  // DOUBT — goals with zero movement this window, vs. goals never started at all.
  // Only evaluates goals that have actually had a chance to show the pattern —
  // same principle as the Breaker fix above: a goal whose only action isn't due
  // for another 5 days isn't "doubt," it's just new. Goals with no dated actions
  // at all are always eligible (there's no "not due yet" to wait out).
  //
  // Deliberately NOT windowed by unlock date, even though every other obstacle in
  // this batch is. This check is an EXISTENCE test ("was there any completion in
  // here") — the exact shape that broke once already when Doubt's grace period
  // tried shrinking this same kind of window: it can hide a real, recent
  // completion that happens to fall just outside a freshly-shrunk window, making a
  // genuinely-engaged goal look stalled. It doesn't need an unlock-date fix for a
  // more fundamental reason anyway — a stalled goal is reporting a CURRENT, ongoing
  // truth ("is this goal moving right now"), not blaming someone for a past static
  // fact the way Procrastination's overdue-item check would. That truth is real
  // regardless of when the obstacle mechanically became visible.
  const goalHasHadAChance=g=>{
    const acts=g.actions||[];
    if(acts.some(a=>a.dueDate&&a.dueDate<=td()))return true;
    return !acts.some(a=>a.dueDate);
  };
  const activeGoals=(goals||[]).filter(g=>!g.movedToHistory&&(g.actions||[]).length>0&&goalHasHadAChance(g));
  const stalledGoals=activeGoals.filter(g=>!(g.actions||[]).some(a=>a.doneAt&&fullDates.includes(a.doneAt)));
  // Confirmed bug, now fixed: this only ever looked at goals, even though habits
  // was a parameter of this whole function. Both minions extend naturally to
  // habits — "zero movement in the window" and "never started since creation"
  // are exactly as meaningful for a habit as for a goal. A habit only counts
  // once it's existed long enough to have had a chance (matches goalHasHadAChance's
  // own principle, just simpler: a habit's very existence as of a date IS its due
  // date, there's no separate future-dated first action to wait out the way a
  // goal can have).
  const habitHasHadAChanceForDoubt=h=>habitStartDate(h)<=td();
  const activeHabitsForDoubt=(habits||[]).filter(habitHasHadAChanceForDoubt);
  const stalledHabits=activeHabitsForDoubt.filter(h=>{
    const log=h.log||{};
    return !fullDates.some(d=>log[d]!=null&&isFullDoneOn(h,d,log[d]));
  });
  const doubtTrackableTotal=activeGoals.length+activeHabitsForDoubt.length;
  const doubtStalledTotal=stalledGoals.length+stalledHabits.length;
  const stalledStarts=doubtTrackableTotal?clamp100(doubtStalledTotal/doubtTrackableTotal*100):0;
  // BUILD NOTE: "Second-Guessed" is meant to read reschedule/edit frequency, but
  // actions don't carry an edit counter yet (see saveEditA). Approximated for now
  // from goals with zero completed actions since creation — closest signal already
  // in the data. Add a real rescheduleCount field on the action object later if this
  // obstacle ships and the approximation proves too blunt.
  const neverStarted=activeGoals.filter(g=>!(g.actions||[]).some(a=>a.done));
  const neverStartedHabits=activeHabitsForDoubt.filter(h=>{
    const log=h.log||{};
    return !Object.keys(log).some(d=>isFullDoneOn(h,d,log[d]));
  });
  const doubtNeverStartedTotal=neverStarted.length+neverStartedHabits.length;
  const secondGuessed=doubtTrackableTotal?clamp100(doubtNeverStartedTotal/doubtTrackableTotal*80):0;

  // BREAKER — days with zero show-up, and the longest run of consecutive misses.
  // Measured only against days something was actually expected (see
  // hasExpectedActivity) — a user with no habits and nothing due yet reads as
  // 0, not 100, since there was nothing to have shown up for. Safe to window-
  // shrink for the same reason as Distraction: both the miss-rate and the longest-
  // gap are computed fresh from whatever days are actually in the window, so a
  // smaller window can't hide real recent show-ups.
  const breakerWindow=windowDaysFor("breaker");
  const expectedDays=expectedDaysInWindow(habits,goals,breakerWindow);
  const missedShowUps=expectedDays>0?clamp100(missedExpectedDays(habits,goals,breakerWindow)/expectedDays*100):0;
  const gap=longestShowUpGap(habits,goals,breakerWindow);
  const brokenChains=clamp100(gap*28);

  // OVERLOAD — created a wave of habits/goals and isn't actually keeping up with them,
  // vs. things created a while ago that quietly went untouched. Pro-only; uses createdAt
  // (same fallback chain as habitStartDate) + existing completion data, no new fields.
  const trackables=[
    ...(habits||[]).map(h=>({kind:"habit",item:h,createdAt:habitStartDate(h)})),
    ...(goals||[]).filter(g=>!g.movedToHistory).map(g=>({kind:"goal",item:g,createdAt:g.createdAt||td()}))
  ];
  const daysOld=t=>Math.floor((new Date(td())-new Date(t.createdAt))/86400000);
  const engagementRate=t=>{
    if(t.kind==="habit"){
      const log=t.item.log||{};
      const entries=Object.keys(log).filter(d=>d>=t.createdAt&&d<=td());
      if(entries.length===0)return 0;
      return entries.filter(d=>isFullDoneOn(t.item,d,log[d])).length/entries.length;
    }
    const acts=t.item.actions||[];
    if(acts.length===0)return 0;
    return acts.filter(a=>a.done).length/acts.length;
  };
  const recentlyCreated=trackables.filter(t=>{const d=daysOld(t);return d>=0&&d<=14;});
  const pileUpCandidates=recentlyCreated.filter(t=>engagementRate(t)<0.2);
  const pileUp=recentlyCreated.length?clamp100(pileUpCandidates.length/recentlyCreated.length*100):0;
  const olderCreated=trackables.filter(t=>daysOld(t)>10);
  const abandonedCandidates=olderCreated.filter(t=>engagementRate(t)<0.15);
  const abandonedFast=olderCreated.length?clamp100(abandonedCandidates.length/olderCreated.length*100):0;

  // ERRATIC RHYTHM — inconsistency in WHICH days a habit gets done (day-to-day flips),
  // and completions clustering into bursts followed by silence instead of steady
  // pacing. Deliberately NOT clock-time based — only the date a habit was logged is
  // tracked, not what time of day, so this reads the pattern that's actually there.
  // Safe to window-shrink on unlock, same reasoning as Distraction: every date
  // evaluated is judged on its own, so a smaller window can't hide real engagement.
  const rhythmDates=lastNDates(windowDaysFor("erraticrhythm"));
  let transitionSum=0,transitionHabits=0,burstSum=0,burstHabits=0;
  (habits||[]).forEach(h=>{
    const startStr=habitStartDate(h);
    const relevantDates=rhythmDates.filter(d=>d>=startStr);
    if(relevantDates.length<4)return;// not enough history to judge a rhythm yet
    const flags=relevantDates.map(d=>isFullDoneOn(h,d,h.log&&h.log[d])?1:0);
    let transitions=0;
    for(let i=1;i<flags.length;i++){if(flags[i]!==flags[i-1])transitions++;}
    transitionSum+=transitions/(flags.length-1);transitionHabits++;
    let sawBurstThenGap=0,i=0;
    while(i<flags.length){
      if(flags[i]===1){
        let burstLen=0;while(i<flags.length&&flags[i]===1){burstLen++;i++;}
        let gapLen=0;while(i<flags.length&&flags[i]===0){gapLen++;i++;}
        if(burstLen>=2&&gapLen>=2)sawBurstThenGap=1;
      }else i++;
    }
    burstSum+=sawBurstThenGap;burstHabits++;
  });
  const scatteredDays=transitionHabits?clamp100(transitionSum/transitionHabits*140):0;
  const bingeThenBust=burstHabits?clamp100(burstSum/burstHabits*100):0;

  // GOAL-HOPPING — starting new goals instead of finishing old ones. Deliberately
  // different from Doubt's Stalled Starts: that measures whether a goal has stalled at
  // all; this measures the specific churn pattern of starting fresh ones while older
  // ones sit untouched, so the two don't just re-report the same underlying thing.
  // Deliberately NOT windowed by unlock date, same reasoning as Doubt just above —
  // both checks here are existence tests over the window, and both are reporting a
  // current ongoing truth (is this goal quiet, are older goals stalled) rather than
  // a resolvable past fact, so there's no unfairness to correct for on unlock day.
  const activeGoalsGH=(goals||[]).filter(g=>!g.movedToHistory);
  const goalAge=g=>Math.floor((new Date(td())-new Date(g.createdAt||td()))/86400000);
  const eligibleForAbandon=activeGoalsGH.filter(g=>{const a=goalAge(g);return a>=5&&a<=30;});
  const abandonCandidates=eligibleForAbandon.filter(g=>!(g.actions||[]).some(a=>a.doneAt&&fullDates.includes(a.doneAt)));
  const fastAbandon=eligibleForAbandon.length?clamp100(abandonCandidates.length/eligibleForAbandon.length*100):0;
  const recentGoals=activeGoalsGH.filter(g=>{const a=goalAge(g);return a>=0&&a<=14;});
  const stalledOlderGoals=activeGoalsGH.filter(g=>{
    const a=goalAge(g);
    return a>14&&!(g.actions||[]).some(act=>act.doneAt&&fullDates.includes(act.doneAt));
  });
  const creationSpree=(stalledOlderGoals.length>0)?clamp100(recentGoals.length*25):0;

  return{
    procrastination:{delayedStart,leftForTomorrow},
    distraction:{brokenFocus,skipped},
    doubt:{stalledStarts,secondGuessed},
    breaker:{missedShowUps,brokenChains},
    overload:{pileUp,abandonedFast},
    erraticrhythm:{scatteredDays,bingeThenBust},
    goalhopping:{fastAbandon,creationSpree}
  };
}
// Boss-level signal = average of its two minions
function bossSignal(id,signals){
  const m=signals[id];if(!m)return 0;
  const vals=Object.values(m);
  return Math.round(vals.reduce((s,v)=>s+v,0)/vals.length);
}

// ── thresholds ──
const OBSTACLE_ACTIVE_THRESHOLD=35;      // boss signal at/above this = Active (never-mastered, or already-lost)
const OBSTACLE_MASTERY_MAX=15;           // a day counts as "clean" at/below this signal
const OBSTACLE_MASTERY_HOLD_DAYS=12;     // need this many clean days...
const OBSTACLE_MASTERY_WINDOW_DAYS=14;   // ...within this trailing rolling window to master —
                                          // NOT a consecutive streak. One or two rough days don't
                                          // erase progress; they just don't count toward the 12,
                                          // and age out of the window on their own after 14 days,
                                          // same self-healing rolling-window principle already
                                          // used for the signal itself. Replaces the old cleanStreak
                                          // counter, which reset to zero on a single missed day —
                                          // directly in tension with the rest of this app's
                                          // forgiving-not-punishing philosophy.
const OBSTACLE_WARNING_THRESHOLD=35;     // while HOLDING mastery: 35-49% = warning only, mastery
                                          // still intact — reuses the same number as "active" for
                                          // a never-mastered obstacle, deliberately, so "this is a
                                          // real concern" means the same thing everywhere
const OBSTACLE_REVIVAL_THRESHOLD=50;     // while HOLDING mastery: this or above = actually lost,
                                          // flips to Fighting Back, climb starts over from zero.
                                          // Meaningfully higher than the warning threshold on
                                          // purpose — losing something already earned should take
                                          // more than the same bar that made it "active" in the
                                          // first place.
const OBSTACLE_MIN_DATA_DAYS=3;          // less real history than this = "Building" state
const DOUBT_GRACE_DAYS=3;                // Doubt only: for this many days right after
                                          // (re-)achieving mastery, a stale goal can't cost it
                                          // the fresh mastery immediately — suppresses the
                                          // revival CONSEQUENCE only (see advanceObstacleMastery).
                                          // The raw signal and the live warning band are both
                                          // untouched; an earlier version tried shrinking the
                                          // measurement window instead and that was wrong — it
                                          // made genuine recent activity invisible rather than
                                          // protecting anything. Doubt-specific because its math
                                          // is goal-count-based, not day-rate-based like the other
                                          // three — the one obstacle that can jump with almost no
                                          // natural warning otherwise.

// ── persisted mastery store — module-level, same load/snapshot pattern as _scoreStore ──
// obstacleMastery: { [bossId]: {masteredAt,cleanDays,lastCheck,revived,revivedAt} }
// cleanDays: {[dateStr]: true|false} — rolling log of clean/not-clean days for the CURRENT
// climb attempt only. Reset to {} the moment mastery is first achieved (no longer needed
// while holding) and again the moment mastery is lost (a fresh climb needs to earn its own
// 12-of-14, not inherit history from before the loss).
const _obstacleStore={mastery:{}};
function loadObstacleStore(d){
  _obstacleStore.mastery=(d&&d.obstacleMastery&&typeof d.obstacleMastery==="object")?{...d.obstacleMastery}:{};
}
function snapshotObstacleStore(){return{obstacleMastery:{..._obstacleStore.mastery}};}

function cleanDayCount(cleanDays){
  if(!cleanDays)return 0;
  return Object.values(cleanDays).filter(Boolean).length;
}
// The earliest recorded clean day since cleanDays was last reset — i.e. when the current
// climb attempt actually began. Derived, not stored separately, so it can never drift out
// of sync with cleanDays itself.
function climbStartedAt(cleanDays){
  if(!cleanDays)return null;
  const trueDays=Object.keys(cleanDays).filter(d=>cleanDays[d]).sort();
  return trueDays.length?trueDays[0]:null;
}

// Advances each boss's mastery tracking by one day. Idempotent per calendar day — safe to
// call on every load, matching the existing pattern.
// ── Sequential unlock ──────────────────────────────────────────────────────
// Only one obstacle is ever the "current" thing being climbed, for everyone, free
// or Pro. Locked obstacles don't exist yet at all — no background tracking, no
// signal computed. Position 0 (Inertia) is always unlocked; every other position
// unlocks permanently the first time the obstacle immediately before it in this
// exact order has EVER been mastered — "ever," not "currently holding," so a later
// obstacle stays unlocked even if an earlier one later needs defending again.
// Free tier's progression through this chain simply stops after Doubt (position 3)
// until Pro is purchased — the tier check below is a ceiling on top of this
// ordering, not a separate visibility system.
const OBSTACLE_UNLOCK_ORDER=["inertia","procrastination","distraction","doubt","breaker","overload","erraticrhythm","goalhopping"];

function isObstacleEverCompleted(id){
  if(id==="inertia"){
    const rec=_obstacleStore.mastery["inertia"];
    return !!(rec&&rec.allDoneAt);
  }
  const rec=_obstacleStore.mastery[id];
  return !!(rec&&rec.masteredAt);
}
function isObstacleUnlocked(id){
  const idx=OBSTACLE_UNLOCK_ORDER.indexOf(id);
  if(idx<=0)return true;// Inertia, or an unrecognized id — never gate an id we don't know
  return isObstacleEverCompleted(OBSTACLE_UNLOCK_ORDER[idx-1]);
}

function advanceObstacleMastery(habits,goals,pk,standaloneActions){
  const today=td();
  let justMasteredId=null;// any mastery-threshold crossing this call — first-ever or
                           // a recovery after a setback. The caller uses this to detect
                           // off-screen achievements (Batch 8) and the free→Pro
                           // transition moment (Batch 7, independently gated so a later
                           // Doubt recovery can't re-trigger it)
  let inertiaDay7Popup=null;// {showUpCount,otherCount,mastered} — fires exactly once,
                             // on the 7th calendar day of the FIRST check-in window,
                             // regardless of whether mastery was actually reached by then

  // Inertia evaluated first, not last — it's position 0 in the unlock chain, so
  // Procrastination's unlock check (right below) needs to see today's completion
  // immediately if this is the exact day Inertia finishes, rather than waiting
  // until the next call. Same reasoning cascades down the whole chain: whichever
  // obstacle masters today unlocks the next one in this same pass, not tomorrow.
  const inertiaRec=_obstacleStore.mastery["inertia"]||{everPlannedTomorrow:false,allDoneAt:null,unlockedAt:null,checkInStartedAt:null,checkInDays:{},day7PopupShownAt:null};
  if(!inertiaRec.unlockedAt)inertiaRec.unlockedAt=today;
  if(!inertiaRec.checkInDays)inertiaRec.checkInDays={};

  if(!inertiaRec.allDoneAt){
    // Stage 1: the 4-item checklist starts the check-in window the moment it's
    // first fully complete — set once, never re-evaluated after.
    if(!inertiaRec.checkInStartedAt&&inertiaChecklist(habits,goals).checklistDone){
      inertiaRec.checkInStartedAt=today;
    }
    // Stage 2: once the window has started, record today's stats (idempotent — only
    // once per calendar day, same guard shape as every other obstacle's daily
    // advance) and check both the rolling mastery bars and the one-time day-7 popup.
    if(inertiaRec.checkInStartedAt&&inertiaRec.checkInDays[today]===undefined){
      inertiaRec.checkInDays[today]=computeInertiaDailyStats(habits,goals,standaloneActions,today);
      // Trim to 30 days back — only the trailing 7 ever matter for the rolling
      // calculation, but a little extra headroom costs nothing and avoids trimming
      // right at the edge of what's still relevant.
      const trimCutoff=new Date(new Date(today).getTime()-29*86400000).toLocaleDateString("en-CA");
      Object.keys(inertiaRec.checkInDays).forEach(d=>{if(d<trimCutoff)delete inertiaRec.checkInDays[d];});

      const{showUpCount,otherCount}=inertiaRollingStats(inertiaRec.checkInDays,today);
      const mastered=showUpCount>=5&&otherCount>=3;
      if(mastered){
        inertiaRec.allDoneAt=today;
        justMasteredId="inertia";
      }
      // Day-7 popup: exactly once, on the 7th calendar day since the window started,
      // regardless of whether the bars above were actually met. Tone in the popup
      // itself is gated by a DIFFERENT threshold (3, not 5) than the mastery bars —
      // computed and shown by the component that reads this, not decided here.
      const daysSinceCheckIn=Math.floor((new Date(today)-new Date(inertiaRec.checkInStartedAt))/86400000)+1;
      if(daysSinceCheckIn===7&&!inertiaRec.day7PopupShownAt){
        inertiaRec.day7PopupShownAt=today;
        inertiaDay7Popup={showUpCount,otherCount,mastered};
      }
    }
  }
  _obstacleStore.mastery["inertia"]=inertiaRec;

  const signals=minionSignals(habits,goals);
  // Only obstacles that are BOTH unlocked (per the chain) AND within this user's
  // tier get tracked at all — nothing advances silently in the background for a
  // locked obstacle, matching the same "no surprise pre-existing progress" reasoning
  // already applied to tier-gating before this.
  OBSTACLES.forEach(o=>{
    if(!isObstacleUnlocked(o.id))return;
    if(!(pk==="pro"||o.tier==="free"))return;
    const rec=_obstacleStore.mastery[o.id]||{masteredAt:null,cleanDays:{},lastCheck:null,revived:false,revivedAt:null,unlockedAt:null};
    if(!rec.cleanDays)rec.cleanDays={};// migrate any pre-existing cleanStreak-only record safely
    if(!rec.unlockedAt)rec.unlockedAt=today;// permanent, set exactly once, the day it unlocks
    if(rec.lastCheck===today){_obstacleStore.mastery[o.id]=rec;return;}

    const sig=bossSignal(o.id,signals);
    const isHolding=!!(rec.masteredAt&&!rec.revived);

    if(isHolding){
      // Doubt-only grace: for a few days right after (re-)achieving mastery, a goal
      // that was already stale going in can't immediately cost Doubt its fresh
      // mastery. This suppresses the CONSEQUENCE only — the signal itself, and the
      // live warning band shown in currentObstacleState, are completely unaffected,
      // so the person still sees an honest heads-up if something's elevated. Doubt
      // specifically because it's the one obstacle that can jump with almost no
      // warning (as few as 2 active goals), unlike the other three which give
      // several real days of runway just from how their math is shaped.
      if(o.id==="doubt"){
        const daysSinceMastered=Math.floor((new Date(today)-new Date(rec.masteredAt))/86400000)+1;
        if(daysSinceMastered>=1&&daysSinceMastered<=DOUBT_GRACE_DAYS){
          rec.lastCheck=today;_obstacleStore.mastery[o.id]=rec;return;
        }
      }
      if(sig>=OBSTACLE_REVIVAL_THRESHOLD){
        rec.revived=true;rec.revivedAt=today;rec.cleanDays={};// fresh climb starts now
      }
    }else{
      // Climbing — either toward first mastery, or re-climbing after a loss.
      rec.cleanDays[today]=sig<=OBSTACLE_MASTERY_MAX;
      const cutoff=new Date(new Date(today).getTime()-(OBSTACLE_MASTERY_WINDOW_DAYS-1)*86400000).toLocaleDateString("en-CA");
      Object.keys(rec.cleanDays).forEach(d=>{if(d<cutoff)delete rec.cleanDays[d];});
      if(cleanDayCount(rec.cleanDays)>=OBSTACLE_MASTERY_HOLD_DAYS){
        rec.masteredAt=today;rec.revived=false;rec.revivedAt=null;rec.cleanDays={};
        justMasteredId=o.id;// first-ever mastery or a recovery after a setback — both
                             // deserve the toast; the Pro-transition modal below is
                             // separately protected by its own one-time "shown" flag,
                             // so broadening this doesn't risk re-triggering it
      }
    }
    rec.lastCheck=today;
    _obstacleStore.mastery[o.id]=rec;
  });
  return{justMasteredId,inertiaDay7Popup};
}

// ── INERTIA — the one obstacle everyone starts with. Unlike the other 7, mastery
// isn't just crossing a signal threshold: the 4-item checklist below (onboarding,
// first life-action, first goal, first plan) only STARTS a 7-day check-in window —
// mastery requires actually showing up during it. Still fundamentally one-time and
// permanent once earned, same as before, just a real week of proving it now instead
// of an instant checklist tick.
const INERTIA_CHECKLIST=[
  {id:"onboarding",label:"Complete onboarding",icon:"👋",check:(h,g,rec)=>localStorage.getItem("hg_onboard_done")==="1"},
  {id:"firstHabit",label:"Set your first life-action",icon:"🔥",check:(h,g,rec)=>(h||[]).length>0},
  {id:"firstGoal",label:"Set your first goal",icon:"🎯",check:(h,g,rec)=>(g||[]).length>0},
  {id:"plannedTomorrow",label:"Plan tomorrow once",icon:"📋",check:(h,g,rec)=>!!(rec&&rec.everPlannedTomorrow)},
];
// A day counts as "showed up" if ANYTHING was completed (life-action or otherwise);
// otherCount specifically excludes life-actions — only goal-actions and standalone
// actions count toward the 3-actions requirement, by explicit founder decision
// ("3 actions other than life actions, of independent or goals" — either kind of
// one-time action counts, recurring life-actions don't).
function computeInertiaDailyStats(habits,goals,standaloneActions,dateStr){
  const habitShowedUp=(habits||[]).some(h=>isFullDoneOn(h,dateStr,h.log&&h.log[dateStr]));
  const goalActionsToday=(goals||[]).flatMap(g=>g.actions||[]).filter(a=>a.doneAt===dateStr).length;
  const standaloneActionsToday=(standaloneActions||[]).filter(a=>a.doneAt===dateStr).length;
  const otherCount=goalActionsToday+standaloneActionsToday;
  return{showedUp:habitShowedUp||otherCount>0,otherCount};
}
// Trailing 7 calendar days INCLUDING today — same rolling-window shape already
// proven correct for the other 7 obstacles' 12-of-14 mechanic, applied here at a
// smaller scale (5-of-7 show-ups, 3 other-actions) rather than inventing a
// differently-shaped mechanic just for this one obstacle.
function inertiaRollingStats(checkInDays,today){
  if(!checkInDays)return{showUpCount:0,otherCount:0};
  const cutoff=new Date(new Date(today).getTime()-6*86400000).toLocaleDateString("en-CA");
  const relevant=Object.keys(checkInDays).filter(d=>d>=cutoff&&d<=today);
  const showUpCount=relevant.filter(d=>checkInDays[d].showedUp).length;
  const otherCount=relevant.reduce((sum,d)=>sum+(checkInDays[d].otherCount||0),0);
  return{showUpCount,otherCount};
}
// Pure read — never mutates the store. everPlannedTomorrow is the one checklist item
// that genuinely needs a persisted flag (tomorrowPlan itself gets overwritten daily,
// so "does it currently exist" can't answer "was this ever done"); the rest are
// safely derivable live from data that only ever accumulates or an existing flag.
//
// checklistDone (the 4 items) and allDone (real mastery) are DELIBERATELY separate
// now, where they used to be the same moment — completing the checklist only starts
// the 7-day window; allDone still only ever becomes true via the permanent allDoneAt
// stamp, matching the same "defeated once, permanently, no revival" guarantee as
// before. checkInStats is live-computed for display only, never used to gate
// anything itself — advanceObstacleMastery is the only place that decides mastery.
function inertiaChecklist(habits,goals){
  const rec=_obstacleStore.mastery["inertia"]||{everPlannedTomorrow:false,allDoneAt:null,checkInStartedAt:null,checkInDays:{}};
  const items=INERTIA_CHECKLIST.map(c=>({id:c.id,label:c.label,icon:c.icon,done:c.check(habits,goals,rec)}));
  const checklistDone=items.every(i=>i.done);
  const allDone=!!rec.allDoneAt;
  let checkInStats=null;
  if(rec.checkInStartedAt&&!rec.allDoneAt){
    checkInStats=inertiaRollingStats(rec.checkInDays||{},td());
  }
  return{items,checklistDone,allDone,rec,checkInStarted:!!rec.checkInStartedAt,checkInStats};
}

function daysSinceEarliest(habits){
  if(!habits||habits.length===0)return 0;
  const earliestStr=habits.reduce((min,h)=>{
    const s=habitStartDate(h);
    return (!min||s<min)?s:min;
  },null);
  if(!earliestStr)return 0;
  return Math.floor((Date.now()-new Date(earliestStr))/86400000);
}

// ── the single source of truth the UI reads ──
// Returns {mode:"active"|"guarded"|"building", obstacle, signal, minions, mastery, ...}
// "active" — a pattern is currently elevated (never-mastered, or mastery genuinely lost);
//   minions show what today's actions weaken.
// "guarded" — nothing elevated enough to be "active". Three sub-cases, in priority order:
//   a held mastery currently in its 35-49% warning band (warning:true) takes priority over
//   progress toward a first/fresh mastery (daysToMastery), which takes priority over a
//   calmly-held mastery with nothing at risk (maintaining:true). Never renders empty.
// "building" — not enough real history yet to read a pattern honestly.
function currentObstacleState(habits,goals,pk){
  // Inertia preempts everything else — it needs no multi-day history at all, so it
  // fills exactly the dead time that used to just say "still learning your patterns."
  // Once complete, it never shows again; normal flow resumes below.
  const inertia=inertiaChecklist(habits,goals);
  if(!inertia.allDone){
    return{mode:"inertia",items:inertia.items,checklistDone:inertia.checklistDone,checkInStarted:inertia.checkInStarted,checkInStats:inertia.checkInStats};
  }

  const hasHabitHistory=(habits||[]).length>0;
  const hasGoalHistory=(goals||[]).some(g=>(g.actions||[]).length>0);
  const trackedDays=hasHabitHistory?Math.min(OBSTACLE_WINDOW,daysSinceEarliest(habits)):(hasGoalHistory?OBSTACLE_WINDOW:0);
  if(trackedDays<OBSTACLE_MIN_DATA_DAYS){
    return{mode:"building",daysNeeded:OBSTACLE_MIN_DATA_DAYS-trackedDays};
  }

  const visible=OBSTACLES.filter(o=>isObstacleUnlocked(o.id)&&(pk==="pro"||o.tier==="free"));
  const signals=minionSignals(habits,goals);
  const today=td();
  const scored=visible.map(o=>{
    const mastery=_obstacleStore.mastery[o.id]||{masteredAt:null,cleanDays:{},revived:false,unlockedAt:null};
    // Unlock-day override: nothing has had a fair chance to be judged yet on the
    // exact day an obstacle unlocks, so it always presents as freshly-starting
    // (100%/full, "climbing") regardless of what the real signal already says —
    // extending the same "hasn't had a chance yet" principle Doubt's own math
    // already uses for brand-new goals, one level up to the obstacle itself. Real
    // evaluation, including the possibility of showing active immediately, begins
    // the following day. Nothing stored is touched by this — advanceObstacleMastery
    // still tracks the real signal and whether today counts as a clean day,
    // completely honestly; only what's shown for selection purposes is overridden,
    // and only for this one day.
    const isUnlockDay=mastery.unlockedAt===today;
    return{
      def:o,
      signal:isUnlockDay?0:bossSignal(o.id,signals),
      minions:signals[o.id],
      mastery
    };
  });

  // Active = highest-signal boss at/above threshold. A held mastery only enters this pool
  // once it's actually crossed the full revival threshold, not just the warning band —
  // otherwise every obstacle sitting quietly in warning territory would incorrectly take
  // over the whole card as if it were already lost.
  const activeCandidates=scored.filter(s=>{
    const isHeld=!!(s.mastery.masteredAt&&!s.mastery.revived);
    return isHeld?s.signal>=OBSTACLE_REVIVAL_THRESHOLD:s.signal>=OBSTACLE_ACTIVE_THRESHOLD;
  });
  if(activeCandidates.length>0){
    activeCandidates.sort((a,b)=>b.signal-a.signal);
    const top=activeCandidates[0];
    return{mode:"active",obstacle:top.def,signal:top.signal,minions:top.minions,
      mastery:top.mastery,returning:!!top.mastery.masteredAt};
  }

  // Guarded — nothing active. Priority: a held mastery at risk (warning) beats one still
  // climbing, which beats one calmly holding with nothing at risk.
  const held=scored.filter(s=>s.mastery.masteredAt&&!s.mastery.revived);
  const atRisk=held.filter(s=>s.signal>=OBSTACLE_WARNING_THRESHOLD);
  if(atRisk.length>0){
    atRisk.sort((a,b)=>b.signal-a.signal);
    const top=atRisk[0];
    return{mode:"guarded",obstacle:top.def,signal:top.signal,minions:top.minions,
      mastery:top.mastery,warning:true};
  }

  const climbing=scored.filter(s=>!(s.mastery.masteredAt&&!s.mastery.revived));
  if(climbing.length>0){
    climbing.sort((a,b)=>cleanDayCount(b.mastery.cleanDays)-cleanDayCount(a.mastery.cleanDays));
    const closest=climbing[0];
    const isUnlockDay=closest.mastery.unlockedAt===today;
    const clean=isUnlockDay?0:cleanDayCount(closest.mastery.cleanDays);
    const startedAt=climbStartedAt(closest.mastery.cleanDays);
    return{mode:"guarded",obstacle:closest.def,signal:closest.signal,minions:closest.minions,
      mastery:closest.mastery,daysToMastery:OBSTACLE_MASTERY_HOLD_DAYS-clean,
      justCrossed:!isUnlockDay&&startedAt===td()};// true only on the exact day it first dipped to <=15% this attempt
  }

  if(held.length>0){
    held.sort((a,b)=>a.mastery.masteredAt.localeCompare(b.mastery.masteredAt));
    const longest=held[0];
    return{mode:"guarded",obstacle:longest.def,signal:longest.signal,minions:longest.minions,
      mastery:longest.mastery,maintaining:true};
  }
  return{mode:"building",daysNeeded:0};
}

// Same per-obstacle state shape currentObstacleState already computes for whichever
// obstacle it auto-selects as "featured" — this does the identical branching, but for
// ONE SPECIFIC obstacle regardless of whether it would actually win that selection.
// Needed so the Your Obstacles grid can let someone browse any unlocked obstacle's
// real data (G6) without that browsing ever touching what Today's card shows —
// deliberately NOT reusing currentObstacleState itself, since its whole job is
// picking the single best-priority obstacle across all of them, not a specific one.
function computeSpecificObstacleState(obstacleId,habits,goals){
  const def=OBSTACLES.find(o=>o.id===obstacleId);
  if(!def)return null;
  const signals=minionSignals(habits,goals);
  const signal=bossSignal(obstacleId,signals);
  const minions=signals[obstacleId];
  const mastery=_obstacleStore.mastery[obstacleId]||{masteredAt:null,cleanDays:{},revived:false};
  const isHeld=!!(mastery.masteredAt&&!mastery.revived);
  if(isHeld){
    if(signal>=OBSTACLE_REVIVAL_THRESHOLD)return{mode:"active",obstacle:def,signal,minions,mastery,returning:true};
    if(signal>=OBSTACLE_WARNING_THRESHOLD)return{mode:"guarded",obstacle:def,signal,minions,mastery,warning:true};
    return{mode:"guarded",obstacle:def,signal,minions,mastery,maintaining:true};
  }
  if(signal>=OBSTACLE_ACTIVE_THRESHOLD)return{mode:"active",obstacle:def,signal,minions,mastery,returning:false};
  const clean=cleanDayCount(mastery.cleanDays);
  const startedAt=climbStartedAt(mastery.cleanDays);
  return{mode:"guarded",obstacle:def,signal,minions,mastery,daysToMastery:OBSTACLE_MASTERY_HOLD_DAYS-clean,justCrossed:startedAt===td()};
}

// H5: Pomodoro↔Habit time link — detects whether a habit's goalUnit is a time unit (min/hr) so it's eligible to link with Pomodoro sessions.
// Contains-match (not exact) so "mins/day", "hrs daily", "hour of study" etc. are still detected.
function isTimeUnit(unit){
  if(!unit)return false;
  return /(min|mins|minute|minutes|hr|hrs|hour|hours)/i.test(unit.trim());
}
// Returns how many of the habit's units equal 1 minute of focus time (e.g. "hr" habit → 60 min = 1 unit)
function timeUnitMinutesMultiplier(unit){
  return /(hr|hrs|hour|hours)/i.test((unit||"").trim())?60:1;
}
// Item 29: Monthly Habits Completed line graph — top-level so it's callable from any component (AnalyticsPage). Replaces the redundant Analytics 90-Day Heatmap; per-habit heatmaps still live on each habit's detail page.
function MonthlyHabitsGraph({habits,t,monthOffset,setMonthOffset}){
  const now=new Date();
  const viewDate=new Date(now.getFullYear(),now.getMonth()+monthOffset,1);
  const vy=viewDate.getFullYear(),vm=viewDate.getMonth();
  const daysInMonth=new Date(vy,vm+1,0).getDate();
  const monthLabel=viewDate.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const isCurMonth=vy===now.getFullYear()&&vm===now.getMonth();
  // Item 32: don't draw the line past today for the current month — future days have no data yet
  const effectiveDays=isCurMonth?now.getDate():daysInMonth;
  const dayCounts=Array.from({length:daysInMonth},(_,i)=>{
    const dateStr=vy+"-"+String(vm+1).padStart(2,"0")+"-"+String(i+1).padStart(2,"0");
    return habits.filter(h=>{const v=h.log&&h.log[dateStr];return isFullDoneOn(h,dateStr,v);}).length;
  });
  const maxV=Math.max(habits.length,1);
  // Item 32: taller chart + every integer tick labeled (0..maxV), not just 0/mid/max
  const H=Math.min(280,Math.max(140,maxV*16)),padT=10,padB=18;
  const plotH=H-padT-padB;
  const yFor=v=>padT+plotH-(v/maxV)*plotH;
  const yTicks=Array.from({length:maxV+1},(_,i)=>i);
  // Item 32: every day gets its own labeled column, wide enough to read clearly while scrolling
  const colW=20,padR=10;
  const W=daysInMonth*colW+padR;
  const xFor=i=>colW/2+i*colW;
  const plottedCounts=dayCounts.slice(0,effectiveDays);
  const pts=plottedCounts.map((v,i)=>xFor(i)+","+yFor(v)).join(" ");
  const totalThisMonth=dayCounts.reduce((s,v)=>s+v,0);
  const axisW=22;
  return(<div style={{background:premiumCard(t),border:"1px solid "+t.border,borderRadius:14,padding:13,marginBottom:9,boxShadow:premiumShadow(t)}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <div style={{fontWeight:700,fontSize:13,display:"flex",alignItems:"center",gap:5}}>{IC.trendUp(t.accent,13)} Monthly Habits Completed</div>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <button onClick={()=>setMonthOffset(o=>o-1)} style={{background:t.surface,border:"none",color:t.text,cursor:"pointer",borderRadius:8,padding:"3px 9px",fontSize:13,fontWeight:700}}>‹</button>
        <span style={{fontSize:10,fontWeight:700,color:t.text,minWidth:74,textAlign:"center"}}>{monthLabel}</span>
        <button onClick={()=>{if(!isCurMonth)setMonthOffset(o=>o+1);}} disabled={isCurMonth} style={{background:t.surface,border:"none",color:isCurMonth?t.border:t.text,cursor:isCurMonth?"default":"pointer",borderRadius:8,padding:"3px 9px",fontSize:13,fontWeight:700}}>›</button>
      </div>
    </div>
    {habits.length===0?<div style={{fontSize:11,color:t.muted,textAlign:"center",padding:"8px 0"}}>Add habits to see this graph</div>:
    <div style={{display:"flex"}}>
      {/* Item 32: fixed Y-axis column — stays visible no matter how far you scroll the chart sideways */}
      <svg width={axisW} height={H} style={{flexShrink:0}}>
        {yTicks.map(v=>(<text key={v} x={axisW-4} y={yFor(v)+3} fontSize={8} fill={t.muted} textAnchor="end">{v}</text>))}
      </svg>
      <div style={{overflowX:"auto",flex:1}}>
        <svg width={W} height={H} style={{display:"block"}}>
          {yTicks.map(v=>(<line key={v} x1={0} x2={W} y1={yFor(v)} y2={yFor(v)} stroke={t.border} strokeWidth={1}/>))}
          <polyline points={pts} fill="none" stroke={t.accent} strokeWidth={2}/>
          {plottedCounts.map((v,i)=>(<circle key={i} cx={xFor(i)} cy={yFor(v)} r={2.5} fill={t.accent}/>))}
          {dayCounts.map((v,i)=>(<text key={"l"+i} x={xFor(i)} y={H-4} fontSize={7} fill={i+1===effectiveDays&&isCurMonth?t.accent:t.muted} fontWeight={i+1===effectiveDays&&isCurMonth?700:400} textAnchor="middle">{i+1}</text>))}
        </svg>
      </div>
    </div>}
    <div style={{fontSize:10,color:t.muted,textAlign:"center",marginTop:6}}>{totalThisMonth} total habit completions this month</div>
  </div>);
}
// Called when saving a habit edit — returns the updated goalCountHistory if goalCount changed, else unchanged
function updateGoalCountHistory(habit,newGoalCount){
  const oldGoalCount=habit.goalCount||0;
  if(newGoalCount===oldGoalCount)return habit.goalCountHistory;
  const todayStr=td();
  let hist=habit.goalCountHistory;
  if(!hist||hist.length===0){
    const createdDate=habit.id?new Date(habit.id).toLocaleDateString("en-CA"):todayStr;
    hist=[{date:createdDate,count:oldGoalCount}];
  }else{
    hist=[...hist];
  }
  if(hist.length>0&&hist[hist.length-1].date===todayStr){
    hist[hist.length-1]={date:todayStr,count:newGoalCount};
  }else{
    hist.push({date:todayStr,count:newGoalCount});
  }
  return hist;
}

// ── Item 8: AI Coach overhaul — client-side analytics engine (free, instant, no AI credits) ──

// 0-100 composite score: habit completion (45%), goal pacing (25%), streak health (20%), journal consistency (10%)
// weekOffset=0 → this week (last 7 days incl. today), weekOffset=1 → the 7 days before that
// ── SC1: calculateMomentumScore — 0–1000 scale ────────────────────────────────
// Returns {total, components{habitConsistency,currentStreak,goalCompletion,
//   journalHabit,moodAverage,focusSessions,friendChallenges,mastery}}
// SC5: all tiers calculate — gating is only on AI analysis display, never the number
//
// Phase 6-SCORE rework — rebuilt to match the two design-review documents exactly:
//   Doc 1: fix the Goal Completion fallback to overall goal progress (not a flat weekly pace);
//          stretch long-horizon caps (current streak → 60d, longest streak → 365d) via a
//          diminishing-returns curve instead of a hard cap; Legend tier once 1000 is held.
//   Doc 2: split into a volatile Momentum layer + a cumulative, monotonic Mastery layer
//          (goals ever completed, journal days ever, longest streak ever, lifetime consistency %);
//          replace the hard 7-day cliff with EMA decay across ALL rolling components (not just
//          habit consistency) — the EMA weighting is also what delivers "missing one day costs
//          less than a full 1/7th," since a recent-but-not-most-recent day already carries less
//          than 1/7 of the total weight under decay, so no separate discrete grace mechanic is
//          needed on top of it; soft floor on daily drops; surface which day(s) drove a drop.
//
// Total budget stays 1000: Momentum layer 820 (Habit Consistency 250, Current Streak 120,
// Goal Completion 200, Journal 100, Mood 50, Focus 50, Challenges 50) + Mastery layer 180
// (Lifetime Goals 35, Lifetime Journal Days 35, Longest Streak Ever 45, Lifetime Consistency% 35,
// Lifetime Focus Hours 30). Rebalanced from the original 900/100 split — Current Streak dropped
// 200→120 since it's redundant with Longest Streak Ever, and that freed weight moved into
// Mastery so growth doesn't flatline once the fast-moving Momentum components max out (~2 months
// for a consistent user) — more of the budget now lives in the layer that never resets.
function calculateMomentumScore(habits,goals,journals,focusLog,challenges,goalStats){
  focusLog=focusLog||{};challenges=challenges||{active:false,wins:0,activeDays:0};goalStats=goalStats||[];
  const today=new Date().toLocaleDateString("en-CA");
  // Shared decay curve for every EMA-based component below: half-life 5 days over a 30-day
  // lookback window. Today matters most; a day 5 days ago counts about half as much; a day
  // 30 days ago barely registers at all — no component below has a hard cliff anymore.
  const decay=Math.pow(0.5,1/5);
  const last30=[];for(let i=0;i<30;i++){const d=new Date();d.setDate(d.getDate()-i);last30.push(d.toLocaleDateString("en-CA"));}

  // ═══════════════════ MOMENTUM LAYER (volatile, 900 pts) ═══════════════════

  // 1. Habit Consistency — max 250 (EMA)
  let habitWDone=0,habitWPossible=0;
  last30.forEach((dKey,i)=>{
    const w=Math.pow(decay,i);
    habits.forEach(h=>{
      habitWPossible+=w;
      if(isFullDoneOn(h,dKey,h.log&&h.log[dKey]))habitWDone+=w;
    });
  });
  const habitConsistency=habitWPossible>0?Math.round((habitWDone/habitWPossible)*250):0;

  // 2. Current Streak — max 120 (was 200 — see rebalance note in Mastery below).
  // Asymptotic diminishing-returns curve, horizon=60 per Doc 1: "current streak cap 30→60 days".
  // pts = max * streak/(streak+horizon) — fast early growth, then slower-but-never-fully-flat
  // growth well past a year.
  const bestActive=habits.length>0?Math.max(...habits.map(h=>h.streak||0)):0;
  const currentStreak=Math.round(120*(bestActive/(bestActive+60)));

  // 3. Goal Completion — max 200 (EMA-weighted due/done ratio, decay-weighted over 30 days
  // instead of a hard "last 7 days" cutoff)
  const decayWeight=dateStr=>{
    const days=Math.floor((Date.now()-new Date(dateStr+"T12:00:00").getTime())/86400000);
    return (days>=0&&days<30)?Math.pow(decay,days):0;
  };
  const allActions=goals.flatMap(g=>g.actions||[]);
  const wDoneActions=allActions.filter(a=>a.doneAt).reduce((s,a)=>s+decayWeight(a.doneAt),0);
  const wDueActions=allActions.filter(a=>a.dueDate).reduce((s,a)=>s+decayWeight(a.dueDate),0);
  // Doc 1 fix: when there's no due-date baseline to measure against, fall back to OVERALL
  // goal progress (actions done ÷ total actions, across all active goals) — proportional to
  // how much of the goal is actually done, not an automatic 100% for completing any one thing.
  const goalPct=wDueActions>0
    ?Math.min(1,wDoneActions/wDueActions)
    :(allActions.length>0?allActions.filter(a=>a.done).length/allActions.length:0);
  const goalCompletion=Math.round(goalPct*200);

  // 4. Journal Habit — max 100 (EMA)
  let journalWDone=0,journalWPossible=0;
  last30.forEach((dKey,i)=>{
    const w=Math.pow(decay,i);
    journalWPossible+=w;
    if(journals&&journals[dKey])journalWDone+=w;
  });
  const journalHabit=journalWPossible>0?Math.round((journalWDone/journalWPossible)*100):0;

  // 5. Mood Average — max 50 (EMA-weighted average, mood is 0–4 scale)
  let moodWSum=0,moodWTotal=0;
  last30.forEach((dKey,i)=>{
    const e=journals&&journals[dKey];
    if(!e)return;
    let m=null;
    if(typeof e==="object")m=e.mood??null;else{try{m=JSON.parse(e).mood??null;}catch{m=null;}}
    if(m==null)return;
    const w=Math.pow(decay,i);
    moodWSum+=m*w;moodWTotal+=w;
  });
  const moodAverage=moodWTotal>0?Math.round((moodWSum/moodWTotal/4)*50):0;

  // 6. Focus Sessions — max 50 (EMA-weighted session count. A sustained ~1 session/day pace,
  // decay-weighted over 30 days, converges to ≈7.73 — that's the "full marks" denominator,
  // roughly preserving the old "7 sessions/week = max" feel without a hard weekly cliff.)
  let focusWSum=0;
  last30.forEach((dKey,i)=>{
    const w=Math.pow(decay,i);
    focusWSum+=((focusLog[dKey]&&focusLog[dKey].sessions)||0)*w;
  });
  const focusSessions=Math.round(Math.min(1,focusWSum/7.73)*50);

  // 7. Friend Challenges — max 50 (unchanged — neither doc flags this component)
  let challengePts=0;
  if(challenges.active)challengePts+=10;
  if(challenges.wins>0)challengePts+=25;
  challengePts+=Math.min(challenges.activeDays||0,15);
  const friendChallenges=Math.min(challengePts,50);

  // ═══════════════════ MASTERY LAYER (cumulative, monotonic, 180 pts) ═══════════════════
  // Rebalanced from Doc 2's original 4-input/100pt version: Current Streak above dropped from
  // 200→120 (freeing 80pts) because it's conceptually redundant with "longest streak ever"
  // here — both measure streak achievement, just one resets and one doesn't. Moving weight
  // from the volatile version to the permanent one directly addresses the "growth basically
  // stops after ~2 months once the fast-moving Momentum components max out" problem: the more
  // of the budget lives in a layer that only ever grows, the less the score flatlines once
  // Habit Consistency/Goal Completion/Journal/Mood/Focus/Challenges are already near their caps.
  // Also added a 5th input (lifetime focus hours) so Mastery isn't just the same 4 things
  // growing slower — broadens what "permanent progress" means.

  // 7a. Lifetime goals completed — 35 (was 25)
  const lifetimeGoalsDone=(goalStats||[]).length;
  const masteryGoals=35*(lifetimeGoalsDone/(lifetimeGoalsDone+8));

  // 7b. Lifetime journal days — 35 (was 25)
  const lifetimeJournalDays=Object.keys(journals||{}).length;
  const masteryJournal=35*(lifetimeJournalDays/(lifetimeJournalDays+60));

  // 7c. Longest streak ever — 45 (was 25 — biggest single increase, since this is what's
  // absorbing Current Streak's reduced weight above). horizon=365 per Doc 1.
  const bestEver=habits.length>0?Math.max(...habits.map(h=>h.best||h.streak||0)):0;
  const masteryStreak=45*(bestEver/(bestEver+365));

  // 7d. Lifetime consistency % — 35 (was 25). For each habit, look from its creation date (or
  // its earliest log entry if no creation date is on record) through today, and measure what
  // fraction of those possible days were fully completed. Summed across all habits.
  let lifeDone=0,lifePossible=0;
  habits.forEach(h=>{
    const logKeys=Object.keys(h.log||{});
    if(logKeys.length===0)return;
    const startStr=h.createdAt?new Date(h.createdAt).toLocaleDateString("en-CA"):logKeys.sort()[0];
    const start=new Date(startStr+"T12:00:00");
    const end=new Date();
    const totalDays=Math.max(1,Math.round((end-start)/86400000)+1);
    let doneDays=0;
    for(let i=0;i<totalDays;i++){
      const d=new Date(start);d.setDate(d.getDate()+i);
      const dKey=d.toLocaleDateString("en-CA");
      if(isFullDoneOn(h,dKey,h.log&&h.log[dKey]))doneDays++;
    }
    lifeDone+=doneDays;lifePossible+=totalDays;
  });
  const lifetimeConsistencyPct=lifePossible>0?lifeDone/lifePossible:0;
  const masteryConsistency=35*lifetimeConsistencyPct;

  // 7e. Lifetime focus hours ever — 30 (NEW). focusLog is never pruned, so this sums every
  // session across the account's whole lifetime, not just the last 30 days. horizon=40 hours
  // (roughly a few months of regular Pomodoro use for 50% credit).
  const lifetimeFocusMin=Object.values(focusLog||{}).reduce((s,d)=>s+((d&&d.totalMin)||0),0);
  const lifetimeFocusHours=lifetimeFocusMin/60;
  const masteryFocusHours=30*(lifetimeFocusHours/(lifetimeFocusHours+40));

  const mastery=Math.round(masteryGoals+masteryJournal+masteryStreak+masteryConsistency+masteryFocusHours);

  let total=habitConsistency+currentStreak+goalCompletion+journalHabit+moodAverage+focusSessions+friendChallenges+mastery;
  total=Math.round(Math.max(0,Math.min(1000,total)));
  const rawTotal=total;

  // SCORE-6 (Doc 2 #3): soft floor on how far the score can drop in one day. Cap max single-day
  // loss at 60pts vs yesterday's recorded score, so a bad day doesn't feel catastrophic while
  // the trend is still visible. Only applies when there's a real yesterday to compare against.
  const yesterday=(()=>{const d=new Date();d.setDate(d.getDate()-1);return d.toLocaleDateString("en-CA");})();
  const yesterdayScore=_scoreStore.history[yesterday];
  const MAX_DAILY_DROP=60;
  if(typeof yesterdayScore==="number"&&total<yesterdayScore-MAX_DAILY_DROP){
    total=Math.max(0,yesterdayScore-MAX_DAILY_DROP);
  }

  // Bug fix: components used to be returned as the raw, unclamped values even when the floor
  // above bumped `total` upward — so the Score Breakdown bars could silently stop summing to
  // the headline number, or even show a component going down while the total stayed flat/rose,
  // which is exactly the kind of "the numbers don't add up" inconsistency that erodes trust.
  // Scale every component by the same ratio so the breakdown always sums back to what's shown.
  const scale=rawTotal>0?total/rawTotal:1;
  const scaledComponents=scale===1
    ? {habitConsistency,currentStreak,goalCompletion,journalHabit,moodAverage,focusSessions,friendChallenges,mastery}
    : {
        habitConsistency:Math.round(habitConsistency*scale),
        currentStreak:Math.round(currentStreak*scale),
        goalCompletion:Math.round(goalCompletion*scale),
        journalHabit:Math.round(journalHabit*scale),
        moodAverage:Math.round(moodAverage*scale),
        focusSessions:Math.round(focusSessions*scale),
        friendChallenges:Math.round(friendChallenges*scale),
        mastery:Math.round(mastery*scale),
      };

  return{
    total,
    components:scaledComponents
  };
}

// SCORE-7 (Doc 2 #5): compares the live component breakdown against the last-saved one (loaded
// from Firestore's scoreComponents field) and names the single biggest negative mover. For
// Habit Consistency and Journal Habit specifically, also names which recent day(s) were missed —
// "your Habit Consistency dipped because Tuesday and Wednesday were missed" — matching the
// day-level example in the doc, not just a component-level number.
function explainScoreChange(components,habits,journals){
  if(!_scoreStore.prevComponents)return null;
  const LABELS={habitConsistency:"Habit Consistency",currentStreak:"Current Streak",goalCompletion:"Goal Completion",journalHabit:"Journal Habit",moodAverage:"Mood Average",focusSessions:"Focus Sessions",friendChallenges:"Friend Challenges",mastery:"Mastery"};
  let biggestKey=null,biggestDelta=0;
  Object.keys(components).forEach(k=>{
    const d=(components[k]||0)-(_scoreStore.prevComponents[k]||0);
    if(d<biggestDelta){biggestDelta=d;biggestKey=k;}
  });
  if(!biggestKey||biggestDelta>=-3)return null;// ignore noise
  let dayDetail=null;
  if(biggestKey==="habitConsistency"&&habits&&habits.length>0){
    const missedDays=[];
    for(let i=1;i<=3;i++){
      const d=new Date();d.setDate(d.getDate()-i);
      const dKey=d.toLocaleDateString("en-CA");
      const anyMissed=habits.some(h=>!isFullDoneOn(h,dKey,h.log&&h.log[dKey]));
      if(anyMissed)missedDays.push(d.toLocaleDateString("en-US",{weekday:"long"}));
    }
    if(missedDays.length>0)dayDetail=missedDays.join(" and ")+" were missed";
  }else if(biggestKey==="journalHabit"&&journals){
    const missedDays=[];
    for(let i=1;i<=3;i++){
      const d=new Date();d.setDate(d.getDate()-i);
      const dKey=d.toLocaleDateString("en-CA");
      if(!journals[dKey])missedDays.push(d.toLocaleDateString("en-US",{weekday:"long"}));
    }
    if(missedDays.length>0)dayDetail=missedDays.join(" and ")+" had no journal entry";
  }
  return{component:biggestKey,label:LABELS[biggestKey]||biggestKey,delta:biggestDelta,dayDetail};
}

// SC2: Weekly delta helper — now reads REAL dated score history from Firestore
// (threaded in via _scoreStore below) instead of a fabricated localStorage baseline.
// ── Score history store (module-level; loaded from user doc, read on save/delta) ──
// scoreHistory: { "YYYY-MM-DD": score }  — daily, pruned to last 365 days
// scoreMonthly: { "YYYY-MM": score }     — month-end value, kept permanently
const _scoreStore={history:{},monthly:{},prevComponents:null};
// H5 — Completion-time store (module-level; loaded from user doc, read/written on save).
// Three-tier rollup, mirroring the score-history pattern above but one tier deeper:
//   completionLog:     { "YYYY-MM-DD": [{k,id,s,c}] } — raw per-completion records
//                       (k="h"/"a"/"s" = habit/goal-action/standalone, s/c = scheduled/
//                       completed minute-of-day), pruned to the most recent 30 dates.
//   completionMonthly: { "YYYY-MM": {hours:[24 x {n,d}]} } — hourly buckets (n=count,
//                       d=delay-minutes sum), written live as completions happen (not
//                       reconstructed from the raw log at prune time), kept 12 months.
//   completionYearly:  { "YYYY": {hours:[24 x {n,d}]} } — permanent. A month folds into
//                       its year and is deleted only once it ages out of the 12-month window.
const _completionStore={log:{},monthly:{},yearly:{}};
function emptyHourBuckets(){return Array.from({length:24},()=>({n:0,d:0}));}
function loadCompletionStore(d){
  _completionStore.log=(d&&d.completionLog&&typeof d.completionLog==="object")?{...d.completionLog}:{};
  _completionStore.monthly=(d&&d.completionMonthly&&typeof d.completionMonthly==="object")?{...d.completionMonthly}:{};
  _completionStore.yearly=(d&&d.completionYearly&&typeof d.completionYearly==="object")?{...d.completionYearly}:{};
}
// Called only on the not-done → done transition, only when the item has at least one
// assigned minuteSlot — nothing to compare a completion time against otherwise.
// kind: "h" (habit) | "a" (goal-action) | "s" (standalone action).
function recordCompletion(kind,id,minuteSlots){
  if(!minuteSlots||minuteSlots.length===0)return;
  const now=new Date();
  const todayKey=now.toLocaleDateString("en-CA");
  const month=todayKey.slice(0,7);
  const scheduled=Math.min(...minuteSlots);
  const completed=now.getHours()*60+now.getMinutes();
  // Raw daily log
  const dayLog=_completionStore.log[todayKey]?[..._completionStore.log[todayKey]]:[];
  dayLog.push({k:kind,id,s:scheduled,c:completed});
  _completionStore.log[todayKey]=dayLog;
  // Prune raw log to the most recent 30 dates
  const dayKeys=Object.keys(_completionStore.log).sort();
  if(dayKeys.length>30){
    for(const k of dayKeys.slice(0,dayKeys.length-30))delete _completionStore.log[k];
  }
  // Monthly hour-bucket aggregate — accumulates live, independent of the raw-log prune above
  const bucket=_completionStore.monthly[month]||{hours:emptyHourBuckets()};
  const hourIdx=Math.min(23,Math.floor(scheduled/60));
  bucket.hours[hourIdx].n+=1;
  bucket.hours[hourIdx].d+=(completed-scheduled);
  _completionStore.monthly[month]=bucket;
  // Prune monthly to the most recent 12 months — anything aged out gets folded into the
  // permanent yearly rollup first, so the hour-of-day signal survives past a year, it
  // just loses month-level granularity.
  const monthKeys=Object.keys(_completionStore.monthly).sort();
  if(monthKeys.length>12){
    for(const mk of monthKeys.slice(0,monthKeys.length-12)){
      const mData=_completionStore.monthly[mk];
      const yk=mk.slice(0,4);
      const yBucket=_completionStore.yearly[yk]||{hours:emptyHourBuckets()};
      mData.hours.forEach((hh,i)=>{yBucket.hours[i].n+=hh.n;yBucket.hours[i].d+=hh.d;});
      _completionStore.yearly[yk]=yBucket;
      delete _completionStore.monthly[mk];
    }
  }
}
function snapshotCompletionStore(){
  return{completionLog:{..._completionStore.log},completionMonthly:{..._completionStore.monthly},completionYearly:{..._completionStore.yearly}};
}
function loadScoreStore(d){
  _scoreStore.history=(d&&d.scoreHistory&&typeof d.scoreHistory==="object")?{...d.scoreHistory}:{};
  _scoreStore.monthly=(d&&d.scoreMonthly&&typeof d.scoreMonthly==="object")?{...d.scoreMonthly}:{};
  // SCORE-7: scoreComponents was already being written to Firestore on every save but never
  // read back. Loading it here gives us a "components as of last save" reference to diff
  // against the live computation, so we can explain *which* component moved, not just that
  // the total changed.
  _scoreStore.prevComponents=(d&&d.scoreComponents&&typeof d.scoreComponents==="object")?{...d.scoreComponents}:null;
  // Backfill: existing users have no history yet. Seed today's value in-memory from
  // the last persisted momentumScore so there's an immediate baseline (no fake past
  // data — delta reads 0 until real history accrues). Persisted on next save().
  const today=new Date().toLocaleDateString("en-CA");
  if(_scoreStore.history[today]==null&&d&&typeof d.momentumScore==="number"){
    _scoreStore.history[today]=d.momentumScore;
    const month=today.slice(0,7);
    if(_scoreStore.monthly[month]==null)_scoreStore.monthly[month]=d.momentumScore;
  }
}
// Record today's score, keep the month-end value, prune daily history to 365 entries.
// Returns the {scoreHistory, scoreMonthly} to persist. Last write of a day/month wins.
function recordScoreSnapshot(score){
  const today=new Date().toLocaleDateString("en-CA");        // YYYY-MM-DD local
  const month=today.slice(0,7);                              // YYYY-MM
  _scoreStore.history[today]=score;
  _scoreStore.monthly[month]=score;                          // last save of month = month's final
  // Prune daily history to the most recent 365 dates (monthly is never pruned).
  const keys=Object.keys(_scoreStore.history).sort();        // ascending date order
  if(keys.length>365){
    for(const k of keys.slice(0,keys.length-365))delete _scoreStore.history[k];
  }
  return{scoreHistory:{..._scoreStore.history},scoreMonthly:{..._scoreStore.monthly}};
}
// Find the score nearest to `daysAgo` days back, within ±tolerance days (handles gaps).
function scoreNear(daysAgo,tolerance){
  const base=new Date();base.setDate(base.getDate()-daysAgo);
  for(let off=0;off<=tolerance;off++){
    for(const sign of (off===0?[0]:[-1,1])){                 // check exact, then ±1, ±2...
      const d=new Date(base);d.setDate(d.getDate()+sign*off);
      const key=d.toLocaleDateString("en-CA");
      if(_scoreStore.history[key]!=null)return _scoreStore.history[key];
    }
  }
  return null;
}
function getScoreWithDelta(habits,goals,journals,focusLog,challenges,goalStats){
  const result=calculateMomentumScore(habits,goals,journals,focusLog,challenges,goalStats);
  const current=result.total;
  // Real "last week" = nearest recorded score to 7 days ago, within ±2 days.
  // Falls back to current (delta 0) until real history has accrued.
  const lastWeek=scoreNear(7,2);
  const lastWeekScore=lastWeek!=null?lastWeek:current;
  return{score:current,lastWeekScore,delta:current-lastWeekScore,components:result.components};
}

function n2Today(){return new Date().toLocaleDateString("en-CA");}
function n2DaysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}

// ── B9: Manifestation local photo store (IndexedDB) ──────────────────────────
// Resize+recompress a File to a small JPEG data URL — keeps every entry
// comfortably under Firestore's 1MB/doc limit even before it's ever synced,
// and keeps IndexedDB usage trivial for the local/trial path too.
function manifCompressPhoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=e=>{img.src=e.target.result;};
    reader.onerror=reject;
    img.onload=()=>{
      const maxDim=640;
      let w=img.width,h=img.height;
      if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
      else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
      const canvas=document.createElement("canvas");
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL("image/jpeg",0.55));
    };
    img.onerror=reject;
    reader.readAsDataURL(file);
  });
}
// Has enough time passed since this type last fired? (interval in days)
function n2GateOpen(lastShown,type,intervalDays){
  const last=lastShown&&lastShown[type];
  if(!last)return true;
  return n2DaysBetween(last,n2Today())>=intervalDays;
}
// True current streak from log (mirrors app logic; freeze marker counts as done).
function n2TrueStreak(habit){
  let s=0;const d=new Date();
  for(let i=0;i<400;i++){
    const k=d.toLocaleDateString("en-CA");
    const v=habit.log&&habit.log[k];
    const ok=v==="freeze"||(habit.goalCount>0&&habit.goalUnit?(typeof v==="number"&&v>=habit.goalCount):!!v);
    if(ok)s++;else break;
    d.setDate(d.getDate()-1);
  }
  return s;
}
function n2ActiveWithin(habits,days){
  const d=new Date();
  for(let i=0;i<days;i++){
    const k=d.toLocaleDateString("en-CA");
    if(habits.some(h=>h.log&&h.log[k]))return true;
    d.setDate(d.getDate()-1);
  }
  return false;
}
