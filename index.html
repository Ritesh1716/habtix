// ── L3: DELETE ACCOUNT MODAL ─────────────────────────────────────────────────
function DeleteAccountModal({t,user,handleLogout,onClose}){
  const[step,setStep]=React.useState(1);
  const[deleting,setDeleting]=React.useState(false);
  const[confirmText,setConfirmText]=React.useState("");
  const[result,setResult]=React.useState(null); // {type:"success"|"partial"|"error", message}

  // B1: deletion now runs entirely server-side via api/delete-account.js
  // (Admin SDK). The old client-side flow needed a *freshly* re-authenticated
  // session to call auth.currentUser.delete() — reauthenticateWithPopup
  // routinely fails on mobile PWAs where popups are blocked by the OS, which
  // is exactly why this used to fall back to the raw browser alert(). The
  // Admin SDK deletes the Auth user directly with no reauth requirement at
  // all, so that failure mode is gone. This function's only job now is to
  // call the endpoint and render an honest result — never a native alert().
  async function handleDelete(){
    if(confirmText.trim().toUpperCase()!=="DELETE")return;
    setDeleting(true);
    setStep(3);
    try{
      const idToken=await user.getIdToken();
      const resp=await fetch("/api/delete-account",{
        method:"POST",
        headers:{"Authorization":"Bearer "+idToken}
      });
      const data=await resp.json().catch(()=>({}));

      if(resp.ok&&data.success){
        try{
          localStorage.removeItem("momentum_gh_"+user.uid);
          localStorage.removeItem("momentum_gs_"+user.uid);
          localStorage.removeItem("hg_notif");
          localStorage.removeItem("hg_reminders");
          localStorage.removeItem("mo_pos3");
          // B9: clear any locally-cached (never-synced) manifestation photos too
          try{indexedDB.deleteDatabase("habtix_manifest");}catch(e2){}
        }catch(e){}
        setResult({type:"success"});
      }else if(resp.status===207||data.dataDeleted){
        // Genuine edge case now (server outage mid-flight, not the old
        // popup-block failure) — data's gone, login couldn't be closed out.
        try{
          localStorage.removeItem("momentum_gh_"+user.uid);
          localStorage.removeItem("momentum_gs_"+user.uid);
        }catch(e){}
        setResult({type:"partial"});
      }else{
        setResult({type:"error",message:data.error||"Something went wrong. Nothing was deleted — your account is unchanged."});
      }
    }catch(e){
      console.error("Delete account request failed:",e);
      setResult({type:"error",message:"Couldn't reach the server. Check your connection and try again — nothing was deleted."});
    }
    setDeleting(false);
  }

  async function finishAndSignOut(){
    try{await handleLogout();}catch(e){}
    onClose();
  }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:9500}}>
      <div style={{background:"#18181c",border:"1px solid #2a2a32",borderRadius:"24px 24px 0 0",padding:"28px 22px 40px",width:"100%",maxWidth:480,animation:"pageIn 0.3s ease"}}>
        {step===1&&(
          <>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{marginBottom:8}}>{IC.warning(t.danger,36)}</div>
              <div style={{fontSize:17,fontWeight:800,color:"#ff4444",marginBottom:8}}>Delete Account?</div>
              <div style={{fontSize:12,color:"#7a7a8c",lineHeight:1.7}}>This will permanently delete your Habtix account and all data. This action <strong style={{color:"#ff4444"}}>cannot be undone</strong>.</div>
            </div>
            <div style={{background:"#1a0a0a",border:"1px solid #ff444433",borderRadius:14,padding:"14px 16px",marginBottom:20,fontSize:12,color:"#aaa",lineHeight:1.8}}>
              <div style={{fontWeight:700,color:"#ff6666",marginBottom:6}}>Permanently deleted:</div>
              <div>• All habits, streaks, and completion history</div>
              <div>• All goals and actions</div>
              <div>• All journal entries and mood logs</div>
              <div>• Your account and login</div>
              <div style={{marginTop:8,color:"#666"}}>Active subscriptions are not automatically cancelled — cancel in Razorpay/Play Store first.</div>
            </div>
            <button onClick={()=>setStep(2)} style={{width:"100%",padding:"13px",borderRadius:14,border:"1px solid #ff444444",background:"#ff444422",color:"#ff6666",fontWeight:700,fontSize:14,cursor:"pointer",marginBottom:10}}>Continue to Delete</button>
            <button onClick={onClose} style={{width:"100%",padding:"12px",borderRadius:14,border:"1px solid #2a2a32",background:"transparent",color:"#888",fontWeight:600,fontSize:13,cursor:"pointer"}}>Cancel</button>
          </>
        )}
        {step===2&&(
          <>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontSize:17,fontWeight:800,color:"#ff4444",marginBottom:8}}>Final Confirmation</div>
              <div style={{fontSize:12,color:"#7a7a8c",lineHeight:1.6}}>Type <strong style={{color:"#ff6666",fontFamily:"monospace"}}>DELETE</strong> to permanently delete your account.</div>
            </div>
            <input
              value={confirmText}
              onChange={e=>setConfirmText(e.target.value)}
              maxLength={10}
              placeholder="Type DELETE to confirm"
              style={{width:"100%",padding:"13px 16px",borderRadius:12,border:"1px solid "+(confirmText.trim().toUpperCase()==="DELETE"?"#ff4444":"#2a2a32"),background:"#111116",color:"#f5f5f5",fontSize:14,fontFamily:"monospace",textAlign:"center",marginBottom:16,boxSizing:"border-box"}}
            />
            <button
              onClick={handleDelete}
              disabled={deleting||confirmText.trim().toUpperCase()!=="DELETE"}
              style={{width:"100%",padding:"13px",borderRadius:14,border:"none",background:confirmText.trim().toUpperCase()==="DELETE"?"#ff4444":"#222",color:confirmText.trim().toUpperCase()==="DELETE"?"#fff":"#555",fontWeight:800,fontSize:14,cursor:deleting||confirmText.trim().toUpperCase()!=="DELETE"?"not-allowed":"pointer",marginBottom:10,transition:"all 0.2s"}}>
              {deleting?"Deleting... Please wait":<span style={{display:"inline-flex",alignItems:"center",gap:5}}>{IC.trash(t.danger,14)} Permanently Delete My Account</span>}
            </button>
            <button onClick={()=>setStep(1)} disabled={deleting} style={{width:"100%",padding:"12px",borderRadius:14,border:"1px solid #2a2a32",background:"transparent",color:"#888",fontWeight:600,fontSize:13,cursor:"pointer"}}>{"← Go Back"}</button>
          </>
        )}
        {step===3&&(
          <>
            {deleting&&!result&&(
              <div style={{textAlign:"center",padding:"20px 0"}}>
                <div style={{width:32,height:32,margin:"0 auto 18px",border:"3px solid #2a2a32",borderTopColor:"#ff4444",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
                <div style={{fontSize:14,fontWeight:700,color:"#f5f5f5",marginBottom:6}}>Deleting your account…</div>
                <div style={{fontSize:12,color:"#7a7a8c"}}>This only takes a moment. Don't close the app.</div>
              </div>
            )}
            {result?.type==="success"&&(
              <>
                <div style={{textAlign:"center",marginBottom:22}}>
                  <div style={{marginBottom:8}}>{IC.checkCircle("#22c55e",36)}</div>
                  <div style={{fontSize:17,fontWeight:800,color:"#22c55e",marginBottom:8}}>Account Deleted</div>
                  <div style={{fontSize:12,color:"#7a7a8c",lineHeight:1.7}}>Your Habtix account and all associated data have been permanently deleted.</div>
                </div>
                <button onClick={finishAndSignOut} style={{width:"100%",padding:"13px",borderRadius:14,border:"none",background:"#22c55e22",color:"#22c55e",fontWeight:700,fontSize:14,cursor:"pointer"}}>Done</button>
              </>
            )}
            {result?.type==="partial"&&(
              <>
                <div style={{textAlign:"center",marginBottom:22}}>
                  <div style={{marginBottom:8}}>{IC.warning("#f59e0b",36)}</div>
                  <div style={{fontSize:17,fontWeight:800,color:"#f59e0b",marginBottom:8}}>Data Deleted</div>
                  <div style={{fontSize:12,color:"#7a7a8c",lineHeight:1.7}}>All your Habtix data is gone. Your login couldn't be fully closed out on our end — email us and we'll finish that part, no data risk on your side.</div>
                </div>
                <a href="mailto:supporthabtixapp@gmail.com?subject=Account%20deletion%20-%20login%20cleanup" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",padding:"13px",borderRadius:14,border:"1px solid #f59e0b44",background:"#f59e0b18",color:"#f59e0b",fontWeight:700,fontSize:14,textDecoration:"none",marginBottom:10,boxSizing:"border-box"}}>{IC.mail("#f59e0b",14)} Email Support</a>
                <button onClick={finishAndSignOut} style={{width:"100%",padding:"12px",borderRadius:14,border:"1px solid #2a2a32",background:"transparent",color:"#888",fontWeight:600,fontSize:13,cursor:"pointer"}}>Done</button>
              </>
            )}
            {result?.type==="error"&&(
              <>
                <div style={{textAlign:"center",marginBottom:22}}>
                  <div style={{marginBottom:8}}>{IC.xCircle("#ff4444",36)}</div>
                  <div style={{fontSize:17,fontWeight:800,color:"#ff4444",marginBottom:8}}>Couldn't Delete Account</div>
                  <div style={{fontSize:12,color:"#7a7a8c",lineHeight:1.7}}>{result.message}</div>
                </div>
                <button onClick={handleDelete} style={{width:"100%",padding:"13px",borderRadius:14,border:"1px solid #ff444444",background:"#ff444422",color:"#ff6666",fontWeight:700,fontSize:14,cursor:"pointer",marginBottom:10}}>Try Again</button>
                <a href="mailto:supporthabtixapp@gmail.com?subject=Account%20deletion%20failed" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",padding:"12px",borderRadius:14,border:"1px solid #2a2a32",background:"transparent",color:"#888",fontWeight:600,fontSize:13,textDecoration:"none",marginBottom:10,boxSizing:"border-box"}}>{IC.mail("#888",13)} Email Support Instead</a>
                <button onClick={onClose} style={{width:"100%",padding:"12px",borderRadius:14,border:"none",background:"transparent",color:"#666",fontWeight:600,fontSize:13,cursor:"pointer"}}>Cancel</button>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function OnboardingModal({t,onDone,userName,habits,setHabits,save,goals,journals,tk,uid}){
  const[step,setStep]=React.useState(0);// 0=identity 1=experience 2=leak 3=habit 4=reminder 5=celebrate
  const[identity,setIdentity]=React.useState(null);
  const[experience,setExperience]=React.useState(null);
  const[leak,setLeak]=React.useState(null);
  const[chosenHabit,setChosenHabit]=React.useState(null);
  const[reminder,setReminder]=React.useState("evening");
  const[customTime,setCustomTime]=React.useState("20:00");
  const[habitAdded,setHabitAdded]=React.useState(false);
  const[showNotifAsk,setShowNotifAsk]=React.useState(false);// R9-H: Mo soft-ask before the native OS permission dialog
  const[animKey,setAnimKey]=React.useState(0);// re-trigger animation on step change

  const firstName=(userName||"").split(" ")[0]||"you";
  const habitOptions=OB_HABIT_MAP[identity]||OB_HABIT_MAP.disciplined;
  const selectedHabit=chosenHabit||habitOptions[0];

  function nextStep(){
    setAnimKey(k=>k+1);
    setStep(s=>s+1);
  }

  // Step 3→4: auto-set first habit option
  function goToHabit(){
    setChosenHabit(habitOptions[0]);
    nextStep();
  }

  // Final: save everything to Firestore and call onDone
  async function finish(wantsReminder){
    // Add the chosen habit
    const rTime=reminder==="custom"?customTime:OB_REMINDERS.find(r=>r.id===reminder)?.time||"19:00";
    const newHabit={
      id:Date.now(),
      name:selectedHabit.name,
      cat:selectedHabit.cat,
      icon:selectedHabit.icon,
      color:selectedHabit.color,
      freq:"daily",
      goalCount:0,goalUnit:"",
      streak:0,best:0,log:{},
      reminder:{enabled:!!(wantsReminder&&rTime),time:rTime},
    };
    const newHabits=[...habits,newHabit];
    setHabits(newHabits);
    // Save habit + onboard fields to Firestore
    try{
      await save(newHabits,goals,journals,tk,null,{
        onboardIdentity:identity,
        onboardExperience:experience,
        onboardLeak:leak,
        onboardReminderTime:rTime,
        onboardingCompleted:true,
      });
    }catch(e){console.warn("Onboard save err:",e);}
    setHabitAdded(true);
    nextStep();// go to celebration

  async function askNotifPermission(){

// ── C10: Error Boundary ─────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  componentDidCatch(error,info){
    console.error("Habtix ErrorBoundary caught:",error,info);
    // C5: report to Sentry if it's loaded (safe no-op pre-consent or if Sentry hasn't finished loading yet)
    try{
      if(window.Sentry&&window.Sentry.captureException){
        window.Sentry.captureException(error,{extra:{componentLabel:this.props.label||"unknown",componentStack:info?.componentStack}});
      }
    }catch(e){}
  }
  reset(){this.setState({hasError:false,error:null});}
  render(){
    if(this.state.hasError){
      const t=this.props.t||{bg:"#0d0d0f",card:"#18181c",border:"#2a2a32",text:"#f0eff4",muted:"#7a7a8c",accent:"#f5c842",danger:"#ef4444",surface:"#1a1a20"};
      return(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:220,padding:"32px 20px",textAlign:"center",background:t.card,borderRadius:16,border:"1px solid "+t.border,margin:16}}>
          <div style={{marginBottom:12}}>{typeof IC!=="undefined"?IC.warning(t.danger,40):<span style={{fontSize:36}}>⚠️</span>}</div>
          <div style={{fontSize:16,fontWeight:800,color:t.text,marginBottom:6}}>Something went wrong</div>
          <div style={{fontSize:12,color:t.muted,marginBottom:16,lineHeight:1.6,maxWidth:280}}>
            {this.props.label||"This section"} ran into a problem. Your data is safe — tap Try Again or reload the page.
          </div>
          <button onClick={()=>this.reset()} style={{padding:"10px 22px",borderRadius:10,border:"none",background:t.accent,color:"#000",fontWeight:700,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>
            Try Again
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}


// ── MoImg: Canvas-based white background removal for all Mo images ──────────
// Uses BFS flood-fill from edges — same algorithm as splash screen
// Works on ANY background color, not just pure black
// ── MoImg: simple, instant Mo image renderer ─────────────────────────────────
// All 50 Mo poses are properly exported transparent PNGs (alpha channel
// baked in) — no canvas, no flood-fill, no processing needed. Just a
// plain <img> tag with a glow shadow. Loads instantly, zero corruption
// risk, clean edges with no whitish halo.
//
// MO_ASSET_VERSION: bump this whenever Mo image FILES change in the repo
// (new poses, re-exported transparency fixes, etc.) even if no other app
// code changed. It's appended as a query string to every Mo image URL,
// which guarantees a genuinely new URL the browser's HTTP cache, any CDN
// edge cache, and the Service Worker have never seen before — bypassing
// every caching layer at once, no matter how aggressively configured.
const MO_ASSET_VERSION="2";
function MoImg({src,size=130,alt="Mo",style={}}){
  const versionedSrc=src?(src+(src.includes("?")?"&":"?")+"v="+MO_ASSET_VERSION):src;
  return(
    <img src={versionedSrc} alt={alt}
      style={{
        width:size,height:size,objectFit:"contain",
        filter:"drop-shadow(0 8px 28px rgba(245,185,50,0.55))",
        flexShrink:0,
        ...style,
      }}
      onError={e=>{e.target.style.display="none";}}
    />
  );
}

function GoalsTour({t,onDone}){
  const[intro,setIntro]=React.useState(true);
  const[step,setStep]=React.useState(0);
  const steps=[
    {title:"Add a new goal",body:"Tap + New Goal to start. Give it a name, priority, and deadline.",selector:'[data-tour="goal-add-btn"]'},
    {title:"Break it into action steps",body:"Add specific action steps with their own dates — this is what actually moves your goal forward.",selector:'[data-tour="goal-add-btn"]'},
    {title:"Tap any goal to open it",body:"See all your action steps, track progress, and check things off as you complete them.",selector:'[data-tour="goal-card-0"]'},
  ];
  const[rect,setRect]=React.useState(null);
  const cur=steps[step];
  const isLast=step===steps.length-1;

  React.useEffect(()=>{
    if(intro)return;
    const el=document.querySelector(cur.selector);
    if(el){const r=el.getBoundingClientRect();setRect({top:r.top-6,left:r.left-6,width:r.width+12,height:r.height+12});}
    else{setRect(null);}
  },[step,intro]);

  function advance(){if(isLast){onDone();}else{setStep(s=>s+1);}}

function App(){
  // Preload all onboarding/auth Mo images immediately on app mount so every
  // screen shows Mo instantly with zero loading delay — browser caches them
  // well before the user reaches each step.
  React.useEffect(()=>{
    const preloadList=[
      "mo-wave-hello.png","mo-handshake.png","mo-comeback.png","mo-presenting.png",
      "mo-arms-crossed.png","mo-writing.png","mo-sit-relax.png","mo-megaphone.png","mo-wink.png",
    ];
    preloadList.forEach(name=>{const img=new Image();img.src="/mo/"+name;});
  },[]);
  const[user,setUser]=useState(null);
  const[loading,setLoading]=useState(true);
  const[signingIn,setSigningIn]=useState(false);
  const[tk,setTk]=useState("obsidian");
  const[habits,setHabits]=useState([]);
  const[goals,setGoals]=useState([]);
  const[journals,setJournals]=useState({});
  const[goalHistory,setGoalHistory]=useState([]);// completed goals history (browsable, capped at 50, user-deletable)
  const[goalStats,setGoalStats]=useState([]);// permanent completion snapshots for Yearly Review — never capped or deleted
  const[streakCards,setStreakCards]=useState([]);// H-Cards: permanent snapshots of milestone streak-share cards (habitId,habitName,icon,color,streak,date,shared)
  const[milestoneCard,setMilestoneCard]=useState(null);// card object just earned — triggers the Mo "Share now?" popup
  const[viewCard,setViewCard]=useState(null);// card tapped open from the Cards tab / milestone popup — feeds StreakShareModal
  const[showGoalHistory,setShowGoalHistory]=useState(false);// history modal open
  const[expandedHistGoal,setExpandedHistGoal]=useState(null);// which history goal's actions are expanded
  const[pk,setPk]=useState("free");
  const[pe,setPe]=useState(null);
  const[signupDate,setSignupDate]=useState(null);
  const[manifVision,setManifVision]=useState("");// B9: cheap top-level check for Dashboard card copy; full record lives on the manifestation page
  const[manifLinkedGoalId,setManifLinkedGoalId]=useState(null);// B9: so Goals page can show a bidirectional badge without a separate fetch
  const[manifTotalLogged,setManifTotalLogged]=useState(0);
  const[tomorrowPlan,setTomorrowPlan]=useState(null);// {date,items:[{kind,id,label,order}],source:"manual"|"ai"} — own lightweight field, not part of the main habits/goals save cycle
  const[dayNotes,setDayNotes]=useState({});// {dateStr:noteText} — moved off localStorage (was device-only, lost on reinstall/device switch) onto Firestore, same field-per-concern pattern as tomorrowPlan
  const[backfillResult,setBackfillResult]=useState(null);// admin-only: one-time profile-field backfill result
  const[backfillRunning,setBackfillRunning]=useState(false);
  async function runProfileBackfill(){
    if(backfillRunning||!user)return;
    setBackfillRunning(true);setBackfillResult(null);
    try{
      const idToken=await user.getIdToken();
      const resp=await fetch("/api/backfill-profiles",{method:"POST",headers:{"Authorization":"Bearer "+idToken}});
      const data=await resp.json().catch(()=>({}));
      setBackfillResult(resp.ok?data:{error:data.error||("HTTP "+resp.status)});
    }catch(e){setBackfillResult({error:e.message});}
    setBackfillRunning(false);
  }
  const[userNumber,setUserNumber]=useState(null);
  const[birthday,setBirthday]=useState("");// UI-PA2: ISO date string e.g. "2004-06-27"
  const[momentumId,setMomentumId]=useState("");// UI-PA5: MO-DisplayName-UniqueCode
  const[friendReqCount,setFriendReqCount]=useState(0);// F1: pending incoming friend requests badge
  const[challengeInviteCount,setChallengeInviteCount]=useState(0);// pending challenge invites badge
  const[referralCountLive,setReferralCountLive]=useState(null);// authoritative count from /api/referral-grant, null until first boot check completes
  const[page,setPage]=useState(null);// null = waiting for loadData to set it
  const[modal,setModal]=useState(null);
  const[detailHabit,setDetailHabit]=useState(null);
  // C1: Offline
  const[isOffline,setIsOffline]=useState(!navigator.onLine);
  const[updateAvailable,setUpdateAvailable]=useState(false);
  useEffect(()=>{
    function onUpdate(){setUpdateAvailable(true);}
    window.addEventListener('momentum:update-available',onUpdate);
    return()=>window.removeEventListener('momentum:update-available',onUpdate);
  },[]);
  const[offlineBanner,setOfflineBanner]=useState(!navigator.onLine);
  // #33: the online-event listener below is registered once on mount ([] deps) — without
  // this ref, its closure would keep calling whatever `save`/`user` looked like at that first
  // render (often before auth has even resolved), silently no-op'ing forever after. This ref
  // is updated every render so the effect always calls the current, correct save().
  const saveRef=React.useRef(null);
  // C2: Onboarding
  const[showOnboarding,setShowOnboarding]=useState(false);
  // C2: Onboarding state
  const[showDashTour,setShowDashTour]=useState(false);// unused now the tour is removed; state kept harmlessly rather than touching every call site
  // Runs what used to be DashboardTour's onDone — push-notification re-ask, or a
  // welcome message if push is already sorted. Extracted so it can fire directly
  // now that the (stale) dashboard tour itself has been removed.
  function finishOnboardingSequence(){
    localStorage.setItem("hg_dash_tour_done","1");
    const alreadyAsked=localStorage.getItem("hg_push_asked")==="1";
    const notGranted=typeof Notification==="undefined"||Notification.permission!=="granted";
    if(!alreadyAsked&&notGranted&&typeof Notification!=="undefined"&&Notification.permission!=="denied"){
      setTimeout(()=>setShowPushReask(true),500);
    }else{
      setTimeout(()=>setMoBubbleMsg("You're all set. Let's build momentum."),400);
    }
  }
  const[showDay7Challenge,setShowDay7Challenge]=useState(false);
  const[showMonthlySummary,setShowMonthlySummary]=useState(false);
  const[monthlyRecapData,setMonthlyRecapData]=useState(null);
  const[showGoalsTour,setShowGoalsTour]=useState(false);
  const[showAnalyticsTour,setShowAnalyticsTour]=useState(false);
  const[pendingDashTour,setPendingDashTour]=useState(false);
  const[showPushReask,setShowPushReask]=useState(false);// C3: meaningful re-ask after tour if push wasn't granted in onboarding
  const[moBubbleMsg,setMoBubbleMsg]=useState(null);
  // L1/L2: Consent modals
  const[showDpdpConsent,setShowDpdpConsent]=useState(false);// pendingDashTour declared near showDashTour
  const[showAiConsent,setShowAiConsent]=useState(false);
  const[pendingAiOpen,setPendingAiOpen]=useState(false);
  // L3: Delete account
  const[showDeleteAccount,setShowDeleteAccount]=useState(false);

  // ── BROWSER HISTORY NAVIGATION ─────────────────────────────────
  function navigateTo(newPage,fromPanel=false){
    if(fromPanel){
      // N8-A: push panel-open state first, then sub-page — back restores panel
      window.history.pushState({page:page,modal:null,detail:null,showHamburger:true},"","/");
    }
    window.history.pushState({page:newPage,modal:null,detail:null},"","/");
    setPage(newPage);setModal(null);setDetailHabit(null);setShowUpdates(false);setShowHamburger(false);
    // First-time page tours — fire once per page, never again
    if(newPage==="goals"&&!localStorage.getItem("hg_goals_tour_done")&&!showOnboarding){
      setTimeout(()=>setShowGoalsTour(true),500);
    }
    if(newPage==="analytics"&&!localStorage.getItem("hg_analytics_tour_done")&&!showOnboarding){
      setTimeout(()=>setShowAnalyticsTour(true),500);
    }
  }
  function openModal(id){

          body=undone.length>0
            ?(maxStreak>=3
                ?lbl+"🔥 "+maxStreak+"-day streak at risk — "+undone.length+" habit"+(undone.length>1?"s":"")+" left before the day ends."
                :lbl+undone.length+" habit"+(undone.length>1?"s":"")+" still open today — a few minutes is all it takes.")
            :lbl+"Fully done today. That's how momentum compounds. See you tomorrow. ✅";
          moPoseIcon=undone.length>0?"/mo/mo-clock.png":"/mo/mo-celebrate.png";
        }

        // Show browser notification
        try{
          const n=new Notification("⚡ Habtix",{
            body,
            icon:moPoseIcon,
            image:moPoseIcon,
            badge:"/icon-192.png",
            tag:fireId,
            requireInteraction:false,
            vibrate:[200,100,200],
          });
          n.onclick=()=>{window.focus();n.close();};
        }catch(e){
          // Try SW notification as fallback
          try{
            if(navigator.serviceWorker&&navigator.serviceWorker.controller){
              navigator.serviceWorker.ready.then(reg=>{
                reg.showNotification("⚡ Habtix",{body,icon:"/icon-192.png",image:moPoseIcon,tag:fireId,vibrate:[200,100,200]});
              });
            }
          }catch(e2){}
        }

        // Vibrate (mobile)
        try{if(navigator.vibrate)navigator.vibrate([300,100,300,100,500]);}catch(e){}

        // Play selected sound
        try{playSound(notifSound);}catch(e){}

        markFired(fireId);
      });
    }

    // Check immediately and every 30 seconds
    checkAndFire();
    const iv=setInterval(checkAndFire,30000);
    return()=>clearInterval(iv);
  },[notif,reminders,habits,notifSound]);

  // ── N.2: In-app situational notification driver (2-slot rhythm) ──────────────
  // On app open (and when core data is ready): evaluate the rotation, fire the top
  // REWARD notification now, then — only if the user is still active ~6 min later —
  // fire the top NUDGE. Max 2/session, spaced, active-only. Persists notifLastShown
  // (+ milestonesNotified, freeDripDay) to Firestore so intervals gate across devices.
  const _n2Ran=React.useRef(false);
  const _n2LastActivity=React.useRef(Date.now());
  useEffect(()=>{
    function bump(){_n2LastActivity.current=Date.now();}
    window.addEventListener("pointerdown",bump);
    window.addEventListener("keydown",bump);
    return()=>{window.removeEventListener("pointerdown",bump);window.removeEventListener("keydown",bump);};
  },[]);
  useEffect(()=>{
    if(_n2Ran.current)return;
    if(!notif)return;
    if(typeof Notification==="undefined"||Notification.permission!=="granted")return;
    if(!user||page===null||showOnboarding)return; // wait for boot, don't interrupt onboarding
    if(!habits)return;
    _n2Ran.current=true;

    async function fireN2(item){
      // Persist gate stamp (+ milestone record) BEFORE showing, so a refresh can't double-fire.
      _notifStore.lastShown[item.type]=n2Today();
      const patch={notifLastShown:_notifStore.lastShown};
      if(item.type==="milestone"&&item.extra&&item.extra.streak!=null){
        if(!_notifStore.milestonesNotified.includes(item.extra.streak)){
          _notifStore.milestonesNotified.push(item.extra.streak);
          patch.milestonesNotified=_notifStore.milestonesNotified;
        }
      }
      try{await fb.setDoc(fb.doc(fb.db,"users",user.uid),patch,{merge:true});}catch(e){}
      // Deep-link tab travels via the SW notification (closed) OR onclick (open tab).
      const url="/?tab="+(item.tab||"dashboard");
      // Same routing rule as the boot-time deep-link handler: journal/pomodoro/coach
      // modal special-casing removed along with those features — every remaining
      // tab value is a real page, routed directly.
      function goToTarget(){
        const tb=item.tab;
        try{navigateTo(tb||"dashboard");}catch(e){}
      }
      // M7: Mo face per notification type, instead of the generic app icon for every single one.
      const MO_ICON_MAP={milestone:"/mo/mo-fist-pump.png",perfectday:"/mo/mo-celebrate.png",comeback:"/mo/mo-comeback.png",features:"/mo/mo-presenting.png",encouragement:"/mo/mo-thumbs-up.png"};
      const moIcon=MO_ICON_MAP[item.type]||"/icon-192.png";
      try{
        const n=new Notification("⚡ Habtix",{body:item.body,icon:moIcon,image:moIcon,badge:"/icon-192.png",tag:"n2_"+item.type+"_"+n2Today(),vibrate:[200,100,200],data:{url}});
        n.onclick=()=>{window.focus();goToTarget();n.close();};
      }catch(e){
        try{if(navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(reg=>reg.showNotification("⚡ Habtix",{body:item.body,icon:moIcon,image:moIcon,tag:"n2_"+item.type+"_"+n2Today(),vibrate:[200,100,200],data:{url}}));}}catch(e2){}
      }
      try{playSound(notifSound);}catch(e){}
    }

    // Build context + evaluate. Score delta from the already-loaded score store.
    const flNow=(()=>{try{return JSON.parse(localStorage.getItem("hg_pomo_focuslog")||"{}");}catch{return{};}})();
    const sd=getScoreWithDelta(habits||[],goals||[],journals||{},flNow,{active:false,wins:0,activeDays:0},goalStats);
    const dripDone=_notifStore.freeDripDay>=7||(signupDate&&n2DaysBetween(signupDate,n2Today())>=7);
    const ctx={
      habits:habits||[],goals:goals||[],journals:journals||{},
      pk,name:(displayName||user.displayName||"").trim().split(" ")[0]||"",
      signupDate,lastShown:_notifStore.lastShown,prefs:_notifStore.prefs,
      milestonesNotified:_notifStore.milestonesNotified,
      scoreVal:sd.score,scoreDelta:sd.delta,dowSun:new Date().getDay()===0,dripDone,
      challengeSummary:_challengeSummary,// N.2 challenge wiring: cheap summary from FriendsPage
    };
    const eligible=n2Evaluate(ctx);

    // ── FREE 7-DAY DRIP (overrides rotation for Free users in their first week) ──
    // One fixed message per day, sequenced. Uses signupDate to derive the day index.
    const isPaidUser=pk==="pro";
    if(!isPaidUser&&signupDate){
      const dayIdx=n2DaysBetween(signupDate,n2Today()); // 0 on signup day
      if(dayIdx>=0&&dayIdx<7){
        const dripKey="drip_"+dayIdx;
        if(!_notifStore.lastShown[dripKey]){
          const dripItem={type:dripKey,slot:"reward",tab:(dayIdx===6?"coach":dayIdx===1?"journal":dayIdx===2?"pomodoro":dayIdx===3?"analytics":dayIdx===4?"goals":"dashboard"),
            body:n2Fill(N2_DRIP[dayIdx],ctx.name)};
          const t2=setTimeout(()=>{fireN2(dripItem);},2500);
          return()=>clearTimeout(t2);
        }
      }
    }

    if(eligible.length===0)return;

    // SLOT 1 (reward): prefer a reward-slot item; else the top item. Fire ~2s after open.
    const reward=eligible.find(e=>e.slot==="reward")||eligible[0];
    const rewardTimer=setTimeout(()=>{fireN2(reward);},2500);

    // SLOT 2 (nudge): a different-type nudge, only if user still active ~6 min in.
    const nudge=eligible.find(e=>e.slot==="nudge"&&e.type!==reward.type);
    let nudgeTimer=null;
    if(nudge){
      nudgeTimer=setTimeout(()=>{
        // Active = interacted within the last 90s. Otherwise skip (never fire into idle).
        if(Date.now()-_n2LastActivity.current<=90000)fireN2(nudge);
      },6*60000);
    }
    return()=>{clearTimeout(rewardTimer);if(nudgeTimer)clearTimeout(nudgeTimer);};
  },[user,page,showOnboarding,habits,notif]);

  async function handleLogin(){
    setSigningIn(true);
    setLoading(true);// hold blank screen through popup + account check, closes the pre-onboarding flash
    try{
      // Try popup first (works on most browsers)
      await fb.signInWithPopup(fb.auth,fb.provider);
    }catch(e){
      if(e.code==="auth/popup-blocked"||e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request"){
        // Popup blocked — fallback to redirect
        try{await fb.signInWithRedirect(fb.auth,fb.provider);}
        catch(e2){console.error(e2);setSigningIn(false);setLoading(false);}
      } else {
        console.error(e);
        setSigningIn(false);setLoading(false);
      }
    }
  }
  async function handleLogout(){
    if(user){localStorage.removeItem("momentum_gh_"+user.uid);localStorage.removeItem("momentum_gs_"+user.uid);}
    await fb.signOut(fb.auth);
    setUser(null);setHabits([]);setGoals([]);setJournals({});setPk("free");setPe(null);
  }

  // openAIModal removed — its only callers (FloatingMo, the coach notification deep-link)
  // are gone. AiConsentModal, showAiConsent and pendingAiOpen are kept below as dormant
  // infrastructure: neither live AI feature (Plan Tomorrow's AI-assist, the new Goal
  // Architect) currently gates on this consent check, which is a real gap worth wiring
  // properly rather than losing the modal that would be needed to fix it.

  // Reliability fix: self-heal accounts whose initial profile write silently failed (e.g. a dropped
  // connection during signup), leaving habits/onboarding data but no email/plan/signupDate/userNumber.
  // email + displayName are fully recoverable from Firebase Auth (always present the instant sign-in
  // succeeds). plan/signupDate/userNumber/referredBy cannot be truly recovered — these get safe
  // defaults (free plan, today's date, next counter number, no referral credit) rather than left blank.
  async function ensureProfileFields(uid,authEmail,authDisplayName){
    try{
      const ref=fb.doc(fb.db,"users",uid);
      const snap=await fb.getDoc(ref);
      if(!snap.exists())return; // nothing to heal — normal creation path will handle it
      const d=snap.data();
      if(d.email&&d.plan&&d.displayName&&d.dpdpConsented!==undefined)return; // profile already intact, nothing to do
      let num=d.userNumber;
      if(!num){
        await fb.runTransaction(fb.db,async tx=>{
          const cRef=fb.doc(fb.db,"meta","userCount");
          const cSnap=await tx.get(cRef);
          num=cSnap.exists()?(cSnap.data().count||0)+1:1;
          tx.set(cRef,{count:num},{merge:true});
        });
      }
      const patch={};
      if(!d.email)patch.email=authEmail||null;
      if(!d.displayName&&authDisplayName)patch.displayName=authDisplayName;
      if(!d.plan)patch.plan="free";
      if(d.planExpiry===undefined)patch.planExpiry=null;
      if(!d.signupDate)patch.signupDate=today;
      if(!d.userNumber)patch.userNumber=num;
      if(d.referredBy===undefined)patch.referredBy=null;
      if(!d.referralBonusDaysGranted)patch.referralBonusDaysGranted=0;
      // Honest default, not a real consent grant — makes the field consistently
      // queryable for DPDP auditing (B2/B3) instead of silently absent on old
      // accounts that got stuck before ever reaching the consent step.
      if(d.dpdpConsented===undefined){patch.dpdpConsented=false;patch.dpdpConsentDate=null;}
      patch.dataRecovered=true;
      patch.dataRecoveredAt=new Date().toISOString();
      await fb.setDoc(ref,patch,{merge:true});
      console.warn("Self-healed incomplete profile for uid:",uid,patch);
    }catch(e){console.error("Profile self-heal err:",e);}
  }

  async function loadData(uid,email,authDisplayName,authUser){
    try{
      const ref=fb.doc(fb.db,"users",uid);
      const snap=await fb.getDoc(ref);
      if(snap.exists()){
        const d=snap.data();
        if(!d.email||!d.plan||!d.displayName||d.dpdpConsented===undefined){
          ensureProfileFields(uid,email,authDisplayName||d.displayName).catch(()=>{});
        }
        setHabits(d.habits||[]);setGoals(d.goals||[]);setJournals(d.journals||{});
        // Fix 12: Load goalHistory from localStorage cache first (instant), then sync from subcollection
        const ghCacheKey="momentum_gh_"+uid;
        const ghCached=localStorage.getItem(ghCacheKey);
        if(ghCached){try{setGoalHistory(JSON.parse(ghCached));}catch(e){}}
        // Load from subcollection in background
        try{
          const ghRef=fb.collection(fb.db,"users",uid,"goalHistory");
          const ghSnap=await fb.getDocs(ghRef);
          const ghArr=[];ghSnap.forEach(d2=>ghArr.push({id:d2.id,...d2.data()}));
          ghArr.sort((a,b)=>(a.completedAt||"").localeCompare(b.completedAt||""));
          setGoalHistory(ghArr);
          localStorage.setItem(ghCacheKey,JSON.stringify(ghArr));
        }catch(e){}
        // Permanent goalStats — never capped/deleted, used for Yearly Review accuracy
        const gsCacheKey="momentum_gs_"+uid;
        const gsCached=localStorage.getItem(gsCacheKey);
        if(gsCached){try{setGoalStats(JSON.parse(gsCached));}catch(e){}}
        if(d.goalStats)setGoalStats(d.goalStats);
        if(d.streakCards)setStreakCards(d.streakCards);
        const loadedPlan=d.plan||"free";
        const loadedExpiry=d.planExpiry||null;
        setTk(d.themeKey||"obsidian");setPk(loadedPlan);setPe(loadedExpiry);
        // Bug fix: plan/planExpiry/referralBonusDaysGranted are protected fields — client
        // writes to them are correctly blocked by design once the doc exists. That's exactly
        // right for security, but it meant BOTH the auto-downgrade-on-expiry write below AND
        // the referral grant write were being silently denied every single time, for every
        // user — the reward was being computed correctly, just never actually saved. Moved
        // both into one server-side call that verifies the caller and writes via Admin SDK,
        // which bypasses client rules entirely (that's the whole point of "server-only" fields).
        try{
          // Was reading the outer `user` state closure here, which this listener captured
          // once on mount (useEffect with [] deps) and never sees updated — meaning it was
          // always null at this exact point, on every single login, guaranteed. This check
          // silently failed every time as a result. authUser is the actual Firebase user
          // object handed straight from the auth callback, so it's always current.
          const idToken=await authUser.getIdToken();
          const resp=await fetch("/api/referral-grant",{method:"POST",headers:{"Authorization":"Bearer "+idToken}});
          if(resp.ok){
            const grantResult=await resp.json();
            setPk(grantResult.plan);setPe(grantResult.planExpiry||null);
            setReferralCountLive(grantResult.referralCount||0);
          }
        }catch(e){console.error("Referral/plan grant check err:",e);}
        if(d.displayName)setDisplayName(d.displayName);
        if(d.signupDate)setSignupDate(d.signupDate);
        if(d.userNumber)setUserNumber(d.userNumber);
        if(d.birthday)setBirthday(d.birthday);
        if(d.momentumId)setMomentumId(d.momentumId);
        if(d.manifestation){
          setManifVision(d.manifestation.vision||"");
          setManifLinkedGoalId(d.manifestation.linkedGoalId??null);
          setManifTotalLogged(d.manifestation.totalLogged||0);
        }
        if(d.tomorrowPlan&&d.tomorrowPlan.date===tomorrowStr()){
          // Only restore if it's still for the upcoming day — a stale plan from
          // a previous day just gets dropped rather than shown as if current.
          setTomorrowPlan(d.tomorrowPlan);
        }
        if(d.dayNotes&&typeof d.dayNotes==="object")setDayNotes(d.dayNotes);
        loadScoreStore(d);// SC2: load dated score history (scoreHistory + scoreMonthly) for real deltas
        loadObstacleStore(d);// Obstacle Engine: load persisted mastery state (same pattern as score history)
        loadNotifStore(d);// N.2: load notification rotation state (lastShown, prefs, milestones, drip)
        refreshFriendReqCount(uid).catch(()=>{});// F1: background, non-blocking
        refreshChallengeInviteCount(uid).catch(()=>{});
        // C2: Firestore is primary truth — localStorage only a cache
        if(d.onboardingCompleted===true){
          localStorage.setItem("hg_onboard_done","1");
          setPage("dashboard");
        } else if(d.onboardingCompleted===false){
          localStorage.removeItem("hg_onboard_done");
          setShowOnboarding(true);
          setPage("dashboard");// onboarding overlay covers this
        } else {
          // Old account, no field → treat as done
          localStorage.setItem("hg_onboard_done","1");
          setPage("dashboard");
        }
      } else {
        localStorage.removeItem("hg_onboard_done");
        setShowOnboarding(true);
        setPage("dashboard");// onboarding overlay covers dashboard
        let num=101;
        await fb.runTransaction(fb.db,async tx=>{
          const cRef=fb.doc(fb.db,"meta","userCount");
          const cSnap=await tx.get(cRef);
          num=cSnap.exists()?(cSnap.data().count||0)+1:1;
          tx.set(cRef,{count:num},{merge:true});
        });
        // Check for referral code in URL — Item 39: full UIDs are case-sensitive, so no upper/lowercasing here
        // REFERRAL FIX: fall back to the localStorage value captured on app load, since a
        // mobile Google sign-in redirect wipes the URL params before we reach this point.
        let urlRef=new URLSearchParams(window.location.search).get("ref");
        if(!urlRef){try{urlRef=localStorage.getItem("hg_pending_ref");}catch(e){}}
        // A user cannot refer themselves.
        if(urlRef===uid)urlRef=null;
        const referredBy=urlRef||null;
        // Item 39: referred signups get 7 days Pro free immediately — a one-time, isolated grant separate from
        // this user's own future referrer ladder (which starts fresh at 0 the moment THEY make their first referral)
        let plan2="free",expStr=null;
        if(referredBy){
          plan2="pro";
          const exp=new Date();exp.setDate(exp.getDate()+7);
          expStr=exp.toISOString();
        }
        setPk(plan2);setPe(expStr);

        const newAccountData={habits:[],goals:[],journals:{},themeKey:"obsidian",plan:plan2,planExpiry:expStr,signupDate:today,userNumber:num,email,displayName:authDisplayName||null,referredBy:referredBy||null,referralBonusDaysGranted:0,onboardingCompleted:false};
        // Reliability fix: account creation is critical — retry silently on transient failures
        // (flaky mobile connections) instead of letting the write fail silently and leaving
        // a user with no profile fields once onboarding's own save creates a bare-bones doc.
        let created=false;
        for(let attempt=0;attempt<3&&!created;attempt++){
          try{
            await fb.setDoc(ref,newAccountData);
            created=true;
          }catch(e){
            console.warn("Account creation attempt "+(attempt+1)+" failed:",e);
            if(attempt<2)await new Promise(r=>setTimeout(r,600*(attempt+1)));
          }
        }
        if(!created)console.error("Account creation failed after 3 attempts — will self-heal on next login via the existing-account backfill check.");
        // REFERRAL FIX: consume the pending ref so it can't attach to a different account
        // created later on the same device.
        try{localStorage.removeItem("hg_pending_ref");}catch(e){}
      }
    }catch(e){console.error("Load err:",e);setPage("dashboard");}// Always unblock on error
  }

  // S7: XSS sanitizer — strip HTML tags before any Firebase write
  function sanitizeInput(str,maxLen=200){
    if(typeof str!=="string")return str;
    return str.replace(/<[^>]*>/g,"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]||c)).slice(0,maxLen);
  }

  async function save(h,g,j,theme,gh){
    if(!user)return;
    // #33: offline mode was never actually wired up — saveOfflineAware() existed but was
    // never called anywhere, so every habit/goal tap while offline just let fb.setDoc hang
    // (no IndexedDB persistence is configured on this Firestore instance) with zero durable
    // record of the attempt. Handling it here instead of at each of the 28+ call sites means
    // every existing mutation gets offline support automatically, with nothing else to change.
    if(isOffline){
      try{
        localStorage.setItem("hg_offline_pending",JSON.stringify({habits:h,goals:g,journals:j,themeKey:theme,timestamp:Date.now()}));
        showToast("Saved locally — will sync when you're back online");
      }catch(e){console.warn("Offline snapshot err:",e);}
      return;// skip the Firestore write attempt entirely — nothing to hang on
    }
    setSaving(true);
    // SC3+SC4: compute score + components and persist to Firestore alongside user data
    const flNow=(()=>{try{return JSON.parse(localStorage.getItem("hg_pomo_focuslog")||"{}");}catch{return{};}})();
    const scoreResult=calculateMomentumScore(h||[],g||[],j||{},flNow,{active:false,wins:0,activeDays:0},goalStats);
    // SC2: record today's score into dated history (365-day daily + permanent monthly)
    const scoreSnap=recordScoreSnapshot(scoreResult.total);
    // Obstacle Engine: advance the rolling mastery clock (idempotent per calendar day)
    // using the freshest habits/goals passed into this save — same lifecycle as the
    // score snapshot above, so mastery survives across sessions instead of resetting
    // to empty on every page load.
    advanceObstacleMastery(h||[],g||[]);
    const obstacleSnap=snapshotObstacleStore();
    // Fix 12: goalHistory no longer stored in main document — uses subcollection instead
    try{await fb.setDoc(fb.doc(fb.db,"users",user.uid),{
      habits:h,goals:g,journals:j,themeKey:theme,
      displayName:sanitizeInput(displayName||user.displayName||"",50),
      momentumScore:scoreResult.total,
      momentumScoreUpdated:new Date().toISOString(),
      scoreComponents:scoreResult.components,
      scoreHistory:scoreSnap.scoreHistory,
      scoreMonthly:scoreSnap.scoreMonthly,
      obstacleMastery:obstacleSnap.obstacleMastery
    },{merge:true});
    // #33: a pending offline snapshot exists only if a save happened while offline and
    // hasn't synced yet. Once a real online save succeeds, whatever's pending is now stale
    // (this save is newer) — clear it so a later reconnect doesn't re-push old data over new.
    try{localStorage.removeItem("hg_offline_pending");}catch(e){}
    }
    catch(e){console.error("Save err:",e);}
    setSaving(false);
  }
  saveRef.current=save;

  function toggleH(id){
    const h=habits.map(hb=>{
      if(hb.id!==id)return hb;
      const log={...hb.log};
      const hasGoal=hb.goalCount>0&&hb.goalUnit;
      if(hasGoal){
        // Count-based: increment count, mark done only when count >= goalCount
        const current=typeof log[today]==="number"?log[today]:log[today]?hb.goalCount:0;
        if(current>=hb.goalCount){
          // Already complete — reset to 0 (untick all)
          delete log[today];
        } else {
          // Increment by 1
          const next=current+1;
          log[today]=next>=hb.goalCount?hb.goalCount:next;
        }
      } else {
        // Simple toggle
        const was=!!log[today];
        if(was)delete log[today];else log[today]=true;
      }
      const isDone=hasGoal?(typeof log[today]==="number"&&log[today]>=hb.goalCount):!!log[today];
      // Streak requires FULL completion only
      const isFullDone=(dateStr,lg,hbObj)=>isFullDoneOn(hbObj,dateStr,lg[dateStr]);
      let streak=0,best=hb.best||0;
      const d=new Date();
      while(true){const s=d.toLocaleDateString("en-CA");if(!isFullDone(s,log,hb))break;streak++;d.setDate(d.getDate()-1);}
      if(streak>best)best=streak;
      if(isDone&&BADGES.some(b=>b.d===streak)){setConfetti(true);showToast("🏆 "+streak+"-day streak badge!","badge");pushStreakCard(hb,streak);}
      if(isDone&&streak===7&&!localStorage.getItem("hg_reviewed")){

      return{...hb,log,streak,best};

  // H5: Pomodoro → Habit time link. Adds focused minutes to a time-based habit's log for today.
  // Auto-completes the habit once the target is reached — manual +1 tap (toggleH) still works independently and untouched.
  // Not capped at goalCount: going over shows as "+extra" (e.g. 75/60 min) so overtime focus is visible, not hidden.
  function logHabitTime(habitId,minutesAdded){
    if(!habitId||!minutesAdded)return null;
    let result=null;
    const h=habits.map(hb=>{
      if(hb.id!==habitId)return hb;
      if(!(hb.goalCount>0&&isTimeUnit(hb.goalUnit))){result={skipped:true};return hb;}
      const mult=timeUnitMinutesMultiplier(hb.goalUnit);
      const unitsToAdd=minutesAdded/mult;
      const log={...hb.log};
      const before=typeof log[today]==="number"?log[today]:(log[today]?hb.goalCount:0);
      const wasComplete=before>=hb.goalCount;
      const after=Math.round((before+unitsToAdd)*100)/100;
      log[today]=after;
      const nowComplete=after>=hb.goalCount;
      const isFullDone=(dateStr,lg,hbObj)=>isFullDoneOn(hbObj,dateStr,lg[dateStr]);
      let streak=0,best=hb.best||0;
      const d=new Date();
      while(true){const s=d.toLocaleDateString("en-CA");if(!isFullDone(s,log,hb))break;streak++;d.setDate(d.getDate()-1);}
      if(streak>best)best=streak;
      if(!wasComplete&&nowComplete&&BADGES.some(b=>b.d===streak)){setConfetti(true);showToast("🏆 "+streak+"-day streak badge!","badge");pushStreakCard(hb,streak);}
      result={justCompleted:!wasComplete&&nowComplete,habitName:hb.name,goalCount:hb.goalCount,goalUnit:hb.goalUnit,total:after,extra:Math.max(0,Math.round((after-hb.goalCount)*100)/100)};
      return{...hb,log,streak,best};
    });
    setHabits(h);save(h,goals,journals,tk);
    return result;
  }

  // Fix 12: Save goalHistory to subcollection with cap 50 + localStorage cache
  async function saveGoalHistory(newGH){
    if(!user)return;
    const uid=user.uid;
    const cacheKey="momentum_gh_"+uid;
    // Cap at 50 — remove oldest if exceeded
    const capped=newGH.length>50?newGH.slice(newGH.length-50):newGH;
    setGoalHistory(capped);
    localStorage.setItem(cacheKey,JSON.stringify(capped));
    // Sync to Firestore subcollection
    try{
      const ghRef=fb.collection(fb.db,"users",uid,"goalHistory");
      const existing=await fb.getDocs(ghRef);
      const batch=fb.writeBatch(fb.db);
      existing.forEach(d=>batch.delete(d.ref));
      await batch.commit();
      for(const g of capped){
        const docRef=fb.doc(fb.collection(fb.db,"users",uid,"goalHistory"),String(g.id||Date.now()));
        await fb.setDoc(docRef,g,{merge:true});
      }

                <GoogleSVG/>{signingIn?"Connecting to Google...":"Continue with Google"}
              </button>

              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                <div style={{flex:1,height:1,background:"#2a2a42"}}/><span style={{fontSize:11,color:"#4a4a6a",flexShrink:0}}>WHAT YOU GET</span><div style={{flex:1,height:1,background:"#2a2a42"}}/>

                  <span style={{fontSize:13,color:"#9a9ab0"}}>{item.label}</span>

            <div style={{textAlign:"center",marginBottom:36}}>
              <div style={{animation:"moEntrance 0.5s cubic-bezier(0.34,1.56,0.64,1)",marginBottom:14,display:"flex",justifyContent:"center"}}>

  // Dashboard
  // ══════════════════════════════════════════════════════════════════
  // TODAY DASHBOARD — Batch 2. Replaces the old multi-card dashboard.
  // One hero stat, one Focus/Obstacle card, a flat action list, a
  // show-ups strip. Momentum Score, the 2×2 feature grid, streak badge
  // boxes and the Updates-panel trigger are removed from here per the
  // locked V1 cut list. Updates/announcements content itself is left
  // untouched further down in the file — it just has no entry point
  // from the dashboard anymore. Flagging rather than silently dropping:
  // the natural new home for it is the hamburger menu, not done here.
  // ══════════════════════════════════════════════════════════════════
  function Dashboard(){
    const obState=React.useMemo(()=>currentObstacleState(habits,goals),[habits,goals]);
    const[openSlot,setOpenSlot]=useState(currentSlotId());

    const todayItems=[
      ...habits.map(h=>({kind:"habit",id:h.id,label:h.name,done:isFullDoneOn(h,today,h.log&&h.log[today]),onToggle:()=>toggleH(h.id),dueTime:null,slotOverride:h.slotOverride||null})),
      ...goals.flatMap(g=>(g.actions||[]).filter(a=>a.dueDate===today).map(a=>({kind:"action",id:a.id,label:a.action,done:a.done,onToggle:()=>toggleA(g.id,a.id),dueTime:a.dueTime||null,slotOverride:a.slotOverride||null,gid:g.id})))
    ];
    const doneCount=todayItems.filter(i=>i.done).length;
    const totalCount=todayItems.length;
    const pct=totalCount>0?Math.round(doneCount/totalCount*100):0;
    const showUpsThisMonth=lastNDates(30).filter(d=>isShowUpDay(habits,goals,d)).length;
    const last14=lastNDates(14).slice().reverse();

    const bySlot={rise:[],momentum:[],night:[]};
    todayItems.forEach(it=>{bySlot[itemSlot(it)].push(it);});

    // Cycles an item's slot override (rise→momentum→night→rise) and persists it on
    // the existing habit/goal-action object — no new save path, rides the current one.
    function cycleSlot(item){
      const order=["rise","momentum","night"];
      const next=order[(order.indexOf(itemSlot(item))+1)%3];
      if(item.kind==="habit"){
        const updated=habits.map(x=>x.id===item.id?{...x,slotOverride:next}:x);
        setHabits(updated);save(updated,goals,journals,tk);
      }else{
        const updatedGoals=goals.map(g=>g.id!==item.gid?g:{...g,actions:(g.actions||[]).map(a=>a.id===item.id?{...a,slotOverride:next}:a)});
        setGoals(updatedGoals);save(habits,updatedGoals,journals,tk);
      }
    }

    return(
    <div style={{paddingBottom:80}}>
      <AppHeader t={t} user={user} displayName={displayName} pk={pk} onCalendar={()=>openModal("calendar")} onNotif={()=>openModal("notif")} onProfile={()=>{window.history.pushState({showHamburger:true,page:page},"",'/');setShowHamburger(true);}} navMuted={navMuted} onUp={()=>showUp("Unlock unlimited goals, deep analytics, AI planning & more!")}/>
      <PlanBanner t={t} pk={pk} pe={pe} onUp={()=>showUp("Unlock unlimited goals, deep analytics, AI planning & more!")}/>

      <div style={{marginTop:14}}>
        {/* TODAY hero */}
        <div style={{background:NB.card,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:16,marginBottom:14,boxShadow:NB.shadowSm}}>
          <div style={{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:NB.muted,fontWeight:700,marginBottom:6,fontFamily:"'Sora',sans-serif"}}>Today</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
            <div style={{fontFamily:NB.font,fontWeight:800,fontSize:40,color:NB.ink,lineHeight:1}}>{pct}%</div>
            <div style={{fontSize:12,color:NB.muted,fontWeight:700,fontFamily:"'Sora',sans-serif"}}>{doneCount} OF {totalCount} ACTIONS</div>
          </div>
          <div style={{height:12,border:"2.5px solid "+NB.ink,borderRadius:NB.rPill,background:NB.bg,overflow:"hidden"}}>
            <div style={{height:"100%",width:pct+"%",background:NB.brand,transition:"width 0.3s ease"}}/>
          </div>
        </div>

        {/* Today's note — only renders if one exists, usually written the night before via Plan Tomorrow */}
        {dayNotes&&dayNotes[today]&&dayNotes[today].trim()&&<div style={{background:NB.blueSoft,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:"12px 14px",marginBottom:14,boxShadow:NB.shadowSm}}>
          <div style={{fontSize:10.5,letterSpacing:0.6,textTransform:"uppercase",fontWeight:700,color:NB.ink,opacity:0.7,marginBottom:4,fontFamily:"'Sora',sans-serif"}}>Your note for today</div>
          <div style={{fontSize:13,color:NB.ink,fontFamily:"'Sora',sans-serif",lineHeight:1.5,whiteSpace:"pre-wrap"}}>{dayNotes[today]}</div>
        </div>}

        {/* FOCUS card */}
        <ObstacleFocusCard obState={obState} onOpen={()=>navigateTo("obstacleDetail")}/>

        {/* Today's actions — Rise / Momentum / Night capsules */}
        {SLOTS.map(slot=>{
          const items=bySlot[slot.id];
          const doneInSlot=items.filter(i=>i.done).length;
          const allDone=items.length>0&&doneInSlot===items.length;
          const isOpen=openSlot===slot.id;
          return(
          <div key={slot.id} style={{marginBottom:12}}>
            <div onClick={()=>setOpenSlot(isOpen?null:slot.id)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:allDone?NB.greenSoft:NB.card,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:"14px 16px",boxShadow:NB.shadowSm,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:26,height:26,borderRadius:"50%",border:"2.5px solid "+NB.ink,background:allDone?NB.green:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  {allDone&&<svg width="12" height="9" viewBox="0 0 11 8" fill="none"><path d="M1 4l3 3 6-6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                </div>
                <div style={{fontFamily:NB.font,fontWeight:700,fontSize:15,color:NB.ink}}>{slot.label}</div>
              </div>
              <div style={{fontFamily:NB.font,fontWeight:700,fontSize:13,color:NB.muted}}>{items.length===0?"—":doneInSlot+" of "+items.length}</div>
            </div>
            {isOpen&&<div style={{marginTop:8}}>
              {items.length===0
                ?<div style={{textAlign:"center",padding:14,color:NB.muted,fontSize:12.5,border:"3px dashed "+NB.ink,borderRadius:16,fontFamily:"'Sora',sans-serif"}}>Nothing in {slot.label} yet.</div>
                :items.map(item=>(
                  <div key={item.kind+"-"+item.id} style={{display:"flex",alignItems:"center",gap:10,background:item.done?NB.greenSoft:NB.card,border:"3px solid "+NB.ink,borderRadius:16,padding:"11px 13px",marginBottom:9,boxShadow:NB.shadowSm}}>
                    <div onClick={item.onToggle} style={{width:22,height:22,border:"2.5px solid "+NB.ink,borderRadius:8,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:item.done?NB.green:"#fff",cursor:"pointer"}}>
                      {item.done&&<svg width="11" height="8" viewBox="0 0 11 8" fill="none"><path d="M1 4l3 3 6-6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                    </div>
                    <div onClick={item.onToggle} style={{fontSize:13.5,fontWeight:600,color:item.done?NB.muted:NB.ink,textDecoration:item.done?"line-through":"none",flex:1,cursor:"pointer",fontFamily:"'Sora',sans-serif"}}>{item.label}</div>
                    <span onClick={()=>cycleSlot(item)} style={{fontSize:10,fontWeight:700,color:NB.muted,border:"2px solid "+NB.ink,borderRadius:NB.rPill,padding:"3px 8px",cursor:"pointer",fontFamily:"'Sora',sans-serif",flexShrink:0}}>{slot.label}</span>
                  </div>
                ))
              }
            </div>}
          </div>);
        })}

        {/* Show ups */}
        <div style={{background:NB.card,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:16,marginBottom:14,boxShadow:NB.shadowSm}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:9}}>
            <div style={{fontFamily:NB.font,fontWeight:700,fontSize:14,color:NB.ink}}>Show ups</div>
            <div style={{fontFamily:NB.font,fontWeight:700,fontSize:13.5,color:NB.ink}}>{showUpsThisMonth} this month</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(14,1fr)",gap:3}}>
            {last14.map(d=>{
              const up=isShowUpDay(habits,goals,d);
              return <div key={d} style={{aspectRatio:"1",borderRadius:5,border:"1.5px solid "+NB.ink,background:up?NB.green:"#fff"}}/>;
            })}
          </div>
        </div>

        {/* Plan Tomorrow entry — no dedicated nav tab yet (that's later batch work), reachable from here for now */}
        <div onClick={()=>navigateTo("planTomorrow")} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:NB.card,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:"14px 16px",marginBottom:14,boxShadow:NB.shadowSm,cursor:"pointer"}}>
          <div style={{fontFamily:NB.font,fontWeight:700,fontSize:14,color:NB.ink}}>{tomorrowPlan&&tomorrowPlan.date===tomorrowStr()?"Tomorrow's plan is set":"Plan Tomorrow"}</div>
          <div style={{fontFamily:NB.font,fontWeight:700,fontSize:16,color:NB.ink}}>→</div>
        </div>
      </div>
    </div>
    );}

  // Focus/Obstacle card — the one bold saturated element on the dashboard.
  // Always renders one of three states, never empty (see currentObstacleState).
  function ObstacleFocusCard({obState,onOpen}){
    if(obState.mode==="building"){
      return(
      <div style={{background:NB.blueSoft,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:18,marginBottom:14,boxShadow:NB.shadow}}>
        <div style={{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:NB.ink,fontWeight:700,opacity:0.75,fontFamily:"'Sora',sans-serif"}}>Reading your patterns</div>
        <div style={{fontFamily:NB.font,fontWeight:800,fontSize:19,color:NB.ink,margin:"6px 0 4px"}}>A few more days of data</div>
        <div style={{fontSize:12.5,color:NB.ink,opacity:0.75,fontFamily:"'Sora',sans-serif"}}>Keep logging habits and actions — {obState.daysNeeded>0?obState.daysNeeded+" more day"+(obState.daysNeeded>1?"s":""):"almost there"} until Habtix can read what's actually getting in your way.</div>
      </div>);
    }
    const o=obState.obstacle;
    const isActive=obState.mode==="active";
    const bg=isActive?NB.coral:(obState.maintaining?NB.greenSoft:NB.blueSoft);
    const textColor=isActive?"#fff":NB.ink;
    return(
    <div onClick={onOpen} style={{background:bg,border:"3px solid "+NB.ink,borderRadius:NB.rCard,padding:18,marginBottom:14,boxShadow:NB.shadow,cursor:"pointer",color:textColor}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div style={{fontSize:11,letterSpacing:1,textTransform:"uppercase",fontWeight:700,opacity:0.85,fontFamily:"'Sora',sans-serif"}}>
            {isActive?(obState.returning?"Returning Pattern":"Active Pattern"):(obState.maintaining?"Maintaining":"Building Toward")}
          </div>
          <div style={{fontFamily:NB.font,fontWeight:800,fontSize:23,margin:"5px 0 8px"}}>{o.name}</div>
        </div>
        <div style={{width:44,height:44,borderRadius:"50%",background:"rgba(255,255,255,0.28)",border:"2.5px solid "+(isActive?"#fff":NB.ink),display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>{o.icon}</div>
      </div>
      <div style={{fontSize:13,lineHeight:1.5,background:isActive?"rgba(0,0,0,0.18)":"rgba(255,255,255,0.5)",borderRadius:14,padding:"9px 12px",fontFamily:"'Sora',sans-serif"}}>
        {isActive
          ?"Today's actions can weaken this — tap to see what's helping."
          :(obState.maintaining
            ?"Mastered "+timeAgoShort(obState.mastery.masteredAt)+" — still holding steady."
            :(obState.daysToMastery>0?obState.daysToMastery+" more clean day"+(obState.daysToMastery>1?"s":"")+" to mastery.":"Almost at mastery — keep going."))
        }
      </div>
      {/* Meter — signal strength while active, mastery progress while guarded-and-building.
          Skipped entirely once maintaining, since "mastered X ago" already says enough. */}
      {(isActive||(!obState.maintaining))&&<div style={{marginTop:12}}>
        <div style={{height:8,background:"rgba(255,255,255,0.28)",borderRadius:NB.rPill,overflow:"hidden"}}>
          <div style={{height:"100%",width:(isActive?obState.signal:Math.round((OBSTACLE_MASTERY_DAYS-obState.daysToMastery)/OBSTACLE_MASTERY_DAYS*100))+"%",background:isActive?"#fff":NB.ink}}/>
        </div>
        <div style={{fontSize:10.5,letterSpacing:0.6,textTransform:"uppercase",fontWeight:700,opacity:0.85,marginTop:5,fontFamily:"'Sora',sans-serif"}}>
          {isActive?"Pattern strength — "+strengthLabel(obState.signal):(OBSTACLE_MASTERY_DAYS-obState.daysToMastery)+" of "+OBSTACLE_MASTERY_DAYS+" clean days"}
        </div>
      </div>}
    </div>);
  }

  function timeAgoShort(dateStr){
    if(!dateStr)return"";
    const days=Math.floor((Date.now()-new Date(dateStr))/86400000);
    if(days<=0)return"today";
    if(days===1)return"1 day ago";
    if(days<30)return days+" days ago";
    return Math.floor(days/30)+" mo ago";
  }
  // Active-mode signal (35-100, since that's the active threshold) bucketed into
  // calm, non-alarming language — matches Mo's tone, not meant to read as a warning.
  function strengthLabel(signal){
    if(signal>=75)return"Strong";
    if(signal>=55)return"Moderate";
    return"Mild";
  }

  // ══════════════════════════════════════════════════════════════════
  // OBSTACLE DETAIL — tap-in from the Focus card. Shows the two minion
  // sub-bars (real per-minion signal, not flavor text), the "shows up
  // as" flavor pills (pure narrative, zero tracked state), actions that
  // help, and the all-patterns badge row (replaces the old city/map).
  // ══════════════════════════════════════════════════════════════════
  function ObstacleDetailPage(){
    const obState=React.useMemo(()=>currentObstacleState(habits,goals),[habits,goals]);

    function BackRow({title}){
      return(
      <div style={{display:"flex",alignItems:"center",gap:9,padding:"8px 0 16px"}}>
        <div onClick={()=>navigateTo("dashboard")} style={{width:38,height:38,border:"3px solid "+NB.ink,borderRadius:12,background:NB.card,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:NB.shadowSm,cursor:"pointer"}}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={NB.ink} strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div style={{fontFamily:NB.font,fontWeight:700,fontSize:16,color:NB.ink}}>{title}</div>
      </div>);
    }

    if(obState.mode==="building"){
      return(
      <div style={{padding:16,fontFamily:NB.font,minHeight:"100vh",background:NB.bg}}>
        <BackRow title="Obstacle"/>
        <div style={{textAlign:"center",padding:"40px 20px",color:NB.muted,fontSize:14,fontFamily:"'Sora',sans-serif"}}>Still reading your patterns — check back in a few days.</div>
      </div>);
    }

    const o=obState.obstacle;
    const isActive=obState.mode==="active";
    const flavor=OBSTACLE_FLAVOR[o.id]||[];
    const helperActions=[
      ...habits.filter(h=>!isFullDoneOn(h,today,h.log&&h.log[today])).slice(0,3).map(h=>({kind:"habit",id:h.id,label:h.name,onToggle:()=>toggleH(h.id)})),
      ...goals.flatMap(g=>(g.actions||[]).filter(a=>!a.done&&a.dueDate===today).map(a=>({kind:"action",id:a.id,label:a.action,onToggle:()=>toggleA(g.id,a.id)})))
    ].slice(0,4);

    return(
    <div style={{padding:16,fontFamily:NB.font,minHeight:"100vh",background:NB.bg,paddingBottom:100}}>
      <BackRow title={isActive?"Active Pattern":"Obstacle"}/>

      <div style={{borderRadius:NB.rCard,background:isActive?NB.coral:(obState.maintaining?NB.greenSoft:NB.blueSoft),border:"3px solid "+NB.ink,padding:"28px 18px",textAlign:"center",marginBottom:16,boxShadow:NB.shadow,color:isActive?"#fff":NB.ink}}>
        <div style={{width:76,height:76,borderRadius:"50%",background:"rgba(255,255,255,0.28)",border:"3px solid "+(isActive?"#fff":NB.ink),margin:"0 auto 12px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:30}}>{o.icon}</div>
        <div style={{fontFamily:NB.font,fontWeight:800,fontSize:22}}>{o.name}</div>
        <div style={{fontSize:11,opacity:0.85,marginTop:4,textTransform:"uppercase",letterSpacing:1,fontWeight:700,fontFamily:"'Sora',sans-serif"}}>
          {isActive?"Signal "+obState.signal+"%":(obState.maintaining?"Mastered · Holding Steady":obState.daysToMastery+" days to mastery")}
        </div>
      </div>

      <div style={{fontFamily:NB.font,fontWeight:700,fontSize:14,color:NB.ink,margin:"2px 0 9px"}}>What's driving it</div>
      {o.minions.map(m=>{
        const val=obState.minions?(obState.minions[m.id]||0):0;
        return(
        <div key={m.id} style={{background:NB.card,border:"3px solid "+NB.ink,borderRadius:16,padding:"11px 13px",marginBottom:9,boxShadow:NB.shadowSm}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <div style={{fontSize:12.5,fontWeight:700,color:NB.ink,fontFamily:"'Sora',sans-serif"}}>{m.name}</div>
            <div style={{fontSize:11,fontWeight:700,color:NB.muted,fontFamily:"'Sora',sans-serif"}}>{val}%</div>
          </div>
          <div style={{height:8,border:"2px solid "+NB.ink,borderRadius:NB.rPill,background:NB.bg,overflow:"hidden"}}>
            <div style={{height:"100%",width:val+"%",background:val>=50?NB.coral:NB.brand}}/>
          </div>
        </div>);
      })}

      {flavor.length>0&&<React.Fragment>
        <div style={{fontFamily:NB.font,fontWeight:700,fontSize:14,color:NB.ink,margin:"14px 0 9px"}}>Shows up as</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:16}}>
          {flavor.map((f,i)=>(<div key={i} style={{fontSize:12,fontWeight:600,border:"2.5px solid "+NB.ink,borderRadius:NB.rPill,padding:"6px 13px",background:NB.card,boxShadow:NB.shadowSm,fontFamily:"'Sora',sans-serif"}}>"{f}"</div>))}
        </div>
      </React.Fragment>}

      {helperActions.length>0&&<React.Fragment>
        <div style={{fontFamily:NB.font,fontWeight:700,fontSize:14,color:NB.ink,margin:"2px 0 9px"}}>Actions that help today</div>
        {helperActions.map(a=>(
          <div key={a.kind+"-"+a.id} onClick={a.onToggle} style={{display:"flex",alignItems:"center",gap:10,background:NB.card,border:"3px solid "+NB.ink,borderRadius:16,padding:"11px 13px",marginBottom:9,boxShadow:NB.shadowSm,cursor:"pointer"}}>
            <div style={{width:22,height:22,border:"2.5px solid "+NB.ink,borderRadius:8,flexShrink:0,background:"#fff"}}/>
            <div style={{fontSize:13.5,fontWeight:600,color:NB.ink,flex:1,fontFamily:"'Sora',sans-serif"}}>{a.label}</div>
          </div>
        ))}
      </React.Fragment>}

      <div style={{fontFamily:NB.font,fontWeight:700,fontSize:14,color:NB.ink,margin:"14px 0 9px"}}>All patterns</div>
      <div style={{display:"flex",gap:9}}>
        {OBSTACLES.map(def=>{
          const rec=_obstacleStore.mastery[def.id]||{masteredAt:null,revived:false};
          const isThisActive=isActive&&def.id===o.id;
          const isMastered=!!rec.masteredAt&&!rec.revived;
          return(
          <div key={def.id} style={{flex:1,borderRadius:16,border:"2.5px solid "+NB.ink,background:isMastered?NB.greenSoft:NB.card,padding:"10px 6px",textAlign:"center"}}>
